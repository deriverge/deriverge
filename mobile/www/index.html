<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tapkasa">
<meta name="theme-color" content="#FBFAF7">
<meta name="robots" content="noindex">
<title>Tapkasa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<!-- APP:START -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#FBFAF7;
    --surface:#FFFFFF;
    --sunk:#F2EEE6;
    --ink:#15120E;
    --ink-2:#5F5749;
    --ink-3:#8C8474;
    --rule:#E4DFD5;
    --accent:#D6402A;
    --accent-dk:#B93520;
    --accent-tint:#FFF6F4;
    --cash:#0F7A4F;
    --card:#1D5BD6;
    --track:#EDE9E0;
    --r-tile:12px;
    --r-btn:10px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.35;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  /* ---------- shell ---------- */
  .shell{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--paper)}

  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(var(--safe-t) + 10px) 16px 10px;
    border-bottom:1px solid var(--rule);background:var(--paper);
    position:relative;z-index:3;
  }
  .top-name{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
  .top-total{text-align:right;flex:0 0 auto}
  .top-total .v{display:block;font-size:15px;margin-top:1px}

  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  /* ---------- tabs ---------- */
  .tabs{
    display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    border-top:1px solid var(--rule);background:var(--surface);
    padding-bottom:var(--safe-b);position:relative;z-index:3;
  }
  .tab{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 10px;background:none;border:0;
    font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);
  }
  .tab .dot{
    position:absolute;top:4px;left:50%;margin-left:6px;
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:11px;font-weight:700;
    display:grid;place-items:center;
  }
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent)}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px}
  @media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}

  .prod{
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;gap:8px;
    min-height:80px;padding:10px 12px;text-align:left;
    background:var(--surface);border:1px solid var(--rule);border-bottom-width:2px;
    border-radius:var(--r-tile);
    -webkit-touch-callout:none;
    transition:transform .06s ease,background .12s ease;
  }
  .prod:active{transform:scale(.97);background:var(--accent-tint)}

  /* podržení = odebrání položky z účtu; pruh ukazuje, kolik zbývá */
  .prod .hold{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:left center}
  .prod.is-hold{background:var(--accent-tint);border-color:var(--accent)}
  .prod.is-hold .hold{transform:scaleX(1);transition:transform 1s linear}
  @media (prefers-reduced-motion:reduce){.prod.is-hold .hold{transition:none}}
  .prod .nm{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .prod .pr{font-size:14px;color:var(--ink-2)}
  .prod.is-on{border-color:var(--accent);background:var(--accent-tint)}
  /* odznak musí zůstat uvnitř karty, ta má oříznuté okraje kvůli pruhu držení */
  .prod .badge{
    position:absolute;top:7px;right:7px;min-width:26px;height:26px;padding:0 7px;
    display:grid;place-items:center;border-radius:13px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:13px;font-weight:700;
  }
  .prod.is-on .nm{padding-right:32px}

  /* barevná karta, pozadí i barva textu jdou z palety inline stylem,
     zbytek se veze na currentColor, takže sedí na jakoukoliv barvu */
  .prod.tinted{border-color:rgba(0,0,0,.16)}
  .prod.tinted .pr{color:inherit;opacity:.85}
  .prod.tinted:active,.prod.tinted.is-hold{filter:brightness(.9)}
  .prod.tinted.is-on{border-color:rgba(0,0,0,.3);box-shadow:inset 0 0 0 3px currentColor}
  .prod.tinted .badge{background:var(--ink);color:var(--bg)}
  .prod.tinted .hold{background:currentColor}
  .prod.custom{border-style:dashed;border-bottom-width:1px;background:transparent;align-items:center;justify-content:center;text-align:center}
  .prod.custom .nm{color:var(--ink-2)}

  .hint{padding:8px 24px 24px;color:var(--ink-3);font-size:13px;text-align:center;line-height:1.5}

  /* ---------- order bar ---------- */
  .bar{border-top:1px solid var(--rule);background:var(--surface);position:relative;z-index:2}
  .bar-lines{max-height:34dvh;overflow-y:auto;border-bottom:1px solid var(--rule)}
  .line{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule)}
  .line:last-child{border-bottom:0}
  .line .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:64px;text-align:right}
  .step{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:2px}
  .step button{width:30px;height:30px;border:0;background:none;border-radius:999px;font-size:17px;font-weight:600;line-height:1;color:var(--ink)}
  .step button:active{background:#E2DCD0}
  .step .q{min-width:22px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700}

  .bar-main{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .bar-sum{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
  .bar-sum .c{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
  .bar-sum .t{display:block;font-size:24px;margin-top:1px}
  .btn-pay{
    flex:0 0 auto;padding:14px 20px;border:0;border-radius:var(--r-btn);
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-pay:disabled{background:var(--track);color:var(--ink-3)}
  .btn-pay:not(:disabled):active{transform:scale(.98);background:var(--accent-dk)}
  .btn-clear{flex:0 0 auto;padding:12px 6px;background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:600}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(21,18,14,.44);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(14px)}to{transform:translateY(0)}}
  .sheet{
    width:100%;max-width:640px;background:var(--paper);
    border-radius:18px 18px 0 0;border-top:1px solid var(--rule);
    padding:18px 16px calc(18px + var(--safe-b));
    max-height:92dvh;overflow-y:auto;overflow-x:hidden;animation:rise .18s ease;
  }
  @media (prefers-reduced-motion:reduce){.scrim,.sheet,.toast{animation:none}}
  .sheet h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .sheet .big{font-size:46px;line-height:1;margin:8px 0 2px}
  .sheet .sub{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
  .sheet .txt{width:100%;height:190px;margin-top:14px;padding:12px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-family:var(--mono);font-size:12px;line-height:1.5;resize:none}

  .pay2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .btn-m{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:20px 10px;border-radius:var(--r-tile);border:0;color:#fff;
    font-size:17px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-m svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .btn-m:active{transform:scale(.98)}
  .m-cash{background:var(--cash)}
  .m-card{background:var(--card)}

  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .key{padding:13px 4px;border-radius:var(--r-btn);border:1px solid var(--rule);background:var(--surface);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .key:active{background:var(--sunk)}
  .keys.cash{grid-template-columns:repeat(5,1fr)}
  .keys.cash .w3{grid-column:span 3}
  .keys.cash .w2{grid-column:span 2}
  .key.wide{grid-column:span 2}
  .key.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .recv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-tile)}
  .recv .lbl{font-size:13px;color:var(--ink-2);font-weight:600}
  .recv .val{font-size:20px}
  .recv.give{background:#F0F7F3;border-color:#BFE0D0}
  .recv.give .val{color:var(--cash)}
  .recv.short .val{color:var(--accent)}
  .recv.off .lbl,.recv.off .val{color:var(--ink-3)}

  .btn-done{width:100%;margin-top:14px;padding:17px;border:0;border-radius:var(--r-btn);background:var(--ink);color:var(--paper);font-size:17px;font-weight:700}
  .btn-done:disabled{background:var(--track);color:var(--ink-3)}
  .btn-done:not(:disabled):active{transform:scale(.99)}
  .btn-done.warn{background:var(--accent)}
  .btn-done.go{background:var(--cash)}
  .btn-ghost{width:100%;margin-top:8px;padding:13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:transparent;color:var(--ink-2);font-size:14px;font-weight:600}

  .paid{display:flex;align-items:center;gap:9px;margin-top:16px;padding:13px 14px;border-radius:var(--r-tile);font-size:15px;font-weight:600;color:#fff}
  .paid svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------- history ---------- */
  .sec{padding:18px 16px 0}
  .sec h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  .hero{padding:18px 16px 16px;border-bottom:1px solid var(--rule)}
  .hero .sum{font-size:44px;line-height:1;margin-top:6px}
  .hero .meta{margin:8px 0 0;font-size:13px;color:var(--ink-2)}

  .split{display:flex;gap:2px;margin-top:14px;height:10px}
  .split i{display:block;border-radius:2px}
  .split i:first-child{border-radius:5px 2px 2px 5px}
  .split i:last-child{border-radius:2px 5px 5px 2px}
  .split i:only-child{border-radius:5px}
  .sp-cash{background:var(--cash)}
  .sp-card{background:var(--card)}
  .legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
  .lg{display:flex;align-items:baseline;gap:7px;font-size:13px}
  .lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;transform:translateY(-1px)}
  .lg .k{color:var(--ink-2);font-weight:600}
  .lg .v{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

  .items{display:flex;flex-direction:column;gap:11px}
  .it .r{display:flex;align-items:baseline;gap:10px}
  .it .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .q{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .it .a{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
  .it .track{height:6px;margin-top:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .it .fill{height:100%;background:var(--accent);border-radius:3px}

  .tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
  .tx:last-child{border-bottom:0}
  .tx .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .tx .mid{flex:1;min-width:0}
  .tx .w{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tx .a{font-family:var(--mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .tx .del{border:0;background:none;color:var(--ink-3);font-size:19px;line-height:1;padding:6px 2px 6px 8px}

  .arch{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .arch .mid{flex:1;min-width:0}
  .arch .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .arch .ab{width:32px;height:32px;flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:17px;line-height:1;border-radius:8px}
  .arch .ab:active{background:var(--sunk)}
  .arch .ab.del{color:var(--accent);font-size:19px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;padding:18px 16px 28px}
  .act{flex:1 1 auto;padding:13px 14px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:14px;font-weight:600}
  .act:active{background:var(--sunk)}
  .act.danger{color:var(--accent);border-color:#F0C7BF}
  .act.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- menu editor ---------- */
  .field{padding:0 16px 14px}
  .inp{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:15px}
  .inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  /* stejná textarea jako v panelu dokladu, jen zasazená do nastavení */
  .field .txt{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r-btn);
              background:var(--surface);font-family:var(--mono);font-size:13px;line-height:1.5;resize:none}
  .field .txt:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  .edit{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 16px;border-bottom:1px solid var(--rule)}
  .edit .e-nm{flex:1;min-width:0;padding:10px 11px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:15px;font-weight:500}
  .edit .e-nm:focus{background:var(--surface);border-color:var(--rule);outline:none}
  .edit .e-pr{width:70px;flex:0 0 auto;padding:10px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:right;font-family:var(--mono);font-weight:700;font-size:14px}
  .edit .e-pr:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .edit .e-vat{width:58px;flex:0 0 auto;padding:10px 6px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:right;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
  .edit .e-vat:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .edit .mv,.edit .rm{width:32px;height:34px;flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;border-radius:8px}
  .edit .mv:active,.edit .rm:active{background:var(--sunk)}
  .edit .rm{color:var(--accent);font-size:19px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));z-index:30;
    max-width:616px;margin:0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-radius:var(--r-tile);background:var(--ink);color:var(--paper);
    font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(21,18,14,.22);animation:rise .18s ease;
  }
  /* nad otevřeným oknem by hláška zakryla jeho tlačítka, jde nahoru */
  .toast.up{bottom:auto;top:calc(var(--safe-t) + 10px)}
  .toast .t{flex:1;min-width:0}
  .toast button{border:0;background:none;color:#FFB3A5;font-size:14px;font-weight:700;padding:4px 2px}
  .toast button.x{color:#9A9184;font-size:18px;line-height:1}

  /* ---------- daňový doklad ---------- */
  /* Pole Od/Do jsou input[type=date]. Na iOS si takové pole s výchozím
     vzhledem drží vlastní vnitřní šířku a width:100% ji nepřebije: pole
     vyjede z panelu a ten pak jde tahat do stran. Pomůže až vypnutí
     nativního vzhledu spolu s min-width:0 a vynulováním vnitřních částí,
     které si iOS kreslí sám. Ve výchozím stavu jsou pole pod sebou, vedle
     sebe je dáváme až tam, kde je na ně opravdu místo. */
  .doc-range{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
  .doc-range label{display:block;min-width:0}
  .doc-range .inp{
    -webkit-appearance:none;appearance:none;
    display:block;width:100%;min-width:0;max-width:100%;
  }
  .doc-range .inp::-webkit-date-and-time-value{text-align:left;min-width:0;margin:0}
  .doc-range .inp::-webkit-datetime-edit{padding:0}
  @media (min-width:520px){.doc-range{grid-template-columns:1fr 1fr}}
  .sf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .sf-grid .sf:nth-child(1),.sf-grid .sf:nth-child(4){grid-column:1 / -1}
  @media (max-width:400px){.sf-grid{grid-template-columns:1fr}.sf-grid .sf{grid-column:1 / -1}}
  .sf{display:block;min-width:0}
  .sf .inp,.sf .txt{min-width:0;max-width:100%}
  .sf-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;grid-column:1 / -1}
  .sf-sug:empty{margin-top:0}
  .sf-sug .sug{padding:7px 11px;border:1px solid var(--rule);border-radius:999px;
    background:var(--surface);font-size:13px;color:var(--ink-2)}
  .sf-sug .sug:active{background:var(--sunk)}
  .sf span{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .doc-range label span{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  /* Ikony v tlačítkách jsou vlastní SVG, ne znaky ani emoji. Jednotné
     nastavení tahu, velikost si každé místo doladí samo. */
  .step button svg,.key svg,.tx .del svg,.arch .ab svg,.edit .mv svg,.edit .rm svg,
  .served .drop svg,.toast button.x svg{
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    display:block;margin:0 auto;
  }

  /* ---------- průvodce propojením bez internetu ---------- */
  /* Smyčka 12 s, kroky po 3 s: 1 zapnutí hotspotu, 2 vlny + výběr sítě,
     3 heslo, 4 spojení. Kroky v textu se zvýrazňují ve stejném rytmu. */
  .oh-scene{margin:14px 0 4px;border:1px solid var(--rule);border-radius:var(--r-tile);background:var(--surface);padding:8px}
  .oh-scene svg{display:block;width:100%;height:auto}

  .oh-scr{fill:var(--paper)}
  .oh-row{fill:var(--sunk)}
  .oh-toggle{fill:#C9C2B6;transition:fill .3s;animation:ohToggle 12s infinite}
  .oh-knob{fill:#FFF;animation:ohKnob 12s infinite}
  .oh-pass{animation:ohPass 12s infinite}
  .oh-wave{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;opacity:0;animation:ohWave 12s infinite}
  .oh-wave.w2{animation-delay:.35s}
  .oh-pick{animation:ohPick 12s infinite}
  .oh-tick{fill:none;stroke:var(--cash);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:ohTick 12s infinite}
  .oh-linkline{fill:none;stroke:var(--cash);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:150;stroke-dashoffset:150;animation:ohLine 12s infinite}
  .oh-done-c{fill:var(--cash)}
  .oh-done-t{fill:none;stroke:#FFF;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .oh-done{opacity:0;animation:ohDone 12s infinite}
  @keyframes ohToggle{0%,6%{fill:#C9C2B6}10%,100%{fill:var(--cash)}}
  @keyframes ohKnob{0%,6%{transform:translateX(-5px)}10%,100%{transform:translateX(0)}}
  @keyframes ohPass{0%,48%{opacity:.35}54%,74%{opacity:1}80%,100%{opacity:.35}}
  @keyframes ohWave{0%,10%{opacity:0}16%,90%{opacity:1}96%,100%{opacity:0}}
  @keyframes ohPick{0%,26%{fill:var(--sunk)}32%,100%{fill:#EAF4EE}}
  @keyframes ohTick{0%,30%{opacity:0}36%,100%{opacity:1}}
  @keyframes ohLine{0%,74%{stroke-dashoffset:150}86%,100%{stroke-dashoffset:0}}
  @keyframes ohDone{0%,84%{opacity:0;transform:scale(.6);transform-origin:170px 97px}92%,100%{opacity:1;transform:scale(1)}}
  .oh-steps{margin:12px 0 0;padding:0 0 0 22px;text-align:left;font-size:14px;line-height:1.45;color:var(--ink-2)}
  .oh-steps li{margin:7px 0;transition:color .4s}
  .oh-steps .oh-s1{animation:ohHi1 12s infinite}
  .oh-steps .oh-s2{animation:ohHi2 12s infinite}
  .oh-steps .oh-s3{animation:ohHi3 12s infinite}
  .oh-steps .oh-s4{animation:ohHi4 12s infinite}
  @keyframes ohHi1{0%,24%{color:var(--ink);font-weight:600}26%,100%{color:var(--ink-2);font-weight:400}}
  @keyframes ohHi2{0%,24%{color:var(--ink-2)}26%,49%{color:var(--ink);font-weight:600}51%,100%{color:var(--ink-2);font-weight:400}}
  @keyframes ohHi3{0%,49%{color:var(--ink-2)}51%,74%{color:var(--ink);font-weight:600}76%,100%{color:var(--ink-2);font-weight:400}}
  @keyframes ohHi4{0%,74%{color:var(--ink-2)}76%,100%{color:var(--ink);font-weight:600}}
  @media (prefers-reduced-motion:reduce){
    .oh-scene *,.oh-steps li{animation:none !important}

  .ob-row i svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- fronta objednávek ---------- */

  .chip{
    display:inline-flex;align-items:center;gap:4px;max-width:100%;

  /* položky v otevřené objednávce */
  .steps{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .st{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:13px 14px;border-radius:var(--r-tile);border:1px solid rgba(0,0,0,.14);
    font-size:16px;font-weight:700;
  }
  .st:active{filter:brightness(.92)}
  .st .nm{flex:1;min-width:0}
  .st .cnt{font-family:var(--mono);font-size:15px;opacity:.8}
  .st .box{
    flex:0 0 auto;width:26px;height:26px;border-radius:7px;
    border:2px solid currentColor;display:grid;place-items:center;
  }
  .st .box svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}

  .served{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule)}

  /* ---------- výběr barvy a přepínač režimu ---------- */

  .wheelhead{margin-top:20px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .wheelwrap{display:flex;align-items:center;gap:18px;margin-top:12px;flex-wrap:wrap}

  .wheelside{display:flex;flex-direction:column;gap:14px;flex:1;min-width:120px}
  .wprev{width:64px;height:52px;border-radius:12px;border:1px solid rgba(0,0,0,.18);display:grid;place-items:center;font-weight:700;font-size:16px}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 16px;border:1px solid var(--rule);border-radius:var(--r-btn);overflow:hidden;background:var(--surface)}

<script>
(function () {
  "use strict";

  var KEY = "kavakasa.v1";

  // Paleta karet. Barva položce nese informaci sama o sobě, obsluha ji pozná
  // dřív, než stihne přečíst název, proto jsou odstíny vybrané tak, aby šly
  // rozeznat i vedle sebe, a ke každému je natvrdo daná barva textu, která na
  // něm má kontrast aspoň 4,75:1.
  var COLORS = [
    { k: "cervena",  n: "Červená",   bg: "#C0311B", ink: "#FFFFFF" },
    { k: "oranzova", n: "Oranžová",  bg: "#F08A24", ink: "#23150A" },
    { k: "zluta",    n: "Žlutá",     bg: "#F5CE3E", ink: "#241C00" },
    { k: "limetka",  n: "Limetka",   bg: "#A8C93A", ink: "#1C2405" },
    { k: "zelena",   n: "Zelená",    bg: "#127A4E", ink: "#FFFFFF" },
    { k: "mata",     n: "Máta",      bg: "#8FD9C0", ink: "#0C2A20" },
    { k: "tyrkys",   n: "Tyrkys",    bg: "#08627F", ink: "#FFFFFF" },
    { k: "nebeska",  n: "Nebeská",   bg: "#8EC4EE", ink: "#0A2033" },
    { k: "modra",    n: "Modrá",     bg: "#2158C4", ink: "#FFFFFF" },
    { k: "fialova",  n: "Fialová",   bg: "#8A2FA8", ink: "#FFFFFF" },
    { k: "ruzova",   n: "Růžová",    bg: "#F2A0C0", ink: "#351020" },
    { k: "purpur",   n: "Purpurová", bg: "#B62F72", ink: "#FFFFFF" },
    { k: "hneda",    n: "Hnědá",     bg: "#5C4632", ink: "#FFFFFF" },
    { k: "grafit",   n: "Grafit",    bg: "#262B33", ink: "#FFFFFF" }
  ];

  function colorOf(key) {
    for (var i = 0; i < COLORS.length; i++) { if (COLORS[i].k === key) { return COLORS[i]; } }
    // vlastní barva z kolečka se ukládá rovnou jako "#rrggbb"
    if (typeof key === "string" && key.charAt(0) === "#" && /^#[0-9a-fA-F]{6}$/.test(key)) {
      return { k: key, n: T("colCustom"), bg: key, ink: inkFor(key) };
    }
    return null;
  }

  // Text na vlastní barvě: tmavý, nebo bílý, podle toho, který má vyšší kontrast.
  function inkFor(hex) {
    var lin = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * lin(parseInt(hex.slice(1, 3), 16)) +
            0.7152 * lin(parseInt(hex.slice(3, 5), 16)) +
            0.0722 * lin(parseInt(hex.slice(5, 7), 16));
    var whiteC = 1.05 / (L + 0.05);
    var darkC = (L + 0.05) / 0.058;   // luminance textové barvy #15120E
    return darkC >= whiteC ? "#15120E" : "#FFFFFF";
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;

    var f = function (n) {
      var k = (n + h / 30) % 12;
      var c = l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
      return ("0" + Math.round(255 * c).toString(16)).slice(-2);

    return "#" + f(0) + f(8) + f(4);
  }

  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255,
        g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var l = (max + min) / 2, d = max - min, h = 0, s = 0;
    if (d) {

      if (max === r) { h = 60 * (((g - b) / d) % 6); }
      else if (max === g) { h = 60 * ((b - r) / d + 2); }
      else { h = 60 * ((r - g) / d + 4); }
      if (h < 0) { h += 360; }
    }
    return { h: h, s: s * 100, l: l * 100 };
  }

      if (typeof it.color !== "undefined") { return; }
      while (next < COLORS.length && used[COLORS[next].k]) { next++; }
      it.color = next < COLORS.length ? COLORS[next].k : "";
      if (it.color) { used[it.color] = true; next++; }
    });

    // účtenky z verze bez fronty doplníme, ať mají číslo a stav
    var maxNo = 0;
    d.sales.forEach(function (s, i) {
      if (typeof s.no !== "number") { s.no = i + 1; }
      if (s.no > maxNo) { maxNo = s.no; }
      s.status = s.status === "open" ? "open" : "served";
      s.updatedAt = typeof s.updatedAt === "number" ? s.updatedAt : (s.ts || 0);
      s.lines.forEach(function (l) {
        l.ready = typeof l.ready === "number" ? l.ready : l.qty;
      });
    });
    d.nextNo = typeof d.nextNo === "number" && d.nextNo > maxNo ? d.nextNo : maxNo + 1;
    return d;
  }

  function isEmpty(d) {
    return !d || (!d.sales.length && !d.archives.length && !d.order.length);
  }

  function load() {
    // v nativní aplikaci je zdrojem pravdy soubor v úložišti zařízení
    if (typeof window.__KASA_BOOT__ === "string" && window.__KASA_BOOT__) {
      var boot = parseState(window.__KASA_BOOT__);
      if (boot) { return boot; }
    }
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    return parseState(raw) || fresh();
  }

  function save() {
    state.savedAt = Date.now();
    var json;
    try { json = JSON.stringify(state); } catch (e) { return; }

    try { localStorage.setItem(KEY, json); } catch (e) {}

    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kasa) {
        window.webkit.messageHandlers.kasa.postMessage(json);
      }
    } catch (e) {}

    if (!dbSettled) { return; }
    if (dbTimer) { clearTimeout(dbTimer); }
    dbTimer = setTimeout(function () { dbWrite(json); }, 300);
  }

  function dbWrite(json) {
    if (!db) { return; }
    try { db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).put(json, DB_KEY); } catch (e) {}
  }

  function dbRead(cb) {
    if (!db) { cb(null); return; }
    try {
      var rq = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(DB_KEY);
      rq.onsuccess = function () { cb(rq.result || null); };
      rq.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }

  function dbInit(done) {
    var called = false;
    function settle() { if (!called) { called = true; done(); } }
    setTimeout(settle, 3000);
    var rq;
    try { rq = indexedDB.open(DB_NAME, 1); } catch (e) { settle(); return; }
    rq.onupgradeneeded = function () {
      try { rq.result.createObjectStore(DB_STORE); } catch (e) {}
    };
    rq.onsuccess = function () { db = rq.result; settle(); };
    rq.onerror = function () { settle(); };
    rq.onblocked = function () { settle(); };
  }

  // ---------- helpers ----------

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }


  function clock(ts) {
    var d = new Date(ts);
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function orderTotal() {
    return state.order.reduce(function (s, l) { return s + l.price * l.qty; }, 0);
  }
  function orderCount() {
    return state.order.reduce(function (s, l) { return s + l.qty; }, 0);
  }
  function salesTotal() {
    return state.sales.reduce(function (s, t) { return s + t.total; }, 0);
  }

  function say(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function findItem(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) { return state.items[i]; }
    }
    return null;
  }

  function refFor(name, price) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].name === name && state.items[i].price === price) { return state.items[i].id; }
    }
    return uid();
  }

  // ---------- order ----------

  function addToOrder(item) {
    var line = null;
    for (var i = 0; i < state.order.length; i++) {
      if (state.order[i].ref === item.id && state.order[i].price === item.price) { line = state.order[i]; break; }
    }
    if (line) { line.qty += 1; }
    else {
      // sazbu si řádek nese s sebou, ať pozdější úprava položky nepřepíše
      // už rozúčtovaný doklad
      state.order.push({ ref: item.id, name: item.name, price: item.price, qty: 1,
                         color: item.color, vat: vatStr(item.vat) });
    }
    save();
    render();
    say(item.name + " · " + czk(orderTotal()));
  }

  function bump(idx, delta) {
    var line = state.order[idx];
    if (!line) { return; }
    line.qty += delta;
    if (line.qty <= 0) { state.order.splice(idx, 1); }
    if (!state.order.length) { linesOpen = false; }
    save();
    render();
  }

  // ---------- sale ----------

  function commit() {
    if (!isPro() && paymentsToday() >= FREE_LIMIT) {
      sheet = { step: "paywall", reason: "limit" };
      render(); return;
    }
    countPayment();
    var sale = {
      id: uid(),
      no: state.nextNo++,
      ts: Date.now(),
      updatedAt: Date.now(),
      method: sheet.method,
      total: sheet.total,
      status: "open",
      lines: state.order.map(function (l) {
        return { name: l.name, price: l.price, qty: l.qty, color: l.color || "", vat: vatStr(l.vat), ready: 0 };
      })
    };
    state.sales.push(sale);
    state.order = [];
    linesOpen = false;
    sheet = null;
    save();
    pushOrder(sale, true);
    render();
    if (state.mode === "kasa" && state.voice) { sayThanks(); }
    showToast(T("toastSaved", czk(sale.total), sale.method === "cash" ? T("cashLower") : T("cardLower")), sale.id);
    say(T("toastSaved", czk(sale.total), ""));
  }

  function undoSale(id) {
    var i = state.sales.length - 1;
    while (i >= 0 && state.sales[i].id !== id) { i--; }
    if (i < 0) { return; }
    var sale = state.sales.splice(i, 1)[0];
    state.order = sale.lines.map(function (l) {
      return { ref: refFor(l.name, l.price), name: l.name, price: l.price, qty: l.qty, color: l.color || "" };
    });
    if (sale.no === state.nextNo - 1) { state.nextNo = sale.no; }
    hideToast();
    save();
    pushDelete([sale.id]);
    render();
    say(T("undoBtn"));
  }

  function showToast(text, undoId) {
    toast = { text: text, undo: undoId || null };
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { hideToast(); render(); }, 7000);
    render();
  }

  function hideToast() {
    toast = null;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  }

  function ask(title, text, okLabel, fn) {
    pending = fn;
    sheet = { step: "confirm", title: title, text: text, ok: okLabel };
    render();
  }

  // ---------- fronta objednávek ----------
  // Zaplacený účet nezmizí, zařadí se do fronty jako objednávka s číslem.
  // Kdo připravuje, odškrtává v ní položky a nakonec dá Vydáno.

  function openOrders() {
    return state.sales.filter(function (s) { return s.status === "open"; })
      .sort(function (a, b) { return a.no - b.no; });
  }

  function servedOrders() {
    return state.sales.filter(function (s) { return s.status !== "open"; })
      .sort(function (a, b) { return b.no - a.no; });
  }

  function findSale(id) {
    for (var i = 0; i < state.sales.length; i++) {
      if (state.sales[i].id === id) { return state.sales[i]; }
    }
    return null;
  }

  function pieces(s) {
    return s.lines.reduce(function (n, l) { return n + l.qty; }, 0);
  }

  function ready(s) {
    return s.lines.reduce(function (n, l) { return n + Math.min(l.ready || 0, l.qty); }, 0);
  }

  function allReady(s) { return ready(s) >= pieces(s); }

  function tint(key, fallback) {
    var c = colorOf(key);
    if (!c) { return fallback || ""; }
    return ' style="background:' + c.bg + ";color:" + c.ink + ";--bg:" + c.bg + ";--ink:" + c.ink + '"';
  }

  // ---------- spárované zařízení ----------
  // Kasa a výdej si posílají celý seznam objednávek. Slučuje se podle id,
  // vyhrává novější updatedAt, pořadí zpráv tak nehraje roli.

  var peers = 0;
  var muted = false;
  var announced = {};      // id objednávek, které už zazněly

  // Nová objednávka se na výdeji přečte nahlas, ať se obsluha nemusí dívat.
  // iOS pustí hlas až po nějakém klepnutí, o to se stará tlačítko v Menu.
  function speak(text) {
    try {
      if (!window.speechSynthesis) { return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = langInfo().loc;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // Na kase zazní poděkování zákazníkovi, jakmile je účet hotový.
  // Záměrně jen samotná věta, bez názvu akce: u stánku se jméno akce
  // opakovalo u každého účtu a znělo to samoúčelně.
  function sayThanks() {
    speak(T("speakThanks"));
  }

  function saySale(s) {
    var parts = [T("speakNewOrder", s.no)];
    s.lines.forEach(function (l) {
      parts.push(l.qty > 1 ? T("speakTimes", l.qty, l.name) : l.name + ".");
    });
    speak(parts.join(" "));
  }

  // Nativní hledání protějšku smí běžet jen v rámci našeho kódu spárování.
  // Voláme při startu a po každé změně kódu; prázdný kód spojení vypne.
  function nativeLink() {
    try {
      if (typeof window.__kasaPeerLink === "function") { window.__kasaPeerLink(state.pair || ""); }
    } catch (e) {}
  }

  // Most se načítá až za touhle stránkou, takže při startu ještě nemusí být
  // po ruce. Necháme mu proto způsob, jak si kód vyzvednout sám.
  window.__kasaRoom = function () { return (state && state.pair) || ""; };

  function nativeSend(msg) {
    try {
      if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.peer) { return; }
      if (!state.pair) { return; }
      msg.src = myId;
      msg.room = state.pair;
      window.webkit.messageHandlers.peer.postMessage(JSON.stringify(msg));
    } catch (e) {}
  }

  // Posílá se vždycky jen ta jedna změněná objednávka, ne celý seznam -
  // jinak zprávy přerostou limit přeposílače a přestanou chodit úplně.
  var pendingOrders = {}, pendTimer = null;

  // Odškrtávání jde rychle po sobě; kdyby každé ťuknutí letělo zvlášť, brzy
  // by došel denní limit přeposílače. Proto se změny na chvíli posbírají.
  function pushOrder(sale, now) {
    if (muted) { return; }
    pendingOrders[sale.id] = sale;
    if (now) { flushOrders(); return; }
    if (pendTimer) { return; }
    pendTimer = setTimeout(flushOrders, 1200);
  }

  function flushOrders() {
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    var list = [];
    Object.keys(pendingOrders).forEach(function (k) {
      if (findSale(k)) { list.push(pendingOrders[k]); }
    });
    pendingOrders = {};
    if (!list.length) { return; }
    nativeSend({ t: "sync", event: state.event, sales: list.map(slim) });
    relaySales(list);
  }

  function pushDelete(ids) {
    if (muted) { return; }
    flushOrders();
    nativeSend({ t: "del", ids: ids });
    relayDeleted(ids);
  }

  function pushClear() {
    if (muted) { return; }
    pendingOrders = {};
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    nativeSend({ t: "clear" });
    relayCleared();
  }

  function pushEverything() {
    if (muted) { return; }
    pendingOrders = {};
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    var open = openOrders();
    nativeSend({ t: "sync", event: state.event, sales: open.map(slim) });
    relaySales(open);
  }

  window.__kasaPeer = function (raw) {
    var msg = null;
    try { msg = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { return; }
    if (!msg || (!Array.isArray(msg.sales) && msg.t !== "del" && msg.t !== "clear")) { return; }
    // pojistka pro případ, že by se spojení navázalo mimo náš kód
    if (!state.pair || (msg.room && msg.room !== state.pair)) { return; }
    lastIn = Date.now();   // i nativní zpráva je „druhé zařízení se ozvalo"

    var changed = false;

    if (msg.t === "del" && Array.isArray(msg.ids)) {
      var before = state.sales.length;
      state.sales = state.sales.filter(function (x) { return msg.ids.indexOf(x.id) < 0; });
      changed = state.sales.length !== before;
    } else if (msg.t === "clear") {
      changed = state.sales.length > 0;
      state.sales = [];
      state.nextNo = 1;
    } else if (Array.isArray(msg.sales)) {
      var mine = {};
      state.sales.forEach(function (s) { mine[s.id] = s; });
      msg.sales.forEach(function (inc) {
        var have = mine[inc.id];
        if (!have) { state.sales.push(inc); changed = true; return; }
        if ((inc.updatedAt || 0) > (have.updatedAt || 0)) {
          state.sales[state.sales.indexOf(have)] = inc;
          changed = true;
        }
      });
    }
    if (!changed) { return; }

    if (state.mode === "vydej" && state.voice) {
      state.sales.forEach(function (s) {
        if (s.status !== "open" || announced[s.id]) { return; }
        announced[s.id] = true;
        saySale(s);
      });
    }

    state.sales.sort(function (a, b) { return (a.no || 0) - (b.no || 0); });
    var maxNo = 0;
    state.sales.forEach(function (s) { if (s.no > maxNo) { maxNo = s.no; } });
    if (state.nextNo <= maxNo) { state.nextNo = maxNo + 1; }
    if (msg.event && state.mode === "vydej") { state.event = msg.event; }

    muted = true;              // příchozí změnu neposíláme hned zpátky
    save();
    muted = false;
    render();
  };

  // Párování přes internet: obě zařízení visí na stejném hotspotu, takže mají
  // i data. Posílají si změny přes veřejný přeposílač pod kódem, který funguje
  // jako adresa. Používá se, jen když si ho uživatel zapne.
  //
  // Přeposílač má dva tvrdé limity: jedna zpráva smí mít nejvýš 4 kB a je
  // strop na počet zpráv za den. Proto se posílá vždycky jen to, co se právě
  // změnilo, jedna objednávka na zprávu, a ne celý seznam. A když
  // přeposílač zprávu odmítne, řekne se to nahlas místo tichého ignorování.

  // Veřejné přeposílače mají denní limity a občas prostě odmítnou. Proto
  // jedeme přes dva naráz: posílá se na oba a poslouchá se na obou. Stačí,
  // aby v danou chvíli fungoval jeden. Zprávy jsou nezávislé na pořadí a
  // slučují se podle id, takže když dorazí dvakrát, nic se nestane.
  var RELAYS = (typeof window.__KASA_RELAY__ === "string" && window.__KASA_RELAY__)
    ? window.__KASA_RELAY__.split(",")
    : ["https://ntfy.sh/", "https://ntfy.envs.net/"];

  var MAX_BYTES = 3500;
  var myId = Math.random().toString(36).slice(2, 10);
  var links = [];
  var seen = {}, relayError = "", lastIn = 0, lastOut = 0, sentOpen = false;
  var pingAt = 0, testResult = "";

  function relayTopic() { return state.pair ? "kasa-stanek-" + state.pair : ""; }

  function anySse() {
    for (var i = 0; i < links.length; i++) { if (links[i].sseUp) { return true; } }
    return false;
  }

  // Zelená tečka nesmí svítit jen proto, že se povedl dotaz, to by lhalo.
  // Svítí, až když drží stálé spojení nebo když od protějšku něco přišlo.
  function refreshLink() {
    setPeers(anySse() || lastIn ? 1 : 0);
  }

  function setPeers(n) {
    if (peers === n) { return; }
    peers = n;
    render();
  }

  function setRelayError(text) {
    if (relayError === text) { return; }
    relayError = text;
    render();
  }

  // z objednávky posíláme jen to, co druhá strana potřebuje pro frontu
  function slim(s) {
    return {
      id: s.id, no: s.no, ts: s.ts, total: s.total, method: s.method,
      status: s.status, updatedAt: s.updatedAt,
      lines: s.lines.map(function (l) {
        return { name: l.name, price: l.price, qty: l.qty, ready: l.ready || 0, color: l.color || "" };
      })
    };
  }

  // Pošle na všechny přeposílače. Chybu hlásíme, teprve když selžou všechny.
  function relayPost(msg, done) {
    var topic = relayTopic();
    if (!topic || !window.fetch || !links.length) { return; }
    msg.src = myId;
    var body;
    try { body = JSON.stringify(msg); } catch (e) { return; }

    var left = links.length, ok = false, worst = 0;
    links.forEach(function (link) {
      fetch(link.base + topic, { method: "POST", body: body }).then(function (r) {
        if (r.ok) { ok = true; } else if (r.status > worst) { worst = r.status; }
      }, function () {}).then(function () {
        if (--left) { return; }
        if (ok) {
          lastOut = Date.now();
          setRelayError("");
        } else {
          setRelayError(worst === 429 ? T("relayLimit")
            : worst ? T("relayRefused", worst)
            : T("relayOffline"));
        }
        if (done) { done(ok, worst); }
      });
    });
  }

  // Objednávky posíláme po dávkách, aby se žádná zpráva nevešla přes limit.
  function relaySales(list) {
    var batch = [], size = 0;
    list.forEach(function (s) {
      var one = slim(s);
      var len = JSON.stringify(one).length;
      if (batch.length && size + len > MAX_BYTES) {
        relayPost({ t: "sync", event: state.event, sales: batch });
        batch = []; size = 0;
      }
      batch.push(one); size += len;
    });
    if (batch.length) { relayPost({ t: "sync", event: state.event, sales: batch }); }
  }

  // Ohlášení se: obě zařízení o sobě dají vědět, jakmile se připojí nebo
  // se na to člověk podívá do Menu. Bez toho by "spárováno" nešlo poznat
  // dřív než u první objednávky, a hlavně by nebylo vidět, že každé
  // zařízení visí na jiném kódu.
  var lastHello = 0, helloBack = 0;

  function sayHello(force) {
    var now = Date.now();
    if (!force && now - lastHello < 15000) { return; }
    lastHello = now;
    relayPost({ t: "hi", role: state.mode });
  }

  function relayDeleted(ids) { relayPost({ t: "del", ids: ids }); }
  function relayCleared() { relayPost({ t: "clear" }); }

  // Zkouška spojení: pošle vlastní značku a čeká, jestli se vrátí. Rozliší
  // tím tři různé poruchy, neodešlo, odešlo ale nechodí zpátky, nebo je vše
  // v pořádku, a nepotřebuje k tomu druhé zařízení.
  function relayTest() {
    if (!relayTopic()) { testResult = T("testNoCode"); render(); return; }
    pingAt = Date.now();
    testResult = T("testTrying");
    render();
    relayPost({ t: "ping", at: pingAt }, function (ok, worst) {
      if (!ok) {
        pingAt = 0;
        testResult = worst === 429 ? T("testLimit")
          : worst ? T("testRefused", worst)
          : T("testOffline");
        render();
        return;
      }
      if (!pingAt) { return; }   // odpověď stihla dorazit dřív než potvrzení odeslání
      testResult = T("testSent");
      render();
      setTimeout(function () {
        if (!pingAt) { return; }
        pingAt = 0;
        testResult = T("testNoEcho");
        render();
      }, 8000);
    });
  }

  function relayClose() {
    links.forEach(function (l) {
      if (l.es) { try { l.es.close(); } catch (e) {} }
      if (l.timer) { clearInterval(l.timer); }
    });
    links = [];
    seen = {}; sentOpen = false; relayError = ""; testResult = ""; pingAt = 0;
  }

  function relayTake(link, env) {
    if (!env || env.event !== "message" || !env.message) { return; }
    var key = link.base + "|" + env.id;
    if (seen[key]) { return; }
    seen[key] = true;
    if (env.time > link.lastTs) { link.lastTs = env.time; }

    var msg = null;
    try { msg = JSON.parse(env.message); } catch (e) { return; }
    if (!msg) { return; }

    if (msg.t === "ping") {
      if (msg.src === myId && pingAt) {
        testResult = T("testOk", ((Date.now() - pingAt) / 1000).toFixed(1));
        pingAt = 0;
        render();
      }
      return;
    }
    if (msg.src === myId) { return; }   // vlastní zprávy zpátky nebereme

    if (msg.t === "hi") {
      lastIn = Date.now();
      refreshLink();
      if (Date.now() - helloBack > 5000) {   // ozveme se zpátky, ale ne donekonečna
        helloBack = Date.now();
        sayHello(true);
      }
      render();
      return;
    }

    lastIn = Date.now();
    refreshLink();
    window.__kasaPeer(msg);
  }

  // Stálé spojení je hlavní cesta; dotazování je záloha, když ho síť nepustí.
  // Když spojení drží, ptáme se zřídka, ať zbytečně nepálíme denní limit.
  function relayPoll(link) {
    var topic = relayTopic();
    if (!topic || !window.fetch) { return; }
    fetch(link.base + topic + "/json?poll=1&since=" + (link.lastTs ? link.lastTs : "5m"))
      .then(function (r) {
        if (!r.ok) { throw new Error(String(r.status)); }
        return r.text();
      })
      .then(function (body) {
        body.split("\n").forEach(function (line) {
          if (!line.trim()) { return; }
          try { relayTake(link, JSON.parse(line)); } catch (e) {}
        });
        refreshLink();
      })
      .catch(function () { refreshLink(); });
  }

  function schedulePoll(link) {
    if (link.timer) { clearInterval(link.timer); }
    link.timer = setInterval(function () { relayPoll(link); }, link.sseUp ? 20000 : 4000);
  }

  // pro diagnostiku: stav jednotlivých přeposílačů
  window.__kasaLinks = function () {
    return links.map(function (l) {
      return { base: l.base, sseUp: l.sseUp, lastTs: l.lastTs };
    });
  };

  function relayOpen() {
    relayClose();
    var topic = relayTopic();
    if (!topic) { return; }

    links = RELAYS.map(function (base) { return { base: base, es: null, sseUp: false, lastTs: 0, timer: null }; });

    links.forEach(function (link) {
      if (window.EventSource) {
        try {
          link.es = new EventSource(link.base + topic + "/sse?since=5m");
          link.es.onopen = function () {
            link.sseUp = true;
            schedulePoll(link);
            refreshLink();
            setRelayError("");
            if (!sentOpen) { sentOpen = true; sayHello(true); relaySales(openOrders()); }
          };
          link.es.onerror = function () {
            link.sseUp = false;
            schedulePoll(link);
            refreshLink();
          };
          link.es.onmessage = function (ev) {
            try { relayTake(link, JSON.parse(ev.data)); } catch (e) {}
          };
        } catch (e) {}
      }
      relayPoll(link);
      schedulePoll(link);
    });
  }

  window.__kasaPeerCount = function (n) {
    setPeers(n | 0);
    if (peers > 0) { pushEverything(); }   // nový protějšek dostane frontu
  };

  // ---------- stats ----------

  function stats() {
    var s = { total: 0, cash: 0, card: 0, count: state.sales.length, pieces: 0, items: [] };
    var map = {};
    state.sales.forEach(function (t) {
      s.total += t.total;
      if (t.method === "cash") { s.cash += t.total; } else { s.card += t.total; }
      t.lines.forEach(function (l) {
        // sazba je součástí klíče, ať se do archivu nesloučí stejná položka
        // prodávaná pod dvěma sazbami
        var lv = resolveVat(l.name, l.vat);
        var k = l.name + "|" + l.price + "|" + lv;
        if (!map[k]) { map[k] = { name: l.name, price: l.price, vat: lv, qty: 0, sum: 0 }; }
        map[k].qty += l.qty;
        map[k].sum += l.qty * l.price;
        s.pieces += l.qty;
      });
    });
    Object.keys(map).forEach(function (k) { s.items.push(map[k]); });
    s.items.sort(function (a, b) { return b.sum - a.sum || b.qty - a.qty; });
    return s;
  }

  function summaryText() {
    var s = stats();
    var out = [];
    out.push(state.event || T("noName"));
    out.push(new Date().toLocaleDateString(langInfo().loc) + " " + clock(Date.now()));
    out.push("");
    out.push(T("sumTotal") + " " + czk(s.total));
    out.push("  " + T("cashLower") + ": " + czk(s.cash));
    out.push("  " + T("cardLower") + ": " + czk(s.card));
    out.push(T("sumBills") + " " + s.count + " · " + T("sumPieces") + " " + s.pieces);
    out.push("");
    s.items.forEach(function (i) {
      out.push(i.qty + "x " + i.name + " a " + czk(i.price) + " = " + czk(i.sum));
    });
    return out.join("\n");
  }

  // ---------- souhrnný daňový doklad ----------
  // Sečte prodeje za období: aktuální účtenky podle času uložení, uzavřené
  // akce podle data uzavření (jednotlivé účtenky se v archivu už nedrží).

  function docDate(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }

  function docBody(fromS, toS) {
    var from = new Date(fromS + "T00:00:00").getTime();
    var to = new Date(toS + "T23:59:59.999").getTime();
    if (isNaN(from) || isNaN(to)) { return null; }

    var total = 0, cashSum = 0, cardSum = 0, bills = 0;
    var items = {}, events = {};
    var addItem = function (name, price, qty, sum, vat) {
      var v = vatStr(vat);
      var k = name + "|" + price + "|" + v;
      if (!items[k]) { items[k] = { name: name, price: price, vat: v, qty: 0, sum: 0 }; }
      items[k].qty += qty;
      items[k].sum += sum;
    };

    state.sales.forEach(function (s) {
      if (s.ts < from || s.ts > to) { return; }
      bills += 1;
      total += s.total;
      if (s.method === "cash") { cashSum += s.total; } else { cardSum += s.total; }
      events[state.event || T("noName")] = true;
      s.lines.forEach(function (l) {
        addItem(l.name, l.price, l.qty, l.qty * l.price, resolveVat(l.name, l.vat));
      });
    });

    state.archives.forEach(function (a) {
      if (a.closedAt < from || a.closedAt > to) { return; }
      bills += a.count || 0;
      total += a.total || 0;
      cashSum += a.cash || 0;
      cardSum += a.card || 0;
      events[(a.event || T("noName")) + " (" + new Date(a.closedAt).toLocaleDateString(langInfo().loc) + ")"] = true;
      (a.items || []).forEach(function (i) {
        addItem(i.name, i.price, i.qty, i.sum, resolveVat(i.name, i.vat));
      });
    });

    if (!bills) { return ""; }

    var list = Object.keys(items).map(function (k) { return items[k]; });
    list.sort(function (a, b) { return b.sum - a.sum || b.qty - a.qty; });

    // Rozpis DPH počítáme jednou a používají ho text i PDF. Ceny se zadávají
    // včetně daně, základ tedy dopočítáváme zpětně: zaklad = cena/(1+sazba/100).
    // Položky bez sazby jdou do základu celé, aby základ a daň daly dohromady
    // přesně celkovou tržbu.
    var vatRows = [], vatBase = 0, vatTax = 0, anyRate = false;
    if (state.vat) {
      var rates = {};
      list.forEach(function (i) {
        var r = vatNum(i.vat);
        var key = r === null ? "" : String(r);
        if (r !== null) { anyRate = true; }
        rates[key] = (rates[key] || 0) + i.sum;
      });
      if (anyRate) {
        Object.keys(rates).sort(function (a, b) {
          return (parseFloat(a) || 0) - (parseFloat(b) || 0);
        }).forEach(function (key) {
          var gross = rates[key];
          var r = key === "" ? null : parseFloat(key);
          var base = r === null ? mr(gross) : mr(gross / (1 + r / 100));
          var tax = mr(gross - base);
          vatBase += base;
          vatTax += tax;
          vatRows.push({ rate: r, gross: gross, base: base, tax: tax });
        });
      }
    }

    var now = new Date();
    var no = "TK-" + docDate(now).replace(/-/g, "") + "-" + ("0" + now.getHours()).slice(-2) + ("0" + now.getMinutes()).slice(-2);
    var loc = langInfo().loc;
    var out = [];
    out.push(T("docTitle"));
    out.push("");
    var sl = sellerLines();
    if (sl.length) {
      sl.forEach(function (ln) { out.push(ln); });
      out.push("");
    }
    out.push(T("docNo") + " " + no);
    out.push(T("docPeriod") + " " + new Date(from).toLocaleDateString(loc) + " - " + new Date(to).toLocaleDateString(loc));
    out.push(T("docIssued") + " " + now.toLocaleDateString(loc) + " " + clock(now.getTime()));
    out.push(T("docEvents") + " " + Object.keys(events).join(", "));
    out.push("");
    out.push(T("docItemsHead"));
    list.forEach(function (i) {
      out.push(i.qty + "x " + i.name + " (" + czk(i.price) + ")  " + czk(i.sum) +
               (state.vat && vatNum(i.vat) !== null ? "  " + vatStr(i.vat) + " %" : ""));
    });
    out.push("");

    // Rozpis DPH. Ceny se zadávají včetně daně, takže základ dopočítáváme
    // zpětně: zaklad = cena / (1 + sazba/100). Položky bez sazby jdou do
    // základu celé, aby základ a daň daly dohromady přesně celkovou tržbu.
    if (vatRows.length) {
      out.push(T("docVatHead"));
      vatRows.forEach(function (v) {
        out.push(v.rate === null
          ? T("docVatNone") + ": " + czk(v.base)
          : T("docVatRate") + " " + v.rate + " %: " + T("docVatBase") + " " + czk(v.base) +
            ", " + T("docVatTax") + " " + czk(v.tax));
      });
      out.push(T("docVatTotalBase") + " " + czk(vatBase));
      out.push(T("docVatTotalTax") + " " + czk(vatTax));
      out.push("");
    }
    out.push(T("docReceipts") + " " + bills);
    out.push(T("cash") + ": " + czk(cashSum));
    out.push(T("card") + ": " + czk(cardSum));
    out.push(T("docTotal") + ": " + czk(total));
    out.push("");
    out.push(T("docFooter"));

    // Text i PDF stojí na týchž datech, ať se nikdy nerozejdou.
    return {
      text: out.join("\n"),
      no: no,
      from: from, to: to, issued: now.getTime(),
      seller: sl,
      events: Object.keys(events),
      items: list,
      vatRows: vatRows, vatBase: vatBase, vatTax: vatTax,
      bills: bills, cash: cashSum, card: cardSum, total: total
    };
  }

  // ---------- doklad jako PDF ----------
  // Doklad kreslíme na plátno a to pak vkládáme do PDF jako JPEG. Důvod je
  // prozaický: kdybychom text psali do PDF přímo, museli bychom do souboru
  // vložit celý font, jinak by se rozsypala diakritika. Devět jazyků včetně
  // češtiny, polštiny a portugalštiny by přes standardní kódování neprošlo.

  var PDF_W = 595, PDF_H = 842;   // A4 v bodech
  var PDF_SCALE = 3;              // px na bod, kvůli ostrosti při tisku

  function pdfPages(doc) {
    var M = 42;                       // okraj
    var rowH = 17;
    var pages = [];

    // kolik řádků položek se vejde na první a na další stránky
    var headH = 210 + Math.max(0, doc.seller.length - 4) * 12;
    var footH = 150 + doc.vatRows.length * rowH;
    var firstRows = Math.max(1, Math.floor((PDF_H - M - headH - footH - M) / rowH));
    var nextRows = Math.max(1, Math.floor((PDF_H - M - 90 - M) / rowH));

    var rest = doc.items.slice();
    pages.push(rest.splice(0, firstRows));
    while (rest.length) { pages.push(rest.splice(0, nextRows)); }
    return { pages: pages, M: M, rowH: rowH };
  }

  // značka: čtyři dlaždice v barvách aplikace, stejný motiv jako ikona
  function drawMark(g, x, y, size) {
    var gap = size * 0.10, t = (size - gap) / 2, r = t * 0.28;
    var cols = ["#D6402A", "#F5CE3E", "#2158C4", "#127A4E"];
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (pos, i) {
      var tx = x + pos[0] * (t + gap), ty = y + pos[1] * (t + gap);
      g.fillStyle = cols[i];
      g.beginPath();
      if (g.roundRect) { g.roundRect(tx, ty, t, t, r); }
      else { g.rect(tx, ty, t, t); }
      g.fill();
    });
  }

  function drawDocPage(doc, plan, pageIx) {
    var M = plan.M, rowH = plan.rowH, S = PDF_SCALE;
    var total = plan.pages.length;
    var rows = plan.pages[pageIx];

    var cv = document.createElement("canvas");
    cv.width = PDF_W * S;
    cv.height = PDF_H * S;
    var g = cv.getContext("2d");
    g.scale(S, S);
    g.fillStyle = "#FFFFFF";
    g.fillRect(0, 0, PDF_W, PDF_H);
    g.textBaseline = "alphabetic";

    var SANS = '-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    var INK = "#15120E", INK2 = "#5F5749", INK3 = "#9A9184", ACC = "#D6402A", LINE = "#E4DFD6";
    var font = function (size, weight) { g.font = (weight || 400) + " " + size + "px " + SANS; };
    var ink = function (c) { g.fillStyle = c; };
    var right = function (t, x, y) { g.textAlign = "right"; g.fillText(t, x, y); g.textAlign = "left"; };
    var rule = function (y, c, w) {
      g.strokeStyle = c || LINE; g.lineWidth = w || 0.7;
      g.beginPath(); g.moveTo(M, y + 0.5); g.lineTo(PDF_W - M, y + 0.5); g.stroke();
    };
    var label = function (t, x, y, alignRight) {
      font(8, 700); ink(INK3);
      g.save(); g.letterSpacing = "0.08em";
      if (alignRight) { right(t.toUpperCase(), x, y); } else { g.fillText(t.toUpperCase(), x, y); }
      g.restore();
    };
    // rozdělí text na řádky po slovech; když se nevejde ani tak, poslední ořízne
    var wrap = function (t, max, maxLines) {
      var words = String(t).split(" ");
      var out = [], cur = "", i = 0;
      for (; i < words.length; i++) {
        var next = cur ? cur + " " + words[i] : words[i];
        if (g.measureText(next).width <= max || !cur) { cur = next; continue; }
        out.push(cur);
        cur = words[i];
        if (out.length === maxLines - 1) { break; }
      }
      var rest = words.slice(i + 1).join(" ");
      if (cur) { out.push(rest ? cur + " " + rest : cur); }
      out[out.length - 1] = clip(out[out.length - 1], max);
      return out;
    };

    var clip = function (t, max) {
      if (g.measureText(t).width <= max) { return t; }
      var v = t;
      while (v.length > 1 && g.measureText(v + "…").width > max) { v = v.slice(0, -1); }
      return v + "…";
    };

    var loc = langInfo().loc;
    var vatOn = state.vat && doc.vatRows.length > 0;
    var y;

    // Sloupce si šířku spočítají podle skutečného obsahu. Pevné hodnoty by
    // v němčině nebo francouzštině, kde jsou popisky delší, narazily jedna
    // do druhé, a u měn se dvěma desetinnými místy taky.
    var colW = function (head, vals) {
      font(8, 700);
      var w = g.measureText(head.toUpperCase()).width;
      font(10.5, 600);
      vals.forEach(function (v) { w = Math.max(w, g.measureText(v).width); });
      return w;
    };
    var wQty = colW(T("docColQty"), doc.items.map(function (i) { return String(i.qty); }));
    var wUnit = colW(T("docColUnit"), doc.items.map(function (i) { return czk(i.price); }));
    var wSum = colW(T("docColSum"), doc.items.map(function (i) { return czk(i.sum); }));
    var wVat = vatOn ? colW(T("docVatTax"), doc.items.map(function (i) {
      return vatNum(i.vat) === null ? "–" : vatStr(i.vat) + " %";
    })) : 0;

    var GAP = 16;
    var xSum = PDF_W - M;
    var xVat = xSum - wSum - GAP;
    var xUnit = (vatOn ? xVat - wVat - GAP : xSum - wSum - GAP);
    var xQty = xUnit - wUnit - GAP;
    var wName = xQty - wQty - GAP - M;

    // vpravo v hlavičce a v rozpisu DPH taky měříme, ať nic nepřeteče doleva
    var halfW = (PDF_W - 2 * M) / 2 - 8;

    // ---- hlavička se značkou ----
    drawMark(g, M, M, 26);
    font(17, 700); ink(INK);
    g.fillText("Tapkasa", M + 34, M + 20);
    font(12, 700); ink(INK);
    right(T("docTitle"), xSum, M + 12);
    font(9.5, 400); ink(INK2);
    right(T("docNo") + " " + doc.no, xSum, M + 26);
    y = M + 40;
    rule(y, ACC, 1.6);
    y += 26;

    if (pageIx === 0) {
      var yl = y, yr = y;

      label(T("sellerHead"), M, yl); yl += 15;
      if (doc.seller.length) {
        doc.seller.forEach(function (ln, i) {
          font(i === 0 ? 11.5 : 10, i === 0 ? 700 : 400);
          ink(i === 0 ? INK : INK2);
          // delší řádky, typicky zápis v rejstříku, raději zalomíme než ořízneme
          wrap(ln, halfW, 3).forEach(function (part, j) {
            g.fillText(part, M, yl);
            yl += (i === 0 && j === 0) ? 16 : 13;
          });
        });
      } else {
        font(10, 400); ink("#C4BDB2");
        g.fillText(T("sellerEmpty"), M, yl); yl += 13;
      }

      label(T("docPeriodLabel"), xSum, yr, true); yr += 15;
      font(10, 400); ink(INK2);
      right(clip(T("docPeriod") + " " + new Date(doc.from).toLocaleDateString(loc) +
            " – " + new Date(doc.to).toLocaleDateString(loc), halfW), xSum, yr); yr += 14;
      right(clip(T("docIssued") + " " + new Date(doc.issued).toLocaleDateString(loc) +
            " " + clock(doc.issued), halfW), xSum, yr); yr += 14;
      right(clip(T("docEvents") + " " + doc.events.join(", "), halfW), xSum, yr); yr += 14;

      y = Math.max(yl, yr) + 20;
    }

    // ---- tabulka položek ----
    label(T("docItemsHead"), M, y); y += 10;
    rule(y); y += 5;
    label(T("docColItem"), M, y + 9);
    label(T("docColQty"), xQty, y + 9, true);
    label(T("docColUnit"), xUnit, y + 9, true);
    if (vatOn) { label(T("docVatTax"), xVat, y + 9, true); }
    label(T("docColSum"), xSum, y + 9, true);
    y += 14;
    rule(y); y += 15;

    rows.forEach(function (i, ix) {
      if (ix % 2 === 1) {
        g.fillStyle = "#FAF8F4";
        g.fillRect(M - 4, y - 11, PDF_W - 2 * M + 8, rowH);
      }
      font(10.5, 500); ink(INK);
      g.fillText(clip(i.name, wName), M, y);
      font(10.5, 400); ink(INK2);
      right(String(i.qty), xQty, y);
      right(czk(i.price), xUnit, y);
      if (vatOn) { right(vatNum(i.vat) === null ? "–" : vatStr(i.vat) + " %", xVat, y); }
      font(10.5, 600); ink(INK);
      right(czk(i.sum), xSum, y);
      y += rowH;
    });

    if (pageIx === plan.pages.length - 1) {
      y += 2; rule(y); y += 22;

      if (doc.vatRows.length) {
        label(T("docVatHead"), M, y); y += 16;

        // i tady si sloupce změříme, popisky daně jsou v každém jazyce jinak dlouhé
        var baseTxt = doc.vatRows.map(function (v) { return T("docVatBase") + " " + czk(v.base); });
        var taxTxt = doc.vatRows.map(function (v) { return T("docVatTax") + " " + czk(v.tax); });
        baseTxt.push(T("docVatTotalBase") + " " + czk(doc.vatBase));
        taxTxt.push(T("docVatTotalTax") + " " + czk(doc.vatTax));
        font(10.5, 700);
        var wide = function (arr) {
          var w = 0;
          arr.forEach(function (t) { w = Math.max(w, g.measureText(t).width); });
          return w;
        };
        var xTax = xSum;
        var xBase = xTax - wide(taxTxt) - GAP;
        var wRate = xBase - wide(baseTxt) - GAP - M;

        doc.vatRows.forEach(function (v, ix) {
          font(10.5, 400); ink(INK2);
          g.fillText(clip(v.rate === null ? T("docVatNone") : T("docVatRate") + " " + v.rate + " %", wRate), M, y);
          right(baseTxt[ix], xBase, y);
          right(taxTxt[ix], xTax, y);
          y += rowH;
        });
        font(10.5, 700); ink(INK);
        right(baseTxt[baseTxt.length - 1], xBase, y);
        right(taxTxt[taxTxt.length - 1], xTax, y);
        y += rowH + 12;
      }

      // souhrn v jemném panelu, ať je nejdůležitější číslo hned vidět
      var boxTop = y - 6, boxH = 82;
      g.fillStyle = "#FBFAF7";
      g.beginPath();
      if (g.roundRect) { g.roundRect(M - 6, boxTop, PDF_W - 2 * M + 12, boxH, 8); }
      else { g.rect(M - 6, boxTop, PDF_W - 2 * M + 12, boxH); }
      g.fill();

      var yb = boxTop + 20;
      font(10, 400); ink(INK2);
      g.fillText(T("docReceipts") + " " + doc.bills, M + 4, yb);
      right(T("cash") + ": " + czk(doc.cash), xSum - 4, yb); yb += 15;
      right(T("card") + ": " + czk(doc.card), xSum - 4, yb); yb += 12;

      g.strokeStyle = LINE; g.lineWidth = 0.7;
      g.beginPath(); g.moveTo(M + 4, yb + 0.5); g.lineTo(xSum - 4, yb + 0.5); g.stroke();
      yb += 22;
      font(13, 700); ink(INK);
      g.fillText(T("docTotal"), M + 4, yb);
      font(16, 700); ink(ACC);
      right(czk(doc.total), xSum - 4, yb);
      y = boxTop + boxH;
    }

    // ---- patička ----
    rule(PDF_H - M - 14);
    font(8.5, 400); ink(INK3);
    g.fillText(T("docFooter"), M, PDF_H - M);
    if (total > 1) { right(T("docPageOf", pageIx + 1, total), xSum, PDF_H - M); }

    return cv;
  }

  // Minimální PDF: každá stránka je jeden JPEG přes celou plochu A4.
  // Odsazení objektů v tabulce xref musí sedět na bajt, proto se soubor
  // skládá po kouscích a délky se počítají průběžně.
  function buildPdf(jpegs) {
    var chunks = [], len = 0;
    var put = function (bytes) { chunks.push(bytes); len += bytes.length; };
    var ascii = function (str) {
      var a = new Uint8Array(str.length);
      for (var i = 0; i < str.length; i++) { a[i] = str.charCodeAt(i) & 0xFF; }
      return a;
    };

    var n = jpegs.length;
    var offsets = [];
    var objId = 0;
    var startObj = function () { objId += 1; offsets[objId] = len; return objId; };

    put(ascii("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));

    // 1 = katalog, 2 = strom stránek, pak dvojice stránka + obsah + obrázek
    var catalog = startObj();
    var pagesId = catalog + 1;
    put(ascii(catalog + " 0 obj\n<< /Type /Catalog /Pages " + pagesId + " 0 R >>\nendobj\n"));

    var kids = [];
    for (var k = 0; k < n; k++) { kids.push((pagesId + 1 + k * 3) + " 0 R"); }
    startObj();
    put(ascii(pagesId + " 0 obj\n<< /Type /Pages /Kids [" + kids.join(" ") +
              "] /Count " + n + " >>\nendobj\n"));

    for (var i = 0; i < n; i++) {
      var pageId = startObj();
      var contId = pageId + 1;
      var imgId = pageId + 2;
      put(ascii(pageId + " 0 obj\n<< /Type /Page /Parent " + pagesId + " 0 R" +
                " /MediaBox [0 0 " + PDF_W + " " + PDF_H + "]" +
                " /Resources << /XObject << /Im0 " + imgId + " 0 R >> >>" +
                " /Contents " + contId + " 0 R >>\nendobj\n"));

      var stream = "q " + PDF_W + " 0 0 " + PDF_H + " 0 0 cm /Im0 Do Q\n";
      startObj();
      put(ascii(contId + " 0 obj\n<< /Length " + stream.length + " >>\nstream\n" +
                stream + "endstream\nendobj\n"));

      var jpg = jpegs[i];
      startObj();
      put(ascii(imgId + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + jpg.w +
                " /Height " + jpg.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8" +
                " /Filter /DCTDecode /Length " + jpg.bytes.length + " >>\nstream\n"));
      put(jpg.bytes);
      put(ascii("\nendstream\nendobj\n"));
    }

    var xref = len;
    var pad = function (num) { var t = String(num); while (t.length < 10) { t = "0" + t; } return t; };
    var x = "xref\n0 " + (objId + 1) + "\n0000000000 65535 f \n";
    for (var o = 1; o <= objId; o++) { x += pad(offsets[o]) + " 00000 n \n"; }
    x += "trailer\n<< /Size " + (objId + 1) + " /Root " + catalog + " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
    put(ascii(x));

    var out = new Uint8Array(len), at = 0;
    chunks.forEach(function (c) { out.set(c, at); at += c.length; });
    return new Blob([out], { type: "application/pdf" });
  }

  function docPdf(doc) {
    var plan = pdfPages(doc);
    var jpegs = [];
    for (var i = 0; i < plan.pages.length; i++) {
      var cv = drawDocPage(doc, plan, i);
      var url = cv.toDataURL("image/jpeg", 0.94);
      var bin = atob(url.slice(url.indexOf(",") + 1));
      var bytes = new Uint8Array(bin.length);
      for (var b = 0; b < bin.length; b++) { bytes[b] = bin.charCodeAt(b); }
      jpegs.push({ w: cv.width, h: cv.height, bytes: bytes });
    }
    return buildPdf(jpegs);
  }

  function docFileName(doc) {
    return (T("docFile") + "-" + doc.no + ".pdf").replace(/[^A-Za-z0-9._-]/g, "-");
  }

  // Sdílení souboru umí Web Share; kde není, soubor aspoň stáhneme.
  function shareDoc(asMail) {
    var doc = sheet && sheet.doc;
    if (!doc) { return; }
    var blob, name;
    try {
      blob = docPdf(doc);
      name = docFileName(doc);
    } catch (e) {
      showToast(T("pdfFail"));
      return;
    }

    var file = null;
    try { file = new File([blob], name, { type: "application/pdf" }); } catch (e) { file = null; }

    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({
        files: [file],
        title: T("docTitle"),
        text: asMail ? T("docMailBody") : undefined
      }).catch(function () { /* uživatel sdílení zavřel, nic neřešíme */ });
      return;
    }

    // náhradní cesta: soubor uložit a u e-mailu rovnou otevřít rozepsanou zprávu
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
    showToast(asMail ? T("pdfSavedMail") : T("pdfSaved"));
    if (asMail) {
      try {
        location.href = "mailto:?subject=" + encodeURIComponent(T("docTitle") + " " + doc.no) +
                        "&body=" + encodeURIComponent(T("docMailBody"));
      } catch (e) {}
    }
  }

  function linkFresh() {
    return lastIn > 0 && (Date.now() - lastIn) < LINK_FRESH_MS;
  }

  function linkText() {
    if (peers > 0) { return T("linkPairedNative"); }   // nativní spojení je živé teď
    if (!state.pair) { return T("linkSearching"); }
    if (linkFresh()) { return T("linkPaired"); }
    if (anySse()) { return T("linkSilent"); }
    return T("linkDown");
  }

  function renderMenu() {
    var till = state.mode === "kasa";

    var h = proSection() +
            '<div class="sec"><h2>' + esc(T("roleHead")) + "</h2></div>" +
            '<div class="seg" role="group" aria-label="' + esc(T("roleHead")) + '">' +
              '<button class="' + (till ? "on" : "") + '" data-mode="kasa">' + esc(T("roleKasa")) + "</button>" +
              '<button class="' + (till ? "" : "on") + '" data-mode="vydej">' + esc(T("roleVydej")) + "</button>" +
            "</div>" +
            '<p class="hint" style="padding-bottom:6px">' +
              esc(till ? T("roleKasaHint") : T("roleVydejHint")) +
            "</p>" +
            pairBlock(till) +
            '<div class="acts" style="padding-top:6px"><button class="act' + (state.voice ? " on" : "") +
              '" data-voice="1">' +
                (state.voice ? SVG.check : "") +
                esc(state.voice ? (till ? T("voiceOnKasa") : T("voiceOnVydej"))
                                : (till ? T("voiceOffKasa") : T("voiceOffVydej"))) + "</button>" +
              '<button class="act" data-voicetest="1">' + esc(T("voiceTry")) + "</button></div>";

    if (!till) {
      return h + '<p class="hint">' + esc(T("vydejPairHint")) + "</p>" + settingsBlock() + renderBackupBlock();
    }

    h += '<div class="sec"><h2>' + esc(T("eventHead")) + "</h2></div>" +
         '<div class="field"><input class="inp" id="evName" value="' + esc(state.event) + '" placeholder="' + esc(T("eventPlaceholder")) + '"></div>' +
         '<div class="sec"><h2>' + esc(T("itemsHead")) + "</h2></div>";

    state.items.forEach(function (it, i) {
      var c = colorOf(it.color);
      h += '<div class="edit">' +
             '<button class="sw' + (c ? "" : " none") + '"' + (c ? ' style="background:' + c.bg + '"' : "") +

             // sazba se ukazuje jen plátcům DPH, ostatním by řádek jen zabírala
             (state.vat
               ? '<input class="e-vat" data-vat="' + it.id + '" inputmode="decimal" placeholder="%" value="' +
                 esc(vatStr(it.vat)) + '" aria-label="' + esc(T("vatAria")) + '">'
               : "") +
             '<button class="mv" data-mv="' + i + '" aria-label="' + esc(T("upAria")) + '"' + (i === 0 ? " disabled style=\"opacity:.25\"" : "") + ">" + SVG.up + "</button>" +
             '<button class="rm" data-rm="' + it.id + '" aria-label="' + esc(T("rmAria")) + '">' + SVG.close + "</button></div>";
    });

    return h + '<div class="acts"><button class="act" data-new="1">' + esc(T("addItem")) + "</button>" +

  // ---------- párování (s tarifní bránou) ----------
  // Kód smí vytvořit jen Pro; připojit se ke kódu může kdokoliv, takže
  // stánku stačí jediné předplatné na kase.
  function pairBlock(till) {
    var h = '<div class="link linkstat' + (peers > 0 || linkFresh() ? " on" : "") + '"><i></i>' + esc(linkText()) + "</div>";
    // Rada s návodem se ukazuje vždy. Dřívější podmínka na nativní most se
    // na zařízení nevyhodnotila spolehlivě a tlačítko pak chybělo úplně.
    h += '<p class="hint" style="text-align:left;padding-top:0;padding-bottom:4px">' + esc(T("pairOfflineHint")) + "</p>" +
         '<div class="acts" style="padding-top:0;padding-bottom:6px"><button class="act" data-offlinehelp="1">' +
         esc(T("offHelpBtn")) + "</button></div>";
    if (state.pair) {
      h += '<div class="link on" style="padding-top:0"><i></i>' + esc(T("pairCode")) + " <strong>" + esc(state.pair) + "</strong></div>" +
        (relayError ? '<p class="hint" style="color:var(--accent);text-align:left;padding-top:0;padding-bottom:2px">' + esc(relayError) + "</p>" : "") +
        (!lastIn && anySse()

          : "") +
        '<p class="hint" style="text-align:left;padding-top:0;padding-bottom:2px">' +
          esc(lastIn ? T("lastIn", clock(lastIn)) : T("nothingYet")) +
          esc(lastOut ? T("lastOut", clock(lastOut)) : "") + "</p>" +
        (testResult ? '<p class="hint" style="text-align:left;padding-top:0;padding-bottom:2px;font-weight:600">' + esc(testResult) + "</p>" : "") +
        '<div class="acts" style="padding-top:0"><button class="act" data-relaytest="1">' + esc(T("testLink")) + "</button>" +
        '<button class="act" data-resync="1">' + esc(T("resendAll")) + "</button>" +
        '<button class="act" data-pairoff="1">' + esc(T("unpair")) + "</button></div>";
      return h;
    }
    h += '<p class="hint" style="text-align:left;padding-top:0;padding-bottom:4px">' + T("pairOneCode") + "</p>" +
      '<div class="field" style="padding-top:0"><input class="inp" id="pairCode" placeholder="' + esc(T("pairPlaceholder")) + '" autocapitalize="characters"></div>' +
      '<div class="acts" style="padding-top:0"><button class="act" data-pairjoin="1">' + esc(T("join")) + "</button>" +
      (isPro()
        ? '<button class="act" data-paircreate="1">' + esc(T("createCode")) + "</button>"
        : '<button class="act" data-paywall="pair">' + esc(T("createCode")) + " · Pro</button>") +
      "</div>";
    if (!isPro()) {
      h += '<p class="hint" style="text-align:left;padding-top:0;padding-bottom:4px">' + esc(T("proJoinFree")) + "</p>";
    }

  // Údaje prodejce. Pole jsou schválně obecná, ať sednou na kteroukoli zemi:

  var SELLER_FIELDS = ["name", "regNo", "vatId", "street", "city", "zip", "country", "email", "phone", "note"];

  // Země našeptáváme v jazyce aplikace: názvy si necháme přeložit systémem,
  // takže Čech píše Česko, Angličan Czechia a Němec Tschechien, a nikdo si
  // je nemusí vymýšlet. Kdyby prohlížeč Intl.DisplayNames neuměl, zůstane
  // z pole obyčejný textový vstup.
  var COUNTRY_CODES = ("AD AE AF AG AL AM AO AR AT AU AZ BA BB BD BE BF BG BH BI BJ BN BO BR BS " +
    "BT BW BY BZ CA CD CF CG CH CI CL CM CN CO CR CU CV CY CZ DE DJ DK DM DO DZ EC EE EG ER ES " +
    "ET FI FJ FM FR GA GB GD GE GH GM GN GQ GR GT GW GY HK HN HR HT HU ID IE IL IN IQ IR IS IT " +
    "JM JO JP KE KG KH KI KM KN KP KR KW KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH " +
    "MK ML MM MN MO MR MT MU MV MW MX MY MZ NA NE NG NI NL NO NP NR NZ OM PA PE PG PH PK PL PR " +
    "PS PT PW PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SY SZ TD TG TH " +
    "TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VN VU WS XK YE ZA ZM ZW").split(" ");

  var countryCache = null, countryCacheLang = null;

  function countryList() {
    var lang = state && state.lang ? state.lang : "cs";
    if (countryCache && countryCacheLang === lang) { return countryCache; }
    var out = [];
    try {
      var dn = new Intl.DisplayNames([langInfo().loc], { type: "region" });
      COUNTRY_CODES.forEach(function (c) {
        var n = dn.of(c);
        if (n && n !== c) { out.push(n); }
      });
      out.sort(function (a, b) { return a.localeCompare(b, langInfo().loc); });
    } catch (e) { out = []; }
    countryCache = out;
    countryCacheLang = lang;
    return out;
  }

  // hledáme bez ohledu na diakritiku a velikost písmen, ať „cesko" najde Česko
  function plain(t) {
    var v = String(t).toLowerCase();
    try { v = v.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e) {}
    return v;
  }

  function countryMatches(q) {
    var v = plain(q).trim();
    if (!v) { return []; }
    var list = countryList();
    var starts = [], has = [];
    for (var i = 0; i < list.length; i++) {
      var pn = plain(list[i]);
      if (pn === v) { return []; }          // přesná shoda, není co nabízet
      if (pn.indexOf(v) === 0) { starts.push(list[i]); }
      else if (pn.indexOf(v) > 0) { has.push(list[i]); }
      if (starts.length >= 6) { break; }
    }
    return starts.concat(has).slice(0, 6);
  }

  function countrySuggestHtml(q) {
    var m = countryMatches(q);
    if (!m.length) { return ""; }
    return m.map(function (n) {
