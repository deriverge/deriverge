  // Zkouška spojení: pošle vlastní značku a čeká, jestli se vrátí. Rozliší
  // tím tři různé poruchy, neodešlo, odešlo ale nechodí zpátky, nebo je vše
  // v pořádku, a nepotřebuje k tomu druhé zařízení.
  function relayTest() {
    if (!relayTopic()) { testResult = T("testNoCode"); render(); return; }
    pingAt = Date.now();
    testResult = T("testTrying");
    render();
    relayPost({ t: "ping", at: pingAt }, function (ok, worst) {
      if (!ok) {
        pingAt = 0;
        testResult = worst === 429 ? T("testLimit")
          : worst ? T("testRefused", worst)
          : T("testOffline");
        render();
        return;
      }
      if (!pingAt) { return; }   // odpověď stihla dorazit dřív než potvrzení odeslání
      testResult = T("testSent");
      render();
      setTimeout(function () {
        if (!pingAt) { return; }
        pingAt = 0;
        testResult = T("testNoEcho");
        render();
      }, 8000);
    });
  }

  function relayClose() {
    links.forEach(function (l) {
      if (l.es) { try { l.es.close(); } catch (e) {} }
      if (l.timer) { clearInterval(l.timer); }
    });
    links = [];
    seen = {}; sentOpen = false; relayError = ""; testResult = ""; pingAt = 0;
  }

  function relayTake(link, env) {
    if (!env || env.event !== "message" || !env.message) { return; }
    var key = link.base + "|" + env.id;
    if (seen[key]) { return; }
    seen[key] = true;
    if (env.time > link.lastTs) { link.lastTs = env.time; }

    var msg = null;
    try { msg = JSON.parse(env.message); } catch (e) { return; }
    if (!msg) { return; }

    if (msg.t === "ping") {
      if (msg.src === myId && pingAt) {
        testResult = T("testOk", (function (x) { try { return new Intl.NumberFormat(langInfo().loc, { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(x); } catch (e) { return x.toFixed(1); } })((Date.now() - pingAt) / 1000));
        pingAt = 0;
        render();
      }
      return;
    }
    // Vlastní zprávy zpátky nebereme: z tohoto spuštění podle run, ze
    // starších spuštění (přeposílač je po restartu přehraje) podle času.
    // Zařízení obnovené z téže zálohy má stejné id, ale jiné spuštění
    // a novější zprávy, takže se navzájem neignorují.
    if (msg.src === myId && (msg.run ? myRuns.indexOf(msg.run) >= 0 : (env.time || 0) * 1000 < bootAt)) { return; }

    if (msg.t === "hi") {
      lastIn = Date.now();
      refreshLink();
      if (state.mode === "kasa" && msg.role === "vydej" && Date.now() - lastQueueSent > 20000) {
        lastQueueSent = Date.now();
        relayAllOpen();
      }
      if (Date.now() - helloBack > 5000) {   // ozveme se zpátky, ale ne donekonečna
        helloBack = Date.now();
        sayHello(true);
      }
      render();
      return;
    }

    lastIn = Date.now();
    refreshLink();
    window.__kasaPeer(msg);
  }

  // Stálé spojení je hlavní cesta; dotazování je záloha, když ho síť nepustí.
  // Když spojení drží, ptáme se zřídka, ať zbytečně nepálíme denní limit.
  function relayPoll(link) {
    var topic = relayTopic();
    if (!topic || !window.fetch) { return; }
    fetch(link.base + topic + "/json?poll=1&since=" + (link.lastTs ? link.lastTs : "5m"))
      .then(function (r) {
        if (!r.ok) { throw new Error(String(r.status)); }
        return r.text();
      })
      .then(function (body) {
        body.split("\n").forEach(function (line) {
          if (!line.trim()) { return; }
          try { relayTake(link, JSON.parse(line)); } catch (e) {}
        });
        refreshLink();
      })
      .catch(function () { refreshLink(); });
  }

  function schedulePoll(link) {
    if (link.timer) { clearInterval(link.timer); }
    link.timer = setInterval(function () { relayPoll(link); }, link.sseUp ? 20000 : 4000);
  }

  // pro diagnostiku: stav jednotlivých přeposílačů
  window.__kasaLinks = function () {
    return links.map(function (l) {
      return { base: l.base, sseUp: l.sseUp, lastTs: l.lastTs };
    });
  };

  function relayOpen() {
    relayClose();
    var topic = relayTopic();
    if (!topic) { return; }

    links = RELAYS.map(function (base) { return { base: base, es: null, sseUp: false, lastTs: 0, timer: null }; });

    links.forEach(function (link) {
      if (window.EventSource) {
        try {
          link.es = new EventSource(link.base + topic + "/sse?since=5m");
          link.es.onopen = function () {
            link.sseUp = true;
            schedulePoll(link);
            refreshLink();
            setRelayError("");
            flushOutbox();
            if (!sentOpen || Date.now() - sentOpen > 60000) {
              sentOpen = Date.now(); sayHello(true);
              relayAllOpen();
            }
          };
          link.es.onerror = function () {
            link.sseUp = false;
            schedulePoll(link);
            refreshLink();
          };
          link.es.onmessage = function (ev) {
            try { relayTake(link, JSON.parse(ev.data)); } catch (e) {}
          };
        } catch (e) {}
      }
      relayPoll(link);
      schedulePoll(link);
    });
  }

  // Diagnostika nativního párování (mobile/bridge.js): text se ukazuje
  // v Propojených zařízeních, ať jde z telefonu poznat, kde se hledání zastavilo.
  var peerDiag = null;
  window.__kasaPeerState = function (d) { peerDiag = d; render(); };

  window.__kasaPeerCount = function (n) {
    nativePeers = n | 0;
    nativeKnown = true;
    refreshLink();
    if (nativePeers > 0) {
      setRelayError("");   // bez internetu nese zprávy nativní spojení, hláška přeposílače by mátla
      flushNativeOutbox(); // co se nestihlo poslat během výpadku, v původním pořadí
      pushEverything();    // nový protějšek dostane frontu
    }
  };

  // Změna účtenky dostane čas vždy vyšší než ten poslední. Zařízení bez
  // internetu mívají hodiny posunuté a „Vydáno“ z pozadu jdoucího výdeje by
  // jinak kasa zahodila jako starší.
  function touchSale(s) {
    s.updatedAt = Math.max(Date.now(), (s.updatedAt || 0) + 1);
  }

  // Příchozí účtenka z druhého zařízení nebo z veřejného přeposílače:
  // jen čisté, úplné údaje. Rozbitá zpráva dřív shodila aplikaci při
  // každém dalším spuštění.
  function cleanSale(inc) {
    if (!isObj(inc) || typeof inc.id !== "string" || !inc.id || inc.id.length > 64) { return null; }
    if (!Array.isArray(inc.lines) || !inc.lines.length) { return null; }
    var no = Number(inc.no);
    if (!isFinite(no) || no < 1) { return null; }
    var lines = [];
    for (var i = 0; i < inc.lines.length; i++) {
      var l = inc.lines[i];
      if (!isObj(l) || typeof l.name !== "string") { return null; }
      var price = Number(l.price), qty = Number(l.qty), rd = Number(l.ready);
      if (!isFinite(price) || !isFinite(qty) || qty <= 0) { return null; }
      lines.push({
        name: l.name.slice(0, 120), price: price, qty: qty,
        ready: isFinite(rd) ? Math.max(0, Math.min(qty, rd)) : 0,
        color: typeof l.color === "string" ? l.color.slice(0, 40) : "",
        vat: typeof l.vat === "string" || typeof l.vat === "number" ? vatStr(l.vat) : ""
      });
    }
    var total = Number(inc.total);
    var o = {
      id: inc.id, no: Math.floor(no),
      ts: isFinite(Number(inc.ts)) ? Number(inc.ts) : Date.now(),
      total: isFinite(total) ? total : lines.reduce(function (a, x) { return a + x.price * x.qty; }, 0),
      method: inc.method === "card" ? "card" : "cash",
      status: inc.status === "open" ? "open" : "served",
      updatedAt: isFinite(Number(inc.updatedAt)) ? Number(inc.updatedAt) : 0,
      lines: lines
    };
    if (typeof inc.ev === "string" && inc.ev) { o.ev = inc.ev.slice(0, 40); }
    if (isFinite(Number(inc.servedAt)) && inc.servedAt) { o.servedAt = Number(inc.servedAt); }
    return o;
  }

  // ---------- akce ----------
  // Aktivní akce žije v kořeni stavu (event, evId, items, sales, nextNo),
  // ostatní otevřené akce v state.parked. Přepnutí je jen výměna obsahu,
  // nic se neuzavírá ani nemaže. Rozpracovaný účet musí být prázdný: jeho
  // řádky odkazují na položky menu aktivní akce.

  function activeEvent() {
    return { id: state.evId, event: state.event, items: state.items, sales: state.sales,
             nextNo: state.nextNo, active: true };
  }

  // Aktivní akce vždy první, pak ostatní v pořadí založení.
  function eachOpenEvent(fn) {
    fn(activeEvent());
    state.parked.slice().forEach(function (pk) { fn(pk); });
  }

  function openEventList() {
    var out = [];
    eachOpenEvent(function (ev) { out.push(ev); });
    return out;
  }

  function parkedById(id) {
    for (var i = 0; i < state.parked.length; i++) {
      if (state.parked[i].id === id) { return state.parked[i]; }
    }
    return null;
  }

  function setEventSales(id, list, maxNo) {
    var target = id === state.evId ? null : parkedById(id);
    if (id === state.evId) {
      state.sales = list;
      if (typeof maxNo === "number" && state.nextNo <= maxNo) { state.nextNo = maxNo + 1; }
    } else if (target) {
      target.sales = list;
      if (typeof maxNo === "number" && target.nextNo <= maxNo) { target.nextNo = maxNo + 1; }
    }
  }

  function locateSale(id) {
    for (var i = 0; i < state.sales.length; i++) {
      if (state.sales[i].id === id) { return { sale: state.sales[i], evId: state.evId }; }
    }
    for (var p = 0; p < state.parked.length; p++) {
      var pk = state.parked[p];
      for (var j = 0; j < pk.sales.length; j++) {
        if (pk.sales[j].id === id) { return { sale: pk.sales[j], evId: pk.id }; }
      }
    }
    return null;
  }

  function archivedSale(id) {
    return state.archives.some(function (a) {
      return Array.isArray(a.sales) && a.sales.some(function (x) { return x && x.id === id; });
    });
  }

  // Změna z druhého zařízení (odškrtnutí, vydání, vrácení do fronty).
  // Sazby DPH a akci si účtenka nechává svoje: starší verze je neposílají.
  function mergeSale(have, inc) {
    have.status = inc.status === "open" ? "open" : "served";
    have.updatedAt = inc.updatedAt || have.updatedAt;
    if (inc.servedAt) { have.servedAt = inc.servedAt; }
    else if (have.status === "open") { delete have.servedAt; }
    var incLines = Array.isArray(inc.lines) ? inc.lines : [];
    if (incLines.length === have.lines.length) {
      have.lines.forEach(function (l, i) {
        var il = incLines[i] || {};
        if (typeof il.ready === "number") { l.ready = il.ready; }
        if (il.vat && !l.vat) { l.vat = il.vat; }
      });
      return;
    }
    var old = have.lines;
    have.lines = incLines.map(function (il) {
      var o = { name: il.name, price: il.price, qty: il.qty, ready: il.ready || 0,
                color: il.color || "", vat: il.vat || "" };
      if (!o.vat) {
        old.forEach(function (ol) {
          if (!o.vat && ol.name === o.name && ol.price === o.price && ol.vat) { o.vat = ol.vat; }
        });
      }
      return o;
    });
    if (typeof inc.total === "number") { have.total = inc.total; }
  }

  function evTotal(ev) {
    return ev.sales.reduce(function (a, x) { return a + (x.total || 0); }, 0);
  }

  function evLabel(ev) { return ev.event || T("noName"); }

  // Uloží aktivní akci mezi odložené a na její místo dá jinou.
  function swapInEvent(next) {
    flushOrders();
    state.parked.push({
      id: state.evId, event: state.event, items: state.items, sales: state.sales,
      nextNo: state.nextNo, createdAt: state.evCreated || 0
    });
    state.evId = next.id;
    state.event = next.event || "";
    state.items = Array.isArray(next.items) ? next.items : [];
    state.sales = Array.isArray(next.sales) ? next.sales : [];
    state.nextNo = typeof next.nextNo === "number" && next.nextNo > 0 ? next.nextNo : 1;
    state.evCreated = next.createdAt || Date.now();
    state.order = [];
    linesOpen = false;
    toast = null;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  }

  function switchEvent(id) {
    if (id === state.evId) { sheet = null; render(); return; }
    var target = parkedById(id);
    if (!target) { return; }
    if (state.order.length) { showToast(T("basketBusy")); return; }
    state.parked = state.parked.filter(function (pk) { return pk.id !== id; });
    swapInEvent(target);
    sheet = null;
    view = "sell";
    save(); render(true);
    showToast(T("toastEvSwitched", evLabel(activeEvent())));
  }

  // Nová akce: menu se volitelně zkopíruje (s novými id), účtenky a čísla
  // začínají od nuly.
  function createEvent(name, copyMenu) {
    if (state.order.length) { showToast(T("basketBusy")); return; }
    var items = copyMenu ? state.items.map(function (it) {
      var o = { id: uid(), name: it.name, price: it.price, color: it.color || "" };
      if (it.vat !== undefined) { o.vat = it.vat; }
      return o;
    }) : [];
    swapInEvent({ id: uid(), event: name, items: items, sales: [], nextNo: 1, createdAt: Date.now() });
    sheet = null;
    view = items.length ? "sell" : "menu";
    save(); render(true);
    showToast(T("toastEvSwitched", evLabel(activeEvent())));
  }

  // ---------- stats ----------

  function stats() {
    var s = { total: 0, cash: 0, card: 0, count: state.sales.length, pieces: 0, items: [] };
    var map = {};
    state.sales.forEach(function (t) {
      s.total += t.total;
      if (t.method === "cash") { s.cash += t.total; } else { s.card += t.total; }
      t.lines.forEach(function (l) {
        // sazba je součástí klíče, ať se do archivu nesloučí stejná položka
        // prodávaná pod dvěma sazbami
        var lv = resolveVat(l.name, l.vat);
        var k = l.name + "|" + l.price + "|" + lv;
        if (!map[k]) { map[k] = { name: l.name, price: l.price, vat: lv, qty: 0, sum: 0 }; }
        map[k].qty += l.qty;
        map[k].sum += l.qty * l.price;
        s.pieces += l.qty;
      });
    });
    Object.keys(map).forEach(function (k) { s.items.push(map[k]); });
    s.items.sort(function (a, b) { return b.sum - a.sum || b.qty - a.qty; });
    return s;
  }

  function summaryText() {
    var s = stats();
    var out = [];
    out.push(state.event || T("noName"));
    out.push(new Date().toLocaleDateString(langInfo().loc) + " " + clock(Date.now()));
    out.push("");
    out.push(T("sumTotal") + " " + czk(s.total));
    out.push("  " + T("cashLower") + ": " + czk(s.cash));
    out.push("  " + T("cardLower") + ": " + czk(s.card));
    out.push(T("sumBills") + " " + s.count + " · " + T("sumPieces") + " " + s.pieces);
    out.push("");
    s.items.forEach(function (i) {
      out.push(i.qty + "× " + i.name + " (" + czk(i.price) + ") = " + czk(i.sum));
    });
    return out.join("\n");
  }

  // ---------- views ----------

  function renderSell() {
    var h = '<div class="grid">';
    state.items.forEach(function (it) {
      var qty = 0;
      state.order.forEach(function (l) { if (l.ref === it.id) { qty += l.qty; } });
      h += '<button class="prod' + (qty ? " is-on" : "") + (it.color ? " tinted" : "") + '"' +
             tint(it.color) + ' data-add="' + it.id + '">' +
             (qty ? '<span class="badge">' + qty + "</span><span class=\"hold\"></span>" : "") +
             '<span class="nm">' + esc(it.name) + "</span>" +
             '<span class="pr num">' + czk(it.price) + "</span>" +
           "</button>";
    });
    h += '<button class="prod custom" data-custom="1"><span class="nm">' + esc(T("customTile")) + "</span></button></div>";
    if (!state.items.length) {
      h += '<p class="hint">' + T("emptyMenu") + "</p>";
    }
    return h;
  }

  function renderBar() {
    var n = orderCount();
    var h = '<div class="bar">';

    if (linesOpen && state.order.length) {
      h += '<div class="bar-lines">';
      state.order.forEach(function (l, i) {
        h += '<div class="line"><span class="nm">' + esc(l.name) + "</span>" +
               '<span class="step">' +
                 '<button data-step="' + i + '" data-d="-1" aria-label="' + esc(T("minus")) + '">' + SVG.minus + "</button>" +
                 '<span class="q">' + l.qty + "</span>" +
                 '<button data-step="' + i + '" data-d="1" aria-label="' + esc(T("plusOne")) + '">' + SVG.plus + "</button>" +
               "</span>" +
               '<span class="amt">' + czk(l.price * l.qty) + "</span></div>";
      });
      h += "</div>";
    }

    h += '<div class="bar-main">';
    if (state.order.length) {
      h += '<button class="bar-sum" data-toggle="1" aria-expanded="' + (linesOpen ? "true" : "false") + '">' +
             '<span class="c">' + n + " " + tp("itemsN", n) +
             (linesOpen ? T("hideLines") : T("editLines")) + "</span>" +
             '<span class="t num">' + czk(orderTotal()) + "</span></button>" +
           '<button class="btn-clear" data-clearask="1">' + esc(T("cancelOrder")) + "</button>" +
           '<button class="btn-pay" data-pay="1">' + esc(T("pay")) + "</button>";
    } else {
      h += '<div class="bar-sum"><span class="c">' + esc(T("newOrder")) + freeCounter() + "</span>" +
           '<span class="t num" style="color:var(--ink-3)">' + czk(0) + "</span></div>" +
           '<button class="btn-pay" disabled>' + esc(T("pay")) + "</button>";
    }
    return h + "</div></div>";
  }

  function renderOrders() {
    var open = openOrders();
    var h = "";
    // Výdej drží frontu ze všech akcí kasy; když se v ní potkají dvě,
    // čísla se mohou opakovat, proto u lístku ukážeme i název akce.
    var evs = {};
    open.forEach(function (s) { evs[s.ev || ""] = true; });
    var mixed = Object.keys(evs).length > 1;

    if (!open.length) {
      h += '<p class="hint" style="padding-top:44px">' + esc(T("noOrders")) + "<br>" +
           esc(state.mode === "vydej" ? T("noOrdersVydej") : T("noOrdersKasa")) + "</p>";
    } else {
      h += '<div class="tickets">';
      open.forEach(function (s) {
        h += '<button class="tk' + (allReady(s) ? " ready" : "") + '" data-ticket="' + s.id + '">' +
               '<span class="no">' + s.no + "</span>" +
               '<span class="mid"><span class="chips">';
        s.lines.forEach(function (l) {
          h += '<span class="chip' + ((l.ready || 0) >= l.qty ? " done" : "") + '"' + tint(l.color) + ">" +
               (l.qty > 1 ? '<span class="q">' + l.qty + "×</span>" : "") + esc(l.name) + "</span>";
        });
        h += '</span><span class="time">' + clock(s.ts) +
               (mixed && (s.en || evNameOf(s.ev)) ? '<span class="evn">' + esc(s.en || evNameOf(s.ev)) + "</span>" : "") + "</span></span>" +
             '<span class="prog">' + ready(s) + "/" + pieces(s) + "</span></button>";
      });
      h += "</div>";
    }

    var done = servedOrders().slice(0, 8);
    if (done.length) {
      h += '<section class="sec"><h2>' + esc(T("servedHead")) + "</h2>";
      done.forEach(function (s) {
        var what = s.lines.map(function (l) { return l.qty + "× " + l.name; }).join(", ");
        h += '<div class="served">' +
             '<button class="row" data-reopen="' + s.id + '" aria-label="' + esc(T("reopenAria", s.no)) + '">' +
               '<span class="no">#' + s.no + "</span>" +
               '<span class="w">' + esc(what) + "</span>" +
               '<span class="back">' + esc(T("reopen")) + "</span></button>" +
             '<button class="drop" data-drop="' + s.id + '" aria-label="' + esc(T("dropAria")) + '">' + SVG.close + "</button></div>";
      });
      h += "</section>";
    }
    return h;
  }

  function renderHistory() {
    var s = stats();
    var h = '<section class="hero"><span class="eyebrow">' + esc(T("revenueTotal")) + "</span>" +
            '<div class="sum num">' + czk(s.total) + "</div>" +
            '<p class="meta">' + s.count + " " + tp("billsN", s.count) + " · " +
            s.pieces + " " + tp("piecesN", s.pieces) + "</p>";

    if (s.total > 0) {
      var pc = Math.round((s.cash / s.total) * 100);
      h += '<div class="split" role="img" aria-label="' + esc(T("splitAria", czk(s.cash), czk(s.card))) + '">';
      if (s.cash > 0) { h += '<i class="sp-cash" style="width:' + pc + '%"></i>'; }
      if (s.card > 0) { h += '<i class="sp-card" style="flex:1"></i>'; }
      h += "</div>";
    }
    h += '<div class="legend">' +
           '<span class="lg"><i class="sp-cash"></i><span class="k">' + esc(T("cash")) + '</span><span class="v">' + czk(s.cash) + "</span></span>" +
           '<span class="lg"><i class="sp-card"></i><span class="k">' + esc(T("card")) + '</span><span class="v">' + czk(s.card) + "</span></span>" +
         "</div></section>";

    if (s.items.length) {
      var max = s.items[0].sum || 1;
      h += '<section class="sec"><h2>' + esc(T("soldHead")) + '</h2><div class="items">';
      s.items.forEach(function (i) {
        h += '<div class="it"><div class="r"><span class="nm">' + esc(i.name) + "</span>" +
             '<span class="q">' + i.qty + "×</span>" +
             '<span class="a">' + czk(i.sum) + "</span></div>" +
             '<div class="track"><div class="fill" style="width:' + Math.max(2, (i.sum / max) * 100) + '%"></div></div></div>';
      });
      h += "</div></section>";
    } else {
      h += '<p class="hint" style="padding-top:28px">' + T("emptyStats") + "</p>";
    }

    if (state.sales.length) {
      h += '<section class="sec"><h2>' + esc(T("receiptsHead")) + "</h2>";
      state.sales.slice().reverse().forEach(function (t) {
        var what = t.lines.map(function (l) { return l.qty + "× " + l.name; }).join(", ");
        h += '<div class="tx"><i class="dot ' + (t.method === "cash" ? "sp-cash" : "sp-card") + '"></i>' +
             '<div class="mid"><div class="w">' + esc(what) + "</div>" +
             '<div class="s">' + clock(t.ts) + " · " + esc(t.method === "cash" ? T("cashLower") : T("cardLower")) + "</div></div>" +
             '<span class="a">' + czk(t.total) + "</span>" +
             '<button class="del" data-del="' + t.id + '" aria-label="' + esc(T("delReceiptAria")) + '">' + SVG.close + "</button></div>";
      });
      h += "</section>";
    }

    if (state.parked.length) {
      h += '<section class="sec"><h2>' + esc(T("openHead")) + "</h2>";
      state.parked.forEach(function (pk) {
        var pn = pk.sales.length;
        h += '<div class="arch"><div class="mid"><div>' + esc(evLabel(pk)) + "</div>" +
             '<div class="s">' + pn + " " + tp("billsN", pn) + "</div></div>" +
             '<span class="num">' + czk(evTotal(pk)) + "</span>" +
             '<button class="act" style="flex:0 0 auto;padding:8px 12px;margin:0" data-evswitch="' + esc(pk.id) + '">' +
               esc(T("evSwitch")) + "</button></div>";
      });
      h += "</section>";
    }

    if (state.archives.length) {
      h += '<section class="sec"><h2>' + esc(T("closedHead")) + "</h2>";
      state.archives.slice().reverse().forEach(function (a) {
        h += '<div class="arch"><div class="mid"><div>' + esc(a.event) + "</div>" +
             '<div class="s">' + new Date(a.closedAt).toLocaleDateString(langInfo().loc) + " · " +
             a.count + " " + tp("billsN", a.count) + " · " + esc(T("cashLower")) + " " + czk(a.cash) +
             ", " + esc(T("cardLower")) + " " + czk(a.card) + "</div></div>" +
             '<span class="num">' + czk(a.total) + "</span>" +
             // vrátit lze jen akci, u které jsou uložené účtenky; starší
             // archivy je nemají a doúčtovat by se nedaly
             (a.sales && a.sales.length
               ? '<button class="ab" data-archopen="' + esc(a.id || "") + '" aria-label="' +
                 esc(T("archReopenAria", a.event)) + '" title="' + esc(T("archReopen")) + '">' + SVG.reopen + "</button>"
               : "") +
             '<button class="ab del" data-archdel="' + esc(a.id || "") + '" aria-label="' +
             esc(T("archDelAria", a.event)) + '" title="' + esc(T("archDelete")) + '">' + SVG.close + "</button></div>";
      });
      h += "</section>";
    }

    return h + '<div class="acts"><button class="act" data-copy="1">' + esc(T("showSummary")) + "</button>" +
           '<button class="act" data-docask="1">' + esc(T("docBtn")) + "</button>" +
           (state.sales.length ? '<button class="act danger" data-close="1">' + esc(T("closeEvent")) + "</button>" : "") + "</div>";
  }

  // ---------- souhrnný daňový doklad ----------
  // Sečte prodeje za období: aktuální účtenky podle času uložení, uzavřené
  // akce podle data uzavření (jednotlivé účtenky se v archivu už nedrží).

  function docDate(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }

  // Názvy akcí pro výběr v dokladu: otevřené i uzavřené, bez opakování.
  function docEventNames() {
    var seen = {}, out = [];
    function add(n) { n = n || T("noName"); if (!seen[n]) { seen[n] = true; out.push(n); } }
    eachOpenEvent(function (ev) { add(ev.event); });
    state.archives.slice().reverse().forEach(function (a) { add(a.event); });
    return out;
  }

  function docBody(fromS, toS, onlyName) {
    // prázdné pole „Od“ znamená od začátku, prázdné „Do“ dnešek; dřív
    // tlačítko v takovém případě tiše nic neudělalo
    if (!fromS) { fromS = "2000-01-01"; }
    if (!toS) { toS = docDate(new Date()); }
    var from = new Date(fromS + "T00:00:00").getTime();
    var to = new Date(toS + "T23:59:59.999").getTime();
    if (isNaN(from) || isNaN(to)) { return null; }

    var total = 0, cashSum = 0, cardSum = 0, bills = 0;
    var items = {}, events = {};
    var addItem = function (name, price, qty, sum, vat) {
      var v = vatStr(vat);
      var k = name + "|" + price + "|" + v;
      if (!items[k]) { items[k] = { name: name, price: price, vat: v, qty: 0, sum: 0 }; }
      items[k].qty += qty;
      items[k].sum += sum;
    };

    // otevřené akce: účtenky podle data prodeje
    eachOpenEvent(function (ev) {
      var evName = ev.event || T("noName");
      if (onlyName && evName !== onlyName) { return; }
      ev.sales.forEach(function (s) {
        if (s.ts < from || s.ts > to) { return; }
        bills += 1;
        total += s.total;
        if (s.method === "cash") { cashSum += s.total; } else { cardSum += s.total; }
        events[evName] = true;
        s.lines.forEach(function (l) {
          addItem(l.name, l.price, l.qty, l.qty * l.price, resolveVat(l.name, l.vat, ev.items));
        });
      });
    });

    // Uzavřené akce: když mají uložené účtenky, počítá se každá podle data
    // prodeje (jako u otevřených). Dřív se celá akce přesunula na datum
    // uzavření a akce přes přelom měsíce se mohla započítat dvakrát.
    // Staré archivy bez účtenek zůstávají podle data uzavření.
    state.archives.forEach(function (a) {
      if (onlyName && (a.event || T("noName")) !== onlyName) { return; }
      var aName = (a.event || T("noName")) + " (" + new Date(a.closedAt).toLocaleDateString(langInfo().loc) + ")";
      if (Array.isArray(a.sales) && a.sales.length) {
        a.sales.forEach(function (s) {
          if (!s || !Array.isArray(s.lines) || s.ts < from || s.ts > to) { return; }
          bills += 1;
          total += s.total || 0;
          if (s.method === "cash") { cashSum += s.total || 0; } else { cardSum += s.total || 0; }
          events[aName] = true;
          // bez sazby na řádku platí sazba uložená v archivu při uzávěrce,
          // ne dnešní menu
          var aItems = Array.isArray(a.items) && a.items.length ? a.items : undefined;
          s.lines.forEach(function (l) {
            addItem(l.name, l.price, l.qty, l.qty * l.price, resolveVat(l.name, l.vat, aItems));
          });
        });
        return;
      }
      if (a.closedAt < from || a.closedAt > to) { return; }
      bills += a.count || 0;
      total += a.total || 0;
      cashSum += a.cash || 0;
      cardSum += a.card || 0;
      events[aName] = true;
      (a.items || []).forEach(function (i) {
        addItem(i.name, i.price, i.qty, i.sum, resolveVat(i.name, i.vat));
      });
    });

    if (!bills) { return ""; }

    var list = Object.keys(items).map(function (k) { return items[k]; });
    list.sort(function (a, b) { return b.sum - a.sum || b.qty - a.qty; });

    // Rozpis DPH počítáme jednou a používají ho text i PDF. Ceny se zadávají
    // včetně daně, základ tedy dopočítáváme zpětně: zaklad = cena/(1+sazba/100).
    // Položky bez sazby jdou do základu celé, aby základ a daň daly dohromady
    // přesně celkovou tržbu.
    var vatRows = [], vatBase = 0, vatTax = 0, anyRate = false;
    if (state.vat) {
      var rates = {};
      list.forEach(function (i) {
        var r = vatNum(i.vat);
        var key = r === null ? "" : String(r);
        if (r !== null) { anyRate = true; }
        rates[key] = (rates[key] || 0) + i.sum;
      });
      if (anyRate) {
        Object.keys(rates).sort(function (a, b) {
          return (parseFloat(a) || 0) - (parseFloat(b) || 0);
        }).forEach(function (key) {
          var gross = rates[key];
          var r = key === "" ? null : parseFloat(key);
          var base = r === null ? vr(gross) : vr(gross / (1 + r / 100));
          var tax = vr(gross - base);
          vatBase = vr(vatBase + base);
          vatTax = vr(vatTax + tax);
          vatRows.push({ rate: r, gross: gross, base: base, tax: tax });
        });
      }
    }

    var now = new Date();
    var no = "TK-" + docDate(now).replace(/-/g, "") + "-" + ("0" + now.getHours()).slice(-2) + ("0" + now.getMinutes()).slice(-2) +
             ("0" + now.getSeconds()).slice(-2);
    var loc = langInfo().loc;
    var out = [];
    out.push(T("docTitle"));
    out.push("");
    var sl = sellerLines();
    if (sl.length) {
      sl.forEach(function (ln) { out.push(ln); });
      out.push("");
    }
    out.push(T("docNo") + " " + no);
    out.push(T("docPeriod") + " " + new Date(from).toLocaleDateString(loc) + " - " + new Date(to).toLocaleDateString(loc));
    out.push(T("docIssued") + " " + now.toLocaleDateString(loc) + " " + clock(now.getTime()));
    out.push(T("docEvents") + " " + Object.keys(events).join(", "));
    out.push("");
    out.push(T("docItemsHead"));
    list.forEach(function (i) {
      out.push(i.qty + "x " + i.name + " (" + czk(i.price) + ")  " + czk(i.sum) +
               (state.vat && vatNum(i.vat) !== null ? "  " + rateTxt(i.vat) + " %" : ""));
    });
    out.push("");

    // Rozpis DPH. Ceny se zadávají včetně daně, takže základ dopočítáváme
    // zpětně: zaklad = cena / (1 + sazba/100). Položky bez sazby jdou do
    // základu celé, aby základ a daň daly dohromady přesně celkovou tržbu.
    if (vatRows.length) {
      out.push(T("docVatHead"));
      vatRows.forEach(function (v) {
        out.push(v.rate === null
          ? T("docVatNone") + ": " + vatMoney(v.base)
          : T("docVatRate") + " " + rateTxt(v.rate) + " %: " + T("docVatBase") + " " + vatMoney(v.base) +
            ", " + T("docVatTax") + " " + vatMoney(v.tax));
      });
      out.push(T("docVatTotalBase") + " " + vatMoney(vatBase));
      out.push(T("docVatTotalTax") + " " + vatMoney(vatTax));
      out.push("");
    }
    out.push(T("docReceipts") + " " + bills);
    out.push(T("cash") + ": " + czk(cashSum));
    out.push(T("card") + ": " + czk(cardSum));
    out.push(T("docTotal") + ": " + czk(total));
    out.push("");
    out.push(T("docFooter"));

    // Text i PDF stojí na týchž datech, ať se nikdy nerozejdou.
    return {
      text: out.join("\n"),
      no: no,
      from: from, to: to, issued: now.getTime(),
      seller: sl,
      events: Object.keys(events),
      items: list,
      vatRows: vatRows, vatBase: vatBase, vatTax: vatTax,
      bills: bills, cash: cashSum, card: cardSum, total: total
    };
  }

  // ---------- doklad jako PDF ----------
  // Doklad kreslíme na plátno a to pak vkládáme do PDF jako JPEG. Důvod je
  // prozaický: kdybychom text psali do PDF přímo, museli bychom do souboru
  // vložit celý font, jinak by se rozsypala diakritika. Devět jazyků včetně
  // češtiny, polštiny a portugalštiny by přes standardní kódování neprošlo.

  var PDF_W = 595, PDF_H = 842;   // A4 v bodech
  var PDF_SCALE = 3;              // px na bod, kvůli ostrosti při tisku

  var PDF_SANS = '-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

  // ořízne text na šířku, s výpustkou
  function pdfClip(g, t, max) {
    if (g.measureText(t).width <= max) { return t; }
    var v = t;
    while (v.length > 1 && g.measureText(v + "…").width > max) { v = v.slice(0, -1); }
    return v + "…";
  }

  // rozdělí text na řádky po slovech; když se nevejde ani tak, poslední ořízne
  function pdfWrap(g, t, max, maxLines) {
    var words = String(t).split(" ");
    var out = [], cur = "", i = 0;
    for (; i < words.length; i++) {
      var next = cur ? cur + " " + words[i] : words[i];
      if (g.measureText(next).width <= max || !cur) { cur = next; continue; }
      out.push(cur);
      cur = words[i];
      if (out.length === maxLines - 1) { break; }
    }
    var rest = words.slice(i + 1).join(" ");
    if (cur) { out.push(rest ? cur + " " + rest : cur); }
    out[out.length - 1] = pdfClip(g, out[out.length - 1], max);
    return out;
  }

  function pdfEventsText(doc) { return T("docEvents") + " " + doc.events.join(", "); }

  // Stránkování podle skutečné geometrie drawDocPage: kde začíná první
  // řádek (hlavička první stránky se měří stejnými písmy a zalomením),
  // kam až smí řádky sahat nad patičku a kolik místa potřebuje souhrn.
  // Dřív se odhadovalo a na delších dokladech součet a DPH vyjely ze stránky.
  function pdfPages(doc) {
    var M = 42, rowH = 17;
    var halfW = (PDF_W - 2 * M) / 2 - 8;
    var g = document.createElement("canvas").getContext("2d");
    var font = function (size, weight) { g.font = (weight || 400) + " " + size + "px " + PDF_SANS; };

    var top = M + 40 + 26;                       // pod linkou hlavičky
    var yl = top + 15, yr = top + 15;
    if (doc.seller.length) {
      doc.seller.forEach(function (ln, i) {
        font(i === 0 ? 11.5 : 10, i === 0 ? 700 : 400);
        pdfWrap(g, ln, halfW, 3).forEach(function (part, j) { yl += (i === 0 && j === 0) ? 16 : 13; });
      });
    } else { yl += 13; }
    font(10, 400);
    yr += 14 + 14 + pdfWrap(g, pdfEventsText(doc), halfW, 4).length * 14;

    var firstBase = [Math.max(yl, yr) + 20 + 44, top + 44];
    var LAST = PDF_H - M - 14 - 10;               // poslední řádek nad patičkou
    var SUM_LIMIT = PDF_H - M - 14 - 8;           // spodek souhrnu nad patičkou
    var V = doc.vatRows.length;
    var sumH = 24 + (V ? 45 + V * rowH : 0) + 76;
    var cap = function (base) { return Math.max(1, Math.floor((LAST - base) / rowH) + 1); };

    var pages = [], rest = doc.items.slice();
    pages.push(rest.splice(0, cap(firstBase[0])));
    while (rest.length) { pages.push(rest.splice(0, cap(firstBase[1]))); }

    // souhrn se musí vejít za poslední řádek, jinak řádky přesuneme na novou stránku
    var li = pages.length - 1;
    var baseOf = function (ix) { return firstBase[ix === 0 ? 0 : 1]; };
    if (baseOf(li) + pages[li].length * rowH + sumH > SUM_LIMIT) {
      // Na novou stránku jde jen poslední řádek (když se k souhrnu vejde),
      // ať předchozí stránka zůstane plná a tabulka nezačíná prázdná.
      var fitNew = Math.floor((SUM_LIMIT - sumH - firstBase[1]) / rowH);
      var move = fitNew >= 1 && pages[li].length > 1 ? 1 : 0;
      pages.push(pages[li].splice(pages[li].length - move, move));
    }
    return { pages: pages, M: M, rowH: rowH };
  }

  // značka: čtyři dlaždice v barvách aplikace, stejný motiv jako ikona
  function drawMark(g, x, y, size) {
    var gap = size * 0.10, t = (size - gap) / 2, r = t * 0.28;
    var cols = ["#D6402A", "#F5CE3E", "#2158C4", "#127A4E"];
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (pos, i) {
      var tx = x + pos[0] * (t + gap), ty = y + pos[1] * (t + gap);
      g.fillStyle = cols[i];
      g.beginPath();
      if (g.roundRect) { g.roundRect(tx, ty, t, t, r); }
      else { g.rect(tx, ty, t, t); }
      g.fill();
    });
  }

  function drawDocPage(doc, plan, pageIx) {
    var M = plan.M, rowH = plan.rowH, S = PDF_SCALE;
    var total = plan.pages.length;
    var rows = plan.pages[pageIx];

    var cv = document.createElement("canvas");
    cv.width = PDF_W * S;
    cv.height = PDF_H * S;
    var g = cv.getContext("2d");
    g.scale(S, S);
    g.fillStyle = "#FFFFFF";
    g.fillRect(0, 0, PDF_W, PDF_H);
    g.textBaseline = "alphabetic";

    var SANS = PDF_SANS;
    var INK = "#15120E", INK2 = "#5F5749", INK3 = "#9A9184", ACC = "#D6402A", LINE = "#E4DFD6";
    var font = function (size, weight) { g.font = (weight || 400) + " " + size + "px " + SANS; };
    var ink = function (c) { g.fillStyle = c; };
    var right = function (t, x, y) { g.textAlign = "right"; g.fillText(t, x, y); g.textAlign = "left"; };
    var rule = function (y, c, w) {
      g.strokeStyle = c || LINE; g.lineWidth = w || 0.7;
      g.beginPath(); g.moveTo(M, y + 0.5); g.lineTo(PDF_W - M, y + 0.5); g.stroke();
    };
    var label = function (t, x, y, alignRight) {
      font(8, 700); ink(INK3);
      g.save(); g.letterSpacing = "0.08em";
      if (alignRight) { right(t.toUpperCase(), x, y); } else { g.fillText(t.toUpperCase(), x, y); }
      g.restore();
    };
    var wrap = function (t, max, maxLines) { return pdfWrap(g, t, max, maxLines); };
    var clip = function (t, max) { return pdfClip(g, t, max); };

    var loc = langInfo().loc;
    var vatOn = state.vat && doc.vatRows.length > 0;
    var y;

    // Sloupce si šířku spočítají podle skutečného obsahu. Pevné hodnoty by
    // v němčině nebo francouzštině, kde jsou popisky delší, narazily jedna
    // do druhé, a u měn se dvěma desetinnými místy taky.
    var colW = function (head, vals) {
      font(8, 700);
      var w = g.measureText(head.toUpperCase()).width;
      font(10.5, 600);
      vals.forEach(function (v) { w = Math.max(w, g.measureText(v).width); });
      return w;
    };
    var wQty = colW(T("docColQty"), doc.items.map(function (i) { return String(i.qty); }));
    var wUnit = colW(T("docColUnit"), doc.items.map(function (i) { return czk(i.price); }));
    var wSum = colW(T("docColSum"), doc.items.map(function (i) { return czk(i.sum); }));
    var wVat = vatOn ? colW(T("docVatTax"), doc.items.map(function (i) {
      return vatNum(i.vat) === null ? "–" : rateTxt(i.vat) + " %";
    })) : 0;

    var GAP = 16;
    var xSum = PDF_W - M;
    var xVat = xSum - wSum - GAP;
    var xUnit = (vatOn ? xVat - wVat - GAP : xSum - wSum - GAP);
    var xQty = xUnit - wUnit - GAP;
    var wName = xQty - wQty - GAP - M;

    // vpravo v hlavičce a v rozpisu DPH taky měříme, ať nic nepřeteče doleva
    var halfW = (PDF_W - 2 * M) / 2 - 8;

    // ---- hlavička se značkou ----
    drawMark(g, M, M, 26);
    font(17, 700); ink(INK);
    g.fillText("Tapkasa", M + 34, M + 20);
    font(12, 700); ink(INK);
    right(T("docTitle"), xSum, M + 12);
    font(9.5, 400); ink(INK2);
    right(T("docNo") + " " + doc.no, xSum, M + 26);
    y = M + 40;
    rule(y, ACC, 1.6);
    y += 26;

    if (pageIx === 0) {
      var yl = y, yr = y;

      label(T("sellerHead"), M, yl); yl += 15;
      if (doc.seller.length) {
        doc.seller.forEach(function (ln, i) {
          font(i === 0 ? 11.5 : 10, i === 0 ? 700 : 400);
          ink(i === 0 ? INK : INK2);
          // delší řádky, typicky zápis v rejstříku, raději zalomíme než ořízneme
          wrap(ln, halfW, 3).forEach(function (part, j) {
            g.fillText(part, M, yl);
            yl += (i === 0 && j === 0) ? 16 : 13;
          });
        });
      } else {
        font(10, 400); ink("#C4BDB2");
        g.fillText(T("sellerEmpty"), M, yl); yl += 13;
      }

      label(T("docPeriodLabel"), xSum, yr, true); yr += 15;
      font(10, 400); ink(INK2);
      right(clip(T("docPeriod") + " " + new Date(doc.from).toLocaleDateString(loc) +
            " – " + new Date(doc.to).toLocaleDateString(loc), halfW), xSum, yr); yr += 14;
      right(clip(T("docIssued") + " " + new Date(doc.issued).toLocaleDateString(loc) +
            " " + clock(doc.issued), halfW), xSum, yr); yr += 14;
      // víc akcí se zalomí na další řádky, dřív zbytek zmizel za výpustkou
      wrap(pdfEventsText(doc), halfW, 4).forEach(function (part) { right(part, xSum, yr); yr += 14; });

      y = Math.max(yl, yr) + 20;
    }

    // ---- tabulka položek ----
    label(T("docItemsHead"), M, y); y += 10;
    rule(y); y += 5;
    label(T("docColItem"), M, y + 9);
    label(T("docColQty"), xQty, y + 9, true);
    label(T("docColUnit"), xUnit, y + 9, true);
    if (vatOn) { label(T("docVatTax"), xVat, y + 9, true); }
    label(T("docColSum"), xSum, y + 9, true);
    y += 14;
    rule(y); y += 15;

    rows.forEach(function (i, ix) {
      if (ix % 2 === 1) {
        g.fillStyle = "#FAF8F4";
        g.fillRect(M - 4, y - 11, PDF_W - 2 * M + 8, rowH);
      }
      font(10.5, 500); ink(INK);
      g.fillText(clip(i.name, wName), M, y);
      font(10.5, 400); ink(INK2);
      right(String(i.qty), xQty, y);
      right(czk(i.price), xUnit, y);
      if (vatOn) { right(vatNum(i.vat) === null ? "–" : rateTxt(i.vat) + " %", xVat, y); }
      font(10.5, 600); ink(INK);
      right(czk(i.sum), xSum, y);
      y += rowH;
    });

    if (pageIx === plan.pages.length - 1) {
      y += 2; rule(y); y += 22;

      if (doc.vatRows.length) {
        label(T("docVatHead"), M, y); y += 16;

        // i tady si sloupce změříme, popisky daně jsou v každém jazyce jinak dlouhé
        var baseTxt = doc.vatRows.map(function (v) { return T("docVatBase") + " " + vatMoney(v.base); });
        var taxTxt = doc.vatRows.map(function (v) { return T("docVatTax") + " " + vatMoney(v.tax); });
        baseTxt.push(T("docVatTotalBase") + " " + vatMoney(doc.vatBase));
        taxTxt.push(T("docVatTotalTax") + " " + vatMoney(doc.vatTax));
        font(10.5, 700);
        var wide = function (arr) {
          var w = 0;
          arr.forEach(function (t) { w = Math.max(w, g.measureText(t).width); });
          return w;
        };

          y += rowH;

        right(baseTxt[baseTxt.length - 1], xBase, y);
        right(taxTxt[taxTxt.length - 1], xTax, y);

  // Minimální PDF: každá stránka je jeden JPEG přes celou plochu A4.
  // Odsazení objektů v tabulce xref musí sedět na bajt, proto se soubor
  // skládá po kouscích a délky se počítají průběžně.
  function buildPdf(jpegs) {
    var chunks = [], len = 0;
    var put = function (bytes) { chunks.push(bytes); len += bytes.length; };
    var ascii = function (str) {
      var a = new Uint8Array(str.length);
      for (var i = 0; i < str.length; i++) { a[i] = str.charCodeAt(i) & 0xFF; }
      return a;
    };

    var n = jpegs.length;
    var offsets = [];
    var objId = 0;
    var startObj = function () { objId += 1; offsets[objId] = len; return objId; };

    put(ascii("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));

    // 1 = katalog, 2 = strom stránek, pak dvojice stránka + obsah + obrázek
    var catalog = startObj();
    var pagesId = catalog + 1;
    put(ascii(catalog + " 0 obj\n<< /Type /Catalog /Pages " + pagesId + " 0 R >>\nendobj\n"));

    var kids = [];
    for (var k = 0; k < n; k++) { kids.push((pagesId + 1 + k * 3) + " 0 R"); }
    startObj();
    put(ascii(pagesId + " 0 obj\n<< /Type /Pages /Kids [" + kids.join(" ") +
              "] /Count " + n + " >>\nendobj\n"));

    for (var i = 0; i < n; i++) {
      var pageId = startObj();
      var contId = pageId + 1;
      var imgId = pageId + 2;
      put(ascii(pageId + " 0 obj\n<< /Type /Page /Parent " + pagesId + " 0 R" +
                " /MediaBox [0 0 " + PDF_W + " " + PDF_H + "]" +
                " /Resources << /XObject << /Im0 " + imgId + " 0 R >> >>" +
                " /Contents " + contId + " 0 R >>\nendobj\n"));

      var stream = "q " + PDF_W + " 0 0 " + PDF_H + " 0 0 cm /Im0 Do Q\n";
      startObj();
      put(ascii(contId + " 0 obj\n<< /Length " + stream.length + " >>\nstream\n" +
                stream + "endstream\nendobj\n"));

      var jpg = jpegs[i];
      startObj();
      put(ascii(imgId + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + jpg.w +
                " /Height " + jpg.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8" +
                " /Filter /DCTDecode /Length " + jpg.bytes.length + " >>\nstream\n"));
      put(jpg.bytes);
      put(ascii("\nendstream\nendobj\n"));
    }

    var xref = len;
    var pad = function (num) { var t = String(num); while (t.length < 10) { t = "0" + t; } return t; };
    var x = "xref\n0 " + (objId + 1) + "\n0000000000 65535 f \n";
    for (var o = 1; o <= objId; o++) { x += pad(offsets[o]) + " 00000 n \n"; }
    x += "trailer\n<< /Size " + (objId + 1) + " /Root " + catalog + " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
    put(ascii(x));

    var out = new Uint8Array(len), at = 0;
    chunks.forEach(function (c) { out.set(c, at); at += c.length; });
    return new Blob([out], { type: "application/pdf" });
  }

  function docPdf(doc) {
    var plan = pdfPages(doc);
    var jpegs = [];
    for (var i = 0; i < plan.pages.length; i++) {
      var cv = drawDocPage(doc, plan, i);
      var url = cv.toDataURL("image/jpeg", 0.94);
      var bin = atob(url.slice(url.indexOf(",") + 1));
      var bytes = new Uint8Array(bin.length);
      for (var b = 0; b < bin.length; b++) { bytes[b] = bin.charCodeAt(b); }
      jpegs.push({ w: cv.width, h: cv.height, bytes: bytes });
    }
    return buildPdf(jpegs);
  }

  function docFileName(doc) {
    return (T("docFile") + "-" + doc.no + ".pdf").replace(/[^A-Za-z0-9._-]/g, "-");
  }

  function blobToBase64(blob, done) {
    try {
      var r = new FileReader();
      r.onload = function () {
        var u = String(r.result || "");
        done(u.indexOf(",") >= 0 ? u.slice(u.indexOf(",") + 1) : null);
      };
      r.onerror = function () { done(null); };
      r.readAsDataURL(blob);
    } catch (e) { done(null); }
  }

  // Doklad ven: mode "mail" (e-mail s přílohou), "share" (nabídka sdílení),
  // "save" (uložit do souborů, jen v aplikaci). V aplikaci jde vše přes
  // nativní modul DocShare: Android WebView nemá Web Share, stažení přes
  // blob: zahodí a mailto: přílohu nenese, takže dřív odešla prázdná zpráva.
  function shareDoc(mode) {
    var doc = sheet && sheet.doc;
    if (!doc) { return; }
    var blob, name;
    try {
      blob = docPdf(doc);
      name = docFileName(doc);
    } catch (e) {
      showToast(T("pdfFail"));
      return;
    }

    if (typeof window.__kasaShareFile === "function") {
      blobToBase64(blob, function (b64) {
        if (!b64) { showToast(T("pdfFail")); return; }
        window.__kasaShareFile({
          data: b64, name: name, mime: "application/pdf", mode: mode,
          subject: T("docTitle") + " " + doc.no, text: T("docMailBody"), title: T("docTitle")
        }).then(function (r) {
          if (r && r.result === "saved") { showToast(T("pdfSaved")); }
        }, function () {
          // Nativní modul selhal. Webová cesta má smysl jen tam, kde WebView
          // umí Web Share (iOS); v Android WebView by stažení i mailto tiše
          // selhaly a hláška „uloženo“ by lhala.
          if (navigator.share) { webShareDoc(doc, blob, name, mode); } else { showToast(T("pdfFail")); }
        });
      });
      return;
    }
    webShareDoc(doc, blob, name, mode);
  }

  // Prohlížeč: Web Share se souborem, kde není, soubor stáhneme.
  function webShareDoc(doc, blob, name, mode) {
    var asMail = mode === "mail";
    var file = null;
    try { file = new File([blob], name, { type: "application/pdf" }); } catch (e) { file = null; }

    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({
        files: [file],
        title: T("docTitle"),
        text: asMail ? T("docMailBody") : undefined
      }).catch(function () { /* uživatel sdílení zavřel, nic neřešíme */ });
      return;
    }

    // náhradní cesta: soubor uložit a u e-mailu rovnou otevřít rozepsanou zprávu
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
    showToast(asMail ? T("pdfSavedMail") : T("pdfSaved"));
    if (asMail) {
      try {
        location.href = "mailto:?subject=" + encodeURIComponent(T("docTitle") + " " + doc.no) +
                        "&body=" + encodeURIComponent(T("docMailBody"));
      } catch (e) {}
    }
  }

  // Změna měny: uložené ceny se nepřevádějí (kurz neznáme), ale při méně
  // desetinných místech se zaokrouhlí. Jinak dlaždice ukazovala 3 Kč, ale
  // součet počítal s 2,5 a nesouhlasil.
  function setCurrency(code) {
    var oldDec = curInfo().dec;
    state.currency = code;
    moneyFmt = null; nfPlain = null;
    if (curInfo().dec < oldDec) {
      var round = function (list) { list.forEach(function (it) { it.price = mr(it.price); }); };
      round(state.items);
      round(state.order);
      state.parked.forEach(function (pk) { round(pk.items); });
    }
  }

  function parsePrice(raw) {
    var t = String(raw === undefined || raw === null ? "" : raw)
      .replace(/[\s\u00a0\u202f']/g, "").replace(/[^0-9.,]/g, "");
    if (!t) { return NaN; }
    var last = Math.max(t.lastIndexOf(","), t.lastIndexOf("."));
    if (last < 0) { return parseFloat(t); }
    var tail = t.slice(last + 1);
    var mixed = t.indexOf(",") >= 0 && t.indexOf(".") >= 0;
    var seps = (t.match(/[.,]/g) || []).length;
    if (mixed || (seps === 1 && tail.length !== 3)) {
      var ip = t.slice(0, last).replace(/[.,]/g, "");
      return parseFloat((ip || "0") + "." + (tail || "0"));
    }
    return parseFloat(t.replace(/[.,]/g, ""));
  }

  function priceStr(v) {
    var dec = curInfo().dec;
    if (!dec || v === Math.round(v)) { return String(Math.round(v)); }
    return String(mr(v));
  }

  // ---------- Jazyk, měna, verze ----------
  // Údaje prodejce. Pole jsou schválně obecná, ať sednou na kteroukoli zemi:
  // popisky se mění podle jazyka (IČO/DIČ, Company number/VAT ID, Steuernummer
  // /USt-IdNr. a tak dál), ale význam zůstává stejný. Poznámka na konci je
  // pro cokoli, co konkrétní země navíc vyžaduje.
  var SELLER_FIELDS = ["name", "regNo", "vatId", "street", "city", "zip", "country", "email", "phone", "note"];

  // Země našeptáváme v jazyce aplikace: názvy si necháme přeložit systémem,
  // takže Čech píše Česko, Angličan Czechia a Němec Tschechien, a nikdo si
  // je nemusí vymýšlet. Kdyby prohlížeč Intl.DisplayNames neuměl, zůstane
  // z pole obyčejný textový vstup.
  var COUNTRY_CODES = ("AD AE AF AG AL AM AO AR AT AU AZ BA BB BD BE BF BG BH BI BJ BN BO BR BS " +
    "BT BW BY BZ CA CD CF CG CH CI CL CM CN CO CR CU CV CY CZ DE DJ DK DM DO DZ EC EE EG ER ES " +
    "ET FI FJ FM FR GA GB GD GE GH GM GN GQ GR GT GW GY HK HN HR HT HU ID IE IL IN IQ IR IS IT " +
    "JM JO JP KE KG KH KI KM KN KP KR KW KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH " +
    "MK ML MM MN MO MR MT MU MV MW MX MY MZ NA NE NG NI NL NO NP NR NZ OM PA PE PG PH PK PL PR " +
    "PS PT PW PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SY SZ TD TG TH " +
    "TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VN VU WS XK YE ZA ZM ZW").split(" ");

  var countryCache = null, countryCacheLang = null;

  function countryList() {
    var lang = state && state.lang ? state.lang : "cs";
    if (countryCache && countryCacheLang === lang) { return countryCache; }
    var out = [];
    try {
      var dn = new Intl.DisplayNames([langInfo().loc], { type: "region" });
      COUNTRY_CODES.forEach(function (c) {
        var n = dn.of(c);
        if (n && n !== c) { out.push(n); }
      });
      out.sort(function (a, b) { return a.localeCompare(b, langInfo().loc); });
    } catch (e) { out = []; }
    countryCache = out;
    countryCacheLang = lang;
    return out;
  }

  // hledáme bez ohledu na diakritiku a velikost písmen, ať „cesko" najde Česko
  function plain(t) {
    var v = String(t).toLowerCase();
    try { v = v.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e) {}
    return v;
  }

  function countryMatches(q) {
    var v = plain(q).trim();
    if (!v) { return []; }
    var list = countryList();
    var starts = [], has = [];
    for (var i = 0; i < list.length; i++) {
      var pn = plain(list[i]);
      if (pn === v) { return []; }          // přesná shoda, není co nabízet
      if (pn.indexOf(v) === 0) { starts.push(list[i]); }
      else if (pn.indexOf(v) > 0) { has.push(list[i]); }
      if (starts.length >= 6) { break; }
    }
    return starts.concat(has).slice(0, 6);
  }

  function countrySuggestHtml(q) {
    var m = countryMatches(q);
    if (!m.length) { return ""; }
    return m.map(function (n) {
      return '<button type="button" class="sug" data-country="' + esc(n) + '">' + esc(n) + "</button>";
    }).join("");

  // ---------- kolečko vlastní barvy ----------
  // Kreslí se na canvas: úhel = odstín, vzdálenost od středu = sytost,
  // posuvník = světlost. Výběr žije mimo state, aby tahání prstem
  // nepřekreslovalo celý list; do položky se zapíše až tlačítkem.

  var wheelPick = { h: 16, s: 78 };
  var wheelL = 52;
  var wheelImg = null;

  function wheelHex() { return hslToHex(wheelPick.h, wheelPick.s, wheelL); }

  function wheelSeed(current) {
    if (typeof current === "string" && current.charAt(0) === "#") {
      var p = hexToHsl(current);
      wheelPick = { h: p.h, s: Math.max(8, p.s) };
      wheelL = Math.round(Math.min(88, Math.max(18, p.l)));
      wheelImg = null;
    }
  }

  function wheelPaint() {
    var cv = document.getElementById("wheel");
    if (!cv) { return; }
    var ctx = cv.getContext("2d");
    var w = cv.width, r = w / 2;
    if (!wheelImg) {
      var img = ctx.createImageData(w, w);
      var data = img.data;
      for (var y = 0; y < w; y++) {
        for (var x = 0; x < w; x++) {
          var dx = x - r + 0.5, dy = y - r + 0.5;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d > r) { continue; }
          var h = Math.atan2(dy, dx) * 180 / Math.PI;
          if (h < 0) { h += 360; }
          var hex = hslToHex(h, Math.min(1, d / r) * 100, wheelL);
          var i = (y * w + x) * 4;
          data[i] = parseInt(hex.slice(1, 3), 16);
          data[i + 1] = parseInt(hex.slice(3, 5), 16);
          data[i + 2] = parseInt(hex.slice(5, 7), 16);
          data[i + 3] = d > r - 2 ? Math.max(0, Math.round((r - d) * 127.5)) : 255;
        }
      }
      wheelImg = img;
    }
    ctx.clearRect(0, 0, w, w);
    ctx.putImageData(wheelImg, 0, 0);
    // ukazatel výběru
    var a = wheelPick.h * Math.PI / 180, dist = (wheelPick.s / 100) * (r - 6);
    var px = r + Math.cos(a) * dist, py = r + Math.sin(a) * dist;
    ctx.beginPath(); ctx.arc(px, py, 12, 0, 2 * Math.PI);
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py, 12, 0, 2 * Math.PI);
    ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 1.5; ctx.stroke();
  }

  function wheelPreview() {
    var pv = document.getElementById("wprev");
    if (!pv) { return; }
    var hex = wheelHex();
    pv.style.background = hex;
    pv.style.color = inkFor(hex);
  }

  function wheelFromEvent(cv, ev) {
    var box = cv.getBoundingClientRect();
    var r = box.width / 2;
    var dx = ev.clientX - box.left - r, dy = ev.clientY - box.top - r;
    var h = Math.atan2(dy, dx) * 180 / Math.PI;
    if (h < 0) { h += 360; }
    wheelPick = { h: h, s: Math.min(1, Math.sqrt(dx * dx + dy * dy) / r) * 100 };
    wheelPaint();
    wheelPreview();
  }

  var wheelDrag = false;
  function wheelInit() {
    var cv = document.getElementById("wheel");
    if (!cv || cv.__wired) { return; }
    cv.__wired = true;
    wheelPaint();
    cv.addEventListener("pointerdown", function (ev) {
      wheelDrag = true;
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
      wheelFromEvent(cv, ev);
      ev.preventDefault();
    });
    cv.addEventListener("pointermove", function (ev) {
      if (wheelDrag) { wheelFromEvent(cv, ev); }
    });
    ["pointerup", "pointercancel"].forEach(function (t) {
      cv.addEventListener(t, function () { wheelDrag = false; });
    });
  }

  // Okno platby zůstává na obrazovce i několik vteřin a mezitím může přijít
  // zpráva z druhého zařízení. Kdyby se při každé překreslila celá stránka,
  // okno by se přerodilo i s návratovou animací a obsluze by poskakovalo
  // pod rukama, proto sahá na DOM jen ta část, jejíž obsah se liší.
  var painted = {};

  // Překreslení nesmí vzít kurzor z pole, do kterého se právě píše (název
  // či cena položky, údaje prodejce). Dřív ho shodila třeba zmizelá hláška
  // nebo půlminutové obnovení stavu spojení a psaní se přerušilo.
  function focusKeyOf(a) {
    if (a.id) { return "#" + a.id; }
    var keys = ["nm", "pr", "vat", "sf"];
    for (var i = 0; i < keys.length; i++) {
      var v = a.getAttribute("data-" + keys[i]);
      if (v !== null) { return "[data-" + keys[i] + '="' + String(v).replace(/["\\]/g, "") + '"]'; }
    }
    return null;
  }

  function swapHtml(el, html) {
    var a = document.activeElement, key = null, val = "", s0 = null, s1 = null;
    if (a && el.contains(a) && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && a.type !== "checkbox") {
      key = focusKeyOf(a);
      val = a.value;
      try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (e) {}
    }
    el.innerHTML = html;
    if (!key) { return; }
    var n = null;
    try { n = el.querySelector(key); } catch (e) { n = null; }
    if (!n) { return; }
    if (n.value !== val) { n.value = val; }
    try { n.focus({ preventScroll: true }); } catch (e) { n.focus(); }
    if (s0 !== null) { try { n.setSelectionRange(s0, s1); } catch (e) {} }
  }

  function paint(id, html) {
    if (painted[id] === html) { return false; }
    painted[id] = html;
    swapHtml(document.getElementById(id), html);
    return true;
  }

  // Panel se překresluje po každém ťuknutí (přijatá částka, vrátit, stav
  // tlačítek). Kdyby se pokaždé nahradil celý slot, zanikl by a znovu
  // vznikl i obal .scrim/.sheet a jeho vstupní animace by se přehrály,
  // což se projevovalo jako probliknutí celého panelu. Dokud je otevřený
  // stejný krok, přepisuje se proto jen vnitřek už existujícího panelu.
  // Kdy se naposledy objevil nový krok panelu. Rychlé dvojí ťuknutí na
  // Zaplatit/Kartou jinak druhým ťuknutím rovnou potvrdilo platbu.
  var stepShownAt = 0;

  function paintSheet() {
    var full = state.setup ? renderSheet() : renderOnboard();
    var slot = document.getElementById("sheetSlot");
    var shell = slot.firstElementChild;
    var sameShell = state.setup && sheet && shell &&
                    shell.classList.contains("scrim") &&
                    shell.getAttribute("data-step") === sheet.step;

    if (sameShell) {
      var box = shell.querySelector(".sheet");
      var inner = sheetInner();
      if (box && painted.sheetInner !== inner) {
        painted.sheetInner = inner;
        swapHtml(box, inner);
      }
      painted.sheetSlot = full; // ať pozdější plné překreslení porovnává správně
      return;
    }

    if (paint("sheetSlot", full)) {
      painted.sheetInner = (state.setup && sheet) ? sheetInner() : null;
      stepShownAt = Date.now();
    }
  }
