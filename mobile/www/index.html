<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Tapkasa, pokladna do kapsy pro stánky, trhy a festivaly. Prodej na tři ťuknutí, fronta objednávek, tržby a DPH doklady. Funguje i bez internetu.">
<link rel="canonical" href="https://deriverge.com/tapkasa/">
<meta property="og:type" content="website">
<meta property="og:title" content="Tapkasa, pokladna do kapsy">
<meta property="og:description" content="Pokladna pro stánky, trhy a festivaly. Funguje i bez internetu, pro malé akce zdarma.">
<meta property="og:url" content="https://deriverge.com/tapkasa/">
<meta property="og:image" content="https://deriverge.com/tapkasa/og.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tapkasa">
<meta name="theme-color" content="#FBFAF7">
<meta name="robots" content="noindex">
<title>Tapkasa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<!-- APP:START -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Písma se načítají bez blokování: stylopis Google Fonts v <body> před
     skriptem aplikace držel start, dokud nevypršel požadavek. Na festivalu
     s přetíženou sítí nebo na routeru bez internetu tak kasa desítky sekund
     ukazovala prázdnou obrazovku. Bez sítě se použijí systémová písma. -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#FBFAF7;
    --surface:#FFFFFF;
    --sunk:#F2EEE6;
    --ink:#15120E;
    --ink-2:#5F5749;
    --ink-3:#8C8474;
    --rule:#E4DFD5;
    --accent:#D6402A;
    --accent-dk:#B93520;
    --accent-tint:#FFF6F4;
    --cash:#0F7A4F;
    --card:#1D5BD6;
    --track:#EDE9E0;
    --r-tile:12px;
    --r-btn:10px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.35;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  /* ---------- shell ---------- */
  /* Na iPhonu na šířku leží výřez nebo Dynamic Island přes okraj; bez
     odsazení zakrýval začátky názvů položek a řádků účtu. */
  .shell{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--paper);
    padding-left:var(--safe-l);padding-right:var(--safe-r)}

  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(var(--safe-t) + 10px) 16px 10px;
    border-bottom:1px solid var(--rule);background:var(--paper);
    position:relative;z-index:3;
  }
  .top > div:first-child{min-width:0;flex:1}
  .top-name{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;margin-top:1px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button.top-name{border:0;background:none;padding:0;text-align:left;color:inherit;font-family:inherit}
  button.top-name:disabled{opacity:1}
  .top-name .chev{display:inline-block;width:9px;height:9px;margin-left:6px;border-right:2px solid var(--ink-3);
    border-bottom:2px solid var(--ink-3);transform:translateY(-3px) rotate(45deg)}
  .top-total{text-align:right;flex:0 0 auto}
  .top-total .v{display:block;font-size:15px;margin-top:1px}

  .view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  /* ---------- tabs ---------- */
  .tabs{
    display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    border-top:1px solid var(--rule);background:var(--surface);
    padding-bottom:var(--safe-b);position:relative;z-index:3;
  }
  .tab{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 10px;background:none;border:0;
    font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);
  }
  .tab .dot{
    position:absolute;top:4px;left:50%;margin-left:6px;
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:11px;font-weight:700;
    display:grid;place-items:center;
  }
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent)}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px}
  @media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}

  .prod{
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;gap:8px;
    min-height:80px;padding:10px 12px;text-align:left;
    background:var(--surface);border:1px solid var(--rule);border-bottom-width:2px;
    border-radius:var(--r-tile);
    -webkit-touch-callout:none;
    transition:transform .06s ease,background .12s ease;
  }
  .prod:active{transform:scale(.97);background:var(--accent-tint)}

  /* podržení = odebrání položky z účtu; pruh ukazuje, kolik zbývá */
  .prod .hold{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:left center}
  .prod.is-hold{background:var(--accent-tint);border-color:var(--accent)}
  .prod.is-hold .hold{transform:scaleX(1);transition:transform 1s linear}
  @media (prefers-reduced-motion:reduce){.prod.is-hold .hold{transition:none}}
  .prod .nm{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
  .prod .pr{font-size:14px;color:var(--ink-2)}
  .prod.is-on{border-color:var(--accent);background:var(--accent-tint)}
  /* odznak musí zůstat uvnitř karty, ta má oříznuté okraje kvůli pruhu držení */
  .prod .badge{
    position:absolute;top:7px;right:7px;min-width:26px;height:26px;padding:0 7px;
    display:grid;place-items:center;border-radius:13px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:13px;font-weight:700;
  }
  .prod.is-on .nm{padding-right:32px}

  /* barevná karta, pozadí i barva textu jdou z palety inline stylem,
     zbytek se veze na currentColor, takže sedí na jakoukoliv barvu */
  .prod.tinted{border-color:rgba(0,0,0,.16)}
  .prod.tinted .pr{color:inherit;opacity:.85}
  .prod.tinted:active,.prod.tinted.is-hold{filter:brightness(.9)}
  .prod.tinted.is-on{border-color:rgba(0,0,0,.3);box-shadow:inset 0 0 0 3px currentColor}
  .prod.tinted .badge{background:var(--ink);color:var(--bg)}
  .prod.tinted .hold{background:currentColor}
  .prod.custom{border-style:dashed;border-bottom-width:1px;background:transparent;align-items:center;justify-content:center;text-align:center}
  .prod.custom .nm{color:var(--ink-2)}

  .hint{padding:8px 24px 24px;color:var(--ink-3);font-size:13px;text-align:center;line-height:1.5}

  /* ---------- order bar ---------- */
  .bar{border-top:1px solid var(--rule);background:var(--surface);position:relative;z-index:2}
  .bar-lines{max-height:34dvh;overflow-y:auto;border-bottom:1px solid var(--rule)}
  /* telefon na šířku: rozbalené řádky účtu nesmí schovat celé menu */
  @media (max-height:450px){.bar-lines{max-height:22dvh}}
  /* Plátce DPH na úzkém telefonu: jméno položky dostalo dva znaky, řádek
     editoru se proto zalomí a ceny s ovládáním jdou pod jméno. */
  @media (max-width:420px){
    .edit.vat{flex-wrap:wrap}
    .edit.vat .e-nm{flex:1 1 calc(100% - 44px)}
    .edit.vat .e-pr{margin-left:36px}
  }
  .line{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule)}
  .line:last-child{border-bottom:0}
  .line .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:64px;text-align:right}
  .step{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:2px}
  .step button{width:30px;height:30px;border:0;background:none;border-radius:999px;font-size:17px;font-weight:600;line-height:1;color:var(--ink)}
  .step button:active{background:#E2DCD0}
  .step .q{min-width:22px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700}

  .bar-main{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .bar-sum{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
  .bar-sum .c{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
  /* Delší popisky tlačítek (Verwerfen/Kassieren…) na úzkém telefonu
     nechaly součtu tak málo místa, že vjel pod Zrušit. Zmenší se. */
  .bar-sum .t{display:block;font-size:24px;margin-top:1px;white-space:nowrap;overflow:hidden}
  .btn-pay{
    flex:0 0 auto;padding:14px 20px;border:0;border-radius:var(--r-btn);
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-pay:disabled{background:var(--track);color:var(--ink-3)}
  .btn-pay:not(:disabled):active{transform:scale(.98);background:var(--accent-dk)}
  .btn-clear{flex:0 0 auto;padding:12px 6px;background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:600}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(21,18,14,.44);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(14px)}to{transform:translateY(0)}}
  .sheet{
    width:100%;max-width:640px;background:var(--paper);
    border-radius:18px 18px 0 0;border-top:1px solid var(--rule);
    padding:18px 16px calc(18px + var(--safe-b));
    max-height:92dvh;overflow-y:auto;overflow-x:hidden;animation:rise .18s ease;
  }
  @media (prefers-reduced-motion:reduce){.scrim,.sheet,.toast{animation:none}}
  .sheet h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .sheet .big{font-size:46px;line-height:1.05;margin:8px 0 2px;white-space:nowrap;overflow:hidden}
  .sheet .sub{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
  .sheet .txt{width:100%;height:190px;margin-top:14px;padding:12px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-family:var(--mono);font-size:12px;line-height:1.5;resize:none}

  .pay2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .btn-m{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:20px 10px;border-radius:var(--r-tile);border:0;color:#fff;
    font-size:17px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-m svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .btn-m:active{transform:scale(.98)}
  .m-cash{background:var(--cash)}
  .m-card{background:var(--card)}

  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .key{padding:13px 4px;border-radius:var(--r-btn);border:1px solid var(--rule);background:var(--surface);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .key:active{background:var(--sunk)}
  .keys.cash{grid-template-columns:repeat(5,minmax(0,1fr))}
  .keys.cash .key{min-width:0;padding:13px 2px;font-size:clamp(12px,3.6vw,15px);overflow-wrap:anywhere}
  .keys.cash .w3{grid-column:span 3}
  .keys.cash .w2{grid-column:span 2}
  .key.wide{grid-column:span 2}
  .key.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .recv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-tile)}
  .recv .lbl{font-size:13px;color:var(--ink-2);font-weight:600}
  .recv .val{font-size:20px}
  .recv.give{background:#F0F7F3;border-color:#BFE0D0}
  .recv.give .val{color:var(--cash)}
  .recv.short .val{color:var(--accent)}
  .recv.off .lbl,.recv.off .val{color:var(--ink-3)}

  .btn-done{width:100%;margin-top:14px;padding:17px;border:0;border-radius:var(--r-btn);background:var(--ink);color:var(--paper);font-size:17px;font-weight:700}
  .btn-done:disabled{background:var(--track);color:var(--ink-3)}
  .btn-done:not(:disabled):active{transform:scale(.99)}
  .btn-done.warn{background:var(--accent)}
  .btn-done.go{background:var(--cash)}
  .btn-ghost{width:100%;margin-top:8px;padding:13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:transparent;color:var(--ink-2);font-size:14px;font-weight:600}

  .paid{display:flex;align-items:center;gap:9px;margin-top:16px;padding:13px 14px;border-radius:var(--r-tile);font-size:15px;font-weight:600;color:#fff}
  .paid svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------- history ---------- */
  .sec{padding:18px 16px 0}
  .sec h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  .hero{padding:18px 16px 16px;border-bottom:1px solid var(--rule)}
  .hero .sum{font-size:44px;line-height:1.05;margin-top:6px;white-space:nowrap;overflow:hidden}
  .hero .meta{margin:8px 0 0;font-size:13px;color:var(--ink-2)}

  .split{display:flex;gap:2px;margin-top:14px;height:10px}
  .split i{display:block;border-radius:2px}
  .split i:first-child{border-radius:5px 2px 2px 5px}
  .split i:last-child{border-radius:2px 5px 5px 2px}
  .split i:only-child{border-radius:5px}
  .sp-cash{background:var(--cash)}
  .sp-card{background:var(--card)}
  .legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
  .lg{display:flex;align-items:baseline;gap:7px;font-size:13px}
  .lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;transform:translateY(-1px)}
  .lg .k{color:var(--ink-2);font-weight:600}
  .lg .v{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

  .items{display:flex;flex-direction:column;gap:11px}
  .it .r{display:flex;align-items:baseline;gap:10px}
  .it .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .q{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .it .a{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
  .it .track{height:6px;margin-top:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .it .fill{height:100%;background:var(--accent);border-radius:3px}

  .tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
  .tx:last-child{border-bottom:0}
  .tx .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .tx .mid{flex:1;min-width:0}
  .tx .w{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tx .a{font-family:var(--mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .tx .del{border:0;background:none;color:var(--ink-3);font-size:19px;line-height:1;padding:6px 2px 6px 8px}

  .arch{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .arch .mid{flex:1;min-width:0}
  .arch .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .arch .ab{width:32px;height:32px;flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:17px;line-height:1;border-radius:8px}
  .arch .ab:active{background:var(--sunk)}
  .arch .ab.del{color:var(--accent);font-size:19px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;padding:18px 16px 28px}
  .act{flex:1 1 auto;padding:13px 14px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:14px;font-weight:600}
  .act:active{background:var(--sunk)}
  .act.danger{color:var(--accent);border-color:#F0C7BF}
  .act.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- menu editor ---------- */
  .field{padding:0 16px 14px}
  .inp{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:15px}
  .inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  /* stejná textarea jako v panelu dokladu, jen zasazená do nastavení */
  .field .txt{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r-btn);
              background:var(--surface);font-family:var(--mono);font-size:13px;line-height:1.5;resize:none}
  .field .txt:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  .edit{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 16px;border-bottom:1px solid var(--rule)}
  .edit .e-nm{flex:1;min-width:0;padding:10px 11px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:15px;font-weight:500}
  .edit .e-nm:focus{background:var(--surface);border-color:var(--rule);outline:none}
  .edit .e-pr{width:70px;flex:0 0 auto;padding:10px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:right;font-family:var(--mono);font-weight:700;font-size:14px}
  .edit .e-pr:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .edit .e-vat{width:58px;flex:0 0 auto;padding:10px 6px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:right;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
  .edit .e-vat:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .edit .mv,.edit .rm{width:32px;height:34px;flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;border-radius:8px}
  .edit .mv:active,.edit .rm:active{background:var(--sunk)}
  .edit .rm{color:var(--accent);font-size:19px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));bottom:calc(76px + var(--safe-b));z-index:30;
    max-width:616px;margin:0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:var(--r-tile);background:var(--ink);color:var(--paper);
    font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(21,18,14,.22);animation:rise .18s ease;
  }
  /* nad otevřeným oknem by hláška zakryla jeho tlačítka, jde nahoru */
  .toast.up{bottom:auto;top:calc(var(--safe-t) + 10px)}
  .toast .t{flex:1;min-width:0}
  .toast button{border:0;background:none;color:#FFB3A5;font-size:14px;font-weight:700;padding:4px 2px}
  .toast button.x{color:#9A9184;font-size:18px;line-height:1}

  /* ---------- daňový doklad ---------- */
  /* Pole Od/Do jsou input[type=date]. Na iOS si takové pole s výchozím
     vzhledem drží vlastní vnitřní šířku a width:100% ji nepřebije: pole
     vyjede z panelu a ten pak jde tahat do stran. Pomůže až vypnutí
     nativního vzhledu spolu s min-width:0 a vynulováním vnitřních částí,
     které si iOS kreslí sám. Ve výchozím stavu jsou pole pod sebou, vedle
     sebe je dáváme až tam, kde je na ně opravdu místo. */
  .doc-range{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
  .doc-range label{display:block;min-width:0}
  .doc-range .inp{
    -webkit-appearance:none;appearance:none;
    display:block;width:100%;min-width:0;max-width:100%;
  }
  .doc-range .inp::-webkit-date-and-time-value{text-align:left;min-width:0;margin:0}
  .doc-range .inp::-webkit-datetime-edit{padding:0}
  @media (min-width:520px){.doc-range{grid-template-columns:1fr 1fr}}
  .sf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .sf-grid .sf:nth-child(1),.sf-grid .sf:nth-child(4){grid-column:1 / -1}
  @media (max-width:400px){.sf-grid{grid-template-columns:1fr}.sf-grid .sf{grid-column:1 / -1}}
  .sf{display:block;min-width:0}
  .sf .inp,.sf .txt{min-width:0;max-width:100%}
  .sf-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;grid-column:1 / -1}
  .sf-sug:empty{margin-top:0}
  .sf-sug .sug{padding:7px 11px;border:1px solid var(--rule);border-radius:999px;
    background:var(--surface);font-size:13px;color:var(--ink-2)}
  .sf-sug .sug:active{background:var(--sunk)}
  .sf span{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .doc-range label span{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .vchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .vchip{padding:9px 13px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
  .vchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .doc-ev{display:block;min-width:0;margin-top:10px}
  .doc-ev span{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .doc-ev .inp{display:block;width:100%;min-width:0;max-width:100%}

  /* ---------- akce ---------- */
  .evl{margin-top:14px;border-top:1px solid var(--rule)}
  .evr{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
  .evr .pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 2px;border:0;background:none;text-align:left}
  .evr .pick .mid{flex:1;min-width:0}
  .evr .pick .n{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .evr .pick .s{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
  .evr .pick .go{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--accent)}
  .evr.on .pick .go{color:var(--cash)}
  .evr .ab{width:36px;height:36px;flex:0 0 auto;border:0;background:none;color:var(--accent);border-radius:8px}
  .evr .ab:active{background:var(--sunk)}
  .evr .ab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .evchk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--ink-2)}
  .evchk input{width:20px;height:20px;accent-color:var(--ink);flex:0 0 auto}
  .tk .evn{margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--sunk);color:var(--ink-2);font-size:11px;font-weight:600}
  /* Ikony v tlačítkách jsou vlastní SVG, ne znaky ani emoji. Jednotné
     nastavení tahu, velikost si každé místo doladí samo. */
  .step button svg,.key svg,.tx .del svg,.arch .ab svg,.edit .mv svg,.edit .rm svg,
  .served .drop svg,.toast button.x svg{
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    display:block;margin:0 auto;
  }
  .act svg,.link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;margin-right:6px;vertical-align:-2px}
  .step button svg{width:17px;height:17px}
  .key svg{width:18px;height:18px}
  .tx .del svg,.served .drop svg,.toast button.x svg{width:17px;height:17px}
  .arch .ab svg,.edit .mv svg,.edit .rm svg{width:17px;height:17px}
  @media (min-width:600px){.step button svg{width:19px;height:19px}}

  /* ---------- průvodce propojením bez internetu ---------- */
  /* Smyčka 12 s, kroky po 3 s: 1 zapnutí hotspotu, 2 vlny + výběr sítě,
     3 heslo, 4 spojení. Kroky v textu se zvýrazňují ve stejném rytmu. */
  .oh-scene{margin:14px 0 4px;border:1px solid var(--rule);border-radius:var(--r-tile);background:var(--surface);padding:8px}
  .oh-scene svg{display:block;width:100%;height:auto}
  .oh-dev{fill:#0E0C09}
  .oh-scr{fill:var(--paper)}
  .oh-row{fill:var(--sunk)}
  .oh-toggle{fill:#C9C2B6;transition:fill .3s;animation:ohToggle 12s infinite}
  .oh-knob{fill:#FFF;animation:ohKnob 12s infinite}
  .oh-pass{animation:ohPass 12s infinite}
  .oh-wave{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;opacity:0;animation:ohWave 12s infinite}
  .oh-wave.w2{animation-delay:.35s}
  .oh-pick{animation:ohPick 12s infinite}
  .oh-tick{fill:none;stroke:var(--cash);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:ohTick 12s infinite}
  .oh-linkline{fill:none;stroke:var(--cash);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:150;stroke-dashoffset:150;animation:ohLine 12s infinite}
  .oh-done-c{fill:var(--cash)}
  .oh-done-t{fill:none;stroke:#FFF;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .oh-done{opacity:0;animation:ohDone 12s infinite}
  @keyframes ohToggle{0%,6%{fill:#C9C2B6}10%,100%{fill:var(--cash)}}
  @keyframes ohKnob{0%,6%{transform:translateX(-5px)}10%,100%{transform:translateX(0)}}
  @keyframes ohPass{0%,48%{opacity:.35}54%,74%{opacity:1}80%,100%{opacity:.35}}
  @keyframes ohWave{0%,10%{opacity:0}16%,90%{opacity:1}96%,100%{opacity:0}}
  @keyframes ohPick{0%,26%{fill:var(--sunk)}32%,100%{fill:#EAF4EE}}
  @keyframes ohTick{0%,30%{opacity:0}36%,100%{opacity:1}}
  @keyframes ohLine{0%,74%{stroke-dashoffset:150}86%,100%{stroke-dashoffset:0}}
  @keyframes ohDone{0%,84%{opacity:0;transform:scale(.6);transform-origin:170px 97px}92%,100%{opacity:1;transform:scale(1)}}
  .oh-steps{margin:12px 0 0;padding:0 0 0 22px;text-align:left;font-size:14px;line-height:1.45;color:var(--ink-2)}
  .oh-steps li{margin:7px 0;transition:color .4s}
  .oh-steps .oh-s1{animation:ohHi1 12s infinite}
  .oh-steps .oh-s2{animation:ohHi2 12s infinite}
  .oh-steps .oh-s3{animation:ohHi3 12s infinite}
  .oh-steps .oh-s4{animation:ohHi4 12s infinite}
  @keyframes ohHi1{0%,24%{color:var(--ink);font-weight:600}26%,100%{color:var(--ink-2);font-weight:400}}
  @keyframes ohHi2{0%,24%{color:var(--ink-2)}26%,49%{color:var(--ink);font-weight:600}51%,100%{color:var(--ink-2);font-weight:400}}
  @keyframes ohHi3{0%,49%{color:var(--ink-2)}51%,74%{color:var(--ink);font-weight:600}76%,100%{color:var(--ink-2);font-weight:400}}
  @keyframes ohHi4{0%,74%{color:var(--ink-2)}76%,100%{color:var(--ink);font-weight:600}}
  @media (prefers-reduced-motion:reduce){
    .oh-scene *,.oh-steps li{animation:none !important}
    .oh-toggle{fill:var(--cash)}.oh-wave,.oh-tick,.oh-done{opacity:1}
    .oh-linkline{stroke-dashoffset:0}.oh-pick{fill:#EAF4EE}
  }

  /* ---------- interaktivní průvodce ---------- */
  /* Kroužek nesmí chytat doteky, jinak by bránil právě té akci, ke které vede. */
  #tourLayer{position:fixed;inset:0;z-index:40;pointer-events:none}
  /* Polohu i velikost nastavuje skript každý snímek podle skutečného prvku,
     bez CSS přechodů: s nimi rámeček při posunu stránky dojížděl a rostl
     po kouskách. Animuje se jen nástup nového kroku (průhlednost a měřítko). */
  .tour-ring{position:fixed;border:3px solid var(--accent);border-radius:14px;
    box-shadow:0 0 0 4px rgba(214,64,42,.18);
    animation:tourPulse 1.6s ease-in-out infinite}
  .tour-ring.is-new{animation:tourIn .3s cubic-bezier(.2,.8,.2,1),tourPulse 1.6s ease-in-out .3s infinite}
  @keyframes tourPulse{0%,100%{box-shadow:0 0 0 4px rgba(214,64,42,.18)}50%{box-shadow:0 0 0 10px rgba(214,64,42,.05)}}
  @keyframes tourIn{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:none}}
  .tour-card{position:fixed;left:14px;right:14px;max-width:560px;margin:0 auto;
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-radius:var(--r-tile);background:var(--ink);color:var(--paper);
    font-size:14px;font-weight:500;line-height:1.4;
    box-shadow:0 8px 24px rgba(21,18,14,.25)}
  .tour-card.is-new{animation:tourCardIn .3s ease-out}
  @keyframes tourCardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tour-n{flex:0 0 auto;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.16);
    font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .tour-t{flex:1;min-width:0}
  .tour-skip{pointer-events:auto;flex:0 0 auto;border:0;background:none;
    color:#9A9184;font-size:13px;font-weight:600;padding:4px 2px}
  @media (prefers-reduced-motion:reduce){.tour-ring,.tour-ring.is-new,.tour-card.is-new{animation:none}}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- počítadlo plateb zdarma ---------- */
  .fcnt{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:11px;font-weight:700;vertical-align:1px}

  /* ---------- výběr jazyka / měny ---------- */
  .picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;max-height:52dvh;overflow-y:auto;padding-bottom:2px}
  .picker .pick{padding:13px 10px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:14px;font-weight:600;text-align:center}
  .picker .pick.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .picker.cur{grid-template-columns:1fr 1fr}
  .picker.cur .pick{display:flex;flex-direction:column;gap:2px;align-items:center}
  .picker.cur .pick strong{font-family:var(--mono);font-size:14px}
  .picker.cur .pick:not(.on){color:var(--ink-2)}

  /* ---------- paywall ---------- */
  .pw-mark{display:flex;justify-content:center;margin:4px 0 10px}
  .pw-mark svg{width:56px;height:56px}
  .pw-list{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .pw-b{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
  .pw-b svg{width:18px;height:18px;stroke:var(--cash);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .pw-plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
  .pw-plan{position:relative;display:flex;flex-direction:column;gap:2px;align-items:center;padding:14px 8px;border:1.5px solid var(--rule);border-radius:var(--r-tile);background:var(--surface)}
  .pw-plan .k{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
  .pw-plan .p{font-size:clamp(15px,5.6vw,22px);max-width:100%;text-align:center;overflow-wrap:anywhere;line-height:1.1}
  .pw-plan .s{font-size:11px;color:var(--ink-3)}
  .pw-plan.best{border-color:var(--accent);background:var(--accent-tint)}
  .pw-plan:active{transform:scale(.98)}
  .pw-legal{padding:6px 4px 0;text-align:center;font-size:12px;color:var(--ink-3)}
  .pw-legal a{color:var(--ink-3);text-decoration:underline;text-underline-offset:2px}

  /* ---------- potvrzení nákupu Pro ---------- */
  .procele{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--paper);animation:pc-fade .3s ease both}
  .procele.out{animation:pc-out .35s ease both}
  .pc-in{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
  .pc-logo{position:relative;width:96px;height:96px}
  .pc-logo i{position:absolute;width:44px;height:44px;border-radius:12px;display:block;animation:pc-tile .7s cubic-bezier(.2,.9,.3,1.2) both}
  .pc-logo i.a{left:0;top:0;background:#D6402A;--dx:-120px;--dy:-120px;animation-delay:.05s}
  .pc-logo i.b{right:0;top:0;background:#F5CE3E;--dx:120px;--dy:-120px;animation-delay:.15s}
  .pc-logo i.c{left:0;bottom:0;background:#2158C4;--dx:-120px;--dy:120px;animation-delay:.25s}
  .pc-logo i.d{right:0;bottom:0;background:#127A4E;--dx:120px;--dy:120px;animation-delay:.35s}
  .pc-head{margin-top:22px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);animation:pc-up .5s ease .55s both}
  .pc-title{margin:6px 0 0;font-size:30px;font-weight:700;letter-spacing:-.02em;animation:pc-up .5s ease .65s both}
  .pc-text{margin:12px 0 0;max-width:320px;font-size:15px;line-height:1.5;color:var(--ink-2);animation:pc-up .5s ease .8s both}
  .pc-check{margin-top:18px;width:34px;height:34px;border-radius:50%;background:var(--cash);display:grid;place-items:center;animation:pc-tile .5s cubic-bezier(.2,.9,.3,1.2) .95s both;--dx:0;--dy:24px}
  .pc-check svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pc-fade{from{opacity:0}to{opacity:1}}
  @keyframes pc-out{from{opacity:1}to{opacity:0}}
  @keyframes pc-tile{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4) rotate(-20deg)}to{opacity:1;transform:none}}
  @keyframes pc-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.procele,.procele.out,.pc-logo i,.pc-head,.pc-title,.pc-text,.pc-check{animation:none}}

  /* ---------- úvodní obrazovka ---------- */
  .ob{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;overflow-y:auto}
  .ob-in{width:100%;max-width:430px;margin:0 auto;padding:calc(var(--safe-t) + 34px) 24px calc(var(--safe-b) + 24px);display:flex;flex-direction:column;flex:1}
  .ob-mark{display:flex;gap:7px;margin-bottom:18px}
  .ob-mark i{width:30px;height:30px;border-radius:9px;display:block}
  .ob h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.02em;font-weight:700}
  .ob .tag{margin:6px 0 0;font-size:15px;color:var(--ink-2);font-weight:600}
  .ob .intro{margin:14px 0 0;font-size:14px;color:var(--ink-2);line-height:1.5}
  .ob h3{margin:26px 0 8px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .ob-langs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .ob-langs button{padding:10px 4px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:13px;font-weight:600}
  .ob-langs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ob-curs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;max-height:132px;overflow-y:auto;padding-bottom:2px}
  .ob-curs button{padding:10px 2px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-2)}
  .ob-curs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ob-how{display:flex;flex-direction:column;gap:14px;margin-top:4px}
  .ob-row{display:flex;gap:13px;align-items:flex-start}
  .ob-row i{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
  .ob-row i svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ob-row p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-2);padding-top:8px}
  .ob-spacer{flex:1;min-height:22px}
  .ob .btn-done{margin-top:10px}
  .ob .btn-ghost{margin-top:8px}

  /* ---------- fronta objednávek ---------- */
  .tickets{display:flex;flex-direction:column;gap:10px;padding:14px 16px 20px}
  .tk{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 14px;background:var(--surface);border:1px solid var(--rule);
    border-bottom-width:2px;border-radius:var(--r-tile);
  }
  .tk:active{transform:scale(.99);background:var(--sunk)}
  .tk.ready{border-color:var(--cash);background:#F2F8F5}
  .tk .no{
    flex:0 0 auto;min-width:46px;height:46px;padding:0 8px;display:grid;place-items:center;
    border-radius:10px;background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:19px;font-weight:700;
  }
  .tk.ready .no{background:var(--cash)}
  .tk .mid{flex:1;min-width:0}
  .tk .chips{display:flex;flex-wrap:wrap;gap:5px}
  .tk .time{margin-top:5px;font-size:12px;color:var(--ink-3)}
  .tk .prog{flex:0 0 auto;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink-2)}

  .chip{
    display:inline-flex;align-items:center;gap:4px;max-width:100%;
    padding:3px 8px;border-radius:999px;border:1px solid rgba(0,0,0,.12);
    background:var(--sunk);color:var(--ink);
    font-size:12px;font-weight:700;line-height:1.3;
  }
  .chip .q{font-family:var(--mono);opacity:.75}
  .chip.done{opacity:.4;text-decoration:line-through}

  /* položky v otevřené objednávce */
  .steps{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .st{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:13px 14px;border-radius:var(--r-tile);border:1px solid rgba(0,0,0,.14);
    font-size:16px;font-weight:700;
  }
  .st:active{filter:brightness(.92)}
  .st .nm{flex:1;min-width:0}
  .st .cnt{font-family:var(--mono);font-size:15px;opacity:.8}
  .st .box{
    flex:0 0 auto;width:26px;height:26px;border-radius:7px;
    border:2px solid currentColor;display:grid;place-items:center;
  }
  .st .box svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .st.done{opacity:.55}
  .st.done .box svg{opacity:1}
  .st.done .nm{text-decoration:line-through}

  .served{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule)}
  .served .row{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;text-align:left}
  .served .row:active{opacity:.6}
  .served .drop{background:none;border:0}
  .served .no{font-family:var(--mono);font-weight:700;color:var(--ink-3);min-width:34px;flex:0 0 auto}
  .served .w{flex:1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .served .back{font-size:12px;font-weight:600;color:var(--accent);flex:0 0 auto}
  .served .drop{flex:0 0 auto;color:var(--ink-3);font-size:19px;line-height:1;padding:6px 2px 6px 10px}

  /* ---------- výběr barvy a přepínač režimu ---------- */
  .sw{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.18)}

  // Zbylé jazyky doplní překladová dávka; do té doby vše spadne na angličtinu.

  // mluví stejným jazykem: angličtina v Británii dává 23/09/2026, ne 9/23.
  var locCache = {};
  function langInfo() {
    var base = LANGS[2];
    for (var i = 0; i < LANGS.length; i++) { if (LANGS[i].k === state.lang) { base = LANGS[i]; break; } }
    if (locCache[base.k] === undefined) {
      var loc = base.loc;
      try {
        var dev = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]);
        for (var j = 0; j < dev.length; j++) {
          var tag = String(dev[j] || "");
          if (tag.split("-")[0].toLowerCase() === base.k && /-[A-Za-z]{2}$/.test(tag) &&
              Intl.DateTimeFormat.supportedLocalesOf([tag]).length) { loc = tag; break; }
        }
      } catch (e) {}
      locCache[base.k] = loc;
    }
    return { k: base.k, n: base.n, loc: locCache[base.k] };
  }

  function detectLang() {
    var cand = [];
    try { cand = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"]; } catch (e) {}
    for (var i = 0; i < cand.length; i++) {
      var two = String(cand[i] || "").slice(0, 2).toLowerCase();
      if (I18N[two] || isLang(two)) { return two; }
    }
    return "en";
  }

  function isLang(k) {
    for (var i = 0; i < LANGS.length; i++) { if (LANGS[i].k === k) { return true; } }
    return false;
  }

  function T(key, a, b) {
    var lang = state && state.lang ? state.lang : "cs";
    var v = (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key]
          : (I18N.en[key] !== undefined ? I18N.en[key] : I18N.cs[key]);
    if (v === undefined) { return key; }
    if (typeof v === "string") {
      if (a !== undefined) { v = v.split("{0}").join(String(a)); }
      if (b !== undefined) { v = v.split("{1}").join(String(b)); }
    }
    return v;
  }

  // množné číslo: čeština/slovenština/polština mají tři tvary, zbytek dva
  function pluralIx(n) {
    var lang = state && state.lang ? state.lang : "cs";
    n = Math.abs(n);
    if (lang === "cs" || lang === "sk") { return n === 1 ? 0 : (n >= 2 && n <= 4 ? 1 : 2); }
    if (lang === "pl") {
      if (n === 1) { return 0; }

      return (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? 1 : 2;
    }
    if (lang === "fr") { return n <= 1 ? 0 : 2; }   // „0 vente“

  //   1. localStorage, okamžitý zápis při každé změně
  //   2. IndexedDB, přežije i to, když prohlížeč localStorage zahodí
  //   3. soubor v úložišti zařízení, když appka běží v nativním obalu (ios/)

  var DB_NAME = "kavakasa", DB_STORE = "state", DB_KEY = "current";
  var db = null, dbSettled = false, dbTimer = null;

  // own = data z úložiště tohoto zařízení. Jen jim patří licence a denní
  // počítadlo; z vložené zálohy se nepřebírají, jinak by stačilo zálohu
  // upravit a mít Pro nebo vynulovaný limit.
  function parseState(raw, own) {
    if (!raw) { return null; }
    var d;
    try { d = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { return null; }
    if (!d || !Array.isArray(d.items)) { return null; }
    d.items = d.items.filter(isObj);
    d.order = Array.isArray(d.order) ? d.order.filter(isObj) : [];
    d.sales = Array.isArray(d.sales) ? d.sales.filter(isObj) : [];
    d.archives = Array.isArray(d.archives) ? d.archives.filter(isObj) : [];
    d.evId = typeof d.evId === "string" && d.evId ? d.evId : uid();
    // id smazaných a vrácených účtenek, ať je protějšek, který smazání
    // nezachytil, nevrátí zpátky do tržby
    d.gone = Array.isArray(d.gone) ? d.gone.filter(function (x) { return typeof x === "string"; }).slice(-500) : [];
    var evSeen = {};
    evSeen[d.evId] = true;
    d.parked = Array.isArray(d.parked) ? d.parked.filter(isObj) : [];
    d.parked.forEach(function (pk) {
      if (typeof pk.id !== "string" || !pk.id || evSeen[pk.id]) { pk.id = uid(); }
      evSeen[pk.id] = true;
      pk.event = typeof pk.event === "string" ? pk.event : "";
      pk.items = Array.isArray(pk.items) ? pk.items.filter(isObj) : [];
      pk.sales = Array.isArray(pk.sales) ? pk.sales.filter(isObj) : [];
      normItems(pk.items);
      var pkMax = normSales(pk.sales, pk.id);
      pk.nextNo = typeof pk.nextNo === "number" && pk.nextNo > pkMax ? pk.nextNo : pkMax + 1;
    });
    // starší archivy vznikaly bez identifikátoru, bez něj by je nešlo smazat
    d.archives.forEach(function (a) { if (!a.id) { a.id = uid(); } });
    d.event = typeof d.event === "string" ? d.event : "";
    d.savedAt = typeof d.savedAt === "number" ? d.savedAt : 0;
    d.mode = d.mode === "vydej" ? "vydej" : "kasa";
    d.voice = d.voice !== false;
    d.pair = typeof d.pair === "string" ? d.pair : "";
    d.lang = isLang(d.lang) ? d.lang : "cs";
    d.currency = typeof d.currency === "string" && d.currency ? d.currency : "CZK";
    // Kdo už má data, tomu se úvod nezobrazuje. Výslovné setup:false (úvod
    // zavřený před dokončením) ale platí dál, jinak se volba jazyka a měny
    // už nikdy neukázala a zůstalo prázdné menu bez názvu akce.
    d.setup = d.setup !== false || d.items.length > 0 || d.sales.length > 0 || d.archives.length > 0 || !!d.pair;
    d.payDay = typeof d.payDay === "string" ? d.payDay : "";
    d.payN = typeof d.payN === "number" ? d.payN : 0;
    d.biz = typeof d.biz === "string" ? d.biz : "";
    d.vat = d.vat === true;   // starší instalace DPH neřešily, zůstanou vypnuté
    d.customVat = typeof d.customVat === "string" ? d.customVat : "";
    // počítadlo uzavřených akcí pro žádost o hodnocení; starší instalace
    // dostanou započtené akce, které už v archivu mají
    d.rateN = typeof d.rateN === "number" ? d.rateN : d.archives.length;
    d.rateAsked = typeof d.rateAsked === "number" ? d.rateAsked : 0;
    // průvodce je pro nové: kdo už má prodeje nebo párování, obtěžovat nebudeme
    d.tourDone = d.tourDone === true || d.sales.length > 0 || d.archives.length > 0 || !!d.pair ||
                 d.parked.some(function (pk) { return pk.sales.length > 0; });
    // Dřív se údaje prodejce psaly volným textem. Aby se nikomu neztratily,
    // přesuneme je do poznámky; strukturovaná pole si doplní sám.
    if (!d.seller || typeof d.seller !== "object") { d.seller = {}; }
    if (!SELLER_FIELDS.some(function (k) { return d.seller[k]; }) && d.biz && !d.seller.note) {
      d.seller.note = d.biz;
      d.biz = "";
    }
    if (typeof d.license !== "string") {
      // instalace z doby před tarify jedou dál bez omezení, nikomu nebereme,
      // co už používal (párování, neomezené účtování)
      d.license = (own && (d.sales.length || d.archives.length || d.pair)) ? "pro-legacy" : "";
    }

    normItems(d.items);

    // účtenky z verze bez fronty doplníme, ať mají číslo, stav a akci
    // Výdej drží frontu cizí kasy: účtenkám bez akce nepřidělujeme id jeho
    // vlastní akce, jinak by je uzávěrka kasy už nikdy nesmazala.
    var maxNo = normSales(d.sales, d.mode === "vydej" ? "" : d.evId);
    d.nextNo = typeof d.nextNo === "number" && d.nextNo > maxNo ? d.nextNo : maxNo + 1;
    return d;
  }

  function isEmpty(d) {
    return !d || (!d.sales.length && !d.archives.length && !d.order.length &&
                  !d.parked.some(function (pk) { return pk.sales.length > 0; }));
  }

  // Vyhrává nejnovější kopie (savedAt). Na iOS nese __KASA_BOOT__ stav
  // z chvíle spuštění aplikace: když systém na pozadí ukončí obsah WebView
  // a stránka se znovu načte, byl by to stav ráno a první uložení by jím
  // přepsalo celý den prodeje. localStorage i nativní soubor se ukládají
  // při každé změně, takže novější z nich je vždy ten správný.
  function load() {
    var best = null;
    function consider(d) { if (d && (!best || (d.savedAt || 0) > (best.savedAt || 0))) { best = d; } }
    if (typeof window.__KASA_BOOT__ === "string" && window.__KASA_BOOT__) {
      consider(parseState(window.__KASA_BOOT__, true));
    }
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    consider(parseState(raw, true));
    return best || fresh();
  }

  // Po výměně celého stavu (záloha, obnova z IndexedDB, jiná karta):
  // formát částek, jazyk stránky, ohlášené objednávky a párování na nový kód.
  function afterReplace(prevPair) {
    moneyFmt = null; nfPlain = null;
    rebuildMoneyFmt();
    state.sales.forEach(function (s) { announced[s.id] = true; });
    if (prevPair === undefined || prevPair !== state.pair) {
      relayOpen();
      nativeLink();
    }
  }

  function save() {
    state.savedAt = Date.now();
    var json;
    try { json = JSON.stringify(state); } catch (e) { return; }

    try { localStorage.setItem(KEY, json); } catch (e) {}

    try {
      if (typeof window.__kasaSave === "function") {
        window.__kasaSave(json);
      } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kasa) {
        window.webkit.messageHandlers.kasa.postMessage(json);
      }
    } catch (e) {}

    if (!dbSettled) { return; }
    if (dbTimer) { clearTimeout(dbTimer); }
    dbTimer = setTimeout(function () { dbWrite(json); }, 300);
  }

  function dbWrite(json) {
    if (!db) { return; }
    try { db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).put(json, DB_KEY); } catch (e) {}
  }

  function dbRead(cb) {
    if (!db) { cb(null); return; }
    try {
      var rq = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(DB_KEY);
      rq.onsuccess = function () { cb(rq.result || null); };
      rq.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }

  function dbInit(done) {
    var called = false;
    function settle() { if (!called) { called = true; done(); } }
    setTimeout(settle, 3000);
    var rq;
    try { rq = indexedDB.open(DB_NAME, 1); } catch (e) { settle(); return; }
    rq.onupgradeneeded = function () {
      try { rq.result.createObjectStore(DB_STORE); } catch (e) {}
    };
    rq.onsuccess = function () { db = rq.result; settle(); };
    rq.onerror = function () { settle(); };
    rq.onblocked = function () { settle(); };
  }

  // ---------- helpers ----------

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }


  function clock(ts) {
    var d = new Date(ts);
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function orderTotal() {
    return state.order.reduce(function (s, l) { return s + l.price * l.qty; }, 0);
  }
  function orderCount() {
    return state.order.reduce(function (s, l) { return s + l.qty; }, 0);
  }
  function salesTotal() {
    return state.sales.reduce(function (s, t) { return s + t.total; }, 0);
  }

  function say(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function findItem(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) { return state.items[i]; }
    }
    return null;
  }

  function refFor(name, price) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].name === name && state.items[i].price === price) { return state.items[i].id; }
    }
    return uid();
  }

  // ---------- order ----------

  function addToOrder(item) {
    var line = null;
    for (var i = 0; i < state.order.length; i++) {
      if (state.order[i].ref === item.id && state.order[i].price === item.price) { line = state.order[i]; break; }
    }
    if (line) { line.qty += 1; }
    else {
      // sazbu si řádek nese s sebou, ať pozdější úprava položky nepřepíše
      // už rozúčtovaný doklad
      state.order.push({ ref: item.id, name: item.name, price: item.price, qty: 1,
                         color: item.color, vat: vatStr(item.vat) });
    }
    save();
    render();
    say(item.name + " · " + czk(orderTotal()));
  }

  function bump(idx, delta) {
    var line = state.order[idx];
    if (!line) { return; }
    line.qty += delta;
    if (line.qty <= 0) { state.order.splice(idx, 1); }
    if (!state.order.length) { linesOpen = false; }
    save();
    render();
  }

  // ---------- sale ----------

  function commit() {
    if (!isPro() && paymentsToday() >= FREE_LIMIT) {
      sheet = { step: "paywall", reason: "limit" };
      render(); return;
    }
    countPayment();
    var sale = {
      id: uid(),
      no: state.nextNo++,
      ts: Date.now(),
      updatedAt: Date.now(),
      method: sheet.method,
      total: sheet.total,
      status: "open",
      ev: state.evId,
      lines: state.order.map(function (l) {
        return { name: l.name, price: l.price, qty: l.qty, color: l.color || "", vat: vatStr(l.vat), ready: 0 };
      })
    };
    state.sales.push(sale);
    state.order = [];
    linesOpen = false;
    sheet = null;
    save();
    pushOrder(sale, true);
    render();
    if (state.mode === "kasa" && state.voice) { sayThanks(); }
    showToast(T("toastSaved", czk(sale.total), sale.method === "cash" ? T("cashLower") : T("cardLower")), sale.id);
    say(T("toastSaved", czk(sale.total), ""));
  }

  function undoSale(id) {
    // Rozpracovaný účet dalšího zákazníka ani otevřené placení se nesmí
    // tiše přepsat vráceným účtem.
    if (state.order.length || sheet) { showToast(T("basketBusy")); return; }
    var i = state.sales.length - 1;
    while (i >= 0 && state.sales[i].id !== id) { i--; }
    if (i < 0) { return; }
    var sale = state.sales.splice(i, 1)[0];
    state.order = sale.lines.map(function (l) {
      return { ref: refFor(l.name, l.price), name: l.name, price: l.price, qty: l.qty,
               color: l.color || "", vat: vatStr(l.vat) };
    });
    // opravený prodej nesmí spotřebovat druhou z bezplatných plateb dne
    if (state.payDay === todayKey() && state.payN > 0 && sale.ts >= new Date().setHours(0, 0, 0, 0)) { state.payN -= 1; }
    if (sale.no === state.nextNo - 1) { state.nextNo = sale.no; }
    hideToast();
    save();
    pushDelete([sale.id]);
    render();
    say(T("undoBtn"));
  }

  function showToast(text, undoId) {
    toast = { text: text, undo: undoId || null };
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { hideToast(); render(); }, 7000);
    render();
  }

  function hideToast() {
    toast = null;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  }

  function ask(title, text, okLabel, fn) {
    pending = fn;
    sheet = { step: "confirm", title: title, text: text, ok: okLabel };
    render();
  }

  // ---------- fronta objednávek ----------
  // Zaplacený účet nezmizí, zařadí se do fronty jako objednávka s číslem.
  // Kdo připravuje, odškrtává v ní položky a nakonec dá Vydáno.

  // Kasa ukazuje nevydané objednávky ze všech otevřených akcí: po přepnutí
  // na jinou akci by jinak z fronty zmizely a nikdo by je nevydal.
  function openOrders() {
    var all = [];
    if (state.mode === "kasa" && state.parked && state.parked.length) {
      eachOpenEvent(function (ev) { all = all.concat(ev.sales); });
    } else {
      all = state.sales;
    }
    return all.filter(function (s) { return s.status === "open"; })
      .sort(function (a, b) { return (a.ts || 0) - (b.ts || 0) || a.no - b.no; });
  }

  function evNameOf(id) {
    if (!id || id === state.evId) { return state.event || T("noName"); }
    var pk = parkedById(id);
    return pk ? (pk.event || T("noName")) : "";
  }

  function servedOrders() {
    return state.sales.filter(function (s) { return s.status !== "open"; })
      .sort(function (a, b) { return b.no - a.no; });
  }

  function findSale(id) {
    var at = locateSale(id);
    return at ? at.sale : null;
  }

  function pieces(s) {
    return s.lines.reduce(function (n, l) { return n + l.qty; }, 0);
  }

  function ready(s) {
    return s.lines.reduce(function (n, l) { return n + Math.min(l.ready || 0, l.qty); }, 0);
  }

  function allReady(s) { return ready(s) >= pieces(s); }

  function tint(key, fallback) {
    var c = colorOf(key);
    if (!c) { return fallback || ""; }
    return ' style="background:' + c.bg + ";color:" + c.ink + ";--bg:" + c.bg + ";--ink:" + c.ink + '"';
  }

  // ---------- spárované zařízení ----------
  // Kasa a výdej si posílají celý seznam objednávek. Slučuje se podle id,
  // vyhrává novější updatedAt, pořadí zpráv tak nehraje roli.

  var peers = 0;        // co ukazuje aplikace (nativni spojeni, nebo preposilac)
  var nativePeers = 0;  // kolik zarizeni drzi nativni spojeni (Wi-Fi/Bluetooth, bez internetu)
  var muted = false;
  var announced = {};      // id objednávek, které už zazněly

  // Nová objednávka se na výdeji přečte nahlas, ať se obsluha nemusí dívat.
  // iOS pustí hlas až po nějakém klepnutí, o to se stará tlačítko v Menu.
  function speak(text) {
    try {
      // nativní hlas (Android), jinak webová syntéza
      if (typeof window.__kasaSpeak === "function") {
        window.__kasaSpeak(text, langInfo().loc);
        return;
      }
      if (!window.speechSynthesis) { return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = langInfo().loc;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // Na kase zazní poděkování zákazníkovi, jakmile je účet hotový.
  // Záměrně jen samotná věta, bez názvu akce: u stánku se jméno akce
  // opakovalo u každého účtu a znělo to samoúčelně.
  function sayThanks() {
    speak(T("speakThanks"));
  }

  function saySale(s) {
    var parts = [T("speakNewOrder", s.no)];
    s.lines.forEach(function (l) {
      parts.push(l.qty > 1 ? T("speakTimes", l.qty, l.name) : l.name + ".");
    });
    speak(parts.join(" "));
  }

  // Nativní hledání protějšku smí běžet jen v rámci našeho kódu spárování.
  // Voláme při startu a po každé změně kódu; prázdný kód spojení vypne.
  function nativeLink() {
    try {
      if (typeof window.__kasaPeerLink === "function") { window.__kasaPeerLink(state.pair || ""); }
    } catch (e) {}
  }

  // Most se načítá až za touhle stránkou, takže při startu ještě nemusí být
  // po ruce. Necháme mu proto způsob, jak si kód vyzvednout sám.
  window.__kasaRoom = function () { return (state && state.pair) || ""; };

  // Zprávy odeslané, když není žádný nativní protějšek (zamčený iPad,
  // vypnutý Bluetooth), se dřív ztratily: smazání, uzávěrka i „Vydáno“.
  // Počkají tady a odejdou v pořadí, jakmile se zařízení znovu spojí.
  var nativeOutbox = [];
  var nativeKnown = false;   // přišel už počet spojení z nativní vrstvy?

  function nativeRaw(json) {
    // Most (mobile/bridge.js) dává přímý hook; objekt WebKitu je jen záloha
    // pro původní obal, kde hook neexistuje.
    if (typeof window.__kasaPeerSend === "function") { window.__kasaPeerSend(json); return; }
    if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.peer) { return; }
    window.webkit.messageHandlers.peer.postMessage(json);
  }

  function nativeSend(msg) {
    try {
      if (!state.pair) { return; }
      msg.src = myId;
      msg.room = state.pair;
      var json = JSON.stringify(msg);
      if (nativeKnown && nativePeers === 0 && peerLinkApp() && msg.t !== "setupReq" && msg.t !== "setup") {
        nativeOutbox.push({ room: state.pair, json: json });
        if (nativeOutbox.length > 80) { nativeOutbox.shift(); }
        return;
      }
      nativeRaw(json);
    } catch (e) {}
  }

  function flushNativeOutbox() {
    var list = nativeOutbox; nativeOutbox = [];
    list.forEach(function (m) {
      if (m.room === state.pair) { try { nativeRaw(m.json); } catch (e) {} }
    });
  }

  // Posílá se vždycky jen ta jedna změněná objednávka, ne celý seznam -
  // jinak zprávy přerostou limit přeposílače a přestanou chodit úplně.
  var pendingOrders = {}, pendTimer = null;

  // Odškrtávání jde rychle po sobě; kdyby každé ťuknutí letělo zvlášť, brzy
  // by došel denní limit přeposílače. Proto se změny na chvíli posbírají.
  function pushOrder(sale, now) {
    if (muted) { return; }
    pendingOrders[sale.id] = sale;
    if (now) { flushOrders(); return; }
    if (pendTimer) { return; }
    pendTimer = setTimeout(flushOrders, 1200);
  }

  function flushOrders() {
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    var list = [];
    Object.keys(pendingOrders).forEach(function (k) {
      if (findSale(k)) { list.push(pendingOrders[k]); }
    });
    pendingOrders = {};
    if (!list.length) { return; }
    sendSales(list, state.evId, state.event);
  }

  function markGone(ids) {
    var have = state.gone || [];
    state.gone = have.concat(ids.filter(function (x) {
      return typeof x === "string" && have.indexOf(x) < 0;
    })).slice(-500);
  }

  function pushDelete(ids) {
    markGone(ids);
    if (muted) { return; }
    save();   // záznam o smazání musí přežít restart, volající ukládal dřív
    flushOrders();
    nativeSend({ t: "del", ids: ids });
    relayDeleted(ids);
  }

  // Uzávěrka smaže na protějšku jen účtenky této akce. Starší verze
  // aplikace id akce neznají a smažou vše jako dřív.
  function pushClear(evId) {
    if (muted) { return; }
    pendingOrders = {};
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    var at = Date.now();
    var m = { t: "clear", role: state.mode, at: at };
    if (evId) { m.ev = evId; }
    nativeSend(m);
    relayCleared(evId, at);
  }

  // Účtenky jedné akce ven: nativně i přes přeposílač, obojí po dávkách.
  // Nearby na Androidu větší zprávu odmítne a zůstane po ní jen řádek
  // v diagnostice, proto i nativní cesta dělí seznam.
  var NATIVE_MAX = 24000;
  function sendSales(list, evId, name) {
    var batch = [], size = 0;
    list.forEach(function (sl) {
      var one = slim(sl);
      var len = JSON.stringify(one).length;
      if (batch.length && size + len > NATIVE_MAX) {
        nativeSend({ t: "sync", event: name, ev: evId, sales: batch });
        batch = []; size = 0;
      }
      batch.push(one); size += len;
    });
    if (batch.length) { nativeSend({ t: "sync", event: name, ev: evId, sales: batch }); }
    relaySales(list, evId, name);
  }

  // ---------- převzetí menu a údajů z druhého zařízení ----------
  // Kopie nastavení (položky, ceny, barvy, DPH, měna, údaje prodejce, název
  // akce) se posílá jen na vyžádání a použije se jen krátce po vlastní
  // žádosti, ať nikdo cizí na stejném kódu nepřepíše menu. Přeposílač má
  // limit na velikost zprávy, položky proto jdou po částech; nativní cesta
  // pošle vše najednou. Části se slučují podle id, duplicity z druhého
  // přeposílače tedy nevadí.
  var setupWanted = 0, setupParts = null;
  var SETUP_WAIT_MS = 90000;

  function setupPayload() {
    return {
      items: state.items.map(function (it) {
        var o = { id: it.id, name: it.name, price: it.price, color: it.color || "" };
        if (it.vat !== undefined) { o.vat = it.vat; }
        return o;
      }),
      seller: state.seller || {}, currency: state.currency, vat: state.vat === true, event: state.event || ""
    };
  }

  function requestSetup() {
    setupWanted = Date.now(); setupParts = null;
    nativeSend({ t: "setupReq" });
    relayPost({ t: "setupReq" });
    showToast(T("setupImportWait"));
  }

  function sendSetup() {
    var p = setupPayload();
    nativeSend({ t: "setup", seq: 0, last: true, full: true, seller: p.seller, currency: p.currency, vat: p.vat, event: p.event, items: p.items });
    var chunks = [], cur = [], size = 0;
    p.items.forEach(function (it) {
      var len = JSON.stringify(it).length;
      if (cur.length && size + len > MAX_BYTES - 700) { chunks.push(cur); cur = []; size = 0; }
      cur.push(it); size += len;
    });
    chunks.push(cur);
    chunks.forEach(function (c, i) {
      var m = { t: "setup", seq: i, n: chunks.length, last: i === chunks.length - 1, items: c };
      if (i === 0) { m.seller = p.seller; m.currency = p.currency; m.vat = p.vat; m.event = p.event; }
      relayPost(m);
    });
  }

  function takeSetup(msg) {
    if (!setupWanted || Date.now() - setupWanted > SETUP_WAIT_MS) { return; }
    if (!setupParts) { setupParts = { items: [], ids: {}, seqs: {}, n: 0, head: false, seller: null, currency: "", vat: false, event: "" }; }
    // úplná kopie z nativního spojení platí sama o sobě, bez ohledu na části
    if (msg.full) { setupParts = { items: [], ids: {}, seqs: {}, n: 1, head: true, seller: null, currency: "", vat: false, event: "" }; }
    var seq = typeof msg.seq === "number" ? msg.seq : 0;
    if (!msg.full && setupParts.seqs[seq]) { return; }          // stejná část z druhého přeposílače
    setupParts.seqs[seq] = true;
    if (typeof msg.n === "number" && msg.n > 0) { setupParts.n = msg.n; }
    if (seq === 0) { setupParts.head = true; }
    if (msg.seller && typeof msg.seller === "object") { setupParts.seller = msg.seller; }
    if (typeof msg.currency === "string") { setupParts.currency = msg.currency; }
    if (typeof msg.vat === "boolean") { setupParts.vat = msg.vat; }
    if (typeof msg.event === "string") { setupParts.event = msg.event; }
    (Array.isArray(msg.items) ? msg.items : []).forEach(function (it) {
      if (!it || typeof it.name !== "string" || typeof it.price !== "number") { return; }
      var id = typeof it.id === "string" && it.id ? it.id : uid();
      if (setupParts.ids[id]) { return; }
      setupParts.ids[id] = true;
      var o = { id: id, name: it.name, price: it.price, color: typeof it.color === "string" ? it.color : "" };
      if (it.vat !== undefined) { o.vat = it.vat; }
      setupParts.items.push(o);
    });
    // Použít až úplné menu: části přes přeposílač chodí v libovolném
    // pořadí a některá se může ztratit. Starší verze počet neposílají,
    // tam platí dřívější „poslední část“.
    if (setupParts.n) {
      if (Object.keys(setupParts.seqs).length < setupParts.n) { return; }
    } else if (!msg.last) { return; }
    if (!setupParts.head) { return; }
    var got = setupParts; setupParts = null; setupWanted = 0;
    if (!got.items.length && !got.seller) { return; }
    if (got.items.length) { state.items = got.items; }
    if (got.seller) {
      var sel = {};
      SELLER_FIELDS.forEach(function (k) { if (typeof got.seller[k] === "string") { sel[k] = got.seller[k]; } });
      state.seller = sel;
    }
    if (got.currency && CURRENCIES.some(function (c) { return c.c === got.currency; })) { state.currency = got.currency; }
    state.vat = got.vat === true;
    if (got.event) { state.event = got.event; }
    muted = true; save(); muted = false;
    afterReplace(state.pair);
    render();
    showToast(T("setupImportDone"));
  }

  function pushEverything() {
    if (muted) { return; }
    pendingOrders = {};
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    eachOpenEvent(function (ev) {
      var open = ev.sales.filter(function (x) { return x.status === "open"; });
      if (open.length || ev.id === state.evId) { sendSales(open, ev.id, ev.event); }
    });
  }

  window.__kasaPeer = function (raw) {
    var msg = null;
    try { msg = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { return; }
    if (msg && (msg.t === "setupReq" || msg.t === "setup")) {
      if (!state.pair || (msg.room && msg.room !== state.pair)) { return; }
      lastIn = Date.now();
      if (msg.t === "setupReq") { sendSetup(); } else { takeSetup(msg); }
      return;
    }
    if (msg && msg.t === "drop" && Array.isArray(msg.ids)) {
      // jen výdej: zastaralé objednávky z fronty pryč, kasa nic nemaže
      if (state.mode !== "vydej" || !state.pair || (msg.room && msg.room !== state.pair)) { return; }
      var dropIds = msg.ids.filter(function (x) { return typeof x === "string"; });
      var kept0 = state.sales.filter(function (x) { return dropIds.indexOf(x.id) < 0; });
      if (kept0.length !== state.sales.length) {
        state.sales = kept0;
        muted = true; save(); muted = false; render();
      }
      return;
    }
    if (!msg || (!Array.isArray(msg.sales) && msg.t !== "del" && msg.t !== "clear")) { return; }
    // pojistka pro případ, že by se spojení navázalo mimo náš kód
    if (!state.pair || (msg.room && msg.room !== state.pair)) { return; }
    lastIn = Date.now();   // i nativní zpráva je „druhé zařízení se ozvalo"

    var changed = false;
    // Akce (aktivní a odložené), do kterých něco přibylo: srovnáme jim
    // pořadí a počítadlo čísel.
    var touched = {};
    var rejected = [];
    var msgEv = typeof msg.ev === "string" ? msg.ev : "";

    if (msg.t === "del" && Array.isArray(msg.ids)) {
      var delIds = msg.ids.filter(function (x) { return typeof x === "string"; });
      markGone(delIds);
      eachOpenEvent(function (ev) {
        var before = ev.sales.length;
        var kept = ev.sales.filter(function (x) { return delIds.indexOf(x.id) < 0; });
        if (kept.length !== before) { setEventSales(ev.id, kept); changed = true; }
      });
    } else if (msg.t === "clear") {
      // Kasa bere uzávěrku jen od jiné kasy. Dřív ji smazala i zpráva
      // z výdeje, třeba po obnovení zálohy, a kasa přišla o tržbu.
      if (state.mode === "kasa" && msg.role !== "kasa") { return; }
      // Uzávěrka se týká jen účtenek vzniklých před ní: akce po uzávěrce
      // pokračuje pod stejným id a pozdě doručená zpráva by jinak smazala
      // i dnešní objednávky. Starší verze čas neposílají, tam platí vše.
      var clearAt = typeof msg.at === "number" ? msg.at : Infinity;
      var older = function (x) { return (x.ts || 0) <= clearAt; };
      if (state.mode === "vydej") {
        // Výdej drží frontu ze všech akcí. Účtenky bez akce jsou z doby
        // před aktualizací a patřily k jediné akci kasy.
        var left = state.sales.filter(function (x) {
          return !(older(x) && (!msgEv || !x.ev || x.ev === msgEv));
        });
        changed = left.length !== state.sales.length;
        state.sales = left;
      } else {
        // druhá kasa: stejná akce, jinak (jiné id akce na každém zařízení)
        // ta, ve které se právě prodává, jako dřív
        var target = msgEv && parkedById(msgEv) ? msgEv : state.evId;
        eachOpenEvent(function (ev) {
          if (ev.id !== target) { return; }
          var keep = ev.sales.filter(function (x) { return !older(x); });
          if (keep.length !== ev.sales.length) {
            setEventSales(ev.id, keep);
            if (!keep.length) {
              if (ev.id === state.evId) { state.nextNo = 1; } else { var pk0 = parkedById(ev.id); if (pk0) { pk0.nextNo = 1; } }
            }
            changed = true;
          }
        });
      }
    } else if (Array.isArray(msg.sales)) {
      var goneSet = {};
      (state.gone || []).forEach(function (x) { goneSet[x] = true; });
      var archSet = null;
      msg.sales.forEach(function (raw) {
        var inc = cleanSale(raw);
        if (!inc) { return; }
        var at = locateSale(inc.id);
        if (at) {
          if ((inc.updatedAt || 0) > (at.sale.updatedAt || 0)) {
            mergeSale(at.sale, inc);
            touched[at.evId] = true;
            changed = true;
          }
          return;
        }
        // Smazanou nebo už uzavřenou účtenku zpátky nebereme a protějšku
        // řekneme, ať ji smaže taky (zmeškal smazání nebo uzávěrku).
        if (!archSet) {
          archSet = {};
          state.archives.forEach(function (a) {
            (Array.isArray(a.sales) ? a.sales : []).forEach(function (x) { if (x && x.id) { archSet[x.id] = true; } });
          });
        }
        if (goneSet[inc.id] || archSet[inc.id]) { rejected.push(inc.id); return; }
        // Nová účtenka. Výdej bere všechno do jedné fronty a pamatuje si
        // název akce, kasa ji zařadí do akce, ze které pochází.
        var target = typeof inc.ev === "string" && inc.ev ? inc.ev : msgEv;
        if (!inc.ev && target) { inc.ev = target; }
        if (state.mode === "vydej") {
          if (msg.event && (!msgEv || inc.ev === msgEv)) { inc.en = msg.event; }
          state.sales.push(inc);
          touched[state.evId] = true;
        } else {
          var pk = target && target !== state.evId ? parkedById(target) : null;
          if (pk) {
            pk.sales.push(inc);
            touched[pk.id] = true;
          } else {
            if (!inc.ev || inc.ev !== state.evId) { inc.ev = state.evId; }
            state.sales.push(inc);
            touched[state.evId] = true;
          }
        }
        changed = true;
      });
    }
    if (rejected.length) {
      // Protějšku řekneme, ať si je vyřadí z fronty, ale bez záznamu
      // o smazání: „del“ by po vrácení uzavřené akce zpět do kasy
      // odmazal její účtenky natrvalo.
      var rej = rejected.slice(0, 60);
      setTimeout(function () { nativeSend({ t: "drop", ids: rej }); relayPost({ t: "drop", ids: rej }); }, 0);
    }
    if (!changed) { return; }

    if (state.mode === "vydej" && state.voice) {
      state.sales.forEach(function (s) {
        if (s.status !== "open" || announced[s.id]) { return; }
        announced[s.id] = true;
        saySale(s);
      });
    }

    eachOpenEvent(function (ev) {
      if (!touched[ev.id]) { return; }
      var list = ev.sales.slice().sort(function (a, b) { return (a.no || 0) - (b.no || 0); });
      var maxNo = 0;
      list.forEach(function (s) { if (s.no > maxNo) { maxNo = s.no; } });
      setEventSales(ev.id, list, maxNo);
    });
    if (msg.event && state.mode === "vydej") { state.event = msg.event; }

    muted = true;              // příchozí změnu neposíláme hned zpátky
    save();
    muted = false;
    render();
  };

  // Párování přes internet: obě zařízení visí na stejném hotspotu, takže mají
  // i data. Posílají si změny přes veřejný přeposílač pod kódem, který funguje
  // jako adresa. Používá se, jen když si ho uživatel zapne.
  //
  // Přeposílač má dva tvrdé limity: jedna zpráva smí mít nejvýš 4 kB a je
  // strop na počet zpráv za den. Proto se posílá vždycky jen to, co se právě
  // změnilo, jedna objednávka na zprávu, a ne celý seznam. A když
  // přeposílač zprávu odmítne, řekne se to nahlas místo tichého ignorování.

  // Veřejné přeposílače mají denní limity a občas prostě odmítnou. Proto
  // jedeme přes dva naráz: posílá se na oba a poslouchá se na obou. Stačí,
  // aby v danou chvíli fungoval jeden. Zprávy jsou nezávislé na pořadí a
  // slučují se podle id, takže když dorazí dvakrát, nic se nestane.
  var RELAYS = (typeof window.__KASA_RELAY__ === "string" && window.__KASA_RELAY__)
    ? window.__KASA_RELAY__.split(",")
    : ["https://ntfy.sh/", "https://ntfy.envs.net/"];

  var MAX_BYTES = 3500;
  // Id zařízení musí přežít restart: přeposílač po startu přehraje zprávy
  // za posledních 5 minut a vlastní starý „clear“ by jinak smazal účtenky.
  var runId = Math.random().toString(36).slice(2, 10);
  var bootAt = Date.now();
  // posledních pár spuštění tohoto zařízení: jejich zprávy jsou naše
  var myRuns = (function () {
    var list = [];
    try { list = JSON.parse(localStorage.getItem("kavakasa.runs") || "[]"); } catch (e) { list = []; }
    if (!Array.isArray(list)) { list = []; }
    list = list.filter(function (x) { return typeof x === "string"; }).concat([runId]).slice(-30);
    try { localStorage.setItem("kavakasa.runs", JSON.stringify(list)); } catch (e) {}
    return list;
  })();
  var myId = (function () {
    var id = "";
    try { id = localStorage.getItem("kavakasa.src") || ""; } catch (e) {}
    if (!/^[a-z0-9]{6,16}$/.test(id)) {
      id = Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem("kavakasa.src", id); } catch (e) {}
    }
    return id;
  })();
  var links = [];
  var seen = {}, relayError = "", lastIn = 0, lastOut = 0, sentOpen = false;
  var pingAt = 0, testResult = "";

  function relayTopic() { return state.pair ? "kasa-stanek-" + state.pair : ""; }

  function anySse() {
    for (var i = 0; i < links.length; i++) { if (links[i].sseUp) { return true; } }
    return false;
  }

  // Zelená tečka nesmí svítit jen proto, že se povedl dotaz, to by lhalo.
  // Svítí, až když drží stálé spojení nebo když od protějšku něco přišlo.
  function refreshLink() {
    setPeers(nativePeers > 0 || anySse() || lastIn ? 1 : 0);
  }

  function setPeers(n) {
    if (peers === n) { return; }
    peers = n;
    render();
  }

  function setRelayError(text) {
    if (relayError === text) { return; }
    relayError = text;
    render();
  }

  // z objednávky posíláme jen to, co druhá strana potřebuje pro frontu
  // Sazba DPH řádku a akce musí cestovat s účtenkou: kasa jinak po
  // odškrtnutí na výdeji dostala zpátky účtenku bez sazeb a doklad pak
  // sazbu hádal podle aktuálního menu.
  function slim(s) {
    var o = {
      id: s.id, no: s.no, ts: s.ts, total: s.total, method: s.method,
      status: s.status, updatedAt: s.updatedAt,
      lines: s.lines.map(function (l) {
        var ln = { name: l.name, price: l.price, qty: l.qty, ready: l.ready || 0, color: l.color || "" };
        if (l.vat) { ln.vat = l.vat; }
        return ln;
      })
    };
    if (s.ev) { o.ev = s.ev; }
    if (s.servedAt) { o.servedAt = s.servedAt; }
    return o;
  }

  // Pošle na všechny přeposílače. Chybu hlásíme, teprve když selžou všechny.
  function relayPost(msg, done) {
    var topic = relayTopic();
    if (!topic || !window.fetch || !links.length) { return; }
    msg.src = myId;
    msg.run = runId;
    var body;
    try { body = JSON.stringify(msg); } catch (e) { return; }

    var left = links.length, ok = false, worst = 0;
    links.forEach(function (link) {
      fetch(link.base + topic, { method: "POST", body: body }).then(function (r) {
        if (r.ok) { ok = true; } else if (r.status > worst) { worst = r.status; }
      }, function () {}).then(function () {
        if (--left) { return; }
        if (ok) {
          lastOut = Date.now();
          setRelayError("");
          flushOutbox();
        } else {
          // Nedoručenou zprávu si necháme a pošleme ji znovu po nejbližším
          // úspěchu nebo obnovení spojení; jinak objednávka z výpadku sítě
          // na výdej nikdy nedorazila.
          if (msg.t !== "hi" && msg.t !== "ping") { queueOutbox(msg); }
          // Chybu skryjeme, jen když zprávy nese živé nativní spojení. Samotná
          // možnost nativního párování nestačí: iPhone s Androidem se bez
          // přeposílače nespojí a obsluha by o výpadku nevěděla.
          setRelayError(nativePeers > 0 ? ""
            : worst === 429 ? T("relayLimit")
            : worst ? T("relayRefused", worst)
            : T("relayOffline"));
        }
        if (done) { done(ok, worst); }
      });
    });
  }

  var outbox = [], outboxBusy = false;
  function queueOutbox(msg) {
    var copy = {};
    Object.keys(msg).forEach(function (k) { if (k !== "src") { copy[k] = msg[k]; } });
    // uzávěrku ani smazání neopakujeme: dorazily by po novějších objednávkách
    // a smazaly by je (akce po uzávěrce jede dál pod stejným id)
    if (copy.t === "clear") { return; }
    outbox.push({ topic: relayTopic(), msg: copy });
    if (outbox.length > 60) { outbox.shift(); }
  }
  function flushOutbox() {
    if (outboxBusy || !outbox.length) { return; }
    outboxBusy = true;
    var list = outbox; outbox = [];
    var topic = relayTopic();
    list.forEach(function (m) { if (m.topic === topic) { relayPost(m.msg); } });
    setTimeout(function () { outboxBusy = false; }, 2000);
  }

  // Objednávky posíláme po dávkách, aby se žádná zpráva nevešla přes limit.
  function relaySales(list, evId, name) {
    evId = evId || state.evId;
    name = typeof name === "string" ? name : state.event;
    var batch = [], size = 0;
    list.forEach(function (s) {
      var one = slim(s);
      var len = JSON.stringify(one).length;
      if (batch.length && size + len > MAX_BYTES) {
        relayPost({ t: "sync", event: name, ev: evId, sales: batch });
        batch = []; size = 0;
      }
      batch.push(one); size += len;
    });
    if (batch.length) { relayPost({ t: "sync", event: name, ev: evId, sales: batch }); }
  }

  // Ohlášení se: obě zařízení o sobě dají vědět, jakmile se připojí nebo
  // se na to člověk podívá do Menu. Bez toho by "spárováno" nešlo poznat
  // dřív než u první objednávky, a hlavně by nebylo vidět, že každé
  // zařízení visí na jiném kódu.
  var lastHello = 0, helloBack = 0, lastQueueSent = 0;

  function sayHello(force) {
    var now = Date.now();
    if (!force && now - lastHello < 15000) { return; }
    lastHello = now;
    relayPost({ t: "hi", role: state.mode });
  }

  function relayDeleted(ids) { relayPost({ t: "del", ids: ids }); }
  // Otevřené objednávky všech akcí jen přes přeposílač (po připojení nebo
  // na pozdrav výdeje, který se připojil později než před 5 minutami).
  function relayAllOpen() {
    eachOpenEvent(function (ev) {
      var open = ev.sales.filter(function (x) { return x.status === "open"; });
      if (open.length) { relaySales(open, ev.id, ev.event); }
    });
  }

  function relayCleared(evId, at) {
    var m = { t: "clear", role: state.mode, at: at || Date.now() };
    if (evId) { m.ev = evId; }
    relayPost(m);
  }
