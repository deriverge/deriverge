  // ---------- interaktivní průvodce ----------
  // Vede nového uživatele skutečnými akcemi: kroužek ukáže, kam ťuknout,
  // a krok se splní až tím, že to uživatel opravdu udělá. Žádné obrázky
  // vedle reality, průvodce běží nad živou aplikací.
  var tourIx = -1, tourRaf = 0, tourScrolledFor = -1, tourLastKey = "", tourLastBox = "";

  var TOUR = [
    { key: "tourS1", sel: function () { return ".prod"; },
      done: function () { return state.order.length > 0; } },
    { key: "tourS1b", sel: function () { return ".prod"; },
      done: function () { return state.order.length === 0; } },
    { key: "tourS1c", sel: function () { return ".prod"; },
      done: function () { return state.order.length > 0; } },
    { key: "tourS2", sel: function () { return "[data-pay]"; },
      done: function () { return !!sheet && (sheet.step === "method" || sheet.step === "cash" || sheet.step === "card"); } },
    { key: "tourS3", sel: function () { return '[data-method="cash"]'; },
      done: function () { return !!sheet && (sheet.step === "cash" || sheet.step === "card"); } },
    { key: "tourS4", sel: function () {
        return (sheet && (sheet.step === "card" || sheet.received > 0)) ? "[data-commit]" : "[data-exact]"; },
      done: function () { return state.sales.length > 0 && !sheet; } },
    { key: "tourS5", sel: function () { return '[data-tab="orders"]'; },
      done: function () { return view === "orders"; } },
    { key: "tourS6", sel: function () { return (sheet && sheet.step === "ticket") ? "[data-serve]" : ".tk"; },
      done: function () { return state.sales.some(function (x) { return x.status !== "open"; }); } },
    { key: "tourS7", sel: function () { return '[data-tab="history"]'; },
      done: function () { return view === "history"; } },
    { key: "tourS8", sel: function () { return '[data-tab="menu"]'; },
      done: function () { return view === "menu"; } },
    { key: "tourS9", sel: function () { return "[data-sellersheet]"; },
      done: function () { return !!sheet && sheet.step === "seller"; } }
  ];

  // Aktivitu řídí jen tourIx; příznak tourDone rozhoduje pouze o automatickém
  // startu po úvodu, jinak by nešlo průvodce pustit z Menu podruhé.
  function tourActive() { return tourIx >= 0 && tourIx < TOUR.length; }

  // Průvodce vede přes dlaždice produktů a zaplacení účtu. S prázdným menu
  // by ukazoval na prvky, které na obrazovce nejsou, proto se nespustí.
  function tourCanRun() { return state.items.length > 0; }

  function tourStart(manual) {
    if (!tourCanRun()) {
      if (manual) { showToast(T("tourNeedsItems")); }
      return;
    }
    tourIx = 0;
    tourScrolledFor = -1;
    view = "sell";
    sheet = null;
    tourLastKey = "";
    tourLastBox = "";
    if (!tourRaf) { tourLoop(); }
    render(true);
  }

  // Rámeček sleduje cíl každý snímek: při plynulém posunu stránky sedí
  // přesně na prvku a nedojíždí za ním.
  function tourLoop() {
    if (!tourActive()) { tourRaf = 0; return; }
    tourPaint();
    tourRaf = requestAnimationFrame(tourLoop);
  }

  function tourEnd(finished) {
    tourIx = -1;
    state.tourDone = true;
    if (tourRaf) { cancelAnimationFrame(tourRaf); tourRaf = 0; }
    save();
    render();
    if (finished) { showToast(T("tourDoneToast")); }
  }

  // posun na další krok; volá se po každém překreslení
  function tourTick() {
    if (!tourActive()) { return; }
    var guard = 0;
    while (tourActive() && TOUR[tourIx].done() && guard++ < TOUR.length) { tourIx += 1; }
    if (tourIx >= TOUR.length) { tourEnd(true); }
  }

  function tourPaint() {
    var layer = document.getElementById("tourLayer");
    if (!layer) { return; }
    if (!tourActive()) {
      if (layer.firstChild) { layer.innerHTML = ""; }
      return;
    }

    if (!layer.firstChild) {
      layer.innerHTML =
        '<div class="tour-ring" aria-hidden="true"></div>' +
        '<div class="tour-card" role="status">' +
          '<span class="tour-n"></span><span class="tour-t"></span>' +
          '<button class="tour-skip" data-tourskip="1">' + esc(T("tourSkip")) + "</button>" +
        "</div>";
    }

    var ring = layer.querySelector(".tour-ring");
    var card = layer.querySelector(".tour-card");
    layer.querySelector(".tour-n").textContent = (tourIx + 1) + "/" + TOUR.length;
    layer.querySelector(".tour-t").textContent = T(TOUR[tourIx].key);

    var el = null;
    try { el = document.querySelector(TOUR[tourIx].sel()); } catch (e) {}
    if (el) {
      // Nový krok si cíl přisune do středu obrazovky. Jen jednou na krok,
      // aby kroužek nebojoval s ručním posouváním uživatele.
      var scrollKey = tourIx + "|" + TOUR[tourIx].sel();
      if (tourScrolledFor !== scrollKey) {
        tourScrolledFor = scrollKey;
        var rr = el.getBoundingClientRect();
        if (rr.top < 70 || rr.bottom > window.innerHeight - 140) {
          try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e2) { el.scrollIntoView(); }
        }
      }
      var r = el.getBoundingClientRect();
      var key = tourIx + "|" + TOUR[tourIx].sel();
      if (key !== tourLastKey) {
        // nový cíl: krátký nástup, restart animace přes reflow
        tourLastKey = key;
        ring.classList.remove("is-new"); card.classList.remove("is-new");
        void ring.offsetWidth;
        ring.classList.add("is-new"); card.classList.add("is-new");
      }
      // karta nad, nebo pod prvkem, podle místa
      var below = r.bottom + 12;
      var cardBelow = below + card.offsetHeight + 16 < window.innerHeight;
      var box = [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height), cardBelow ? 1 : 0].join(",");
      if (box !== tourLastBox) {
        tourLastBox = box;
        ring.style.display = "block";
        ring.style.left = (r.left - 6) + "px";
        ring.style.top = (r.top - 6) + "px";
        ring.style.width = (r.width + 12) + "px";
        ring.style.height = (r.height + 12) + "px";
        if (cardBelow) {
          card.style.top = below + "px";
          card.style.bottom = "auto";
        } else {
          card.style.top = "auto";
          card.style.bottom = (window.innerHeight - r.top + 12) + "px";
        }
      }
    } else {
      tourLastBox = "";
      ring.style.display = "none";
      // Bez cíle karta patří nahoru: dole zakrývala Zaplatit i Hotovo
      // (průhledná pro ťuknutí, ale tlačítka nebyla vidět).
      card.style.bottom = "auto";
      card.style.top = "calc(var(--safe-t) + 70px)";
    }
  }

  // ---------- žádost o hodnocení ----------
  // Ptáme se až lidí, kterým aplikace prokazatelně slouží: po desáté
  // uzavřené akci, a znovu až po padesáté a stopadesáté. Okno vyvolává
  // systém (v nativním obalu přes hook z bridge.js) a sám si hlídá,
  // aby se neukazovalo příliš často; na webu hook není a nestane se nic.
  var RATE_AT = [10, 50, 150];
  function maybeAskReview() {
    if (typeof window.__kasaAskReview !== "function") { return; }
    for (var i = 0; i < RATE_AT.length; i++) {
      if (state.rateN >= RATE_AT[i] && state.rateAsked < RATE_AT[i]) {
        state.rateAsked = state.rateN;
        save();
        // chvilku po potvrzení uzávěrky, ať okno nepřekryje oznámení
        setTimeout(function () { window.__kasaAskReview(); }, 1600);
        return;
      }
    }
  }

  // Android: tlačítko Zpět (mobile/.../MainActivity). Vrací true, když
  // na stránce bylo co zavřít; jinak aplikaci opustí systém.
  window.__kasaBack = function () {
    if (tourActive()) { tourEnd(false); render(); return true; }
    if (sheet) {
      pending = null;
      sheet = sheet.back ? sheet.back : sheet.step === "newevent" ? { step: "events" } : null;
      render(); return true;
    }
    if (!state.setup && obStep > 1) { obStep = 1; render(); return true; }
    if (linesOpen) { linesOpen = false; render(); return true; }
    var first = tabsFor()[0][0];
    if (view !== first) { view = first; render(true); return true; }
    return false;
  };

  // Velká čísla (součet účtu, částka k zaplacení, tržba) se musí vejít celá:
  // s delšími popisky tlačítek a velkými částkami (Ft, Rp, ₫) přetékala
  // za okraj. Písmo se zmenší jen tolik, kolik je potřeba.
  function fitNumbers() {
    var list = document.querySelectorAll(".bar-sum .t, .sheet .big, .hero .sum");
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      el.style.fontSize = "";
      el.style.whiteSpace = "nowrap";
      var size = parseFloat(getComputedStyle(el).fontSize) || 24;
      var guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && size > 12 && guard++ < 30) {
        size = Math.max(12, size - 1.5);
        el.style.fontSize = size + "px";
      }
    }
  }

  // Název akce v hlavičce je na kase zároveň přepínač akcí.
  function paintTopName() {
    var el = document.getElementById("topName");
    if (!el) { return; }
    var till = state.mode === "kasa";
    var name = state.event || T("noName");
    var html = esc(name) + (till ? '<i class="chev" aria-hidden="true"></i>' : "");
    if (el.innerHTML !== html) { el.innerHTML = html; }
    el.disabled = !till;
    el.setAttribute("aria-label", till ? T("evSwitchAria", name) : name);
  }

  function render(toTop) {
    // role bez prodeje nesmí zůstat viset na obrazovce, kterou nemá
    var allowed = tabsFor().map(function (t) { return t[0]; });
    if (allowed.indexOf(view) < 0) { view = allowed[0]; }

    var waiting = openOrders().length;
    document.getElementById("topRole").textContent = state.mode === "vydej" ? T("roleVydej") : T("roleKasa");
    document.getElementById("topLabel").textContent = T("ordersLabel");
    paintTopName();
    document.getElementById("topInfo").textContent = String(waiting);

    var v = document.getElementById("view");
    var keep = v.scrollTop;
    var redrawn = paint("view", view === "sell" ? renderSell()
                              : view === "orders" ? renderOrders()
                              : view === "history" ? renderHistory()
                              : renderMenu());
    if (redrawn || toTop) { v.scrollTop = toTop ? 0 : keep; }

    paint("barSlot", view === "sell" ? renderBar() : "");
    renderTabs(waiting);
    paintSheet();
    if (sheet && sheet.step === "color") { wheelInit(); }
    paint("toastSlot", toast
      ? '<div class="toast' + (sheet ? " up" : "") + '"><span class="t">' + esc(toast.text) + "</span>" +
        (toast.undo ? '<button data-undo="' + toast.undo + '">' + esc(T("undoBtn")) + "</button>" : "") +
        '<button class="x" data-hidetoast="1" aria-label="' + esc(T("close")) + '">' + SVG.close + "</button></div>"
      : "");
    placeToast();
    fitNumbers();

    tourTick();
    tourPaint();
  }

  // Hláška (třeba vrácení účtu) nesmí zakrýt řádek s cenou a tlačítkem
  // Zaplatit: na prodejní obrazovce ji posadíme těsně nad lištu účtu.
  function placeToast() {
    var t = document.querySelector("#toastSlot .toast");
    if (!t || t.classList.contains("up")) { return; }
    var bar = document.querySelector("#barSlot .bar");
    if (!bar) { return; }
    var top = bar.getBoundingClientRect().top;
    if (top > 0) { t.style.bottom = Math.round(window.innerHeight - top + 8) + "px"; }
  }

  // ---------- interaction ----------

  var SEL = "[data-tab],[data-add],[data-custom],[data-step],[data-toggle],[data-clearask],[data-pay]," +
            "[data-method],[data-note],[data-exact],[data-zero],[data-commit],[data-cancel],[data-scrim]," +
            "[data-dig],[data-back],[data-addcustom],[data-del],[data-copy],[data-copytext],[data-close]," +
            "[data-new],[data-rm],[data-mv],[data-reset],[data-undo],[data-hidetoast],[data-yes]," +
            "[data-backup],[data-restoreask],[data-dorestore],[data-docask],[data-docmake]," +
            "[data-ticket],[data-line],[data-serve],[data-reopen],[data-drop],[data-col],[data-setcol],[data-applycustom],[data-mode],[data-voice],[data-voicetest],"+
            "[data-paircreate],[data-pairjoin],[data-pairoff],[data-resync],[data-relaytest],[data-setupimport]," +
            "[data-tourskip],[data-tourstart],[data-offlinehelp],[data-country],[data-docmail],[data-docshare],[data-docsave],[data-sellersheet],[data-archopen],[data-archdel],[data-vatmode],[data-langsheet],[data-cursheet],[data-setlang],[data-setcur],[data-paywall],[data-buy]," +
            "[data-restorebuy],[data-oblang],[data-obcur],[data-obnext],[data-obdemo],[data-obempty]," +
            "[data-evsheet],[data-evswitch],[data-evnew],[data-evcreate],[data-evdel],[data-cvat],[data-backupfile]";

  document.addEventListener("click", function (ev) {
    if (suppressClick) { suppressClick = false; return; }
    var t = ev.target && ev.target.closest ? ev.target.closest(SEL) : null;
    if (!t) { return; }
    var d = t.dataset;

    keepAwake();

    // a tap on the sheet body (not on a control) must not close it
    if (d.scrim && t !== ev.target) { return; }

    if (d.tab) {
      view = d.tab;
      linesOpen = false;
      if (view === "menu" && state.pair) { sayHello(); }
      // Prázdné menu průvodce odložilo; nabídne se, jakmile je co prodávat.
      if (view === "sell" && !state.tourDone && !tourActive() && tourCanRun()) {
        tourStart();
        return;
      }
      render(true);
      return;
    }

    if (d.add) {
      var it = findItem(d.add);
      if (it) { addToOrder(it); }
      return;
    }

    if (d.custom) { sheet = { step: "custom", amount: 0, vat: state.vat ? defaultCustomVat() : "" }; render(); return; }
    if (d.dig) {
      // číslice navíc se ignoruje, dřív se částka potichu změnila na 999 999
      var nv = parseInt(String(sheet.amount) + d.dig, 10) || 0;
      if (nv <= 99999999) { sheet.amount = nv; }
      render(); return;
    }
    if (d.back) { sheet.amount = Math.floor(sheet.amount / 10); render(); return; }
    if (d.cvat) {
      if (sheet) { sheet.vat = d.cvat === "-" ? "" : d.cvat; render(); }
      return;
    }

    if (d.addcustom) {
      var cl = { ref: uid(), name: T("customItem"), price: mr(minorToMajor(sheet.amount)), qty: 1 };
      if (state.vat) {
        cl.vat = vatStr(sheet.vat);
        state.customVat = cl.vat === "" ? "-" : cl.vat;
      }
      state.order.push(cl);
      sheet = null; save(); render(); return;
    }

    // zatemněné pozadí panelu nese data-step taky; to není krokovač řádku
    if (d.step && !d.scrim) { bump(parseInt(d.step, 10), parseInt(d.d, 10)); return; }
    if (d.toggle) { linesOpen = !linesOpen; render(); return; }

    if (d.clearask) {
      var cc = T("confirmClear");
      ask(cc[0], cc[1], cc[2], function () {
        state.order = []; linesOpen = false; save();
      });
      return;
    }

    if (d.pay) {
      if (!isPro() && paymentsToday() >= FREE_LIMIT) {
        sheet = { step: "paywall", reason: "limit" };
        render(); return;
      }
      sheet = { step: "method", total: mr(orderTotal()), method: null, received: 0 };
      render(); return;
    }
    if ((d.method || d.commit) && Date.now() - stepShownAt < 450) { return; }
    if (d.method) { sheet.method = d.method; sheet.step = d.method; render(); return; }
    if (d.note) { sheet.received = mr(sheet.received + parseFloat(d.note)); render(); return; }
    if (d.exact) { sheet.received = sheet.total; render(); return; }
    if (d.zero) { sheet.received = 0; render(); return; }
    if (d.commit) { commit(); return; }

    if (d.yes) {
      var fn = pending;
      pending = null;
      sheet = null;
      if (fn) { fn(); }
      render();
      return;
    }

    if (d.cancel || d.scrim) {
      if (sheet && (sheet.step === "cash" || sheet.step === "card")) {
        sheet.step = "method"; sheet.received = 0;
      } else if (sheet && sheet.back) {
        sheet = sheet.back;   // údaje prodejce otevřené z dokladu: zpět do dokladu
      } else {
        sheet = null; pending = null;
      }
      render(); return;
    }

    if (d.undo) { undoSale(d.undo); return; }
    if (d.hidetoast) { hideToast(); render(); return; }

    if (d.del) {
      var id = d.del;
      var cd = T("confirmDelReceipt");
      ask(cd[0], cd[1], cd[2], function () {
        state.sales = state.sales.filter(function (s) { return s.id !== id; });
        save(); pushDelete([id]);
      });
      return;
    }

    if (d.copy) {
      sheet = { step: "text", title: T("summaryHead"), body: summaryText() };
      render(); return;
    }

    if (d.docask) {
      var today = new Date();
      var first = new Date(today.getFullYear(), today.getMonth(), 1);
      sheet = { step: "doc", from: docDate(first), to: docDate(today) };
      render(); return;
    }

    if (d.docmake) {
      var fEl = document.getElementById("docFrom"), tEl = document.getElementById("docTo");
      var eEl = document.getElementById("docEv");
      var doc = docBody(fEl ? fEl.value : "", tEl ? tEl.value : "", eEl ? eEl.value : "");
      if (doc === null) { return; }
      if (doc === "") {
        sheet.error = T("docEmpty"); sheet.from = fEl.value; sheet.to = tEl.value; sheet.ev = eEl ? eEl.value : "";
        render(); return;
      }
      sheet = { step: "docout", body: doc.text, doc: doc };
      render(); return;
    }

    if (d.docmail) { shareDoc("mail"); return; }
    if (d.docshare) { shareDoc("share"); return; }
    if (d.docsave) { shareDoc("save"); return; }

    if (d.backupfile) {
      var bj = sheet && sheet.body;
      if (!bj || typeof window.__kasaShareFile !== "function") { return; }
      blobToBase64(new Blob([bj], { type: "application/json" }), function (b64) {
        if (!b64) { showToast(T("backupFail")); return; }
        window.__kasaShareFile({
          data: b64, name: "tapkasa-backup-" + docDate(new Date()) + ".json", mime: "application/json",
          mode: d.backupfile === "share" ? "share" : "save", subject: T("backupHead"), text: "", title: T("backupHead")
        }).then(function (r) {
          if (r && r.result === "saved") { showToast(T("backupSaved")); }
        }, function () { showToast(T("backupFail")); });
      });
      return;
    }

    if (d.copytext) {
      var body = sheet.body;
      var area = document.getElementById("dump");
      var copiedMsg = sheet.backup || sheet.step === "docout" ? T("copiedAny") : T("toastCopied");
      // Android: schránka tiše zahodí text nad zhruba půl megabajtu, ale
      // hlásí úspěch. Velkou zálohu proto nekopírujeme a nabídneme soubor.
      if (sheet.backup && nativeApp() && !iosApp() && body.length > 200000) {
        showToast(T("backupTooBig")); render(); return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(body).then(function () {
          sheet = null; render(); showToast(copiedMsg); render();
        }, function () {
          if (area) { area.focus(); area.select(); }
          showToast(T("toastCopyFail")); render();
        });
      } else if (area) {
        area.focus(); area.select();
        showToast(T("toastCopySelect")); render();
      }
      return;
    }

    // ---- akce: přehled, přepnutí, založení, odebrání ----
    if (d.evsheet) {
      if (state.mode !== "kasa") { return; }
      sheet = { step: "events" };
      render(); return;
    }
    if (d.evswitch) { switchEvent(d.evswitch); return; }
    if (d.evnew) {
      if (state.order.length) { showToast(T("basketBusy")); return; }
      sheet = { step: "newevent", draft: "", copy: true };
      render();
      var nn = document.getElementById("evNewName");
      if (nn) { nn.focus(); }
      return;
    }
    if (d.evcreate) {
      var nEl = document.getElementById("evNewName"), cEl = document.getElementById("evCopy");
      createEvent(nEl ? nEl.value.trim().slice(0, 60) : "", cEl ? cEl.checked : false);
      return;
    }
    if (d.evdel) {
      var dv = parkedById(d.evdel);
      if (!dv) { return; }
      if (dv.sales.length) { showToast(T("evDelBusy")); return; }
      var ex = T("confirmEvDel");
      var back = sheet;
      ask(ex[0], ex[1].split("{0}").join(evLabel(dv)), ex[2], function () {
        state.parked = state.parked.filter(function (pk) { return pk.id !== dv.id; });
        save();
        sheet = back && back.step === "events" ? { step: "events" } : null;
        render();
      });
      return;
    }

    if (d.close) {
      var cx = T("confirmClose");
      ask(cx[0], cx[1], cx[2], function () {
        var s = stats();
        // účtenky si archiv nese s sebou, jinak by nešlo akci vrátit zpět
        // do kasy a doúčtovat ji
        state.archives.push({
          id: uid(), closedAt: Date.now(), event: state.event || T("noName"), evId: state.evId,
          total: s.total, cash: s.cash, card: s.card, count: s.count, pieces: s.pieces, items: s.items,
          sales: state.sales.slice(), nextNo: state.nextNo
        });
        // Akce zůstává otevřená (název, menu), jen začíná znovu od nuly:
        // denní uzávěrka kavárny tak nevyžaduje zakládat akci každý den.
        state.sales = [];
        state.nextNo = 1;
        state.rateN += 1;
        save(); pushClear(state.evId);
        // starší verze výdeje po uzávěrce smaže frontu celou, i objednávky
        // jiných otevřených akcí; ty mu hned pošleme znovu
        if (state.parked.length) { pushEverything(); }
        showToast(T("toastClosed"));
        maybeAskReview();
      });
      return;
    }

    // Vrácení uzavřené akce zpět do kasy. Slučovat dvě akce dohromady by
    // rozhodilo číslování účtenek i uzávěrku, proto se vrací jako samostatná
    // otevřená akce (s kopií současného menu) a kasa se do ní přepne.
    if (d.archopen) {
      var ao = null;
      for (var ai = 0; ai < state.archives.length; ai++) {
        if (state.archives[ai].id === d.archopen) { ao = state.archives[ai]; break; }
      }
      if (!ao || !ao.sales || !ao.sales.length) { return; }
      if (state.order.length) {
        showToast(T("basketBusy"));
        return;
      }
      var ax = T("confirmArchOpen");
      ask(ax[0], ax[1].split("{0}").join(ao.event), ax[2], function () {
        // Kam účtenky vrátit: do prázdné akce, která je ta samá (stejné id
        // nebo název), jinak do nové otevřené akce. Denní uzávěrka nechává
        // akci otevřenou, takže typicky se vrací zpátky do ní.
        var same = function (ev) { return (ao.evId && ev.id === ao.evId) || ev.event === ao.event; };
        var into = null;
        if (!state.sales.length && (same(activeEvent()) || !state.parked.length)) {
          into = activeEvent();
        } else {
          state.parked.forEach(function (pk) { if (!into && !pk.sales.length && same(pk)) { into = pk; } });
        }
        var rid = into ? into.id
          : (ao.evId && ao.evId !== state.evId && !parkedById(ao.evId) ? ao.evId : uid());
        var rsales = ao.sales.filter(isObj).map(function (x) { var c = JSON.parse(JSON.stringify(x)); c.ev = rid; return c; });
        var back = {};
        rsales.forEach(function (x) { back[x.id] = true; });
        state.gone = (state.gone || []).filter(function (x) { return !back[x]; });
        var rmax = normSales(rsales, rid);
        var rnext = Math.max(ao.nextNo || 0, rmax + 1);
        state.archives = state.archives.filter(function (x) { return x.id !== ao.id; });
        if (into && into.active) {
          state.event = ao.event;
          state.sales = rsales;
          state.nextNo = rnext;
        } else if (into) {
          state.parked = state.parked.filter(function (pk) { return pk.id !== into.id; });
          swapInEvent({ id: into.id, event: ao.event, items: into.items, sales: rsales, nextNo: rnext,
                        createdAt: into.createdAt || Date.now() });
        } else {
          // menu vezmeme z otevřené akce stejného jména, jinak z aktivní
          var src = state.items;
          state.parked.forEach(function (pk) { if (same(pk) && pk.items.length) { src = pk.items; } });
          var ritems = src.map(function (it) {
            var o = { id: uid(), name: it.name, price: it.price, color: it.color || "" };
            if (it.vat !== undefined) { o.vat = it.vat; }
            return o;
          });
          swapInEvent({ id: rid, event: ao.event, items: ritems, sales: rsales, nextNo: rnext, createdAt: Date.now() });
        }
        save(); pushEverything(); render();
        showToast(T("toastArchOpen", ao.event));
      });
      return;
    }

    if (d.archdel) {
      var ad = null;
      for (var di = 0; di < state.archives.length; di++) {
        if (state.archives[di].id === d.archdel) { ad = state.archives[di]; break; }
      }
      if (!ad) { return; }
      var dx = T("confirmArchDel");
      ask(dx[0], dx[1].split("{0}").join(ad.event), dx[2], function () {
        state.archives = state.archives.filter(function (x) { return x.id !== ad.id; });
        save(); render();
        showToast(T("toastArchDel"));
      });
      return;
    }

    if (d["new"]) {
      state.items.push({ id: uid(), name: "", price: demoPrice(50), color: "" });
      save(); render();
      var all = document.querySelectorAll(".e-nm");
      if (all.length) { all[all.length - 1].focus(); }
      return;
    }

    if (d.rm) {
      var rid = d.rm;
      var item = findItem(rid);
      var ci2 = T("confirmDelItem");
      ask(ci2[0], ci2[1].split("{0}").join(item && item.name ? item.name : T("theItem")), ci2[2], function () {
        state.items = state.items.filter(function (i) { return i.id !== rid; });
        save();
      });
      return;
    }

    if (d.mv) {
      var idx = parseInt(d.mv, 10);
      if (idx <= 0) { return; }
      var moved = state.items.splice(idx, 1)[0];
      state.items.splice(idx - 1, 0, moved);
      save(); render(); return;
    }

    if (d.reset) {
      var cr = T("confirmReset");
      ask(cr[0], cr[1], cr[2], function () {
        state.items = defaultItems();
        save();
      });
      return;
    }

    // ---- fronta objednávek ----
    if (d.ticket) { sheet = { step: "ticket", id: d.ticket }; render(); return; }

    if (d.line) {
      var tk = findSale(sheet.id);
      if (!tk) { return; }
      var ln = tk.lines[parseInt(d.line, 10)];
      if (!ln) { return; }
      ln.ready = (ln.ready || 0) >= ln.qty ? 0 : (ln.ready || 0) + 1;
      touchSale(tk);
      save(); pushOrder(tk); render(); return;
    }

    if (d.serve) {
      var srv = findSale(d.serve);
      if (!srv) { return; }
      srv.status = "served";
      srv.servedAt = Date.now();
      touchSale(srv);
      srv.lines.forEach(function (l) { l.ready = l.qty; });
      sheet = null;
      save(); pushOrder(srv, true); render();
      showToast(T("toastServed", srv.no));
      return;
    }

    if (d.drop) {
      var gone = findSale(d.drop);
      if (!gone) { return; }
      var co = T("confirmDropOrder");
      ask(co[0].split("{0}").join(String(gone.no)), co[1], co[2], function () {
        var gAt = locateSale(gone.id);
        if (gAt) {
          var src = gAt.evId === state.evId ? state.sales : (parkedById(gAt.evId) || { sales: [] }).sales;
          setEventSales(gAt.evId, src.filter(function (x) { return x.id !== gone.id; }));
        }
        save(); pushDelete([gone.id]);
      });
      return;
    }

    if (d.reopen) {
      var rop = findSale(d.reopen);
      if (!rop) { return; }
      rop.status = "open";
      touchSale(rop);
      save(); pushOrder(rop, true); render();
      showToast(T("toastReopened", rop.no));
      return;
    }

    // ---- barvy a role ----
    if (d.col) {
      var ci = findItem(d.col);
      sheet = { step: "color", id: d.col, current: ci ? ci.color : "" };
      wheelSeed(sheet.current);
      render(); return;
    }

    if (d.applycustom) {
      var cti = findItem(sheet.id);
      if (cti) { cti.color = wheelHex(); }
      sheet = null;
      save(); render(); return;
    }

    if (d.setcol) {
      var ct = findItem(sheet.id);
      if (ct) { ct.color = d.setcol === "-" ? "" : d.setcol; }
      sheet = null;
      save(); render(); return;
    }

    if (d.paircreate) {
      if (!isPro()) { sheet = { step: "paywall", reason: "pair" }; render(); return; }
      var abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", code = "";
      for (var ci = 0; ci < 5; ci++) { code += abc.charAt(Math.floor(Math.random() * abc.length)); }
      state.pair = code;
      save(); relayOpen(); nativeLink(); render();
      sayHello(true);
      showToast(T("toastCode", code));
      return;
    }

    if (d.pairjoin) {
      var fld = document.getElementById("pairCode");
      var code2 = (fld ? fld.value : "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code2.length < 3) { showToast(T("toastEnterCode")); return; }
      state.pair = code2;
      save(); relayOpen(); nativeLink(); render();
      sayHello(true);
      showToast(T("toastJoining", code2));
      return;
    }

    if (d.relaytest) { relayTest(); return; }

    if (d.resync) {
      pushEverything();
      showToast(T("toastResent"));
      return;
    }

    if (d.setupimport) {
      var si = T("setupImportAsk");
      ask(si[0], si[1], si[2], requestSetup);
      return;
    }

    if (d.pairoff) {
      state.pair = "";
      peers = 0;
      nativePeers = 0;
      relayClose();
      nativeLink();   // bez kódu se nativní hledání vypne
      save(); render();
      return;
    }

    // Kasa děkuje zákazníkovi, výdej čte objednávky: hláška po zapnutí
    // i zkouška hlasu musí odpovídat roli zařízení.
    if (d.voice) {
      state.voice = !state.voice;
      save(); render();
      if (state.voice) { speak(state.mode === "kasa" ? T("speakThanksOn") : T("speakVoiceOn")); }
      return;
    }

    if (d.voicetest) {
      speak(state.mode === "kasa" ? T("speakThanks") : T("speakTest"));
      return;
    }

    if (d.country) {
      if (!state.seller) { state.seller = {}; }
      state.seller.country = d.country;
      save();
      var ci = document.querySelector('[data-sf="country"]');
      if (ci) { ci.value = d.country; }
      var cb = document.getElementById("cSug");
      if (cb) { cb.innerHTML = ""; }
      return;
    }

    if (d.tourskip) { tourEnd(false); return; }
    if (d.tourstart) { tourStart(true); return; }

    if (d.offlinehelp) { sheet = { step: "offhelp" }; render(); return; }

    if (d.sellersheet) {
      var fromDoc = sheet && sheet.step === "doc";
      if (fromDoc) {
        var f0 = document.getElementById("docFrom"), t0 = document.getElementById("docTo"), e0 = document.getElementById("docEv");
        sheet = { step: "seller", back: { step: "doc", from: f0 ? f0.value : sheet.from, to: t0 ? t0.value : sheet.to, ev: e0 ? e0.value : "" } };
      } else {
        sheet = { step: "seller" };
      }
      render(); return;
    }

    if (d.vatmode) {
      state.vat = !state.vat;
      save(); render();
      return;
    }

    if (d.mode) {
      var nextMode = d.mode === "vydej" ? "vydej" : "kasa";
      if (nextMode === state.mode) { return; }   // ťuknutí na už zvolenou roli nesmí smazat účet
      state.mode = nextMode;
      state.order = [];
      linesOpen = false;
      save(); render();
      showToast(state.mode === "kasa" ? T("toastModeKasa") : T("toastModeVydej"));
      return;
    }

    if (d.backup) {
      sheet = { step: "text", title: T("backupHead"), body: JSON.stringify(state), backup: true };
      render(); return;
    }

    if (d.restoreask) { sheet = { step: "restore" }; render(); return; }

    // ---- jazyk, měna, tarif ----
    if (d.langsheet) { sheet = { step: "lang" }; render(); return; }
    if (d.cursheet) { sheet = { step: "currency" }; render(); return; }

    if (d.setlang) {
      state.lang = isLang(d.setlang) ? d.setlang : state.lang;
      moneyFmt = null; nfPlain = null;
      sheet = null;
      save(); render(); return;
    }

    if (d.setcur) {
      setCurrency(d.setcur);
      sheet = null;
      save(); render(); return;
    }

    if (d.paywall) { sheet = { step: "paywall", reason: d.paywall }; render(); return; }
    if (d.buy) { billingBuy(d.buy); return; }
    if (d.restorebuy) { billingRestore(); return; }

    // ---- onboarding ----
    if (d.oblang) { state.lang = d.oblang; moneyFmt = null; nfPlain = null; save(); render(); return; }
    if (d.obcur) { setCurrency(d.obcur); save(); render(); return; }
    if (d.obnext) { obStep = 2; render(); return; }
    if (d.obdemo || d.obempty) {
      state.items = d.obdemo ? defaultItems() : [];
      state.event = T("demoEvent");
      state.setup = true;
      obStep = 1;
      try { localStorage.setItem("kasa.setupDone", "1"); } catch (e) {}
      save();
      // Kdo začíná s prázdným menu, nemá průvodce na čem ukazovat. Spustí se
      // sám, až si první položku přidá a přejde na prodej.
      if (!state.tourDone && tourCanRun()) { tourStart(); } else { render(true); }
      return;
    }

    if (d.dorestore) {
      var box = document.getElementById("paste");
      var raw = box ? box.value.trim() : "";
      var next = parseState(raw);
      if (!next) {
        sheet.draft = raw;
        sheet.error = T("restoreBad");
        render(); return;
      }
      // licence a denní počítadlo zůstávají zařízení, ne záloze
      next.license = state.license;
      next.payDay = state.payDay;
      next.payN = state.payN;
      state = next;
      sheet = null;
      // Dřív šlo na protějšek i „clear“, a když zálohu obnovil výdej,
      // kasa přišla o všechny neuzavřené účtenky. Posíláme jen otevřené.
      save(); afterReplace(); pushEverything(); render();
      showToast(T("toastRestored"));
      return;
    }
  });

  // ---------- podržení karty = odebrání té jedné položky z účtu ----------
  // Obsluha se ukliká, podrží prst na kartě a řádek zmizí, bez rušení celého účtu.
  // HOLD_MS musí sedět s délkou přechodu u .prod.is-hold .hold v CSS.
  var HOLD_MS = 1000;
  var holdTimer = null, holdCard = null, holdX = 0, holdY = 0;

  function endHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdCard) { holdCard.classList.remove("is-hold"); holdCard = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    suppressClick = false;
    endHold();

    var card = ev.target && ev.target.closest ? ev.target.closest(".prod[data-add]") : null;
    if (!card) { return; }

    var id = card.getAttribute("data-add");
    var qty = 0;
    state.order.forEach(function (l) { if (l.ref === id) { qty += l.qty; } });
    if (!qty) { return; }

    holdCard = card;
    holdX = ev.clientX;
    holdY = ev.clientY;
    card.classList.add("is-hold");

    holdTimer = setTimeout(function () {
      var name = "";
      state.order = state.order.filter(function (l) {
        if (l.ref !== id) { return true; }
        name = l.name;
        return false;
      });
      if (!state.order.length) { linesOpen = false; }
      suppressClick = true;   // ať uvolnění prstu položku hned nepřidá zpátky
      endHold();
      save();
      render();
      showToast(T("toastRemoved", name));
      say(T("toastRemoved", name));
    }, HOLD_MS);
  });

  document.addEventListener("pointermove", function (ev) {
    if (!holdTimer) { return; }
    if (Math.abs(ev.clientX - holdX) > 10 || Math.abs(ev.clientY - holdY) > 10) { endHold(); }
  });
  ["pointerup", "pointercancel"].forEach(function (e) {
    document.addEventListener(e, endHold);
  });
  document.getElementById("view").addEventListener("scroll", endHold, { passive: true });
  document.addEventListener("contextmenu", function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest(".prod")) { ev.preventDefault(); }
  });

  // menu editing writes straight to state, without re-rendering (keeps the keyboard open)
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.dataset) { return; }

    if (el.dataset.sf) {
      if (!state.seller) { state.seller = {}; }
      state.seller[el.dataset.sf] = el.value;
      save();
      // Nabídku zemí měníme přímo, překreslení celého panelu by vzalo
      // fokus a rozepsané slovo by se rozpadlo.
      if (el.dataset.sf === "country") {
        var box = document.getElementById("cSug");
        if (box) { box.innerHTML = countrySuggestHtml(el.value); }
      }
      return;
    }

    if (el.id === "docFrom" || el.id === "docTo") {
      if (sheet && sheet.step === "doc") {
        if (el.id === "docFrom") { sheet.from = el.value; } else { sheet.to = el.value; }
      }
      return;
    }

    if (el.id === "wlight") {
      wheelL = parseInt(el.value, 10) || 52;
      wheelImg = null;
      wheelPaint();
      wheelPreview();
      return;
    }

    if (el.id === "evName") {
      state.event = el.value;
      paintTopName();
      save();
      return;
    }

    // rozepsanou zálohu držíme ve stavu, ať ji překreslení (třeba zhasnutí
    // hlášky) nesmaže z pole
    if (el.id === "paste" && sheet) {
      sheet.draft = el.value;
      sheet.error = "";
      return;
    }

    var nameId = el.dataset.nm;
    var priceId = el.dataset.pr;
    var vatId = el.dataset.vat;
    var item = findItem(nameId || priceId || vatId);
    if (!item) { return; }

    if (nameId) {
      item.name = el.value;
    } else if (vatId) {
      // prázdné pole necháváme prázdné, ať jde sazbu zase odebrat
      item.vat = String(el.value).trim() === "" ? "" : vatNum(el.value);
      if (item.vat === null) { item.vat = ""; }
    } else {
      var num = parsePrice(el.value);
      item.price = isNaN(num) ? 0 : mr(num);
    }
    save();
  });

  // keep the screen awake while the stand is open
  function keepAwake() {
    if (wakeAsked || !navigator.wakeLock || !navigator.wakeLock.request) { return; }
    wakeAsked = true;
    try {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; wakeAsked = false; });
      }, function () { wakeAsked = false; });
    } catch (e) { wakeAsked = false; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !wakeLock) { wakeAsked = false; keepAwake(); }
  });

  // ---------- boot ----------
  state = load();
  try {
    if (!state.setup && localStorage.getItem("kasa.setupDone")) { state.setup = true; }
  } catch (e) {}
  rebuildMoneyFmt();
  state.sales.forEach(function (s) { announced[s.id] = true; });
  render();

  relayOpen();
  nativeLink();

  // Stav spojení se mění i pouhým plynutím času (čerstvost poslední zprávy).
  // Otevřené menu se proto jednou za půl minuty překreslí; díky diffování
  // se do stránky reálně sáhne, jen když se text stavu opravdu změní.
  setInterval(function () {
    if (view === "menu" && !sheet) { render(); }
  }, 30000);

  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (!el || el.id !== "restoreFile" || !el.files || !el.files[0]) { return; }
    var rd = new FileReader();
    rd.onload = function () {
      if (sheet && sheet.step === "restore") { sheet.draft = String(rd.result || ""); sheet.error = ""; render(); }
    };
    rd.readAsText(el.files[0]);
  });

  // Webová verze otevřená ve dvou kartách: novější uložení z druhé karty
  // převezmeme, jinak by si karty navzájem přepisovaly tržby a čísla.
  // otočení telefonu nebo změna velikosti okna: velká čísla znovu přizpůsobit
  window.addEventListener("resize", function () { try { fitNumbers(); } catch (e) {} });

  window.addEventListener("storage", function (ev) {
    if (ev.key !== KEY || !ev.newValue) { return; }
    var other = parseState(ev.newValue, true);
    if (!other || (other.savedAt || 0) <= (state.savedAt || 0)) { return; }
    var keepOrder = state.order, keepEv = state.evId, prevPair = state.pair;
    state = other;
    // Rozpracovaný účet patří této kartě; cizí by rozhodil otevřené placení.
    if (state.evId === keepEv) { state.order = keepOrder; }
    else if (sheet) { sheet = null; }
    afterReplace(prevPair);
    render();
  });

  dbInit(function () {
    dbSettled = true;
    dbRead(function (rec) {
      var backup = parseState(rec, true);   // záloha z tohoto zařízení
      // V zařízení nic není, ale záložní kopie ano, nebo je záložní kopie
      // novější (localStorage se přestal ukládat, když došlo místo) → obnovit.
      if (backup && !isEmpty(backup) &&
          (isEmpty(state) || (backup.savedAt || 0) > (state.savedAt || 0))) {
        state = backup;
        afterReplace();
        render();
        showToast(T("toastDbRestore"));
      }
      save();
    });
  });
})();
</script>
<!-- APP:END -->

    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        reg.update();          // ať se oprava rozjede hned po první návštěvě
      }).catch(function () {});
    });
  }
