<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tapkasa">
<meta name="theme-color" content="#FBFAF7">
<meta name="robots" content="noindex">
<title>Tapkasa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<!-- APP:START -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#FBFAF7;
    --surface:#FFFFFF;
    --sunk:#F2EEE6;
    --ink:#15120E;
    --ink-2:#5F5749;
    --ink-3:#8C8474;
    --rule:#E4DFD5;
    --accent:#D6402A;
    --accent-dk:#B93520;
    --accent-tint:#FFF6F4;
    --cash:#0F7A4F;
    --card:#1D5BD6;
    --track:#EDE9E0;
    --r-tile:12px;
    --r-btn:10px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.35;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  /* ---------- shell ---------- */
  .shell{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--paper)}

  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(var(--safe-t) + 10px) 16px 10px;
    border-bottom:1px solid var(--rule);background:var(--paper);
    position:relative;z-index:3;
  }
  .top-name{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
  .top-total{text-align:right;flex:0 0 auto}
  .top-total .v{display:block;font-size:15px;margin-top:1px}

  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  /* ---------- tabs ---------- */
  .tabs{
    display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    border-top:1px solid var(--rule);background:var(--surface);
    padding-bottom:var(--safe-b);position:relative;z-index:3;
  }
  .tab{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 10px;background:none;border:0;
    font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);
  }
  .tab .dot{
    position:absolute;top:4px;left:50%;margin-left:6px;
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:11px;font-weight:700;
    display:grid;place-items:center;
  }
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent)}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px}
  @media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}

  .prod{
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;gap:8px;
    min-height:80px;padding:10px 12px;text-align:left;
    background:var(--surface);border:1px solid var(--rule);border-bottom-width:2px;
    border-radius:var(--r-tile);
    -webkit-touch-callout:none;
    transition:transform .06s ease,background .12s ease;
  }
  .prod:active{transform:scale(.97);background:var(--accent-tint)}

  /* podržení = odebrání položky z účtu; pruh ukazuje, kolik zbývá */
  .prod .hold{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:left center}
  .prod.is-hold{background:var(--accent-tint);border-color:var(--accent)}
  .prod.is-hold .hold{transform:scaleX(1);transition:transform 1s linear}
  @media (prefers-reduced-motion:reduce){.prod.is-hold .hold{transition:none}}
  .prod .nm{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .prod .pr{font-size:14px;color:var(--ink-2)}
  .prod.is-on{border-color:var(--accent);background:var(--accent-tint)}
  /* odznak musí zůstat uvnitř karty, ta má oříznuté okraje kvůli pruhu držení */
  .prod .badge{
    position:absolute;top:7px;right:7px;min-width:26px;height:26px;padding:0 7px;
    display:grid;place-items:center;border-radius:13px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:13px;font-weight:700;
  }
  .prod.is-on .nm{padding-right:32px}

  /* barevná karta, pozadí i barva textu jdou z palety inline stylem,
     zbytek se veze na currentColor, takže sedí na jakoukoliv barvu */
  .prod.tinted{border-color:rgba(0,0,0,.16)}
  .prod.tinted .pr{color:inherit;opacity:.85}
  .prod.tinted:active,.prod.tinted.is-hold{filter:brightness(.9)}
  .prod.tinted.is-on{border-color:rgba(0,0,0,.3);box-shadow:inset 0 0 0 3px currentColor}
  .prod.tinted .badge{background:var(--ink);color:var(--bg)}
  .prod.tinted .hold{background:currentColor}
  .prod.custom{border-style:dashed;border-bottom-width:1px;background:transparent;align-items:center;justify-content:center;text-align:center}
  .prod.custom .nm{color:var(--ink-2)}

  .hint{padding:8px 24px 24px;color:var(--ink-3);font-size:13px;text-align:center;line-height:1.5}

  /* ---------- order bar ---------- */
  .bar{border-top:1px solid var(--rule);background:var(--surface);position:relative;z-index:2}
  .bar-lines{max-height:34dvh;overflow-y:auto;border-bottom:1px solid var(--rule)}
  .line{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule)}
  .line:last-child{border-bottom:0}
  .line .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:64px;text-align:right}
  .step{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:2px}
  .step button{width:30px;height:30px;border:0;background:none;border-radius:999px;font-size:17px;font-weight:600;line-height:1;color:var(--ink)}
  .step button:active{background:#E2DCD0}
  .step .q{min-width:22px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700}

  .bar-main{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .bar-sum{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
  .bar-sum .c{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
  .bar-sum .t{display:block;font-size:24px;margin-top:1px}
  .btn-pay{
    flex:0 0 auto;padding:14px 20px;border:0;border-radius:var(--r-btn);
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-pay:disabled{background:var(--track);color:var(--ink-3)}
  .btn-pay:not(:disabled):active{transform:scale(.98);background:var(--accent-dk)}
  .btn-clear{flex:0 0 auto;padding:12px 6px;background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:600}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(21,18,14,.44);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(14px)}to{transform:translateY(0)}}
  .sheet{
    width:100%;max-width:640px;background:var(--paper);
    border-radius:18px 18px 0 0;border-top:1px solid var(--rule);
    padding:18px 16px calc(18px + var(--safe-b));
    max-height:92dvh;overflow-y:auto;animation:rise .18s ease;
  }
  @media (prefers-reduced-motion:reduce){.scrim,.sheet,.toast{animation:none}}
  .sheet h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .sheet .big{font-size:46px;line-height:1;margin:8px 0 2px}
  .sheet .sub{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
  .sheet .txt{width:100%;height:190px;margin-top:14px;padding:12px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-family:var(--mono);font-size:12px;line-height:1.5;resize:none}

  .pay2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .btn-m{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:20px 10px;border-radius:var(--r-tile);border:0;color:#fff;
    font-size:17px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-m svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .btn-m:active{transform:scale(.98)}
  .m-cash{background:var(--cash)}
  .m-card{background:var(--card)}

  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .key{padding:13px 4px;border-radius:var(--r-btn);border:1px solid var(--rule);background:var(--surface);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .key:active{background:var(--sunk)}
  .keys.cash{grid-template-columns:repeat(5,1fr)}
  .keys.cash .w3{grid-column:span 3}
  .keys.cash .w2{grid-column:span 2}
  .key.wide{grid-column:span 2}
  .key.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .recv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-tile)}
  .recv .lbl{font-size:13px;color:var(--ink-2);font-weight:600}
  .recv .val{font-size:20px}
  .recv.give{background:#F0F7F3;border-color:#BFE0D0}
  .recv.give .val{color:var(--cash)}
  .recv.short .val{color:var(--accent)}
  .recv.off .lbl,.recv.off .val{color:var(--ink-3)}

  .btn-done{width:100%;margin-top:14px;padding:17px;border:0;border-radius:var(--r-btn);background:var(--ink);color:var(--paper);font-size:17px;font-weight:700}
  .btn-done:disabled{background:var(--track);color:var(--ink-3)}
  .btn-done:not(:disabled):active{transform:scale(.99)}
  .btn-done.warn{background:var(--accent)}
  .btn-done.go{background:var(--cash)}
  .btn-ghost{width:100%;margin-top:8px;padding:13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:transparent;color:var(--ink-2);font-size:14px;font-weight:600}

  .paid{display:flex;align-items:center;gap:9px;margin-top:16px;padding:13px 14px;border-radius:var(--r-tile);font-size:15px;font-weight:600;color:#fff}
  .paid svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------- history ---------- */
  .sec{padding:18px 16px 0}
  .sec h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  .hero{padding:18px 16px 16px;border-bottom:1px solid var(--rule)}
  .hero .sum{font-size:44px;line-height:1;margin-top:6px}
  .hero .meta{margin:8px 0 0;font-size:13px;color:var(--ink-2)}

  .split{display:flex;gap:2px;margin-top:14px;height:10px}
  .split i{display:block;border-radius:2px}
  .split i:first-child{border-radius:5px 2px 2px 5px}
  .split i:last-child{border-radius:2px 5px 5px 2px}
  .split i:only-child{border-radius:5px}
  .sp-cash{background:var(--cash)}
  .sp-card{background:var(--card)}
  .legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
  .lg{display:flex;align-items:baseline;gap:7px;font-size:13px}
  .lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;transform:translateY(-1px)}
  .lg .k{color:var(--ink-2);font-weight:600}
  .lg .v{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

  .items{display:flex;flex-direction:column;gap:11px}
  .it .r{display:flex;align-items:baseline;gap:10px}
  .it .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .q{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .it .a{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
  .it .track{height:6px;margin-top:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .it .fill{height:100%;background:var(--accent);border-radius:3px}

  .tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
  .tx:last-child{border-bottom:0}
  .tx .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .tx .mid{flex:1;min-width:0}
  .tx .w{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tx .a{font-family:var(--mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .tx .del{border:0;background:none;color:var(--ink-3);font-size:19px;line-height:1;padding:6px 2px 6px 8px}

  .arch{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .arch .mid{flex:1;min-width:0}
  .arch .s{font-size:12px;color:var(--ink-3);margin-top:2px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;padding:18px 16px 28px}
  .act{flex:1 1 auto;padding:13px 14px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:14px;font-weight:600}
  .act:active{background:var(--sunk)}
  .act.danger{color:var(--accent);border-color:#F0C7BF}
  .act.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- menu editor ---------- */
  .field{padding:0 16px 14px}
  .inp{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:15px}
  .inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  .edit{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 16px;border-bottom:1px solid var(--rule)}
  .edit .e-nm{flex:1;min-width:0;padding:10px 11px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:15px;font-weight:500}
  .edit .e-nm:focus{background:var(--surface);border-color:var(--rule);outline:none}
  .edit .e-pr{width:70px;flex:0 0 auto;padding:10px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:right;font-family:var(--mono);font-weight:700;font-size:14px}
  .edit .e-pr:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .edit .mv,.edit .rm{width:32px;height:34px;flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;border-radius:8px}
  .edit .mv:active,.edit .rm:active{background:var(--sunk)}
  .edit .rm{color:var(--accent);font-size:19px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));z-index:30;
    max-width:616px;margin:0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-radius:var(--r-tile);background:var(--ink);color:var(--paper);
    font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(21,18,14,.22);animation:rise .18s ease;
  }
  /* nad otevřeným oknem by hláška zakryla jeho tlačítka, jde nahoru */
  .toast.up{bottom:auto;top:calc(var(--safe-t) + 10px)}
  .toast .t{flex:1;min-width:0}
  .toast button{border:0;background:none;color:#FFB3A5;font-size:14px;font-weight:700;padding:4px 2px}
  .toast button.x{color:#9A9184;font-size:18px;line-height:1}

  /* ---------- daňový doklad ---------- */
  .doc-range{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .doc-range label span{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  #printDoc{display:none}
  @media print{
    body>*{display:none !important}
    #printDoc{display:block !important;font:12px/1.5 ui-monospace,Menlo,monospace;color:#000;white-space:pre-wrap;margin:0}
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- počítadlo plateb zdarma ---------- */
  .fcnt{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:11px;font-weight:700;vertical-align:1px}

  /* ---------- výběr jazyka / měny ---------- */
  .picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;max-height:52dvh;overflow-y:auto;padding-bottom:2px}
  .picker .pick{padding:13px 10px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:14px;font-weight:600;text-align:center}
  .picker .pick.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .picker.cur{grid-template-columns:1fr 1fr}
  .picker.cur .pick{display:flex;flex-direction:column;gap:2px;align-items:center}
  .picker.cur .pick strong{font-family:var(--mono);font-size:14px}
  .picker.cur .pick:not(.on){color:var(--ink-2)}

  /* ---------- paywall ---------- */
  .pw-mark{display:flex;justify-content:center;margin:4px 0 10px}
  .pw-mark svg{width:56px;height:56px}
  .pw-list{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .pw-b{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
  .pw-b svg{width:18px;height:18px;stroke:var(--cash);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .pw-plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .pw-plan{position:relative;display:flex;flex-direction:column;gap:2px;align-items:center;padding:14px 8px;border:1.5px solid var(--rule);border-radius:var(--r-tile);background:var(--surface)}
  .pw-plan .k{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
  .pw-plan .p{font-size:22px}
  .pw-plan .s{font-size:11px;color:var(--ink-3)}
  .pw-plan.best{border-color:var(--accent);background:var(--accent-tint)}
  .pw-plan:active{transform:scale(.98)}
  .pw-legal{padding:6px 4px 0;text-align:center;font-size:12px;color:var(--ink-3)}
  .pw-legal a{color:var(--ink-3);text-decoration:underline;text-underline-offset:2px}

  /* ---------- úvodní obrazovka ---------- */
  .ob{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;overflow-y:auto}
  .ob-in{width:100%;max-width:430px;margin:0 auto;padding:calc(var(--safe-t) + 34px) 24px calc(var(--safe-b) + 24px);display:flex;flex-direction:column;flex:1}
  .ob-mark{display:flex;gap:7px;margin-bottom:18px}
  .ob-mark i{width:30px;height:30px;border-radius:9px;display:block}
  .ob h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.02em;font-weight:700}
  .ob .tag{margin:6px 0 0;font-size:15px;color:var(--ink-2);font-weight:600}
  .ob .intro{margin:14px 0 0;font-size:14px;color:var(--ink-2);line-height:1.5}

    if (!line) { return; }
    line.qty += delta;
    if (line.qty <= 0) { state.order.splice(idx, 1); }
    if (!state.order.length) { linesOpen = false; }
    save();
    render();
  }

  // ---------- sale ----------

  function commit() {
    if (!isPro() && paymentsToday() >= FREE_LIMIT) {
      sheet = { step: "paywall", reason: "limit" };
      render(); return;
    }
    countPayment();
    var sale = {
      id: uid(),
      no: state.nextNo++,
      ts: Date.now(),
      updatedAt: Date.now(),
      method: sheet.method,
      total: sheet.total,
      status: "open",
      lines: state.order.map(function (l) {
        return { name: l.name, price: l.price, qty: l.qty, color: l.color || "", ready: 0 };
      })
    };
    state.sales.push(sale);
    state.order = [];
    linesOpen = false;
    sheet = null;
    save();
    pushOrder(sale, true);
    render();
    if (state.mode === "kasa" && state.voice) { sayThanks(); }
    showToast(T("toastSaved", czk(sale.total), sale.method === "cash" ? T("cashLower") : T("cardLower")), sale.id);
    say(T("toastSaved", czk(sale.total), ""));
  }

  function undoSale(id) {
    var i = state.sales.length - 1;
    while (i >= 0 && state.sales[i].id !== id) { i--; }
    if (i < 0) { return; }
    var sale = state.sales.splice(i, 1)[0];
    state.order = sale.lines.map(function (l) {
      return { ref: refFor(l.name, l.price), name: l.name, price: l.price, qty: l.qty, color: l.color || "" };
    });
    if (sale.no === state.nextNo - 1) { state.nextNo = sale.no; }
    hideToast();
    save();
    pushDelete([sale.id]);
    render();
    say(T("undoBtn"));
  }

  function showToast(text, undoId) {
    toast = { text: text, undo: undoId || null };
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { hideToast(); render(); }, 7000);
    render();
  }

  function hideToast() {
    toast = null;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  }

  function ask(title, text, okLabel, fn) {
    pending = fn;
    sheet = { step: "confirm", title: title, text: text, ok: okLabel };
    render();
  }

  // ---------- fronta objednávek ----------
  // Zaplacený účet nezmizí, zařadí se do fronty jako objednávka s číslem.
  // Kdo připravuje, odškrtává v ní položky a nakonec dá Vydáno.

  function openOrders() {
    return state.sales.filter(function (s) { return s.status === "open"; })
      .sort(function (a, b) { return a.no - b.no; });
  }

  function servedOrders() {
    return state.sales.filter(function (s) { return s.status !== "open"; })
      .sort(function (a, b) { return b.no - a.no; });
  }

  function findSale(id) {
    for (var i = 0; i < state.sales.length; i++) {
      if (state.sales[i].id === id) { return state.sales[i]; }
    }
    return null;
  }

  function pieces(s) {
    return s.lines.reduce(function (n, l) { return n + l.qty; }, 0);
  }

  function ready(s) {
    return s.lines.reduce(function (n, l) { return n + Math.min(l.ready || 0, l.qty); }, 0);
  }

  function allReady(s) { return ready(s) >= pieces(s); }

  function tint(key, fallback) {
    var c = colorOf(key);
    if (!c) { return fallback || ""; }
    return ' style="background:' + c.bg + ";color:" + c.ink + ";--bg:" + c.bg + ";--ink:" + c.ink + '"';
  }

  // ---------- spárované zařízení ----------
  // Kasa a výdej si posílají celý seznam objednávek. Slučuje se podle id,
  // vyhrává novější updatedAt, pořadí zpráv tak nehraje roli.

  var peers = 0;
  var muted = false;
  var announced = {};      // id objednávek, které už zazněly

  // Nová objednávka se na výdeji přečte nahlas, ať se obsluha nemusí dívat.
  // iOS pustí hlas až po nějakém klepnutí, o to se stará tlačítko v Menu.
  function speak(text) {
    try {
      if (!window.speechSynthesis) { return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = langInfo().loc;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // Na kase zazní poděkování zákazníkovi, jakmile je účet hotový.
  function sayThanks() {
    var ev = (state.event || "").trim();
    var name = ev ? ev.charAt(0).toLowerCase() + ev.slice(1) : "";
    speak(T("speakThanks") + (name ? " " + T("speakEnjoy", name) : ""));
  }

  function saySale(s) {
    var parts = [T("speakNewOrder", s.no)];
    s.lines.forEach(function (l) {
      parts.push(l.qty > 1 ? T("speakTimes", l.qty, l.name) : l.name + ".");
    });
    speak(parts.join(" "));
  }

  function nativeSend(msg) {
    try {
      if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.peer) { return; }
      msg.src = myId;
      window.webkit.messageHandlers.peer.postMessage(JSON.stringify(msg));
    } catch (e) {}
  }

  // Posílá se vždycky jen ta jedna změněná objednávka, ne celý seznam -
  // jinak zprávy přerostou limit přeposílače a přestanou chodit úplně.
  var pendingOrders = {}, pendTimer = null;

  // Odškrtávání jde rychle po sobě; kdyby každé ťuknutí letělo zvlášť, brzy
  // by došel denní limit přeposílače. Proto se změny na chvíli posbírají.
  function pushOrder(sale, now) {
    if (muted) { return; }
    pendingOrders[sale.id] = sale;
    if (now) { flushOrders(); return; }
    if (pendTimer) { return; }
    pendTimer = setTimeout(flushOrders, 1200);
  }

  function flushOrders() {
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    var list = [];
    Object.keys(pendingOrders).forEach(function (k) {
      if (findSale(k)) { list.push(pendingOrders[k]); }
    });
    pendingOrders = {};
    if (!list.length) { return; }
    nativeSend({ t: "sync", event: state.event, sales: list.map(slim) });
    relaySales(list);
  }

  function pushDelete(ids) {
    if (muted) { return; }
    flushOrders();
    nativeSend({ t: "del", ids: ids });
    relayDeleted(ids);
  }

  function pushClear() {
    if (muted) { return; }
    pendingOrders = {};
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    nativeSend({ t: "clear" });
    relayCleared();
  }

  function pushEverything() {
    if (muted) { return; }
    pendingOrders = {};
    if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
    var open = openOrders();
    nativeSend({ t: "sync", event: state.event, sales: open.map(slim) });
    relaySales(open);
  }

  window.__kasaPeer = function (raw) {
    var msg = null;
    try { msg = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { return; }
    if (!msg || (!Array.isArray(msg.sales) && msg.t !== "del" && msg.t !== "clear")) { return; }

    var changed = false;

    if (msg.t === "del" && Array.isArray(msg.ids)) {
      var before = state.sales.length;
      state.sales = state.sales.filter(function (x) { return msg.ids.indexOf(x.id) < 0; });
      changed = state.sales.length !== before;
    } else if (msg.t === "clear") {
      changed = state.sales.length > 0;
      state.sales = [];
      state.nextNo = 1;
    } else if (Array.isArray(msg.sales)) {
      var mine = {};
      state.sales.forEach(function (s) { mine[s.id] = s; });
      msg.sales.forEach(function (inc) {
        var have = mine[inc.id];
        if (!have) { state.sales.push(inc); changed = true; return; }
        if ((inc.updatedAt || 0) > (have.updatedAt || 0)) {
          state.sales[state.sales.indexOf(have)] = inc;
          changed = true;
        }
      });
    }
    if (!changed) { return; }

    if (state.mode === "vydej" && state.voice) {
      state.sales.forEach(function (s) {
        if (s.status !== "open" || announced[s.id]) { return; }
        announced[s.id] = true;
        saySale(s);
      });
    }

    state.sales.sort(function (a, b) { return (a.no || 0) - (b.no || 0); });
    var maxNo = 0;
    state.sales.forEach(function (s) { if (s.no > maxNo) { maxNo = s.no; } });
    if (state.nextNo <= maxNo) { state.nextNo = maxNo + 1; }
    if (msg.event && state.mode === "vydej") { state.event = msg.event; }

    muted = true;              // příchozí změnu neposíláme hned zpátky
    save();
    muted = false;
    render();
  };

  // Párování přes internet: obě zařízení visí na stejném hotspotu, takže mají
  // i data. Posílají si změny přes veřejný přeposílač pod kódem, který funguje
  // jako adresa. Používá se, jen když si ho uživatel zapne.
  //
  // Přeposílač má dva tvrdé limity: jedna zpráva smí mít nejvýš 4 kB a je
  // strop na počet zpráv za den. Proto se posílá vždycky jen to, co se právě
  // změnilo, jedna objednávka na zprávu, a ne celý seznam. A když
  // přeposílač zprávu odmítne, řekne se to nahlas místo tichého ignorování.

  // Veřejné přeposílače mají denní limity a občas prostě odmítnou. Proto
  // jedeme přes dva naráz: posílá se na oba a poslouchá se na obou. Stačí,
  // aby v danou chvíli fungoval jeden. Zprávy jsou nezávislé na pořadí a
  // slučují se podle id, takže když dorazí dvakrát, nic se nestane.
  var RELAYS = (typeof window.__KASA_RELAY__ === "string" && window.__KASA_RELAY__)
    ? window.__KASA_RELAY__.split(",")
    : ["https://ntfy.sh/", "https://ntfy.envs.net/"];

  var MAX_BYTES = 3500;
  var myId = Math.random().toString(36).slice(2, 10);
  var links = [];
  var seen = {}, relayError = "", lastIn = 0, lastOut = 0, sentOpen = false;
  var pingAt = 0, testResult = "";

  function relayTopic() { return state.pair ? "kasa-stanek-" + state.pair : ""; }

  function anySse() {
    for (var i = 0; i < links.length; i++) { if (links[i].sseUp) { return true; } }
    return false;
  }

  // Zelená tečka nesmí svítit jen proto, že se povedl dotaz, to by lhalo.
  // Svítí, až když drží stálé spojení nebo když od protějšku něco přišlo.
  function refreshLink() {
    setPeers(anySse() || lastIn ? 1 : 0);
  }

  function setPeers(n) {
    if (peers === n) { return; }
    peers = n;
    render();
  }

  function setRelayError(text) {
    if (relayError === text) { return; }
    relayError = text;
    render();
  }

  // z objednávky posíláme jen to, co druhá strana potřebuje pro frontu
  function slim(s) {
    return {
      id: s.id, no: s.no, ts: s.ts, total: s.total, method: s.method,
      status: s.status, updatedAt: s.updatedAt,
      lines: s.lines.map(function (l) {
        return { name: l.name, price: l.price, qty: l.qty, ready: l.ready || 0, color: l.color || "" };
      })
    };
  }

  // Pošle na všechny přeposílače. Chybu hlásíme, teprve když selžou všechny.
  function relayPost(msg, done) {
    var topic = relayTopic();
    if (!topic || !window.fetch || !links.length) { return; }
    msg.src = myId;
    var body;
    try { body = JSON.stringify(msg); } catch (e) { return; }

    var left = links.length, ok = false, worst = 0;
    links.forEach(function (link) {
      fetch(link.base + topic, { method: "POST", body: body }).then(function (r) {
        if (r.ok) { ok = true; } else if (r.status > worst) { worst = r.status; }
      }, function () {}).then(function () {
        if (--left) { return; }
        if (ok) {
          lastOut = Date.now();
          setRelayError("");
        } else {
          setRelayError(worst === 429 ? T("relayLimit")
            : worst ? T("relayRefused", worst)
            : T("relayOffline"));
        }
        if (done) { done(ok, worst); }
      });
    });
  }

  // Objednávky posíláme po dávkách, aby se žádná zpráva nevešla přes limit.
  function relaySales(list) {
    var batch = [], size = 0;
    list.forEach(function (s) {
      var one = slim(s);
      var len = JSON.stringify(one).length;
      if (batch.length && size + len > MAX_BYTES) {
        relayPost({ t: "sync", event: state.event, sales: batch });
        batch = []; size = 0;
      }
      batch.push(one); size += len;
    });
    if (batch.length) { relayPost({ t: "sync", event: state.event, sales: batch }); }
  }

  // Ohlášení se: obě zařízení o sobě dají vědět, jakmile se připojí nebo
  // se na to člověk podívá do Menu. Bez toho by "spárováno" nešlo poznat
  // dřív než u první objednávky, a hlavně by nebylo vidět, že každé
  // zařízení visí na jiném kódu.
  var lastHello = 0, helloBack = 0;

  function sayHello(force) {
    var now = Date.now();
    if (!force && now - lastHello < 15000) { return; }
    lastHello = now;
    relayPost({ t: "hi", role: state.mode });
  }

  function relayDeleted(ids) { relayPost({ t: "del", ids: ids }); }
  function relayCleared() { relayPost({ t: "clear" }); }

  // Zkouška spojení: pošle vlastní značku a čeká, jestli se vrátí. Rozliší
  // tím tři různé poruchy, neodešlo, odešlo ale nechodí zpátky, nebo je vše
  // v pořádku, a nepotřebuje k tomu druhé zařízení.
  function relayTest() {
    if (!relayTopic()) { testResult = T("testNoCode"); render(); return; }
    pingAt = Date.now();
    testResult = T("testTrying");
    render();
    relayPost({ t: "ping", at: pingAt }, function (ok, worst) {
      if (!ok) {
        pingAt = 0;
        testResult = worst === 429 ? T("testLimit")
          : worst ? T("testRefused", worst)
          : T("testOffline");
        render();
        return;
      }
      if (!pingAt) { return; }   // odpověď stihla dorazit dřív než potvrzení odeslání
      testResult = T("testSent");
      render();
      setTimeout(function () {
        if (!pingAt) { return; }
        pingAt = 0;
        testResult = T("testNoEcho");
        render();
      }, 8000);
    });
  }

  function relayClose() {
    links.forEach(function (l) {
      if (l.es) { try { l.es.close(); } catch (e) {} }
      if (l.timer) { clearInterval(l.timer); }
    });
    links = [];
    seen = {}; sentOpen = false; relayError = ""; testResult = ""; pingAt = 0;
  }

  function relayTake(link, env) {
    if (!env || env.event !== "message" || !env.message) { return; }
    var key = link.base + "|" + env.id;
    if (seen[key]) { return; }
    seen[key] = true;
    if (env.time > link.lastTs) { link.lastTs = env.time; }

    var msg = null;
    try { msg = JSON.parse(env.message); } catch (e) { return; }
    if (!msg) { return; }

    if (msg.t === "ping") {
      if (msg.src === myId && pingAt) {
        testResult = T("testOk", ((Date.now() - pingAt) / 1000).toFixed(1));
        pingAt = 0;
        render();
      }
      return;
    }
    if (msg.src === myId) { return; }   // vlastní zprávy zpátky nebereme

    if (msg.t === "hi") {
      lastIn = Date.now();
      refreshLink();
      if (Date.now() - helloBack > 5000) {   // ozveme se zpátky, ale ne donekonečna
        helloBack = Date.now();
        sayHello(true);
      }
      render();
      return;
    }

    lastIn = Date.now();
    refreshLink();
    window.__kasaPeer(msg);
  }

  // Stálé spojení je hlavní cesta; dotazování je záloha, když ho síť nepustí.
  // Když spojení drží, ptáme se zřídka, ať zbytečně nepálíme denní limit.
  function relayPoll(link) {
    var topic = relayTopic();
    if (!topic || !window.fetch) { return; }
    fetch(link.base + topic + "/json?poll=1&since=" + (link.lastTs ? link.lastTs : "5m"))
      .then(function (r) {
        if (!r.ok) { throw new Error(String(r.status)); }
        return r.text();
      })
      .then(function (body) {
        body.split("\n").forEach(function (line) {
          if (!line.trim()) { return; }
          try { relayTake(link, JSON.parse(line)); } catch (e) {}
        });
        refreshLink();
      })
      .catch(function () { refreshLink(); });
  }

  function schedulePoll(link) {
    if (link.timer) { clearInterval(link.timer); }
    link.timer = setInterval(function () { relayPoll(link); }, link.sseUp ? 20000 : 4000);
  }

  // pro diagnostiku: stav jednotlivých přeposílačů
  window.__kasaLinks = function () {
    return links.map(function (l) {
      return { base: l.base, sseUp: l.sseUp, lastTs: l.lastTs };
    });
  };

  function relayOpen() {
    relayClose();
    var topic = relayTopic();
    if (!topic) { return; }

    links = RELAYS.map(function (base) { return { base: base, es: null, sseUp: false, lastTs: 0, timer: null }; });

    links.forEach(function (link) {
      if (window.EventSource) {
        try {
          link.es = new EventSource(link.base + topic + "/sse?since=5m");
          link.es.onopen = function () {
            link.sseUp = true;
            schedulePoll(link);
            refreshLink();
            setRelayError("");
            if (!sentOpen) { sentOpen = true; sayHello(true); relaySales(openOrders()); }
          };
          link.es.onerror = function () {
            link.sseUp = false;
            schedulePoll(link);
            refreshLink();
          };
          link.es.onmessage = function (ev) {
            try { relayTake(link, JSON.parse(ev.data)); } catch (e) {}
          };
        } catch (e) {}
      }
      relayPoll(link);
      schedulePoll(link);
    });
  }

  window.__kasaPeerCount = function (n) {
    setPeers(n | 0);
    if (peers > 0) { pushEverything(); }   // nový protějšek dostane frontu
  };

  // ---------- stats ----------

  function stats() {
    var s = { total: 0, cash: 0, card: 0, count: state.sales.length, pieces: 0, items: [] };
    var map = {};
    state.sales.forEach(function (t) {
      s.total += t.total;
      if (t.method === "cash") { s.cash += t.total; } else { s.card += t.total; }
      t.lines.forEach(function (l) {
        var k = l.name + "|" + l.price;
        if (!map[k]) { map[k] = { name: l.name, price: l.price, qty: 0, sum: 0 }; }
        map[k].qty += l.qty;
        map[k].sum += l.qty * l.price;
        s.pieces += l.qty;
      });
    });
    Object.keys(map).forEach(function (k) { s.items.push(map[k]); });
    s.items.sort(function (a, b) { return b.sum - a.sum || b.qty - a.qty; });
    return s;
  }

  function summaryText() {
    var s = stats();
    var out = [];
    out.push(state.event || T("noName"));
    out.push(new Date().toLocaleDateString(langInfo().loc) + " " + clock(Date.now()));
    out.push("");
    out.push(T("sumTotal") + " " + czk(s.total));
    out.push("  " + T("cashLower") + ": " + czk(s.cash));
    out.push("  " + T("cardLower") + ": " + czk(s.card));
    out.push(T("sumBills") + " " + s.count + " · " + T("sumPieces") + " " + s.pieces);
    out.push("");
    s.items.forEach(function (i) {
      out.push(i.qty + "x " + i.name + " a " + czk(i.price) + " = " + czk(i.sum));
    });
    return out.join("\n");
  }

  // ---------- views ----------

  function renderSell() {
    var h = '<div class="grid">';
    state.items.forEach(function (it) {
      var qty = 0;
      state.order.forEach(function (l) { if (l.ref === it.id) { qty += l.qty; } });
      h += '<button class="prod' + (qty ? " is-on" : "") + (it.color ? " tinted" : "") + '"' +
             tint(it.color) + ' data-add="' + it.id + '">' +
             (qty ? '<span class="badge">' + qty + "</span><span class=\"hold\"></span>" : "") +
             '<span class="nm">' + esc(it.name) + "</span>" +
             '<span class="pr num">' + czk(it.price) + "</span>" +
           "</button>";
    });
    h += '<button class="prod custom" data-custom="1"><span class="nm">' + esc(T("customTile")) + "</span></button></div>";
    if (!state.items.length) {
      h += '<p class="hint">' + T("emptyMenu") + "</p>";
    }
    return h;
  }

  function renderBar() {
    var n = orderCount();
    var h = '<div class="bar">';

    if (linesOpen && state.order.length) {
      h += '<div class="bar-lines">';
      state.order.forEach(function (l, i) {
        h += '<div class="line"><span class="nm">' + esc(l.name) + "</span>" +
               '<span class="step">' +
                 '<button data-step="' + i + '" data-d="-1" aria-label="' + esc(T("minus")) + '">−</button>' +
                 '<span class="q">' + l.qty + "</span>" +
                 '<button data-step="' + i + '" data-d="1" aria-label="' + esc(T("plusOne")) + '">+</button>' +
               "</span>" +
               '<span class="amt">' + czk(l.price * l.qty) + "</span></div>";
      });
      h += "</div>";
    }

    h += '<div class="bar-main">';
    if (state.order.length) {
      h += '<button class="bar-sum" data-toggle="1" aria-expanded="' + (linesOpen ? "true" : "false") + '">' +
             '<span class="c">' + n + " " + tp("itemsN", n) +
             (linesOpen ? T("hideLines") : T("editLines")) + "</span>" +
             '<span class="t num">' + czk(orderTotal()) + "</span></button>" +
           '<button class="btn-clear" data-clearask="1">' + esc(T("cancelOrder")) + "</button>" +
           '<button class="btn-pay" data-pay="1">' + esc(T("pay")) + "</button>";
    } else {
      h += '<div class="bar-sum"><span class="c">' + esc(T("newOrder")) + freeCounter() + "</span>" +
           '<span class="t num" style="color:var(--ink-3)">' + czk(0) + "</span></div>" +

  // ---------- souhrnný daňový doklad ----------
  // Sečte prodeje za období: aktuální účtenky podle času uložení, uzavřené
  // akce podle data uzavření (jednotlivé účtenky se v archivu už nedrží).

  function docDate(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }

  function docBody(fromS, toS) {
    var from = new Date(fromS + "T00:00:00").getTime();
    var to = new Date(toS + "T23:59:59.999").getTime();
    if (isNaN(from) || isNaN(to)) { return null; }

    var total = 0, cashSum = 0, cardSum = 0, bills = 0;
    var items = {}, events = {};
    var addItem = function (name, price, qty, sum) {
      var k = name + "|" + price;
      if (!items[k]) { items[k] = { name: name, price: price, qty: 0, sum: 0 }; }
      items[k].qty += qty;
      items[k].sum += sum;
    };

    state.sales.forEach(function (s) {
      if (s.ts < from || s.ts > to) { return; }
      bills += 1;
      total += s.total;
      if (s.method === "cash") { cashSum += s.total; } else { cardSum += s.total; }
      events[state.event || T("noName")] = true;
      s.lines.forEach(function (l) { addItem(l.name, l.price, l.qty, l.qty * l.price); });
    });

    state.archives.forEach(function (a) {
      if (a.closedAt < from || a.closedAt > to) { return; }
      bills += a.count || 0;
      total += a.total || 0;
      cashSum += a.cash || 0;
      cardSum += a.card || 0;
      events[(a.event || T("noName")) + " (" + new Date(a.closedAt).toLocaleDateString(langInfo().loc) + ")"] = true;
      (a.items || []).forEach(function (i) { addItem(i.name, i.price, i.qty, i.sum); });
    });

    if (!bills) { return ""; }

    var list = Object.keys(items).map(function (k) { return items[k]; });
    list.sort(function (a, b) { return b.sum - a.sum || b.qty - a.qty; });

    var now = new Date();
    var no = "TK-" + docDate(now).replace(/-/g, "") + "-" + ("0" + now.getHours()).slice(-2) + ("0" + now.getMinutes()).slice(-2);
    var loc = langInfo().loc;
    var out = [];
    out.push(T("docTitle"));
    out.push("");
    if (state.biz.trim()) {
      state.biz.trim().split("\n").forEach(function (ln) { out.push(ln.trim()); });
      out.push("");
    }
    out.push(T("docNo") + " " + no);
    out.push(T("docPeriod") + " " + new Date(from).toLocaleDateString(loc) + " - " + new Date(to).toLocaleDateString(loc));
    out.push(T("docIssued") + " " + now.toLocaleDateString(loc) + " " + clock(now.getTime()));
    out.push(T("docEvents") + " " + Object.keys(events).join(", "));
    out.push("");
    out.push(T("docItemsHead"));
    list.forEach(function (i) {
      out.push(i.qty + "x " + i.name + " (" + czk(i.price) + ")  " + czk(i.sum));
    });
    out.push("");
    out.push(T("docReceipts") + " " + bills);
    out.push(T("cash") + ": " + czk(cashSum));
    out.push(T("card") + ": " + czk(cardSum));
    out.push(T("docTotal") + ": " + czk(total));
    out.push("");
    out.push(T("docFooter"));
    return out.join("\n");
  }

  // ---------- kolečko vlastní barvy ----------
  // Kreslí se na canvas: úhel = odstín, vzdálenost od středu = sytost,
  // posuvník = světlost. Výběr žije mimo state, aby tahání prstem
  // nepřekreslovalo celý list; do položky se zapíše až tlačítkem.

  var wheelPick = { h: 16, s: 78 };
  var wheelL = 52;
  var wheelImg = null;

  function wheelHex() { return hslToHex(wheelPick.h, wheelPick.s, wheelL); }

  function wheelSeed(current) {
    if (typeof current === "string" && current.charAt(0) === "#") {
      var p = hexToHsl(current);
      wheelPick = { h: p.h, s: Math.max(8, p.s) };
      wheelL = Math.round(Math.min(88, Math.max(18, p.l)));
      wheelImg = null;
    }
  }

  function wheelPaint() {
    var cv = document.getElementById("wheel");
    if (!cv) { return; }
    var ctx = cv.getContext("2d");
    var w = cv.width, r = w / 2;
    if (!wheelImg) {
      var img = ctx.createImageData(w, w);
      var data = img.data;
      for (var y = 0; y < w; y++) {
        for (var x = 0; x < w; x++) {
          var dx = x - r + 0.5, dy = y - r + 0.5;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d > r) { continue; }
          var h = Math.atan2(dy, dx) * 180 / Math.PI;
          if (h < 0) { h += 360; }
          var hex = hslToHex(h, Math.min(1, d / r) * 100, wheelL);
          var i = (y * w + x) * 4;
          data[i] = parseInt(hex.slice(1, 3), 16);
          data[i + 1] = parseInt(hex.slice(3, 5), 16);
          data[i + 2] = parseInt(hex.slice(5, 7), 16);
          data[i + 3] = d > r - 2 ? Math.max(0, Math.round((r - d) * 127.5)) : 255;
        }
      }
      wheelImg = img;
    }
    ctx.clearRect(0, 0, w, w);
    ctx.putImageData(wheelImg, 0, 0);
    // ukazatel výběru
    var a = wheelPick.h * Math.PI / 180, dist = (wheelPick.s / 100) * (r - 6);
    var px = r + Math.cos(a) * dist, py = r + Math.sin(a) * dist;
    ctx.beginPath(); ctx.arc(px, py, 12, 0, 2 * Math.PI);
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py, 12, 0, 2 * Math.PI);
    ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 1.5; ctx.stroke();
  }

  function wheelPreview() {
    var pv = document.getElementById("wprev");
    if (!pv) { return; }
    var hex = wheelHex();
    pv.style.background = hex;
    pv.style.color = inkFor(hex);
  }

  function wheelFromEvent(cv, ev) {
    var box = cv.getBoundingClientRect();
    var r = box.width / 2;
    var dx = ev.clientX - box.left - r, dy = ev.clientY - box.top - r;
    var h = Math.atan2(dy, dx) * 180 / Math.PI;
    if (h < 0) { h += 360; }
    wheelPick = { h: h, s: Math.min(1, Math.sqrt(dx * dx + dy * dy) / r) * 100 };
    wheelPaint();
    wheelPreview();
  }

  var wheelDrag = false;
  function wheelInit() {
    var cv = document.getElementById("wheel");
    if (!cv || cv.__wired) { return; }
    cv.__wired = true;
    wheelPaint();
    cv.addEventListener("pointerdown", function (ev) {
      wheelDrag = true;
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
      wheelFromEvent(cv, ev);
      ev.preventDefault();
    });
    cv.addEventListener("pointermove", function (ev) {
      if (wheelDrag) { wheelFromEvent(cv, ev); }
    });
    ["pointerup", "pointercancel"].forEach(function (t) {
      cv.addEventListener(t, function () { wheelDrag = false; });
    });
  }

             '<div class="big num">' + ready(s) + "/" + pieces(s) + "</div>" +

               esc(s.method === "cash" ? T("cashLower") : T("cardLower")) + "</p>" +
             '<div class="steps">';
        s.lines.forEach(function (l, i) {
          var isDone = (l.ready || 0) >= l.qty;
          h += '<button class="st' + (isDone ? " done" : "") + '"' +
                 tint(l.color, ' style="background:var(--surface)"') + ' data-line="' + i + '">' +
                 '<span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>' +
                 '<span class="nm">' + esc(l.name) + "</span>" +
                 (l.qty > 1 ? '<span class="cnt">' + (l.ready || 0) + "/" + l.qty + "</span>" : "") +
               "</button>";

        h += "</div>" +
             '<button class="btn-done' + (allReady(s) ? " go" : "") + '" data-serve="' + s.id + '">' + esc(T("serve")) + "</button>" +
             '<button class="btn-ghost" data-cancel="1">' + esc(T("close")) + "</button>" +

    if (sheet.step === "color") {

             "</div>" +

    if (sheet.step === "lang") {
      h += "<h2>" + esc(T("langHead")) + '</h2><div class="picker">';
      LANGS.forEach(function (l) {
        h += '<button class="pick' + (state.lang === l.k ? " on" : "") + '" data-setlang="' + l.k + '">' + esc(l.n) + "</button>";
      });
      h += "</div>" + '<button class="btn-ghost" data-cancel="1">' + esc(T("back")) + "</button>";

    if (sheet.step === "currency") {
      h += "<h2>" + esc(T("currencyHead")) + "</h2>" +

        h += '<button class="pick' + (state.currency === c.c ? " on" : "") + '" data-setcur="' + c.c + '">' +
             '<strong>' + c.c + "</strong> " + esc(curSample(c)) + "</button>";

      h += "</div>" + '<button class="btn-ghost" data-cancel="1">' + esc(T("back")) + "</button>";
    }

    if (sheet.step === "paywall") {
      h += '<div class="pw-mark">' + PRO_MARK + "</div>" +
           "<h2 style=\"text-align:center\">" + esc(T("proHead")) + "</h2>" +
           '<p class="sub" style="text-align:center;font-size:15px">' +
             esc(sheet.reason === "limit" ? T("proWall", FREE_LIMIT)
               : sheet.reason === "pair" ? T("proPairWall")
               : T("proPitch")) + "</p>" +
           '<div class="pw-list">' +
             '<div class="pw-b">' + PW_CHECK + esc(T("proB1")) + "</div>" +
             '<div class="pw-b">' + PW_CHECK + esc(T("proB2")) + "</div>" +
             '<div class="pw-b">' + PW_CHECK + esc(T("proB3")) + "</div>" +
           "</div>" +
           '<div class="pw-plans">' +
             '<button class="pw-plan" data-buy="monthly"><span class="k">' + esc(T("proMonthly")) + '</span><span class="p num">' + esc(priceOf("monthly")) + "</span><span class=\"s\">" + esc(T("proPerMonth", "")) .replace(" / ", "/") + "</span></button>" +
             '<button class="pw-plan best" data-buy="yearly"><span class="k">' + esc(T("proYearly")) + '</span><span class="p num">' + esc(priceOf("yearly")) + "</span><span class=\"s\">" + esc(T("proPerYear", "")).replace(" / ", "/") + "</span></button>" +
           "</div>" +
           '<button class="btn-ghost" data-restorebuy="1">' + esc(T("proRestore")) + "</button>" +
           '<button class="btn-ghost" data-cancel="1">' + esc(T("proLater")) + "</button>" +
           '<p class="hint" style="padding:10px 4px 0">' + esc(T("proTerms")) + "</p>" +
           '<p class="pw-legal"><a href="https://www.deriverge.com/kava/privacy.html" target="_blank" rel="noopener">' + esc(T("proPrivacy")) + "</a>" +
           ' · <a href="https://www.deriverge.com/kava/terms.html" target="_blank" rel="noopener">' + esc(T("proTermsLink")) + "</a></p>";
    }

    return h + "</div></div>";
  }

  // ---------- render ----------

  var ICON = {
    sell: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>',
    orders: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9.5 8.5h5"/><path d="M9.5 12.5h5"/></svg>',
    history: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>',
    menu: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><circle cx="8.5" cy="6" r="2"/><circle cx="15.5" cy="12" r="2"/><circle cx="8.5" cy="18" r="2"/></svg>'
  };

  function tabsFor() {
    return state.mode === "vydej"
      ? [["orders", T("tabOrders")], ["menu", T("tabSettings")]]
      : [["sell", T("tabSell")], ["orders", T("tabOrders")], ["history", T("tabHistory")], ["menu", T("tabMenu")]];
  }

  function renderTabs(waiting) {
    var h = "";
    tabsFor().forEach(function (t) {
      h += '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' +
           (view === t[0] ? "true" : "false") + '">' + ICON[t[0]] +
           (t[0] === "orders" && waiting ? '<span class="dot">' + waiting + "</span>" : "") +
           t[1] + "</button>";
    });
    paint("tabs", h);
  }

  // Okno platby zůstává na obrazovce i několik vteřin a mezitím může přijít
  // zpráva z druhého zařízení. Kdyby se při každé překreslila celá stránka,
  // okno by se přerodilo i s návratovou animací a obsluze by poskakovalo
  // pod rukama, proto sahá na DOM jen ta část, jejíž obsah se liší.
  var painted = {};

  function paint(id, html) {
    if (painted[id] === html) { return false; }
    painted[id] = html;
    document.getElementById(id).innerHTML = html;
    return true;
  }

  function renderOnboard() {
    if (state.setup) { return ""; }
    var h = '<div class="ob"><div class="ob-in">' +
      '<div class="ob-mark"><i style="background:#D6402A"></i><i style="background:#F5CE3E"></i><i style="background:#2158C4"></i><i style="background:#127A4E"></i></div>' +
      "<h1>Tapkasa</h1>" +
      '<p class="tag">' + esc(T("obTagline")) + "</p>";

    if (obStep === 1) {
      h += '<p class="intro">' + esc(T("obIntro")) + "</p>" +
        "<h3>" + esc(T("obLang")) + '</h3><div class="ob-langs">';
      LANGS.forEach(function (l) {
        h += '<button' + (state.lang === l.k ? ' class="on"' : "") + ' data-oblang="' + l.k + '">' + esc(l.n) + "</button>";
      });
      h += "</div><h3>" + esc(T("obCurrency")) + '</h3><div class="ob-curs">';
      CURRENCIES.forEach(function (c) {
        h += '<button' + (state.currency === c.c ? ' class="on"' : "") + ' data-obcur="' + c.c + '">' + c.c + "</button>";
      });
      h += "</div>" +
        '<div class="ob-spacer"></div>' +
        '<button class="btn-done" data-obnext="1">' + esc(T("obNext")) + "</button>";
    } else {
      h += '<div class="ob-how" style="margin-top:26px">' +
        '<div class="ob-row"><i style="background:#D6402A">' + ICON.sell + "</i><p>" + esc(T("obHow1")) + "</p></div>" +
        '<div class="ob-row"><i style="background:#2158C4">' + ICON.orders + "</i><p>" + esc(T("obHow2")) + "</p></div>" +
        '<div class="ob-row"><i style="background:#127A4E"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="12" height="16" rx="2"/><rect x="16" y="8" width="6" height="12" rx="2"/></svg></i><p>' + esc(T("obHow3")) + "</p></div>" +
      "</div>" +
      '<div class="ob-spacer"></div>' +
      '<button class="btn-done" data-obdemo="1">' + esc(T("obDemo")) + "</button>" +
      '<button class="btn-ghost" data-obempty="1">' + esc(T("obEmpty")) + "</button>";
    }
    return h + "</div></div>";
  }

  function render(toTop) {
    // role bez prodeje nesmí zůstat viset na obrazovce, kterou nemá
    var allowed = tabsFor().map(function (t) { return t[0]; });
    if (allowed.indexOf(view) < 0) { view = allowed[0]; }

    var waiting = openOrders().length;
    document.getElementById("topRole").textContent = state.mode === "vydej" ? T("roleVydej") : T("roleKasa");
    document.getElementById("topLabel").textContent = T("ordersLabel");
    document.getElementById("topName").textContent = state.event || T("noName");
    document.getElementById("topInfo").textContent = String(waiting);

    var v = document.getElementById("view");
    var keep = v.scrollTop;
    var redrawn = paint("view", view === "sell" ? renderSell()
                              : view === "orders" ? renderOrders()
                              : view === "history" ? renderHistory()
                              : renderMenu());
    if (redrawn || toTop) { v.scrollTop = toTop ? 0 : keep; }

    paint("barSlot", view === "sell" ? renderBar() : "");
    renderTabs(waiting);
    paint("sheetSlot", state.setup ? renderSheet() : renderOnboard());
    if (sheet && sheet.step === "color") { wheelInit(); }
    paint("toastSlot", toast
      ? '<div class="toast' + (sheet ? " up" : "") + '"><span class="t">' + esc(toast.text) + "</span>" +
        (toast.undo ? '<button data-undo="' + toast.undo + '">' + esc(T("undoBtn")) + "</button>" : "") +
        '<button class="x" data-hidetoast="1" aria-label="Zavřít">×</button></div>'
      : "");
  }

  // ---------- interaction ----------

  var SEL = "[data-tab],[data-add],[data-custom],[data-step],[data-toggle],[data-clearask],[data-pay]," +
            "[data-method],[data-note],[data-exact],[data-zero],[data-commit],[data-cancel],[data-scrim]," +
            "[data-dig],[data-back],[data-addcustom],[data-del],[data-copy],[data-copytext],[data-close]," +
            "[data-new],[data-rm],[data-mv],[data-reset],[data-undo],[data-hidetoast],[data-yes]," +
            "[data-backup],[data-restoreask],[data-dorestore],[data-docask],[data-docmake],[data-docprint]," +
            "[data-ticket],[data-line],[data-serve],[data-reopen],[data-drop],[data-col],[data-setcol],[data-applycustom],[data-mode],[data-voice],[data-voicetest],"+
            "[data-paircreate],[data-pairjoin],[data-pairoff],[data-resync],[data-relaytest]," +
            "[data-langsheet],[data-cursheet],[data-setlang],[data-setcur],[data-paywall],[data-buy]," +
            "[data-restorebuy],[data-devtap],[data-oblang],[data-obcur],[data-obnext],[data-obdemo],[data-obempty]";

  document.addEventListener("click", function (ev) {
    if (suppressClick) { suppressClick = false; return; }
    var t = ev.target && ev.target.closest ? ev.target.closest(SEL) : null;
    if (!t) { return; }
    var d = t.dataset;

    keepAwake();

    // a tap on the sheet body (not on a control) must not close it
    if (d.scrim && t !== ev.target) { return; }

    if (d.tab) {
      view = d.tab;
      linesOpen = false;
      if (view === "menu" && state.pair) { sayHello(); }
      render(true);
      return;
    }

    if (d.add) {
      var it = findItem(d.add);
      if (it) { addToOrder(it); }
      return;
    }

    if (d.custom) { sheet = { step: "custom", amount: 0 }; render(); return; }
    if (d.dig) {
      sheet.amount = Math.min(999999, parseInt(String(sheet.amount) + d.dig, 10) || 0);
      render(); return;
    }
    if (d.back) { sheet.amount = Math.floor(sheet.amount / 10); render(); return; }
    if (d.addcustom) {
      state.order.push({ ref: uid(), name: T("customItem"), price: mr(minorToMajor(sheet.amount)), qty: 1 });
      sheet = null; save(); render(); return;
    }

    if (d.step) { bump(parseInt(d.step, 10), parseInt(d.d, 10)); return; }
    if (d.toggle) { linesOpen = !linesOpen; render(); return; }

    if (d.clearask) {
      var cc = T("confirmClear");
      ask(cc[0], cc[1], cc[2], function () {
        state.order = []; linesOpen = false; save();
      });
      return;
    }

    if (d.pay) {
      if (!isPro() && paymentsToday() >= FREE_LIMIT) {
        sheet = { step: "paywall", reason: "limit" };
        render(); return;
      }
      sheet = { step: "method", total: mr(orderTotal()), method: null, received: 0 };
      render(); return;
    }
    if (d.method) { sheet.method = d.method; sheet.step = d.method; render(); return; }
    if (d.note) { sheet.received = mr(sheet.received + parseFloat(d.note)); render(); return; }
    if (d.exact) { sheet.received = sheet.total; render(); return; }
    if (d.zero) { sheet.received = 0; render(); return; }
    if (d.commit) { commit(); return; }

    if (d.yes) {
      var fn = pending;
      pending = null;
      sheet = null;
      if (fn) { fn(); }
      render();
      return;
    }

    if (d.cancel || d.scrim) {
      if (sheet && (sheet.step === "cash" || sheet.step === "card")) {
        sheet.step = "method"; sheet.received = 0;
      } else {
        sheet = null; pending = null;
      }
      render(); return;
    }

    if (d.undo) { undoSale(d.undo); return; }
    if (d.hidetoast) { hideToast(); render(); return; }

    if (d.del) {
      var id = d.del;
      var cd = T("confirmDelReceipt");
      ask(cd[0], cd[1], cd[2], function () {
        state.sales = state.sales.filter(function (s) { return s.id !== id; });
        save(); pushDelete([id]);
      });
      return;
    }

    if (d.copy) {
      sheet = { step: "text", title: T("summaryHead"), body: summaryText() };
      render(); return;
    }

    if (d.docask) {
      var today = new Date();
      var first = new Date(today.getFullYear(), today.getMonth(), 1);
      sheet = { step: "doc", from: docDate(first), to: docDate(today) };
      render(); return;
    }

    if (d.docmake) {
      var fEl = document.getElementById("docFrom"), tEl = document.getElementById("docTo");
      var body = docBody(fEl ? fEl.value : "", tEl ? tEl.value : "");
      if (body === null) { return; }
      if (body === "") { sheet.error = T("docEmpty"); sheet.from = fEl.value; sheet.to = tEl.value; render(); return; }
      sheet = { step: "docout", body: body };
      render(); return;
    }

    if (d.docprint) {
      var pd = document.getElementById("printDoc");
      if (pd) { pd.textContent = sheet.body; }
      try { window.print(); } catch (e) {}
      return;
    }

    if (d.copytext) {
      var body = sheet.body;
      var area = document.getElementById("dump");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(body).then(function () {
          sheet = null; render(); showToast(T("toastCopied")); render();
        }, function () {
          if (area) { area.focus(); area.select(); }
          showToast(T("toastCopyFail")); render();
        });
      } else if (area) {
        area.focus(); area.select();
        showToast(T("toastCopySelect")); render();
      }
      return;
    }

    if (d.close) {
      var cx = T("confirmClose");
      ask(cx[0], cx[1], cx[2], function () {
        var s = stats();
        state.archives.push({
          closedAt: Date.now(), event: state.event || "Prodej",
          total: s.total, cash: s.cash, card: s.card, count: s.count, pieces: s.pieces, items: s.items
        });
        state.sales = [];
        state.nextNo = 1;
        save(); pushClear();
        showToast(T("toastClosed"));
      });
      return;
    }

    if (d["new"]) {
      state.items.push({ id: uid(), name: "", price: demoPrice(50), color: "" });
      save(); render();
      var all = document.querySelectorAll(".e-nm");
      if (all.length) { all[all.length - 1].focus(); }
      return;
    }

    if (d.rm) {
      var rid = d.rm;
      var item = findItem(rid);
      var ci2 = T("confirmDelItem");
      ask(ci2[0], ci2[1].split("{0}").join(item && item.name ? item.name : T("theItem")), ci2[2], function () {
        state.items = state.items.filter(function (i) { return i.id !== rid; });
        save();
      });
      return;
    }

    if (d.mv) {
      var idx = parseInt(d.mv, 10);
      if (idx <= 0) { return; }
      var moved = state.items.splice(idx, 1)[0];
      state.items.splice(idx - 1, 0, moved);
      save(); render(); return;
    }

    if (d.reset) {
      var cr = T("confirmReset");
      ask(cr[0], cr[1], cr[2], function () {
        state.items = defaultItems();
        save();
      });
      return;
    }

    // ---- fronta objednávek ----
    if (d.ticket) { sheet = { step: "ticket", id: d.ticket }; render(); return; }

    if (d.line) {
      var tk = findSale(sheet.id);
      if (!tk) { return; }
      var ln = tk.lines[parseInt(d.line, 10)];
      if (!ln) { return; }
      ln.ready = (ln.ready || 0) >= ln.qty ? 0 : (ln.ready || 0) + 1;
      tk.updatedAt = Date.now();
      save(); pushOrder(tk); render(); return;
    }

    if (d.serve) {
      var srv = findSale(d.serve);
      if (!srv) { return; }
      srv.status = "served";
      srv.servedAt = Date.now();
      srv.updatedAt = Date.now();
      srv.lines.forEach(function (l) { l.ready = l.qty; });
      sheet = null;
      save(); pushOrder(srv, true); render();
      showToast(T("toastServed", srv.no));
      return;
    }

    if (d.drop) {
      var gone = findSale(d.drop);
      if (!gone) { return; }
      var co = T("confirmDropOrder");
      ask(co[0].split("{0}").join(String(gone.no)), co[1], co[2], function () {
        state.sales = state.sales.filter(function (x) { return x.id !== gone.id; });
        save(); pushDelete([gone.id]);
      });
      return;
    }

    if (d.reopen) {
      var rop = findSale(d.reopen);
      if (!rop) { return; }
      rop.status = "open";
      rop.updatedAt = Date.now();
      save(); pushOrder(rop, true); render();
      showToast(T("toastReopened", rop.no));
      return;
    }

    // ---- barvy a role ----
    if (d.col) {
      var ci = findItem(d.col);
      sheet = { step: "color", id: d.col, current: ci ? ci.color : "" };
      wheelSeed(sheet.current);
      render(); return;
    }

    if (d.applycustom) {
      var cti = findItem(sheet.id);
      if (cti) { cti.color = wheelHex(); }
      sheet = null;
      save(); render(); return;
    }

    if (d.setcol) {
      var ct = findItem(sheet.id);
      if (ct) { ct.color = d.setcol === "-" ? "" : d.setcol; }
      sheet = null;
      save(); render(); return;
    }

    if (d.paircreate) {
      if (!isPro()) { sheet = { step: "paywall", reason: "pair" }; render(); return; }
      var abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", code = "";
      for (var ci = 0; ci < 5; ci++) { code += abc.charAt(Math.floor(Math.random() * abc.length)); }
      state.pair = code;
      save(); relayOpen(); render();
      sayHello(true);
      showToast(T("toastCode", code));
      return;
    }

    if (d.pairjoin) {
      var fld = document.getElementById("pairCode");
      var code2 = (fld ? fld.value : "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code2.length < 3) { showToast(T("toastEnterCode")); return; }
      state.pair = code2;
      save(); relayOpen(); render();
      sayHello(true);
      showToast(T("toastJoining", code2));
      return;
    }

    if (d.relaytest) { relayTest(); return; }

    if (d.resync) {
      pushEverything();
      showToast(T("toastResent"));
      return;
    }

    if (d.pairoff) {
      state.pair = "";
      peers = 0;
      relayClose();
      save(); render();
      return;
    }

    if (d.voice) {
      state.voice = !state.voice;
      save(); render();
      if (state.voice) { speak(T("speakVoiceOn")); }
      return;
    }

    if (d.voicetest) {
      speak(T("speakTest"));
      return;
    }

    if (d.mode) {
      state.mode = d.mode === "vydej" ? "vydej" : "kasa";
      state.order = [];
      linesOpen = false;
      save(); render();
      showToast(state.mode === "kasa" ? T("toastModeKasa") : T("toastModeVydej"));
      return;
    }

    if (d.backup) {
      sheet = { step: "text", title: T("backupHead"), body: JSON.stringify(state) };
      render(); return;
    }

    if (d.restoreask) { sheet = { step: "restore" }; render(); return; }

    // ---- jazyk, měna, tarif ----
    if (d.langsheet) { sheet = { step: "lang" }; render(); return; }
    if (d.cursheet) { sheet = { step: "currency" }; render(); return; }

    if (d.setlang) {
      state.lang = isLang(d.setlang) ? d.setlang : state.lang;
      moneyFmt = null; nfPlain = null;
      sheet = null;
      save(); render(); return;
    }

    if (d.setcur) {
      state.currency = d.setcur;
      moneyFmt = null; nfPlain = null;
      sheet = null;
      save(); render(); return;
    }

    if (d.paywall) { sheet = { step: "paywall", reason: d.paywall }; render(); return; }
    if (d.buy) { billingBuy(d.buy); return; }
    if (d.restorebuy) { billingRestore(); return; }

    // 7 klepnutí na verzi = vývojářské odemčení Pro (pro testování bez obchodu)
    if (d.devtap) {
      devTaps++;
      if (devTaps >= 7) {
        devTaps = 0;
        state.license = state.license === "pro-dev" ? "" : "pro-dev";
        save(); render();
        showToast(state.license ? T("devOn") : T("devOff"));
      }
      return;
    }

    // ---- onboarding ----
    if (d.oblang) { state.lang = d.oblang; moneyFmt = null; nfPlain = null; save(); render(); return; }
    if (d.obcur) { state.currency = d.obcur; moneyFmt = null; nfPlain = null; save(); render(); return; }
    if (d.obnext) { obStep = 2; render(); return; }
    if (d.obdemo || d.obempty) {
      state.items = d.obdemo ? defaultItems() : [];
      state.event = T("demoEvent");
      state.setup = true;
      obStep = 1;
      try { localStorage.setItem("kasa.setupDone", "1"); } catch (e) {}
      save(); render(true); return;
    }

    if (d.dorestore) {
      var box = document.getElementById("paste");
      var raw = box ? box.value.trim() : "";
      var next = parseState(raw);
      if (!next) {
        sheet.draft = raw;
        sheet.error = T("restoreBad");
        render(); return;
      }
      state = next;
      sheet = null;
      save(); pushClear(); pushEverything(); render();
      showToast(T("toastRestored"));
      return;
    }
  });

  // ---------- podržení karty = odebrání té jedné položky z účtu ----------
  // Obsluha se ukliká, podrží prst na kartě a řádek zmizí, bez rušení celého účtu.
  // HOLD_MS musí sedět s délkou přechodu u .prod.is-hold .hold v CSS.
  var HOLD_MS = 1000;
  var holdTimer = null, holdCard = null, holdX = 0, holdY = 0;

  function endHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdCard) { holdCard.classList.remove("is-hold"); holdCard = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    suppressClick = false;
    endHold();

    var card = ev.target && ev.target.closest ? ev.target.closest(".prod[data-add]") : null;
    if (!card) { return; }

    var id = card.getAttribute("data-add");
    var qty = 0;
    state.order.forEach(function (l) { if (l.ref === id) { qty += l.qty; } });
    if (!qty) { return; }

    holdCard = card;
    holdX = ev.clientX;
    holdY = ev.clientY;
    card.classList.add("is-hold");

    holdTimer = setTimeout(function () {
      var name = "";
      state.order = state.order.filter(function (l) {
        if (l.ref !== id) { return true; }
        name = l.name;
        return false;
      });
      if (!state.order.length) { linesOpen = false; }
      suppressClick = true;   // ať uvolnění prstu položku hned nepřidá zpátky
      endHold();
      save();
      render();
      showToast(T("toastRemoved", name));
      say(T("toastRemoved", name));
    }, HOLD_MS);
  });

  document.addEventListener("pointermove", function (ev) {
    if (!holdTimer) { return; }
    if (Math.abs(ev.clientX - holdX) > 10 || Math.abs(ev.clientY - holdY) > 10) { endHold(); }
  });
  ["pointerup", "pointercancel"].forEach(function (e) {
    document.addEventListener(e, endHold);
  });
  document.getElementById("view").addEventListener("scroll", endHold, { passive: true });
  document.addEventListener("contextmenu", function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest(".prod")) { ev.preventDefault(); }
  });

  // menu editing writes straight to state, without re-rendering (keeps the keyboard open)
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.dataset) { return; }

    if (el.id === "bizBox") {
      state.biz = el.value;
      save();
      return;
    }

    if (el.id === "docFrom" || el.id === "docTo") {
      if (sheet && sheet.step === "doc") {
        if (el.id === "docFrom") { sheet.from = el.value; } else { sheet.to = el.value; }
      }
      return;
    }

    if (el.id === "wlight") {
      wheelL = parseInt(el.value, 10) || 52;
      wheelImg = null;
      wheelPaint();
      wheelPreview();
      return;
    }

    if (el.id === "evName") {
      state.event = el.value;
      document.getElementById("topName").textContent = state.event || T("noName");
      save();
      return;
    }

    // rozepsanou zálohu držíme ve stavu, ať ji překreslení (třeba zhasnutí
    // hlášky) nesmaže z pole
    if (el.id === "paste" && sheet) {
      sheet.draft = el.value;
      sheet.error = "";
      return;
    }

    var nameId = el.dataset.nm;
    var priceId = el.dataset.pr;
    var item = findItem(nameId || priceId);
    if (!item) { return; }

    if (nameId) {
      item.name = el.value;
    } else {
      var num = parseFloat(String(el.value).replace(",", ".").replace(/[^0-9.]/g, ""));
      item.price = isNaN(num) ? 0 : mr(num);
    }
    save();
  });

  // keep the screen awake while the stand is open
  function keepAwake() {
    if (wakeAsked || !navigator.wakeLock || !navigator.wakeLock.request) { return; }
    wakeAsked = true;
    try {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; wakeAsked = false; });
      }, function () { wakeAsked = false; });
    } catch (e) { wakeAsked = false; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !wakeLock) { wakeAsked = false; keepAwake(); }
  });

  // ---------- boot ----------
  state = load();
  try {
    if (!state.setup && localStorage.getItem("kasa.setupDone")) { state.setup = true; }
  } catch (e) {}
  rebuildMoneyFmt();
  state.sales.forEach(function (s) { announced[s.id] = true; });
  render();

  relayOpen();

  dbInit(function () {
    dbSettled = true;
    dbRead(function (rec) {
      var backup = parseState(rec);
      // v zařízení nic není, ale záložní kopie ano → obnovit
      if (backup && isEmpty(state) && !isEmpty(backup)) {
        state = backup;
        render();
        showToast(T("toastDbRestore"));
      }
      save();
    });
  });
})();
</script>
