<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasa">
<meta name="theme-color" content="#FBFAF7">
<meta name="robots" content="noindex">
<title>Kasa na stánek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
</head>
<body>
<!-- APP:START -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#FBFAF7;
    --surface:#FFFFFF;
    --sunk:#F2EEE6;
    --ink:#15120E;
    --ink-2:#5F5749;
    --ink-3:#8C8474;
    --rule:#E4DFD5;
    --accent:#D6402A;
    --accent-dk:#B93520;
    --accent-tint:#FFF6F4;
    --cash:#0F7A4F;
    --card:#1D5BD6;
    --track:#EDE9E0;
    --r-tile:12px;
    --r-btn:10px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.35;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  /* ---------- shell ---------- */
  .shell{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--paper)}

  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(var(--safe-t) + 10px) 16px 10px;
    border-bottom:1px solid var(--rule);background:var(--paper);
    position:relative;z-index:3;
  }
  .top-name{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
  .top-total{text-align:right;flex:0 0 auto}
  .top-total .v{display:block;font-size:15px;margin-top:1px}

  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  /* ---------- tabs ---------- */
  .tabs{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--rule);background:var(--surface);
    padding-bottom:var(--safe-b);position:relative;z-index:3;
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 10px;background:none;border:0;
    font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);
  }
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent)}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px}
  @media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}

  .prod{
    position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
    min-height:80px;padding:10px 12px;text-align:left;
    background:var(--surface);border:1px solid var(--rule);border-bottom-width:2px;
    border-radius:var(--r-tile);
    transition:transform .06s ease,background .12s ease;
  }
  .prod:active{transform:scale(.97);background:var(--accent-tint)}
  .prod .nm{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  .prod .pr{font-size:14px;color:var(--ink-2)}
  .prod.is-on{border-color:var(--accent);background:var(--accent-tint)}
  .prod .badge{
    position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;
    display:grid;place-items:center;border-radius:12px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:12px;font-weight:700;
  }
  .prod.custom{border-style:dashed;border-bottom-width:1px;background:transparent;align-items:center;justify-content:center;text-align:center}
  .prod.custom .nm{color:var(--ink-2)}

  .hint{padding:8px 24px 24px;color:var(--ink-3);font-size:13px;text-align:center;line-height:1.5}

  /* ---------- order bar ---------- */
  .bar{border-top:1px solid var(--rule);background:var(--surface);position:relative;z-index:2}
  .bar-lines{max-height:34dvh;overflow-y:auto;border-bottom:1px solid var(--rule)}
  .line{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule)}
  .line:last-child{border-bottom:0}
  .line .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:64px;text-align:right}
  .step{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:2px}
  .step button{width:30px;height:30px;border:0;background:none;border-radius:999px;font-size:17px;font-weight:600;line-height:1;color:var(--ink)}
  .step button:active{background:#E2DCD0}
  .step .q{min-width:22px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700}

  .bar-main{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .bar-sum{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
  .bar-sum .c{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
  .bar-sum .t{display:block;font-size:24px;margin-top:1px}
  .btn-pay{
    flex:0 0 auto;padding:14px 20px;border:0;border-radius:var(--r-btn);
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-pay:disabled{background:var(--track);color:var(--ink-3)}
  .btn-pay:not(:disabled):active{transform:scale(.98);background:var(--accent-dk)}
  .btn-clear{flex:0 0 auto;padding:12px 6px;background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:600}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(21,18,14,.44);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(14px)}to{transform:translateY(0)}}
  .sheet{
    width:100%;max-width:640px;background:var(--paper);
    border-radius:18px 18px 0 0;border-top:1px solid var(--rule);
    padding:18px 16px calc(18px + var(--safe-b));
    max-height:92dvh;overflow-y:auto;animation:rise .18s ease;
  }
  @media (prefers-reduced-motion:reduce){.scrim,.sheet,.toast{animation:none}}
  .sheet h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .sheet .big{font-size:46px;line-height:1;margin:8px 0 2px}
  .sheet .sub{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
  .sheet .txt{width:100%;height:190px;margin-top:14px;padding:12px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-family:var(--mono);font-size:12px;line-height:1.5;resize:none}

  .pay2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .btn-m{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:20px 10px;border-radius:var(--r-tile);border:0;color:#fff;
    font-size:17px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-m svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .btn-m:active{transform:scale(.98)}
  .m-cash{background:var(--cash)}
  .m-card{background:var(--card)}

  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .key{padding:13px 4px;border-radius:var(--r-btn);border:1px solid var(--rule);background:var(--surface);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .key:active{background:var(--sunk)}
  .key.wide{grid-column:span 2}
  .key.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .recv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-tile)}
  .recv .lbl{font-size:13px;color:var(--ink-2);font-weight:600}
  .recv .val{font-size:20px}
  .recv.give{background:#F0F7F3;border-color:#BFE0D0}
  .recv.give .val{color:var(--cash)}
  .recv.short .val{color:var(--accent)}

  .btn-done{width:100%;margin-top:14px;padding:17px;border:0;border-radius:var(--r-btn);background:var(--ink);color:var(--paper);font-size:17px;font-weight:700}
  .btn-done:disabled{background:var(--track);color:var(--ink-3)}
  .btn-done:not(:disabled):active{transform:scale(.99)}
  .btn-done.warn{background:var(--accent)}
  .btn-ghost{width:100%;margin-top:8px;padding:13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:transparent;color:var(--ink-2);font-size:14px;font-weight:600}

  .paid{display:flex;align-items:center;gap:9px;margin-top:16px;padding:13px 14px;border-radius:var(--r-tile);font-size:15px;font-weight:600;color:#fff}
  .paid svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------- history ---------- */
  .sec{padding:18px 16px 0}
  .sec h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  .hero{padding:18px 16px 16px;border-bottom:1px solid var(--rule)}
  .hero .sum{font-size:44px;line-height:1;margin-top:6px}
  .hero .meta{margin:8px 0 0;font-size:13px;color:var(--ink-2)}

  .split{display:flex;gap:2px;margin-top:14px;height:10px}
  .split i{display:block;border-radius:2px}
  .split i:first-child{border-radius:5px 2px 2px 5px}
  .split i:last-child{border-radius:2px 5px 5px 2px}
  .split i:only-child{border-radius:5px}
  .sp-cash{background:var(--cash)}
  .sp-card{background:var(--card)}
  .legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
  .lg{display:flex;align-items:baseline;gap:7px;font-size:13px}
  .lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;transform:translateY(-1px)}
  .lg .k{color:var(--ink-2);font-weight:600}
  .lg .v{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

  .items{display:flex;flex-direction:column;gap:11px}
  .it .r{display:flex;align-items:baseline;gap:10px}
  .it .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .q{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .it .a{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
  .it .track{height:6px;margin-top:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .it .fill{height:100%;background:var(--accent);border-radius:3px}

  .tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
  .tx:last-child{border-bottom:0}
  .tx .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .tx .mid{flex:1;min-width:0}
  .tx .w{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tx .a{font-family:var(--mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .tx .del{border:0;background:none;color:var(--ink-3);font-size:19px;line-height:1;padding:6px 2px 6px 8px}

  .arch{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .arch .mid{flex:1;min-width:0}
  .arch .s{font-size:12px;color:var(--ink-3);margin-top:2px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;padding:18px 16px 28px}
  .act{flex:1 1 auto;padding:13px 14px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:14px;font-weight:600}
  .act:active{background:var(--sunk)}
  .act.danger{color:var(--accent);border-color:#F0C7BF}

  /* ---------- menu editor ---------- */
  .field{padding:0 16px 14px}
  .inp{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:15px}
  .inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  .edit{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 16px;border-bottom:1px solid var(--rule)}
  .edit .e-nm{flex:1;min-width:0;padding:10px 11px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:15px;font-weight:500}
  .edit .e-nm:focus{background:var(--surface);border-color:var(--rule);outline:none}
  .edit .e-pr{width:70px;flex:0 0 auto;padding:10px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:right;font-family:var(--mono);font-weight:700;font-size:14px}
  .edit .e-pr:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .edit .mv,.edit .rm{width:32px;height:34px;flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;border-radius:8px}
  .edit .mv:active,.edit .rm:active{background:var(--sunk)}
  .edit .rm{color:var(--accent);font-size:19px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));z-index:30;
    max-width:616px;margin:0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-radius:var(--r-tile);background:var(--ink);color:var(--paper);
    font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(21,18,14,.22);animation:rise .18s ease;
  }
  .toast .t{flex:1;min-width:0}
  .toast button{border:0;background:none;color:#FFB3A5;font-size:14px;font-weight:700;padding:4px 2px}
  .toast button.x{color:#9A9184;font-size:18px;line-height:1}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<div class="shell">
  <header class="top">
    <div>
      <span class="eyebrow">Kasa</span>
      <span class="top-name" id="topName">—</span>
    </div>
    <div class="top-total">
      <span class="eyebrow">Tržba</span>
      <span class="v num" id="topTotal">0 Kč</span>
    </div>
  </header>

  <main class="view" id="view"></main>

  <div id="barSlot"></div>

  <nav class="tabs" role="tablist" aria-label="Sekce">
    <button class="tab" role="tab" data-tab="sell" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
      Prodej
    </button>
    <button class="tab" role="tab" data-tab="history" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      Přehled
    </button>
    <button class="tab" role="tab" data-tab="menu" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><circle cx="8.5" cy="6" r="2"/><circle cx="15.5" cy="12" r="2"/><circle cx="8.5" cy="18" r="2"/></svg>
      Menu
    </button>
  </nav>
</div>

<div id="sheetSlot"></div>
<div id="toastSlot"></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var KEY = "kavakasa.v1";

  var DEFAULT_ITEMS = [
    { name: "Espresso",              price: 50 },
    { name: "Lungo",                 price: 60 },
    { name: "Cappuccino",            price: 70 },
    { name: "Caffe latte",           price: 80 },
    { name: "Ice latte",             price: 80 },
    { name: "Ice latte karamelové",  price: 90 },
    { name: "Ice latte kokosové",    price: 90 },
    { name: "Espresso tonic",        price: 70 },
    { name: "Ganucho grepresso",     price: 70 },
    { name: "Čaj",                   price: 30 }
  ];

  var NOTES = [10, 20, 50, 100, 200, 500, 1000];

  // ---------- state ----------

  var state = null;
  var view = "sell";
  var sheet = null;       // {step:'method'|'cash'|'card'|'custom'|'confirm'|'text', ...}
  var pending = null;     // callback for the confirm sheet
  var linesOpen = false;
  var toast = null;
  var toastTimer = null;
  var wakeLock = null;
  var wakeAsked = false;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function defaultItems() {
    return DEFAULT_ITEMS.map(function (i) { return { id: uid(), name: i.name, price: i.price }; });
  }

  function fresh() {
    return { v: 1, event: "Loučení s prázdninami", items: defaultItems(), order: [], sales: [], archives: [] };
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) { return fresh(); }
    try {
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.items)) { return fresh(); }
      d.order = Array.isArray(d.order) ? d.order : [];
      d.sales = Array.isArray(d.sales) ? d.sales : [];
      d.archives = Array.isArray(d.archives) ? d.archives : [];
      d.event = typeof d.event === "string" ? d.event : "";
      return d;
    } catch (e) { return fresh(); }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- helpers ----------

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var nf = new Intl.NumberFormat("cs-CZ", { maximumFractionDigits: 0 });
  function czk(n) { return nf.format(Math.round(n)) + " Kč"; }

  function clock(ts) {
    var d = new Date(ts);
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function orderTotal() {
    return state.order.reduce(function (s, l) { return s + l.price * l.qty; }, 0);
  }
  function orderCount() {
    return state.order.reduce(function (s, l) { return s + l.qty; }, 0);
  }
  function salesTotal() {
    return state.sales.reduce(function (s, t) { return s + t.total; }, 0);
  }

  function plural(n, one, few, many) {
    if (n === 1) { return one; }
    if (n >= 2 && n <= 4) { return few; }
    return many;
  }

  function say(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function findItem(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) { return state.items[i]; }
    }
    return null;
  }

  function refFor(name, price) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].name === name && state.items[i].price === price) { return state.items[i].id; }
    }
    return uid();
  }

  // ---------- order ----------

  function addToOrder(item) {
    var line = null;
    for (var i = 0; i < state.order.length; i++) {
      if (state.order[i].ref === item.id && state.order[i].price === item.price) { line = state.order[i]; break; }
    }
    if (line) { line.qty += 1; }
    else { state.order.push({ ref: item.id, name: item.name, price: item.price, qty: 1 }); }
    save();
    render();
    say(item.name + ", celkem " + czk(orderTotal()));
  }

  function bump(idx, delta) {
    var line = state.order[idx];
    if (!line) { return; }
    line.qty += delta;
    if (line.qty <= 0) { state.order.splice(idx, 1); }
    if (!state.order.length) { linesOpen = false; }
    save();
    render();
  }

  // ---------- sale ----------

  function commit() {
    var sale = {
      id: uid(),
      ts: Date.now(),
      method: sheet.method,
      total: sheet.total,
      lines: state.order.map(function (l) { return { name: l.name, price: l.price, qty: l.qty }; })
    };
    state.sales.push(sale);
    state.order = [];
    linesOpen = false;
    sheet = null;
    save();
    render();
    showToast("Uloženo · " + czk(sale.total) + " " + (sale.method === "cash" ? "hotově" : "kartou"), sale.id);
    say("Účet uložen.");
  }

  function undoSale(id) {
    var i = state.sales.length - 1;
    while (i >= 0 && state.sales[i].id !== id) { i--; }
    if (i < 0) { return; }
    var sale = state.sales.splice(i, 1)[0];
    state.order = sale.lines.map(function (l) {
      return { ref: refFor(l.name, l.price), name: l.name, price: l.price, qty: l.qty };
    });
    hideToast();
    save();
    render();
    say("Účet vrácen zpět na rozpracovaný.");
  }

  function showToast(text, undoId) {
    toast = { text: text, undo: undoId || null };
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { hideToast(); render(); }, 7000);
    render();
  }

  function hideToast() {
    toast = null;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  }

  function ask(title, text, okLabel, fn) {
    pending = fn;
    sheet = { step: "confirm", title: title, text: text, ok: okLabel };
    render();
  }

  // ---------- stats ----------

  function stats() {
    var s = { total: 0, cash: 0, card: 0, count: state.sales.length, pieces: 0, items: [] };
    var map = {};
    state.sales.forEach(function (t) {
      s.total += t.total;
      if (t.method === "cash") { s.cash += t.total; } else { s.card += t.total; }
      t.lines.forEach(function (l) {
        var k = l.name + "|" + l.price;
        if (!map[k]) { map[k] = { name: l.name, price: l.price, qty: 0, sum: 0 }; }
        map[k].qty += l.qty;
        map[k].sum += l.qty * l.price;
        s.pieces += l.qty;
      });
    });
    Object.keys(map).forEach(function (k) { s.items.push(map[k]); });
    s.items.sort(function (a, b) { return b.sum - a.sum || b.qty - a.qty; });
    return s;
  }

  function summaryText() {
    var s = stats();
    var out = [];
    out.push(state.event || "Prodej");
    out.push(new Date().toLocaleDateString("cs-CZ") + " " + clock(Date.now()));
    out.push("");
    out.push("Tržba celkem: " + czk(s.total));
    out.push("  hotově: " + czk(s.cash));
    out.push("  kartou: " + czk(s.card));
    out.push("Účtů: " + s.count + " · kusů: " + s.pieces);
    out.push("");
    s.items.forEach(function (i) {
      out.push(i.qty + "x " + i.name + " a " + czk(i.price) + " = " + czk(i.sum));
    });
    return out.join("\n");
  }

  // ---------- views ----------

  function renderSell() {
    var h = '<div class="grid">';
    state.items.forEach(function (it) {
      var qty = 0;
      state.order.forEach(function (l) { if (l.ref === it.id) { qty += l.qty; } });
      h += '<button class="prod' + (qty ? " is-on" : "") + '" data-add="' + it.id + '">' +
             (qty ? '<span class="badge">' + qty + "</span>" : "") +
             '<span class="nm">' + esc(it.name) + "</span>" +
             '<span class="pr num">' + czk(it.price) + "</span>" +
           "</button>";
    });
    h += '<button class="prod custom" data-custom="1"><span class="nm">+ Jiná částka</span></button></div>';
    if (!state.items.length) {
      h += '<p class="hint">Zatím tu nejsou žádné položky.<br>Přidej si je v záložce Menu.</p>';
    }
    return h;
  }

  function renderBar() {
    var n = orderCount();
    var h = '<div class="bar">';

    if (linesOpen && state.order.length) {
      h += '<div class="bar-lines">';
      state.order.forEach(function (l, i) {
        h += '<div class="line"><span class="nm">' + esc(l.name) + "</span>" +
               '<span class="step">' +
                 '<button data-step="' + i + '" data-d="-1" aria-label="Ubrat">−</button>' +
                 '<span class="q">' + l.qty + "</span>" +
                 '<button data-step="' + i + '" data-d="1" aria-label="Přidat">+</button>' +
               "</span>" +
               '<span class="amt">' + czk(l.price * l.qty) + "</span></div>";
      });
      h += "</div>";
    }

    h += '<div class="bar-main">';
    if (state.order.length) {
      h += '<button class="bar-sum" data-toggle="1" aria-expanded="' + (linesOpen ? "true" : "false") + '">' +
             '<span class="c">' + n + " " + plural(n, "položka", "položky", "položek") +
             (linesOpen ? " · skrýt" : " · upravit") + "</span>" +
             '<span class="t num">' + czk(orderTotal()) + "</span></button>" +
           '<button class="btn-clear" data-clearask="1">Zrušit</button>' +
           '<button class="btn-pay" data-pay="1">Zaplatit</button>';
    } else {
      h += '<div class="bar-sum"><span class="c">Nový účet</span>' +
           '<span class="t num" style="color:var(--ink-3)">0 Kč</span></div>' +
           '<button class="btn-pay" disabled>Zaplatit</button>';
    }
    return h + "</div></div>";
  }

  function renderHistory() {
    var s = stats();
    var h = '<section class="hero"><span class="eyebrow">Tržba celkem</span>' +
            '<div class="sum num">' + czk(s.total) + "</div>" +
            '<p class="meta">' + s.count + " " + plural(s.count, "účet", "účty", "účtů") + " · " +
            s.pieces + " " + plural(s.pieces, "kus", "kusy", "kusů") + "</p>";

    if (s.total > 0) {
      var pc = Math.round((s.cash / s.total) * 100);
      h += '<div class="split" role="img" aria-label="Hotově ' + czk(s.cash) + ", kartou " + czk(s.card) + '">';
      if (s.cash > 0) { h += '<i class="sp-cash" style="width:' + pc + '%"></i>'; }
      if (s.card > 0) { h += '<i class="sp-card" style="flex:1"></i>'; }
      h += "</div>";
    }
    h += '<div class="legend">' +
           '<span class="lg"><i class="sp-cash"></i><span class="k">Hotově</span><span class="v">' + czk(s.cash) + "</span></span>" +
           '<span class="lg"><i class="sp-card"></i><span class="k">Kartou</span><span class="v">' + czk(s.card) + "</span></span>" +
         "</div></section>";

    if (s.items.length) {
      var max = s.items[0].sum || 1;
      h += '<section class="sec"><h2>Co se prodalo</h2><div class="items">';
      s.items.forEach(function (i) {
        h += '<div class="it"><div class="r"><span class="nm">' + esc(i.name) + "</span>" +
             '<span class="q">' + i.qty + "×</span>" +
             '<span class="a">' + czk(i.sum) + "</span></div>" +
             '<div class="track"><div class="fill" style="width:' + Math.max(2, (i.sum / max) * 100) + '%"></div></div></div>';
      });
      h += "</div></section>";
    } else {
      h += '<p class="hint" style="padding-top:28px">Zatím nic neprodáno.<br>Jakmile uložíš první účet, objeví se tu statistika.</p>';
    }

    if (state.sales.length) {
      h += '<section class="sec"><h2>Účtenky</h2>';
      state.sales.slice().reverse().forEach(function (t) {
        var what = t.lines.map(function (l) { return l.qty + "× " + l.name; }).join(", ");
        h += '<div class="tx"><i class="dot ' + (t.method === "cash" ? "sp-cash" : "sp-card") + '"></i>' +
             '<div class="mid"><div class="w">' + esc(what) + "</div>" +
             '<div class="s">' + clock(t.ts) + " · " + (t.method === "cash" ? "hotově" : "kartou") + "</div></div>" +
             '<span class="a">' + czk(t.total) + "</span>" +
             '<button class="del" data-del="' + t.id + '" aria-label="Smazat účtenku">×</button></div>';
      });
      h += "</section>";
    }

    if (state.archives.length) {
      h += '<section class="sec"><h2>Uzavřené akce</h2>';
      state.archives.slice().reverse().forEach(function (a) {
        h += '<div class="arch"><div class="mid"><div>' + esc(a.event) + "</div>" +
             '<div class="s">' + new Date(a.closedAt).toLocaleDateString("cs-CZ") + " · " +
             a.count + " " + plural(a.count, "účet", "účty", "účtů") + " · hotově " + czk(a.cash) +
             ", kartou " + czk(a.card) + "</div></div>" +
             '<span class="num">' + czk(a.total) + "</span></div>";
      });
      h += "</section>";
    }

    return h + '<div class="acts"><button class="act" data-copy="1">Zobrazit souhrn</button>' +
           (state.sales.length ? '<button class="act danger" data-close="1">Uzavřít akci</button>' : "") + "</div>";
  }

  function renderMenu() {
    var h = '<div class="sec"><h2>Název akce</h2></div>' +
            '<div class="field"><input class="inp" id="evName" value="' + esc(state.event) + '" placeholder="Např. Loučení s prázdninami"></div>' +
            '<div class="sec"><h2>Položky a ceny</h2></div>';

    state.items.forEach(function (it, i) {
      h += '<div class="edit">' +
             '<input class="e-nm" data-nm="' + it.id + '" value="' + esc(it.name) + '" placeholder="Název">' +
             '<input class="e-pr" data-pr="' + it.id + '" inputmode="numeric" value="' + it.price + '" aria-label="Cena v korunách">' +
             '<button class="mv" data-mv="' + i + '" aria-label="Posunout nahoru"' + (i === 0 ? " disabled style=\"opacity:.25\"" : "") + ">↑</button>" +
             '<button class="rm" data-rm="' + it.id + '" aria-label="Smazat položku">×</button></div>';
    });

    return h + '<div class="acts"><button class="act" data-new="1">+ Přidat položku</button>' +
           '<button class="act danger" data-reset="1">Obnovit výchozí menu</button></div>' +
           '<p class="hint">Ceny se ukládají průběžně. Změna ceny neovlivní už uložené účtenky.</p>';
  }

  function renderSheet() {
    if (!sheet) { return ""; }
    var h = '<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true">';

    if (sheet.step === "method") {
      var n = orderCount();
      h += "<h2>K zaplacení</h2><div class=\"big num\">" + czk(sheet.total) + "</div>" +
           '<p class="sub">' + n + " " + plural(n, "položka", "položky", "položek") + "</p>" +
           '<div class="pay2">' +
             '<button class="btn-m m-cash" data-method="cash"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>Hotově</button>' +
             '<button class="btn-m m-card" data-method="card"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Kartou</button>' +
           "</div><button class=\"btn-ghost\" data-cancel=\"1\">Zpět na účet</button>";
    }

    if (sheet.step === "cash") {
      var back = sheet.received - sheet.total;
      h += "<h2>Hotově</h2><div class=\"big num\">" + czk(sheet.total) + "</div>" +
           '<p class="sub">Naťukej, co ti dal — spočítám, kolik vrátit. Nebo rovnou Hotovo.</p>' +
           '<div class="keys"><button class="key wide' + (sheet.received && sheet.received === sheet.total ? " on" : "") +
             '" data-exact="1">Přesně</button><button class="key wide" data-zero="1">Vynulovat</button>';
      NOTES.forEach(function (v) { h += '<button class="key" data-note="' + v + '">' + v + "</button>"; });
      h += "</div>";
      if (sheet.received > 0) {
        h += '<div class="recv"><span class="lbl">Dostal jsem</span><span class="val num">' + czk(sheet.received) + "</span></div>";
        h += back >= 0
          ? '<div class="recv give"><span class="lbl">Vrátit</span><span class="val num">' + czk(back) + "</span></div>"
          : '<div class="recv short"><span class="lbl">Chybí ještě</span><span class="val num">' + czk(-back) + "</span></div>";
      }
      h += '<button class="btn-done" data-commit="1">Hotovo</button>' +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "card") {
      h += "<h2>Kartou</h2><div class=\"big num\">" + czk(sheet.total) + "</div>" +
           '<p class="sub">Naúčtuj částku na terminálu a potvrď.</p>' +
           '<div class="paid m-card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' +
           czk(sheet.total) + " na terminál</div>" +
           '<button class="btn-done" data-commit="1">Hotovo</button>' +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "custom") {
      h += "<h2>Jiná částka</h2><div class=\"big num\">" + czk(sheet.amount) + "</div>" +
           '<p class="sub">Přidá se na účet jako jednorázová položka.</p><div class="keys">';
      ["1", "2", "3", "4", "5", "6", "7", "8", "9"].forEach(function (d) {
        h += '<button class="key" data-dig="' + d + '">' + d + "</button>";
      });
      h += '<button class="key" data-dig="0">0</button>' +
           '<button class="key" data-dig="00">00</button>' +
           '<button class="key" data-back="1" aria-label="Smazat číslici">←</button></div>' +
           '<button class="btn-done" data-addcustom="1"' + (sheet.amount > 0 ? "" : " disabled") + ">Přidat na účet</button>" +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "confirm") {
      h += "<h2>" + esc(sheet.title) + "</h2>" +
           '<p class="sub" style="font-size:15px;margin-top:10px">' + esc(sheet.text) + "</p>" +
           '<button class="btn-done warn" data-yes="1">' + esc(sheet.ok) + "</button>" +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "text") {
      h += "<h2>" + esc(sheet.title) + "</h2>" +
           '<textarea class="txt" readonly id="dump">' + esc(sheet.body) + "</textarea>" +
           '<button class="btn-done" data-copytext="1">Zkopírovat</button>' +
           '<button class="btn-ghost" data-cancel="1">Zavřít</button>';
    }

    return h + "</div></div>";
  }

  // ---------- render ----------

  function render(toTop) {
    document.getElementById("topName").textContent = state.event || "Bez názvu";
    document.getElementById("topTotal").textContent = czk(salesTotal());

    var v = document.getElementById("view");
    var keep = v.scrollTop;
    v.innerHTML = view === "sell" ? renderSell() : view === "history" ? renderHistory() : renderMenu();
    v.scrollTop = toTop ? 0 : keep;

    document.getElementById("barSlot").innerHTML = view === "sell" ? renderBar() : "";
    document.getElementById("sheetSlot").innerHTML = renderSheet();
    document.getElementById("toastSlot").innerHTML = toast
      ? '<div class="toast"><span class="t">' + esc(toast.text) + "</span>" +
        (toast.undo ? '<button data-undo="' + toast.undo + '">Vrátit zpět</button>' : "") +
        '<button class="x" data-hidetoast="1" aria-label="Zavřít">×</button></div>'
      : "";

    var tabs = document.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute("aria-selected", tabs[i].getAttribute("data-tab") === view ? "true" : "false");
    }
  }

  // ---------- interaction ----------

  var SEL = "[data-tab],[data-add],[data-custom],[data-step],[data-toggle],[data-clearask],[data-pay]," +
            "[data-method],[data-note],[data-exact],[data-zero],[data-commit],[data-cancel],[data-scrim]," +
            "[data-dig],[data-back],[data-addcustom],[data-del],[data-copy],[data-copytext],[data-close]," +
            "[data-new],[data-rm],[data-mv],[data-reset],[data-undo],[data-hidetoast],[data-yes]";

  document.addEventListener("click", function (ev) {
    var t = ev.target && ev.target.closest ? ev.target.closest(SEL) : null;
    if (!t) { return; }
    var d = t.dataset;

    keepAwake();

    // a tap on the sheet body (not on a control) must not close it
    if (d.scrim && t !== ev.target) { return; }

    if (d.tab) { view = d.tab; linesOpen = false; render(true); return; }

    if (d.add) {
      var it = findItem(d.add);
      if (it) { addToOrder(it); }
      return;
    }

    if (d.custom) { sheet = { step: "custom", amount: 0 }; render(); return; }
    if (d.dig) {
      sheet.amount = Math.min(999999, parseInt(String(sheet.amount) + d.dig, 10) || 0);
      render(); return;
    }
    if (d.back) { sheet.amount = Math.floor(sheet.amount / 10); render(); return; }
    if (d.addcustom) {
      state.order.push({ ref: uid(), name: "Jiná položka", price: sheet.amount, qty: 1 });
      sheet = null; save(); render(); return;
    }

    if (d.step) { bump(parseInt(d.step, 10), parseInt(d.d, 10)); return; }
    if (d.toggle) { linesOpen = !linesOpen; render(); return; }

    if (d.clearask) {
      ask("Zrušit účet", "Rozpracovaný účet se smaže. Uložené účtenky zůstanou.", "Zrušit účet", function () {
        state.order = []; linesOpen = false; save();
      });
      return;
    }

    if (d.pay) { sheet = { step: "method", total: orderTotal(), method: null, received: 0 }; render(); return; }
    if (d.method) { sheet.method = d.method; sheet.step = d.method; render(); return; }
    if (d.note) { sheet.received += parseInt(d.note, 10); render(); return; }
    if (d.exact) { sheet.received = sheet.total; render(); return; }
    if (d.zero) { sheet.received = 0; render(); return; }
    if (d.commit) { commit(); return; }

    if (d.yes) {
      var fn = pending;
      pending = null;
      sheet = null;
      if (fn) { fn(); }
      render();
      return;
    }

    if (d.cancel || d.scrim) {
      if (sheet && (sheet.step === "cash" || sheet.step === "card")) {
        sheet.step = "method"; sheet.received = 0;
      } else {
        sheet = null; pending = null;
      }
      render(); return;
    }

    if (d.undo) { undoSale(d.undo); return; }
    if (d.hidetoast) { hideToast(); render(); return; }

    if (d.del) {
      var id = d.del;
      ask("Smazat účtenku", "Částka se odečte z tržby i ze statistiky.", "Smazat", function () {
        state.sales = state.sales.filter(function (s) { return s.id !== id; });
        save();
      });
      return;
    }

    if (d.copy) {
      sheet = { step: "text", title: "Souhrn prodeje", body: summaryText() };
      render(); return;
    }

    if (d.copytext) {
      var body = sheet.body;
      var area = document.getElementById("dump");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(body).then(function () {
          sheet = null; render(); showToast("Souhrn zkopírován"); render();
        }, function () {
          if (area) { area.focus(); area.select(); }
          showToast("Nešlo zkopírovat — označ text a zkopíruj ručně"); render();
        });
      } else if (area) {
        area.focus(); area.select();
        showToast("Označeno — zkopíruj přes nabídku Kopírovat"); render();
      }
      return;
    }

    if (d.close) {
      ask("Uzavřít akci", "Tržba se odloží do přehledu uzavřených akcí a kasa se vynuluje pro další prodej.", "Uzavřít akci", function () {
        var s = stats();
        state.archives.push({
          closedAt: Date.now(), event: state.event || "Prodej",
          total: s.total, cash: s.cash, card: s.card, count: s.count, pieces: s.pieces, items: s.items
        });
        state.sales = [];
        save();
        showToast("Akce uzavřena, kasa je vynulovaná.");
      });
      return;
    }

    if (d["new"]) {
      state.items.push({ id: uid(), name: "", price: 50 });
      save(); render();
      var all = document.querySelectorAll(".e-nm");
      if (all.length) { all[all.length - 1].focus(); }
      return;
    }

    if (d.rm) {
      var rid = d.rm;
      var item = findItem(rid);
      ask("Smazat položku", "Smazat „" + (item && item.name ? item.name : "položku") + "“ z menu? Prodeje zůstanou v přehledu.", "Smazat", function () {
        state.items = state.items.filter(function (i) { return i.id !== rid; });
        save();
      });
      return;
    }

    if (d.mv) {
      var idx = parseInt(d.mv, 10);
      if (idx <= 0) { return; }
      var moved = state.items.splice(idx, 1)[0];
      state.items.splice(idx - 1, 0, moved);
      save(); render(); return;
    }

    if (d.reset) {
      ask("Obnovit výchozí menu", "Celý seznam položek se nahradí výchozím. Uložené prodeje zůstanou.", "Obnovit", function () {
        state.items = defaultItems();
        save();
      });
      return;
    }
  });

  // menu editing writes straight to state, without re-rendering (keeps the keyboard open)
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.dataset) { return; }

    if (el.id === "evName") {
      state.event = el.value;
      document.getElementById("topName").textContent = state.event || "Bez názvu";
      save();
      return;
    }

    var nameId = el.dataset.nm;
    var priceId = el.dataset.pr;
    var item = findItem(nameId || priceId);
    if (!item) { return; }

    if (nameId) {
      item.name = el.value;
    } else {
      var n = parseInt(String(el.value).replace(/[^0-9]/g, ""), 10);
      item.price = isNaN(n) ? 0 : n;
    }
    save();
  });

  // keep the screen awake while the stand is open
  function keepAwake() {
    if (wakeAsked || !navigator.wakeLock || !navigator.wakeLock.request) { return; }
    wakeAsked = true;
    try {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; wakeAsked = false; });
      }, function () { wakeAsked = false; });
    } catch (e) { wakeAsked = false; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !wakeLock) { wakeAsked = false; keepAwake(); }
  });

  // ---------- boot ----------
  state = load();
  save();
  render();
})();
</script>
