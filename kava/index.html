<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasa">
<meta name="theme-color" content="#FBFAF7">
<meta name="robots" content="noindex">
<title>Kasa na stánek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
</head>
<body>
<!-- APP:START -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#FBFAF7;
    --surface:#FFFFFF;
    --sunk:#F2EEE6;
    --ink:#15120E;
    --ink-2:#5F5749;
    --ink-3:#8C8474;
    --rule:#E4DFD5;
    --accent:#D6402A;
    --accent-dk:#B93520;
    --accent-tint:#FFF6F4;
    --cash:#0F7A4F;
    --card:#1D5BD6;
    --track:#EDE9E0;
    --r-tile:12px;
    --r-btn:10px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.35;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  /* ---------- shell ---------- */
  .shell{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--paper)}

  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(var(--safe-t) + 10px) 16px 10px;
    border-bottom:1px solid var(--rule);background:var(--paper);
    position:relative;z-index:3;
  }
  .top-name{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
  .top-total{text-align:right;flex:0 0 auto}
  .top-total .v{display:block;font-size:15px;margin-top:1px}

  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  /* ---------- tabs ---------- */
  .tabs{
    display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    border-top:1px solid var(--rule);background:var(--surface);
    padding-bottom:var(--safe-b);position:relative;z-index:3;
  }
  .tab{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 10px;background:none;border:0;
    font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);
  }
  .tab .dot{
    position:absolute;top:4px;left:50%;margin-left:6px;
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:11px;font-weight:700;
    display:grid;place-items:center;
  }
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent)}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px}
  @media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}

  .prod{
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;gap:8px;
    min-height:80px;padding:10px 12px;text-align:left;
    background:var(--surface);border:1px solid var(--rule);border-bottom-width:2px;
    border-radius:var(--r-tile);
    -webkit-touch-callout:none;
    transition:transform .06s ease,background .12s ease;
  }
  .prod:active{transform:scale(.97);background:var(--accent-tint)}

  /* podržení = odebrání položky z účtu; pruh ukazuje, kolik zbývá */
  .prod .hold{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:left center}
  .prod.is-hold{background:var(--accent-tint);border-color:var(--accent)}
  .prod.is-hold .hold{transform:scaleX(1);transition:transform 1s linear}
  @media (prefers-reduced-motion:reduce){.prod.is-hold .hold{transition:none}}
  .prod .nm{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .prod .pr{font-size:14px;color:var(--ink-2)}
  .prod.is-on{border-color:var(--accent);background:var(--accent-tint)}
  .prod .badge{
    position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;
    display:grid;place-items:center;border-radius:12px;
    background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:12px;font-weight:700;
  }

  /* barevná karta — pozadí i barva textu jdou z palety inline stylem,
     zbytek se veze na currentColor, takže sedí na jakoukoliv barvu */
  .prod.tinted{border-color:rgba(0,0,0,.16)}
  .prod.tinted .pr{color:inherit;opacity:.85}
  .prod.tinted:active,.prod.tinted.is-hold{filter:brightness(.9)}
  .prod.tinted.is-on{border-color:rgba(0,0,0,.3);box-shadow:inset 0 0 0 3px currentColor}
  .prod.tinted .badge{background:currentColor;color:var(--bg)}
  .prod.tinted .hold{background:currentColor}
  .prod.custom{border-style:dashed;border-bottom-width:1px;background:transparent;align-items:center;justify-content:center;text-align:center}
  .prod.custom .nm{color:var(--ink-2)}

  .hint{padding:8px 24px 24px;color:var(--ink-3);font-size:13px;text-align:center;line-height:1.5}

  /* ---------- order bar ---------- */
  .bar{border-top:1px solid var(--rule);background:var(--surface);position:relative;z-index:2}
  .bar-lines{max-height:34dvh;overflow-y:auto;border-bottom:1px solid var(--rule)}
  .line{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule)}
  .line:last-child{border-bottom:0}
  .line .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:64px;text-align:right}
  .step{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:2px}
  .step button{width:30px;height:30px;border:0;background:none;border-radius:999px;font-size:17px;font-weight:600;line-height:1;color:var(--ink)}
  .step button:active{background:#E2DCD0}
  .step .q{min-width:22px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700}

  .bar-main{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .bar-sum{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
  .bar-sum .c{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
  .bar-sum .t{display:block;font-size:24px;margin-top:1px}
  .btn-pay{
    flex:0 0 auto;padding:14px 20px;border:0;border-radius:var(--r-btn);
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-pay:disabled{background:var(--track);color:var(--ink-3)}
  .btn-pay:not(:disabled):active{transform:scale(.98);background:var(--accent-dk)}
  .btn-clear{flex:0 0 auto;padding:12px 6px;background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:600}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(21,18,14,.44);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(14px)}to{transform:translateY(0)}}
  .sheet{
    width:100%;max-width:640px;background:var(--paper);
    border-radius:18px 18px 0 0;border-top:1px solid var(--rule);
    padding:18px 16px calc(18px + var(--safe-b));
    max-height:92dvh;overflow-y:auto;animation:rise .18s ease;
  }
  @media (prefers-reduced-motion:reduce){.scrim,.sheet,.toast{animation:none}}
  .sheet h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .sheet .big{font-size:46px;line-height:1;margin:8px 0 2px}
  .sheet .sub{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
  .sheet .txt{width:100%;height:190px;margin-top:14px;padding:12px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-family:var(--mono);font-size:12px;line-height:1.5;resize:none}

  .pay2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .btn-m{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:20px 10px;border-radius:var(--r-tile);border:0;color:#fff;
    font-size:17px;font-weight:700;letter-spacing:-.01em;
  }
  .btn-m svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .btn-m:active{transform:scale(.98)}
  .m-cash{background:var(--cash)}
  .m-card{background:var(--card)}

  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .key{padding:13px 4px;border-radius:var(--r-btn);border:1px solid var(--rule);background:var(--surface);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .key:active{background:var(--sunk)}
  .key.wide{grid-column:span 2}
  .key.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .recv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-tile)}
  .recv .lbl{font-size:13px;color:var(--ink-2);font-weight:600}
  .recv .val{font-size:20px}
  .recv.give{background:#F0F7F3;border-color:#BFE0D0}
  .recv.give .val{color:var(--cash)}
  .recv.short .val{color:var(--accent)}

  .btn-done{width:100%;margin-top:14px;padding:17px;border:0;border-radius:var(--r-btn);background:var(--ink);color:var(--paper);font-size:17px;font-weight:700}
  .btn-done:disabled{background:var(--track);color:var(--ink-3)}
  .btn-done:not(:disabled):active{transform:scale(.99)}
  .btn-done.warn{background:var(--accent)}
  .btn-done.go{background:var(--cash)}
  .btn-ghost{width:100%;margin-top:8px;padding:13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:transparent;color:var(--ink-2);font-size:14px;font-weight:600}

  .paid{display:flex;align-items:center;gap:9px;margin-top:16px;padding:13px 14px;border-radius:var(--r-tile);font-size:15px;font-weight:600;color:#fff}
  .paid svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------- history ---------- */
  .sec{padding:18px 16px 0}
  .sec h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  .hero{padding:18px 16px 16px;border-bottom:1px solid var(--rule)}
  .hero .sum{font-size:44px;line-height:1;margin-top:6px}
  .hero .meta{margin:8px 0 0;font-size:13px;color:var(--ink-2)}

  .split{display:flex;gap:2px;margin-top:14px;height:10px}
  .split i{display:block;border-radius:2px}
  .split i:first-child{border-radius:5px 2px 2px 5px}
  .split i:last-child{border-radius:2px 5px 5px 2px}
  .split i:only-child{border-radius:5px}
  .sp-cash{background:var(--cash)}
  .sp-card{background:var(--card)}
  .legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
  .lg{display:flex;align-items:baseline;gap:7px;font-size:13px}
  .lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;transform:translateY(-1px)}
  .lg .k{color:var(--ink-2);font-weight:600}
  .lg .v{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

  .items{display:flex;flex-direction:column;gap:11px}
  .it .r{display:flex;align-items:baseline;gap:10px}
  .it .nm{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .q{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .it .a{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
  .it .track{height:6px;margin-top:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .it .fill{height:100%;background:var(--accent);border-radius:3px}

  .tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
  .tx:last-child{border-bottom:0}
  .tx .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .tx .mid{flex:1;min-width:0}
  .tx .w{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tx .a{font-family:var(--mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .tx .del{border:0;background:none;color:var(--ink-3);font-size:19px;line-height:1;padding:6px 2px 6px 8px}

  .arch{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .arch .mid{flex:1;min-width:0}
  .arch .s{font-size:12px;color:var(--ink-3);margin-top:2px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;padding:18px 16px 28px}
  .act{flex:1 1 auto;padding:13px 14px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:14px;font-weight:600}
  .act:active{background:var(--sunk)}
  .act.danger{color:var(--accent);border-color:#F0C7BF}
  .act.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- menu editor ---------- */
  .field{padding:0 16px 14px}
  .inp{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r-btn);background:var(--surface);font-size:15px}
  .inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  .edit{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 16px;border-bottom:1px solid var(--rule)}
  .edit .e-nm{flex:1;min-width:0;padding:10px 11px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:15px;font-weight:500}
  .edit .e-nm:focus{background:var(--surface);border-color:var(--rule);outline:none}
  .edit .e-pr{width:70px;flex:0 0 auto;padding:10px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:right;font-family:var(--mono);font-weight:700;font-size:14px}
  .edit .e-pr:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .edit .mv,.edit .rm{width:32px;height:34px;flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;border-radius:8px}
  .edit .mv:active,.edit .rm:active{background:var(--sunk)}
  .edit .rm{color:var(--accent);font-size:19px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));z-index:30;
    max-width:616px;margin:0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-radius:var(--r-tile);background:var(--ink);color:var(--paper);
    font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(21,18,14,.22);animation:rise .18s ease;
  }
  /* nad otevřeným oknem by hláška zakryla jeho tlačítka — jde nahoru */
  .toast.up{bottom:auto;top:calc(var(--safe-t) + 10px)}
  .toast .t{flex:1;min-width:0}
  .toast button{border:0;background:none;color:#FFB3A5;font-size:14px;font-weight:700;padding:4px 2px}
  .toast button.x{color:#9A9184;font-size:18px;line-height:1}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- fronta objednávek ---------- */
  .tickets{display:flex;flex-direction:column;gap:10px;padding:14px 16px 20px}
  .tk{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 14px;background:var(--surface);border:1px solid var(--rule);
    border-bottom-width:2px;border-radius:var(--r-tile);
  }
  .tk:active{transform:scale(.99);background:var(--sunk)}
  .tk.ready{border-color:var(--cash);background:#F2F8F5}
  .tk .no{
    flex:0 0 auto;min-width:46px;height:46px;padding:0 8px;display:grid;place-items:center;
    border-radius:10px;background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:19px;font-weight:700;
  }
  .tk.ready .no{background:var(--cash)}
  .tk .mid{flex:1;min-width:0}
  .tk .chips{display:flex;flex-wrap:wrap;gap:5px}
  .tk .time{margin-top:5px;font-size:12px;color:var(--ink-3)}
  .tk .prog{flex:0 0 auto;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink-2)}

  .chip{
    display:inline-flex;align-items:center;gap:4px;max-width:100%;
    padding:3px 8px;border-radius:999px;border:1px solid rgba(0,0,0,.12);
    background:var(--sunk);color:var(--ink);
    font-size:12px;font-weight:700;line-height:1.3;
  }
  .chip .q{font-family:var(--mono);opacity:.75}
  .chip.done{opacity:.4;text-decoration:line-through}

  /* položky v otevřené objednávce */
  .steps{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .st{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:13px 14px;border-radius:var(--r-tile);border:1px solid rgba(0,0,0,.14);
    font-size:16px;font-weight:700;
  }
  .st:active{filter:brightness(.92)}
  .st .nm{flex:1;min-width:0}
  .st .cnt{font-family:var(--mono);font-size:15px;opacity:.8}
  .st .box{
    flex:0 0 auto;width:26px;height:26px;border-radius:7px;
    border:2px solid currentColor;display:grid;place-items:center;
  }
  .st .box svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .st.done{opacity:.55}
  .st.done .box svg{opacity:1}
  .st.done .nm{text-decoration:line-through}

  .served{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
  .served .no{font-family:var(--mono);font-weight:700;color:var(--ink-3);min-width:34px}
  .served .w{flex:1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .served .back{font-size:12px;font-weight:600;color:var(--accent)}

  /* ---------- výběr barvy a přepínač režimu ---------- */
  .sw{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.18)}
  .sw:active{transform:scale(.94)}
  .sw.none{background:var(--surface);position:relative;overflow:hidden}
  .sw.none::after{content:"";position:absolute;left:-4px;top:13px;width:38px;height:1px;background:var(--ink-3);transform:rotate(-45deg)}

  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
  .swatches button{height:54px;border-radius:var(--r-tile);border:1px solid rgba(0,0,0,.18);font-size:12px;font-weight:700}
  .swatches button.on{box-shadow:inset 0 0 0 3px currentColor;border-color:rgba(0,0,0,.35)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 16px;border:1px solid var(--rule);border-radius:var(--r-btn);overflow:hidden;background:var(--surface)}

  <main class="view" id="view"></main>

</div>

<div id="sheetSlot"></div>
<div id="toastSlot"></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var KEY = "kavakasa.v1";

  // Paleta karet. Barva položce nese informaci sama o sobě — obsluha ji pozná
  // dřív, než stihne přečíst název — proto jsou odstíny vybrané tak, aby šly
  // rozeznat i vedle sebe, a ke každému je natvrdo daná barva textu, která na
  // něm má kontrast aspoň 4,75:1.
  var COLORS = [
    { k: "cervena",  n: "Červená",   bg: "#C0311B", ink: "#FFFFFF" },
    { k: "oranzova", n: "Oranžová",  bg: "#F08A24", ink: "#23150A" },
    { k: "zluta",    n: "Žlutá",     bg: "#F5CE3E", ink: "#241C00" },
    { k: "limetka",  n: "Limetka",   bg: "#A8C93A", ink: "#1C2405" },
    { k: "zelena",   n: "Zelená",    bg: "#127A4E", ink: "#FFFFFF" },
    { k: "mata",     n: "Máta",      bg: "#8FD9C0", ink: "#0C2A20" },
    { k: "tyrkys",   n: "Tyrkys",    bg: "#08627F", ink: "#FFFFFF" },
    { k: "nebeska",  n: "Nebeská",   bg: "#8EC4EE", ink: "#0A2033" },
    { k: "modra",    n: "Modrá",     bg: "#2158C4", ink: "#FFFFFF" },
    { k: "fialova",  n: "Fialová",   bg: "#8A2FA8", ink: "#FFFFFF" },
    { k: "ruzova",   n: "Růžová",    bg: "#F2A0C0", ink: "#351020" },
    { k: "purpur",   n: "Purpurová", bg: "#B62F72", ink: "#FFFFFF" },
    { k: "hneda",    n: "Hnědá",     bg: "#5C4632", ink: "#FFFFFF" },
    { k: "grafit",   n: "Grafit",    bg: "#262B33", ink: "#FFFFFF" }
  ];

  function colorOf(key) {
    for (var i = 0; i < COLORS.length; i++) { if (COLORS[i].k === key) { return COLORS[i]; } }
    return null;
  }

  var DEFAULT_ITEMS = [
    { name: "Espresso",              price: 50, color: "hneda" },
    { name: "Lungo",                 price: 60, color: "grafit" },
    { name: "Cappuccino",            price: 70, color: "oranzova" },
    { name: "Caffe latte",           price: 80, color: "zluta" },
    { name: "Ice latte",             price: 80, color: "nebeska" },
    { name: "Ice latte karamelové",  price: 90, color: "modra" },
    { name: "Ice latte kokosové",    price: 90, color: "mata" },
    { name: "Espresso tonic",        price: 70, color: "limetka" },
    { name: "Ganucho grepresso",     price: 70, color: "ruzova" },
    { name: "Čaj",                   price: 30, color: "zelena" }
  ];

  var NOTES = [10, 20, 50, 100, 200, 500, 1000];

  // ---------- state ----------

  var state = null;
  var view = "sell";
  var sheet = null;       // {step:'method'|'cash'|'card'|'custom'|'confirm'|'text', ...}
  var pending = null;     // callback for the confirm sheet
  var linesOpen = false;
  var toast = null;
  var toastTimer = null;
  var wakeLock = null;
  var wakeAsked = false;
  var suppressClick = false;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function defaultItems() {
    return DEFAULT_ITEMS.map(function (i) {
      return { id: uid(), name: i.name, price: i.price, color: i.color };
    });
  }

  function fresh() {
    return {
      v: 2, event: "Loučení s prázdninami", mode: "kasa", nextNo: 1, voice: true,
      items: defaultItems(), order: [], sales: [], archives: []
    };
  }

  // ---------- ukládání ----------
  // Tři nezávislé kopie, aby ani vybitý a restartovaný tablet o tržbu nepřipravil:
  //   1. localStorage — okamžitý zápis při každé změně
  //   2. IndexedDB    — přežije i to, když prohlížeč localStorage zahodí
  //   3. soubor v úložišti zařízení — když appka běží v nativním obalu (ios/)

  var DB_NAME = "kavakasa", DB_STORE = "state", DB_KEY = "current";
  var db = null, dbSettled = false, dbTimer = null;

  function parseState(raw) {
    if (!raw) { return null; }
    var d;
    try { d = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { return null; }
    if (!d || !Array.isArray(d.items)) { return null; }
    d.order = Array.isArray(d.order) ? d.order : [];
    d.sales = Array.isArray(d.sales) ? d.sales : [];
    d.archives = Array.isArray(d.archives) ? d.archives : [];
    d.event = typeof d.event === "string" ? d.event : "";
    d.savedAt = typeof d.savedAt === "number" ? d.savedAt : 0;
    d.mode = d.mode === "vydej" ? "vydej" : "kasa";
    d.voice = d.voice !== false;

    // položky uložené před zavedením barev je dostanou samy, každá jinou.
    // Prázdný řetězec je vědomá volba "bez barvy" — tu necháváme být.
    var used = {};
    d.items.forEach(function (it) { if (it.color) { used[it.color] = true; } });
    var next = 0;
    d.items.forEach(function (it) {
      if (typeof it.color !== "undefined") { return; }
      while (next < COLORS.length && used[COLORS[next].k]) { next++; }
      it.color = next < COLORS.length ? COLORS[next].k : "";
      if (it.color) { used[it.color] = true; next++; }
    });

    // účtenky z verze bez fronty doplníme, ať mají číslo a stav
    var maxNo = 0;
    d.sales.forEach(function (s, i) {
      if (typeof s.no !== "number") { s.no = i + 1; }
      if (s.no > maxNo) { maxNo = s.no; }
      s.status = s.status === "open" ? "open" : "served";
      s.updatedAt = typeof s.updatedAt === "number" ? s.updatedAt : (s.ts || 0);
      s.lines.forEach(function (l) {
        l.ready = typeof l.ready === "number" ? l.ready : l.qty;
      });
    });
    d.nextNo = typeof d.nextNo === "number" && d.nextNo > maxNo ? d.nextNo : maxNo + 1;
    return d;
  }

  function isEmpty(d) {
    return !d || (!d.sales.length && !d.archives.length && !d.order.length);
  }

  function load() {
    // v nativní aplikaci je zdrojem pravdy soubor v úložišti zařízení
    if (typeof window.__KASA_BOOT__ === "string" && window.__KASA_BOOT__) {
      var boot = parseState(window.__KASA_BOOT__);
      if (boot) { return boot; }
    }
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    return parseState(raw) || fresh();
  }

  function save() {
    state.savedAt = Date.now();
    var json;
    try { json = JSON.stringify(state); } catch (e) { return; }

    try { localStorage.setItem(KEY, json); } catch (e) {}

    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kasa) {
        window.webkit.messageHandlers.kasa.postMessage(json);
      }
    } catch (e) {}

    if (!dbSettled) { return; }
    if (dbTimer) { clearTimeout(dbTimer); }
    dbTimer = setTimeout(function () { dbWrite(json); }, 300);
  }

  function dbWrite(json) {
    if (!db) { return; }
    try { db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).put(json, DB_KEY); } catch (e) {}
  }

  function dbRead(cb) {
    if (!db) { cb(null); return; }
    try {
      var rq = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(DB_KEY);
      rq.onsuccess = function () { cb(rq.result || null); };
      rq.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }

  function dbInit(done) {
    var called = false;
    function settle() { if (!called) { called = true; done(); } }
    setTimeout(settle, 3000);
    var rq;
    try { rq = indexedDB.open(DB_NAME, 1); } catch (e) { settle(); return; }
    rq.onupgradeneeded = function () {
      try { rq.result.createObjectStore(DB_STORE); } catch (e) {}
    };
    rq.onsuccess = function () { db = rq.result; settle(); };
    rq.onerror = function () { settle(); };
    rq.onblocked = function () { settle(); };
  }

  // ---------- helpers ----------

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var nf = new Intl.NumberFormat("cs-CZ", { maximumFractionDigits: 0 });
  function czk(n) { return nf.format(Math.round(n)) + " Kč"; }

  function clock(ts) {
    var d = new Date(ts);
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function orderTotal() {
    return state.order.reduce(function (s, l) { return s + l.price * l.qty; }, 0);
  }
  function orderCount() {
    return state.order.reduce(function (s, l) { return s + l.qty; }, 0);
  }
  function salesTotal() {
    return state.sales.reduce(function (s, t) { return s + t.total; }, 0);
  }

  function plural(n, one, few, many) {
    if (n === 1) { return one; }
    if (n >= 2 && n <= 4) { return few; }
    return many;
  }

  function say(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function findItem(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) { return state.items[i]; }
    }
    return null;
  }

  function refFor(name, price) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].name === name && state.items[i].price === price) { return state.items[i].id; }
    }
    return uid();
  }

  // ---------- order ----------

  function addToOrder(item) {
    var line = null;
    for (var i = 0; i < state.order.length; i++) {
      if (state.order[i].ref === item.id && state.order[i].price === item.price) { line = state.order[i]; break; }
    }
    if (line) { line.qty += 1; }
    else { state.order.push({ ref: item.id, name: item.name, price: item.price, qty: 1, color: item.color }); }
    save();
    render();
    say(item.name + ", celkem " + czk(orderTotal()));
  }

  function bump(idx, delta) {
    var line = state.order[idx];
    if (!line) { return; }
    line.qty += delta;
    if (line.qty <= 0) { state.order.splice(idx, 1); }
    if (!state.order.length) { linesOpen = false; }
    save();
    render();
  }

  // ---------- sale ----------

  function commit() {
    var sale = {
      id: uid(),
      no: state.nextNo++,
      ts: Date.now(),
      updatedAt: Date.now(),
      method: sheet.method,
      total: sheet.total,
      status: "open",
      lines: state.order.map(function (l) {
        return { name: l.name, price: l.price, qty: l.qty, color: l.color || "", ready: 0 };
      })
    };
    state.sales.push(sale);
    state.order = [];
    linesOpen = false;
    sheet = null;
    pushSales();
    render();
    if (state.mode === "kasa" && state.voice) { sayThanks(); }
    showToast("Uloženo · " + czk(sale.total) + " " + (sale.method === "cash" ? "hotově" : "kartou"), sale.id);
    say("Účet uložen.");
  }

  function undoSale(id) {
    var i = state.sales.length - 1;
    while (i >= 0 && state.sales[i].id !== id) { i--; }
    if (i < 0) { return; }
    var sale = state.sales.splice(i, 1)[0];
    state.order = sale.lines.map(function (l) {
      return { ref: refFor(l.name, l.price), name: l.name, price: l.price, qty: l.qty, color: l.color || "" };
    });
    if (sale.no === state.nextNo - 1) { state.nextNo = sale.no; }
    hideToast();
    pushSales("replace");
    render();
    say("Účet vrácen zpět na rozpracovaný.");
  }

  // uloží a rozešle změnu do spárovaného zařízení
  function pushSales(kind) {
    save();
    if (!muted) { broadcast(kind); }
  }

  function showToast(text, undoId) {
    toast = { text: text, undo: undoId || null };
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { hideToast(); render(); }, 7000);
    render();
  }

  function hideToast() {
    toast = null;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  }

  function ask(title, text, okLabel, fn) {
    pending = fn;
    sheet = { step: "confirm", title: title, text: text, ok: okLabel };
    render();
  }

  // ---------- fronta objednávek ----------
  // Zaplacený účet nezmizí — zařadí se do fronty jako objednávka s číslem.
  // Kdo připravuje, odškrtává v ní položky a nakonec dá Vydáno.

  function openOrders() {
    return state.sales.filter(function (s) { return s.status === "open"; })
      .sort(function (a, b) { return a.no - b.no; });
  }

  function servedOrders() {
    return state.sales.filter(function (s) { return s.status !== "open"; })
      .sort(function (a, b) { return b.no - a.no; });
  }

  function findSale(id) {
    for (var i = 0; i < state.sales.length; i++) {
      if (state.sales[i].id === id) { return state.sales[i]; }
    }
    return null;
  }

  function pieces(s) {
    return s.lines.reduce(function (n, l) { return n + l.qty; }, 0);
  }

  function ready(s) {
    return s.lines.reduce(function (n, l) { return n + Math.min(l.ready || 0, l.qty); }, 0);
  }

  function allReady(s) { return ready(s) >= pieces(s); }

  function tint(key, fallback) {
    var c = colorOf(key);
    if (!c) { return fallback || ""; }
    return ' style="background:' + c.bg + ';color:' + c.ink + ';--bg:' + c.bg + '"';
  }

  // ---------- spárované zařízení ----------
  // Kasa a výdej si posílají celý seznam objednávek. Slučuje se podle id,
  // vyhrává novější updatedAt — pořadí zpráv tak nehraje roli.

  var peers = 0;
  var muted = false;
  var announced = {};      // id objednávek, které už zazněly

  // Nová objednávka se na výdeji přečte nahlas, ať se obsluha nemusí dívat.
  // iOS pustí hlas až po nějakém klepnutí — o to se stará tlačítko v Menu.
  function speak(text) {
    try {
      if (!window.speechSynthesis) { return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "cs-CZ";
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // Na kase zazní poděkování zákazníkovi, jakmile je účet hotový.
  function sayThanks() {
    var ev = (state.event || "").trim();
    var name = ev ? ev.charAt(0).toLowerCase() + ev.slice(1) : "";
    speak("Děkujeme za objednávku." + (name ? " Užijte si " + name + "." : ""));
  }

  function saySale(s) {
    var parts = ["Nová objednávka číslo " + s.no + "."];
    s.lines.forEach(function (l) {
      parts.push(l.qty > 1 ? l.qty + "krát " + l.name + "." : l.name + ".");
    });
    speak(parts.join(" "));
  }

  function broadcast(kind) {
    try {
      if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.peer) { return; }
      window.webkit.messageHandlers.peer.postMessage(JSON.stringify({
        t: kind || "sync", event: state.event, sales: state.sales
      }));
    } catch (e) {}
  }

  window.__kasaPeer = function (raw) {
    var msg = null;
    try { msg = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { return; }
    if (!msg || !Array.isArray(msg.sales)) { return; }

    var changed = false;

    if (msg.t === "replace") {
      state.sales = msg.sales;
      changed = true;
    } else {
      var mine = {};
      state.sales.forEach(function (s) { mine[s.id] = s; });
      msg.sales.forEach(function (inc) {
        var have = mine[inc.id];
        if (!have) { state.sales.push(inc); changed = true; return; }
        if ((inc.updatedAt || 0) > (have.updatedAt || 0)) {
          state.sales[state.sales.indexOf(have)] = inc;
          changed = true;
        }
      });
    }
    if (!changed) { return; }

    if (state.mode === "vydej" && state.voice) {
      state.sales.forEach(function (s) {
        if (s.status !== "open" || announced[s.id]) { return; }
        announced[s.id] = true;
        saySale(s);
      });
    }

    state.sales.sort(function (a, b) { return (a.no || 0) - (b.no || 0); });
    var maxNo = 0;
    state.sales.forEach(function (s) { if (s.no > maxNo) { maxNo = s.no; } });
    if (state.nextNo <= maxNo) { state.nextNo = maxNo + 1; }
    if (msg.event && state.mode === "vydej") { state.event = msg.event; }

    muted = true;              // příchozí změnu neposíláme hned zpátky
    save();
    muted = false;
    render();
  };

  window.__kasaPeerCount = function (n) {
    peers = n | 0;
    render();
    if (peers > 0) { broadcast(); }   // nový protějšek dostane rovnou celý stav
  };

  // ---------- stats ----------

  function stats() {
    var s = { total: 0, cash: 0, card: 0, count: state.sales.length, pieces: 0, items: [] };
    var map = {};
    state.sales.forEach(function (t) {
      s.total += t.total;
      if (t.method === "cash") { s.cash += t.total; } else { s.card += t.total; }
      t.lines.forEach(function (l) {
        var k = l.name + "|" + l.price;
        if (!map[k]) { map[k] = { name: l.name, price: l.price, qty: 0, sum: 0 }; }
        map[k].qty += l.qty;
        map[k].sum += l.qty * l.price;
        s.pieces += l.qty;
      });
    });
    Object.keys(map).forEach(function (k) { s.items.push(map[k]); });
    s.items.sort(function (a, b) { return b.sum - a.sum || b.qty - a.qty; });
    return s;
  }

  function summaryText() {
    var s = stats();
    var out = [];
    out.push(state.event || "Prodej");
    out.push(new Date().toLocaleDateString("cs-CZ") + " " + clock(Date.now()));
    out.push("");
    out.push("Tržba celkem: " + czk(s.total));
    out.push("  hotově: " + czk(s.cash));
    out.push("  kartou: " + czk(s.card));
    out.push("Účtů: " + s.count + " · kusů: " + s.pieces);
    out.push("");
    s.items.forEach(function (i) {
      out.push(i.qty + "x " + i.name + " a " + czk(i.price) + " = " + czk(i.sum));
    });
    return out.join("\n");
  }

  // ---------- views ----------

  function renderSell() {
    var h = '<div class="grid">';
    state.items.forEach(function (it) {
      var qty = 0;
      state.order.forEach(function (l) { if (l.ref === it.id) { qty += l.qty; } });
      h += '<button class="prod' + (qty ? " is-on" : "") + (it.color ? " tinted" : "") + '"' +
             tint(it.color) + ' data-add="' + it.id + '">' +
             (qty ? '<span class="badge">' + qty + "</span><span class=\"hold\"></span>" : "") +
             '<span class="nm">' + esc(it.name) + "</span>" +
             '<span class="pr num">' + czk(it.price) + "</span>" +
           "</button>";
    });
    h += '<button class="prod custom" data-custom="1"><span class="nm">+ Jiná částka</span></button></div>';
    if (!state.items.length) {
      h += '<p class="hint">Zatím tu nejsou žádné položky.<br>Přidej si je v záložce Menu.</p>';
    }
    return h;
  }

  function renderBar() {
    var n = orderCount();
    var h = '<div class="bar">';

    if (linesOpen && state.order.length) {
      h += '<div class="bar-lines">';
      state.order.forEach(function (l, i) {
        h += '<div class="line"><span class="nm">' + esc(l.name) + "</span>" +
               '<span class="step">' +
                 '<button data-step="' + i + '" data-d="-1" aria-label="Ubrat">−</button>' +
                 '<span class="q">' + l.qty + "</span>" +
                 '<button data-step="' + i + '" data-d="1" aria-label="Přidat">+</button>' +
               "</span>" +
               '<span class="amt">' + czk(l.price * l.qty) + "</span></div>";
      });
      h += "</div>";
    }

    h += '<div class="bar-main">';
    if (state.order.length) {
      h += '<button class="bar-sum" data-toggle="1" aria-expanded="' + (linesOpen ? "true" : "false") + '">' +
             '<span class="c">' + n + " " + plural(n, "položka", "položky", "položek") +
             (linesOpen ? " · skrýt" : " · upravit") + "</span>" +
             '<span class="t num">' + czk(orderTotal()) + "</span></button>" +
           '<button class="btn-clear" data-clearask="1">Zrušit</button>' +
           '<button class="btn-pay" data-pay="1">Zaplatit</button>';
    } else {
      h += '<div class="bar-sum"><span class="c">Nový účet</span>' +
           '<span class="t num" style="color:var(--ink-3)">0 Kč</span></div>' +
           '<button class="btn-pay" disabled>Zaplatit</button>';
    }
    return h + "</div></div>";
  }

  function renderOrders() {
    var open = openOrders();
    var h = "";

    if (!open.length) {
      h += '<p class="hint" style="padding-top:44px">Žádná objednávka nečeká.<br>' +
           (state.mode === "vydej"
             ? "Jakmile kasa něco naúčtuje, objeví se to tady."
             : "Zaplacené účty se sem zařadí samy.") + "</p>";
    } else {
      h += '<div class="tickets">';
      open.forEach(function (s) {
        h += '<button class="tk' + (allReady(s) ? " ready" : "") + '" data-ticket="' + s.id + '">' +
               '<span class="no">' + s.no + "</span>" +
               '<span class="mid"><span class="chips">';
        s.lines.forEach(function (l) {
          h += '<span class="chip' + ((l.ready || 0) >= l.qty ? " done" : "") + '"' + tint(l.color) + ">" +
               (l.qty > 1 ? '<span class="q">' + l.qty + "×</span>" : "") + esc(l.name) + "</span>";
        });
        h += '</span><span class="time">' + clock(s.ts) + "</span></span>" +
             '<span class="prog">' + ready(s) + "/" + pieces(s) + "</span></button>";
      });
      h += "</div>";
    }

    var done = servedOrders().slice(0, 8);
    if (done.length) {
      h += '<section class="sec"><h2>Vydané</h2>';
      done.forEach(function (s) {
        var what = s.lines.map(function (l) { return l.qty + "× " + l.name; }).join(", ");
        h += '<button class="served" data-reopen="' + s.id + '">' +
             '<span class="no">#' + s.no + "</span>" +
             '<span class="w">' + esc(what) + "</span>" +
             '<span class="back">Vrátit</span></button>';
      });
      h += "</section>";
    }
    return h;
  }

  function renderHistory() {
    var s = stats();
    var h = '<section class="hero"><span class="eyebrow">Tržba celkem</span>' +
            '<div class="sum num">' + czk(s.total) + "</div>" +
            '<p class="meta">' + s.count + " " + plural(s.count, "účet", "účty", "účtů") + " · " +
            s.pieces + " " + plural(s.pieces, "kus", "kusy", "kusů") + "</p>";

    if (s.total > 0) {
      var pc = Math.round((s.cash / s.total) * 100);
      h += '<div class="split" role="img" aria-label="Hotově ' + czk(s.cash) + ", kartou " + czk(s.card) + '">';
      if (s.cash > 0) { h += '<i class="sp-cash" style="width:' + pc + '%"></i>'; }
      if (s.card > 0) { h += '<i class="sp-card" style="flex:1"></i>'; }
      h += "</div>";
    }
    h += '<div class="legend">' +
           '<span class="lg"><i class="sp-cash"></i><span class="k">Hotově</span><span class="v">' + czk(s.cash) + "</span></span>" +
           '<span class="lg"><i class="sp-card"></i><span class="k">Kartou</span><span class="v">' + czk(s.card) + "</span></span>" +
         "</div></section>";

    if (s.items.length) {
      var max = s.items[0].sum || 1;
      h += '<section class="sec"><h2>Co se prodalo</h2><div class="items">';
      s.items.forEach(function (i) {
        h += '<div class="it"><div class="r"><span class="nm">' + esc(i.name) + "</span>" +
             '<span class="q">' + i.qty + "×</span>" +
             '<span class="a">' + czk(i.sum) + "</span></div>" +
             '<div class="track"><div class="fill" style="width:' + Math.max(2, (i.sum / max) * 100) + '%"></div></div></div>';
      });
      h += "</div></section>";
    } else {
      h += '<p class="hint" style="padding-top:28px">Zatím nic neprodáno.<br>Jakmile uložíš první účet, objeví se tu statistika.</p>';
    }

    if (state.sales.length) {
      h += '<section class="sec"><h2>Účtenky</h2>';
      state.sales.slice().reverse().forEach(function (t) {
        var what = t.lines.map(function (l) { return l.qty + "× " + l.name; }).join(", ");
        h += '<div class="tx"><i class="dot ' + (t.method === "cash" ? "sp-cash" : "sp-card") + '"></i>' +
             '<div class="mid"><div class="w">' + esc(what) + "</div>" +
             '<div class="s">' + clock(t.ts) + " · " + (t.method === "cash" ? "hotově" : "kartou") + "</div></div>" +
             '<span class="a">' + czk(t.total) + "</span>" +
             '<button class="del" data-del="' + t.id + '" aria-label="Smazat účtenku">×</button></div>';
      });
      h += "</section>";
    }

    if (state.archives.length) {
      h += '<section class="sec"><h2>Uzavřené akce</h2>';
      state.archives.slice().reverse().forEach(function (a) {
        h += '<div class="arch"><div class="mid"><div>' + esc(a.event) + "</div>" +
             '<div class="s">' + new Date(a.closedAt).toLocaleDateString("cs-CZ") + " · " +
             a.count + " " + plural(a.count, "účet", "účty", "účtů") + " · hotově " + czk(a.cash) +
             ", kartou " + czk(a.card) + "</div></div>" +
             '<span class="num">' + czk(a.total) + "</span></div>";
      });
      h += "</section>";
    }

    return h + '<div class="acts"><button class="act" data-copy="1">Zobrazit souhrn</button>' +
           (state.sales.length ? '<button class="act danger" data-close="1">Uzavřít akci</button>' : "") + "</div>";
  }

  function renderMenu() {
    var till = state.mode === "kasa";

    var h = '<div class="sec"><h2>Role zařízení</h2></div>' +
            '<div class="seg" role="group" aria-label="Role zařízení">' +
              '<button class="' + (till ? "on" : "") + '" data-mode="kasa">Kasa</button>' +
              '<button class="' + (till ? "" : "on") + '" data-mode="vydej">Výdej</button>' +
            "</div>" +
            '<p class="hint" style="padding-bottom:6px">' +
              (till
                ? "Tohle zařízení účtuje a posílá objednávky druhému."
                : "Tohle zařízení jenom přijímá objednávky a odškrtává je. Neúčtuje.") +
            "</p>" +
            '<div class="link' + (peers > 0 ? " on" : "") + '"><i></i>' +
              (peers > 0
                ? (peers === 1 ? "Spárováno s druhým zařízením" : "Spárováno se " + peers + " zařízeními")
                : "Druhé zařízení zatím nenalezeno") +
            "</div>" +
            '<div class="acts" style="padding-top:6px"><button class="act' + (state.voice ? " on" : "") +
              '" data-voice="1">' + (state.voice ? (till ? "Děkuje zákazníkovi ✓" : "Čte objednávky nahlas ✓") : (till ? "Poděkovat zákazníkovi" : "Číst objednávky nahlas")) + "</button>" +
              '<button class="act" data-voicetest="1">Zkusit hlas</button></div>';

    if (!till) {
      return h + '<p class="hint">Párování běží samo po místní síti, jakmile jsou obě zařízení' +
             ' zapnutá a blízko sebe. Funguje jen v nainstalované aplikaci z <code>ios/</code>,' +
             ' ne v prohlížeči.</p>' + renderBackupBlock();
    }

    h += '<div class="sec"><h2>Název akce</h2></div>' +
         '<div class="field"><input class="inp" id="evName" value="' + esc(state.event) + '" placeholder="Např. Loučení s prázdninami"></div>' +
         '<div class="sec"><h2>Položky, ceny a barvy</h2></div>';

    state.items.forEach(function (it, i) {
      var c = colorOf(it.color);
      h += '<div class="edit">' +
             '<button class="sw' + (c ? "" : " none") + '"' + (c ? ' style="background:' + c.bg + '"' : "") +
               ' data-col="' + it.id + '" aria-label="Barva karty"></button>' +
             '<input class="e-nm" data-nm="' + it.id + '" value="' + esc(it.name) + '" placeholder="Název">' +
             '<input class="e-pr" data-pr="' + it.id + '" inputmode="numeric" value="' + it.price + '" aria-label="Cena v korunách">' +
             '<button class="mv" data-mv="' + i + '" aria-label="Posunout nahoru"' + (i === 0 ? " disabled style=\"opacity:.25\"" : "") + ">↑</button>" +
             '<button class="rm" data-rm="' + it.id + '" aria-label="Smazat položku">×</button></div>';
    });

    return h + '<div class="acts"><button class="act" data-new="1">+ Přidat položku</button>' +
           '<button class="act danger" data-reset="1">Obnovit výchozí menu</button></div>' +
           '<p class="hint">Ceny i barvy se ukládají průběžně. Změna ceny neovlivní už uložené účtenky.</p>' +
           renderBackupBlock();
  }

  function renderBackupBlock() {
    return '<div class="sec"><h2>Záloha dat</h2></div>' +
           '<div class="acts"><button class="act" data-backup="1">Zobrazit zálohu</button>' +
           '<button class="act" data-restoreask="1">Načíst ze zálohy</button></div>' +
           '<p class="hint">Kasa si data drží v zařízení nadvakrát, takže restart ani vybitá baterie o ně nepřipraví.' +
           '<br>Zálohu si můžeš zkopírovat kamkoliv — do poznámek, do mailu — a kdykoliv z ní kasu obnovit.</p>';
  }

  function renderSheet() {
    if (!sheet) { return ""; }
    var h = '<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true">';

    if (sheet.step === "method") {
      var n = orderCount();
      h += "<h2>K zaplacení</h2><div class=\"big num\">" + czk(sheet.total) + "</div>" +
           '<p class="sub">' + n + " " + plural(n, "položka", "položky", "položek") + "</p>" +
           '<div class="pay2">' +
             '<button class="btn-m m-cash" data-method="cash"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>Hotově</button>' +
             '<button class="btn-m m-card" data-method="card"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Kartou</button>' +
           "</div><button class=\"btn-ghost\" data-cancel=\"1\">Zpět na účet</button>";
    }

    if (sheet.step === "cash") {
      var back = sheet.received - sheet.total;
      h += "<h2>Hotově</h2><div class=\"big num\">" + czk(sheet.total) + "</div>" +
           '<p class="sub">Naťukej, co ti dal — spočítám, kolik vrátit. Nebo rovnou Hotovo.</p>' +
           '<div class="keys"><button class="key wide' + (sheet.received && sheet.received === sheet.total ? " on" : "") +
             '" data-exact="1">Přesně</button><button class="key wide" data-zero="1">Vynulovat</button>';
      NOTES.forEach(function (v) { h += '<button class="key" data-note="' + v + '">' + v + "</button>"; });
      h += "</div>";
      if (sheet.received > 0) {
        h += '<div class="recv"><span class="lbl">Dostal jsem</span><span class="val num">' + czk(sheet.received) + "</span></div>";
        h += back >= 0
          ? '<div class="recv give"><span class="lbl">Vrátit</span><span class="val num">' + czk(back) + "</span></div>"
          : '<div class="recv short"><span class="lbl">Chybí ještě</span><span class="val num">' + czk(-back) + "</span></div>";
      }
      h += '<button class="btn-done" data-commit="1">Hotovo</button>' +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "card") {
      h += "<h2>Kartou</h2><div class=\"big num\">" + czk(sheet.total) + "</div>" +
           '<p class="sub">Naúčtuj částku na terminálu a potvrď.</p>' +
           '<div class="paid m-card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' +
           czk(sheet.total) + " na terminál</div>" +
           '<button class="btn-done" data-commit="1">Hotovo</button>' +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "custom") {
      h += "<h2>Jiná částka</h2><div class=\"big num\">" + czk(sheet.amount) + "</div>" +
           '<p class="sub">Přidá se na účet jako jednorázová položka.</p><div class="keys">';
      ["1", "2", "3", "4", "5", "6", "7", "8", "9"].forEach(function (d) {
        h += '<button class="key" data-dig="' + d + '">' + d + "</button>";
      });
      h += '<button class="key" data-dig="0">0</button>' +
           '<button class="key" data-dig="00">00</button>' +
           '<button class="key" data-back="1" aria-label="Smazat číslici">←</button></div>' +
           '<button class="btn-done" data-addcustom="1"' + (sheet.amount > 0 ? "" : " disabled") + ">Přidat na účet</button>" +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "confirm") {
      h += "<h2>" + esc(sheet.title) + "</h2>" +
           '<p class="sub" style="font-size:15px;margin-top:10px">' + esc(sheet.text) + "</p>" +
           '<button class="btn-done warn" data-yes="1">' + esc(sheet.ok) + "</button>" +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "text") {
      h += "<h2>" + esc(sheet.title) + "</h2>" +
           '<textarea class="txt" readonly id="dump">' + esc(sheet.body) + "</textarea>" +
           '<button class="btn-done" data-copytext="1">Zkopírovat</button>' +
           '<button class="btn-ghost" data-cancel="1">Zavřít</button>';
    }

    if (sheet.step === "ticket") {
      var s = findSale(sheet.id);
      if (!s) {
        h += "<h2>Objednávka</h2><p class=\"sub\">Tahle objednávka už ve frontě není.</p>" +
             '<button class="btn-done" data-cancel="1">Zavřít</button>';
      } else {
        h += "<h2>Objednávka #" + s.no + "</h2>" +
             '<div class="big num">' + ready(s) + "/" + pieces(s) + "</div>" +
             '<p class="sub">' + clock(s.ts) + " · " + czk(s.total) + " " +
               (s.method === "cash" ? "hotově" : "kartou") + "</p>" +
             '<div class="steps">';
        s.lines.forEach(function (l, i) {
          var isDone = (l.ready || 0) >= l.qty;
          h += '<button class="st' + (isDone ? " done" : "") + '"' +
                 tint(l.color, ' style="background:var(--surface)"') + ' data-line="' + i + '">' +
                 '<span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>' +
                 '<span class="nm">' + esc(l.name) + "</span>" +
                 (l.qty > 1 ? '<span class="cnt">' + (l.ready || 0) + "/" + l.qty + "</span>" : "") +
               "</button>";
        });
        h += "</div>" +
             '<button class="btn-done' + (allReady(s) ? " go" : "") + '" data-serve="' + s.id + '">Vydáno</button>' +
             '<button class="btn-ghost" data-cancel="1">Zavřít</button>';
      }
    }

    if (sheet.step === "color") {
      h += "<h2>Barva karty</h2>" +
           '<p class="sub">Barvu si obsluha zapamatuje dřív, než přečte název. Stejná barva se ukáže i ve frontě objednávek.</p>' +
           '<div class="swatches">';
      COLORS.forEach(function (c) {
        h += '<button' + (sheet.current === c.k ? ' class="on"' : "") +
             ' style="background:' + c.bg + ";color:" + c.ink + '" data-setcol="' + c.k + '">' + esc(c.n) + "</button>";
      });
      h += "</div>" +
           '<button class="btn-ghost" data-setcol="-">Bez barvy</button>' +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    if (sheet.step === "restore") {
      h += "<h2>Načíst ze zálohy</h2>" +
           '<p class="sub">Vlož text zálohy. Nahradí celý obsah kasy — položky, účtenky i archiv.</p>' +
           (sheet.error ? '<p class="sub" style="color:var(--accent);font-weight:600">' + esc(sheet.error) + "</p>" : "") +
           '<textarea class="txt" id="paste" placeholder="Sem vlož zálohu">' + esc(sheet.draft || "") + "</textarea>" +
           '<button class="btn-done warn" data-dorestore="1">Nahradit data zálohou</button>' +
           '<button class="btn-ghost" data-cancel="1">Zpět</button>';
    }

    return h + "</div></div>";
  }

  // ---------- render ----------

  var ICON = {
    sell: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>',
    orders: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9.5 8.5h5"/><path d="M9.5 12.5h5"/></svg>',
    history: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>',
    menu: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><circle cx="8.5" cy="6" r="2"/><circle cx="15.5" cy="12" r="2"/><circle cx="8.5" cy="18" r="2"/></svg>'
  };

  function tabsFor() {
    return state.mode === "vydej"
      ? [["orders", "Objednávky"], ["menu", "Nastavení"]]
      : [["sell", "Prodej"], ["orders", "Objednávky"], ["history", "Přehled"], ["menu", "Menu"]];
  }

  function renderTabs(waiting) {
    var h = "";
    tabsFor().forEach(function (t) {
      h += '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' +
           (view === t[0] ? "true" : "false") + '">' + ICON[t[0]] +
           (t[0] === "orders" && waiting ? '<span class="dot">' + waiting + "</span>" : "") +
           t[1] + "</button>";
    });
    document.getElementById("tabs").innerHTML = h;
  }

  function render(toTop) {
    // role bez prodeje nesmí zůstat viset na obrazovce, kterou nemá
    var allowed = tabsFor().map(function (t) { return t[0]; });
    if (allowed.indexOf(view) < 0) { view = allowed[0]; }

    var waiting = openOrders().length;
    document.getElementById("topRole").textContent = state.mode === "vydej" ? "Výdej" : "Kasa";
    document.getElementById("topName").textContent = state.event || "Bez názvu";
    document.getElementById("topInfo").textContent = String(waiting);

    var v = document.getElementById("view");
    var keep = v.scrollTop;
    v.innerHTML = view === "sell" ? renderSell()
                : view === "orders" ? renderOrders()
                : view === "history" ? renderHistory()
                : renderMenu();
    v.scrollTop = toTop ? 0 : keep;

    document.getElementById("barSlot").innerHTML = view === "sell" ? renderBar() : "";
    renderTabs(waiting);
    document.getElementById("sheetSlot").innerHTML = renderSheet();
    document.getElementById("toastSlot").innerHTML = toast
      ? '<div class="toast' + (sheet ? " up" : "") + '"><span class="t">' + esc(toast.text) + "</span>" +
        (toast.undo ? '<button data-undo="' + toast.undo + '">Vrátit zpět</button>' : "") +
        '<button class="x" data-hidetoast="1" aria-label="Zavřít">×</button></div>'
      : "";
  }

  // ---------- interaction ----------

  var SEL = "[data-tab],[data-add],[data-custom],[data-step],[data-toggle],[data-clearask],[data-pay]," +
            "[data-method],[data-note],[data-exact],[data-zero],[data-commit],[data-cancel],[data-scrim]," +
            "[data-dig],[data-back],[data-addcustom],[data-del],[data-copy],[data-copytext],[data-close]," +
            "[data-new],[data-rm],[data-mv],[data-reset],[data-undo],[data-hidetoast],[data-yes]," +
            "[data-backup],[data-restoreask],[data-dorestore]," +
            "[data-ticket],[data-line],[data-serve],[data-reopen],[data-col],[data-setcol],[data-mode],[data-voice],[data-voicetest]";

  document.addEventListener("click", function (ev) {
    if (suppressClick) { suppressClick = false; return; }
    var t = ev.target && ev.target.closest ? ev.target.closest(SEL) : null;
    if (!t) { return; }
    var d = t.dataset;

    keepAwake();

    // a tap on the sheet body (not on a control) must not close it
    if (d.scrim && t !== ev.target) { return; }

    if (d.tab) { view = d.tab; linesOpen = false; render(true); return; }

    if (d.add) {
      var it = findItem(d.add);
      if (it) { addToOrder(it); }
      return;
    }

    if (d.custom) { sheet = { step: "custom", amount: 0 }; render(); return; }
    if (d.dig) {
      sheet.amount = Math.min(999999, parseInt(String(sheet.amount) + d.dig, 10) || 0);
      render(); return;
    }
    if (d.back) { sheet.amount = Math.floor(sheet.amount / 10); render(); return; }
    if (d.addcustom) {
      state.order.push({ ref: uid(), name: "Jiná položka", price: sheet.amount, qty: 1 });
      sheet = null; save(); render(); return;
    }

    if (d.step) { bump(parseInt(d.step, 10), parseInt(d.d, 10)); return; }
    if (d.toggle) { linesOpen = !linesOpen; render(); return; }

    if (d.clearask) {
      ask("Zrušit účet", "Rozpracovaný účet se smaže. Uložené účtenky zůstanou.", "Zrušit účet", function () {
        state.order = []; linesOpen = false; save();
      });
      return;
    }

    if (d.pay) { sheet = { step: "method", total: orderTotal(), method: null, received: 0 }; render(); return; }
    if (d.method) { sheet.method = d.method; sheet.step = d.method; render(); return; }
    if (d.note) { sheet.received += parseInt(d.note, 10); render(); return; }
    if (d.exact) { sheet.received = sheet.total; render(); return; }
    if (d.zero) { sheet.received = 0; render(); return; }
    if (d.commit) { commit(); return; }

    if (d.yes) {
      var fn = pending;
      pending = null;
      sheet = null;
      if (fn) { fn(); }
      render();
      return;
    }

    if (d.cancel || d.scrim) {
      if (sheet && (sheet.step === "cash" || sheet.step === "card")) {
        sheet.step = "method"; sheet.received = 0;
      } else {
        sheet = null; pending = null;
      }
      render(); return;
    }

    if (d.undo) { undoSale(d.undo); return; }
    if (d.hidetoast) { hideToast(); render(); return; }

    if (d.del) {
      var id = d.del;
      ask("Smazat účtenku", "Částka se odečte z tržby i ze statistiky.", "Smazat", function () {
        state.sales = state.sales.filter(function (s) { return s.id !== id; });
        pushSales("replace");
      });
      return;
    }

    if (d.copy) {
      sheet = { step: "text", title: "Souhrn prodeje", body: summaryText() };
      render(); return;
    }

    if (d.copytext) {
      var body = sheet.body;
      var area = document.getElementById("dump");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(body).then(function () {
          sheet = null; render(); showToast("Souhrn zkopírován"); render();
        }, function () {
          if (area) { area.focus(); area.select(); }
          showToast("Nešlo zkopírovat — označ text a zkopíruj ručně"); render();
        });
      } else if (area) {
        area.focus(); area.select();
        showToast("Označeno — zkopíruj přes nabídku Kopírovat"); render();
      }
      return;
    }

    if (d.close) {
      ask("Uzavřít akci", "Tržba se odloží do přehledu uzavřených akcí a kasa se vynuluje pro další prodej.", "Uzavřít akci", function () {
        var s = stats();
        state.archives.push({
          closedAt: Date.now(), event: state.event || "Prodej",
          total: s.total, cash: s.cash, card: s.card, count: s.count, pieces: s.pieces, items: s.items
        });
        state.sales = [];
        state.nextNo = 1;
        pushSales("replace");
        showToast("Akce uzavřena, kasa je vynulovaná.");
      });
      return;
    }

    if (d["new"]) {
      state.items.push({ id: uid(), name: "", price: 50 });
      save(); render();
      var all = document.querySelectorAll(".e-nm");
      if (all.length) { all[all.length - 1].focus(); }
      return;
    }

    if (d.rm) {
      var rid = d.rm;
      var item = findItem(rid);
      ask("Smazat položku", "Smazat „" + (item && item.name ? item.name : "položku") + "“ z menu? Prodeje zůstanou v přehledu.", "Smazat", function () {
        state.items = state.items.filter(function (i) { return i.id !== rid; });
        save();
      });
      return;
    }

    if (d.mv) {
      var idx = parseInt(d.mv, 10);
      if (idx <= 0) { return; }
      var moved = state.items.splice(idx, 1)[0];
      state.items.splice(idx - 1, 0, moved);
      save(); render(); return;
    }

    if (d.reset) {
      ask("Obnovit výchozí menu", "Celý seznam položek se nahradí výchozím. Uložené prodeje zůstanou.", "Obnovit", function () {
        state.items = defaultItems();
        save();
      });
      return;
    }

    // ---- fronta objednávek ----
    if (d.ticket) { sheet = { step: "ticket", id: d.ticket }; render(); return; }

    if (d.line) {
      var tk = findSale(sheet.id);
      if (!tk) { return; }
      var ln = tk.lines[parseInt(d.line, 10)];
      if (!ln) { return; }
      ln.ready = (ln.ready || 0) >= ln.qty ? 0 : (ln.ready || 0) + 1;
      tk.updatedAt = Date.now();
      pushSales(); render(); return;
    }

    if (d.serve) {
      var srv = findSale(d.serve);
      if (!srv) { return; }
      srv.status = "served";
      srv.servedAt = Date.now();
      srv.updatedAt = Date.now();
      srv.lines.forEach(function (l) { l.ready = l.qty; });
      sheet = null;
      pushSales(); render();
      showToast("Objednávka #" + srv.no + " vydaná");
      return;
    }

    if (d.reopen) {
      var rop = findSale(d.reopen);
      if (!rop) { return; }
      rop.status = "open";
      rop.updatedAt = Date.now();
      pushSales(); render();
      showToast("Objednávka #" + rop.no + " zpátky ve frontě");
      return;
    }

    // ---- barvy a role ----
    if (d.col) {
      var ci = findItem(d.col);
      sheet = { step: "color", id: d.col, current: ci ? ci.color : "" };
      render(); return;
    }

    if (d.setcol) {
      var ct = findItem(sheet.id);
      if (ct) { ct.color = d.setcol === "-" ? "" : d.setcol; }
      sheet = null;
      save(); render(); return;
    }

    if (d.voice) {
      state.voice = !state.voice;
      save(); render();
      if (state.voice) { speak("Čtení objednávek zapnuto."); }
      return;
    }

    if (d.voicetest) {
      speak("Nová objednávka číslo 7. Dvakrát espresso. Cappuccino.");
      return;
    }

    if (d.mode) {
      state.mode = d.mode === "vydej" ? "vydej" : "kasa";
      state.order = [];
      linesOpen = false;
      save(); render();
      showToast(state.mode === "kasa" ? "Zařízení je teď kasa" : "Zařízení je teď výdej");
      return;
    }

    if (d.backup) {
      sheet = { step: "text", title: "Záloha dat", body: JSON.stringify(state) };
      render(); return;
    }

    if (d.restoreask) { sheet = { step: "restore" }; render(); return; }

    if (d.dorestore) {
      var box = document.getElementById("paste");
      var raw = box ? box.value.trim() : "";
      var next = parseState(raw);
      if (!next) {
        sheet.draft = raw;
        sheet.error = "Tohle nevypadá jako záloha kasy. Zkontroluj, že je vložená celá včetně složených závorek.";
        render(); return;
      }
      state = next;
      sheet = null;
      pushSales("replace"); render();
      showToast("Data obnovena ze zálohy");
      return;
    }
  });

  // ---------- podržení karty = odebrání té jedné položky z účtu ----------
  // Obsluha se ukliká, podrží prst na kartě a řádek zmizí — bez rušení celého účtu.
  // HOLD_MS musí sedět s délkou přechodu u .prod.is-hold .hold v CSS.
  var HOLD_MS = 1000;
  var holdTimer = null, holdCard = null, holdX = 0, holdY = 0;

  function endHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdCard) { holdCard.classList.remove("is-hold"); holdCard = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    suppressClick = false;
    endHold();

    var card = ev.target && ev.target.closest ? ev.target.closest(".prod[data-add]") : null;
    if (!card) { return; }

    var id = card.getAttribute("data-add");
    var qty = 0;
    state.order.forEach(function (l) { if (l.ref === id) { qty += l.qty; } });
    if (!qty) { return; }

    holdCard = card;
    holdX = ev.clientX;
    holdY = ev.clientY;
    card.classList.add("is-hold");

    holdTimer = setTimeout(function () {
      var name = "";
      state.order = state.order.filter(function (l) {
        if (l.ref !== id) { return true; }
        name = l.name;
        return false;
      });
      if (!state.order.length) { linesOpen = false; }
      suppressClick = true;   // ať uvolnění prstu položku hned nepřidá zpátky
      endHold();
      save();
      render();
      showToast(name + " odebráno z účtu");
      say(name + " odebráno z účtu.");
    }, HOLD_MS);
  });

  document.addEventListener("pointermove", function (ev) {
    if (!holdTimer) { return; }
    if (Math.abs(ev.clientX - holdX) > 10 || Math.abs(ev.clientY - holdY) > 10) { endHold(); }
  });
  ["pointerup", "pointercancel"].forEach(function (e) {
    document.addEventListener(e, endHold);
  });
  document.getElementById("view").addEventListener("scroll", endHold, { passive: true });
  document.addEventListener("contextmenu", function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest(".prod")) { ev.preventDefault(); }
  });

  // menu editing writes straight to state, without re-rendering (keeps the keyboard open)
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.dataset) { return; }

    if (el.id === "evName") {
      state.event = el.value;
      document.getElementById("topName").textContent = state.event || "Bez názvu";
      save();
      return;
    }

    // rozepsanou zálohu držíme ve stavu, ať ji překreslení (třeba zhasnutí
    // hlášky) nesmaže z pole
    if (el.id === "paste" && sheet) {
      sheet.draft = el.value;
      sheet.error = "";
      return;
    }

    var nameId = el.dataset.nm;
    var priceId = el.dataset.pr;
    var item = findItem(nameId || priceId);
    if (!item) { return; }

    if (nameId) {
      item.name = el.value;
    } else {
      var n = parseInt(String(el.value).replace(/[^0-9]/g, ""), 10);
      item.price = isNaN(n) ? 0 : n;
    }
    save();
  });

  // keep the screen awake while the stand is open
  function keepAwake() {
    if (wakeAsked || !navigator.wakeLock || !navigator.wakeLock.request) { return; }
    wakeAsked = true;
    try {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; wakeAsked = false; });
      }, function () { wakeAsked = false; });
    } catch (e) { wakeAsked = false; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !wakeLock) { wakeAsked = false; keepAwake(); }
  });

  // ---------- boot ----------
  state = load();
  state.sales.forEach(function (s) { announced[s.id] = true; });
  render();

  dbInit(function () {
    dbSettled = true;
    dbRead(function (rec) {
      var backup = parseState(rec);
      // v zařízení nic není, ale záložní kopie ano → obnovit
      if (backup && isEmpty(state) && !isEmpty(backup)) {
        state = backup;
        render();
        showToast("Kasa obnovena ze záložní kopie v zařízení");
      }
      save();
    });
  });
})();
</script>

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
