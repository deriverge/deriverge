<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tapkasa music</title></head><body>
<script>
// Podkres pro spot: 104 BPM, 11 taktů (~25,4 s) + dojezd.
// Teplé marimbové plucky, měkký basový puls, shaker, jemná melodie,
// úvodní čtyřtónový motiv sladěný s naskládáním čtyř karet značky.
async function renderMusic() {
  var SR = 44100, DUR = 26.5;
  var ctx = new OfflineAudioContext(2, Math.ceil(SR * DUR), SR);
  var BPM = 104, BEAT = 60 / BPM, BAR = 4 * BEAT;

  var master = ctx.createDynamicsCompressor();
  master.threshold.value = -14; master.knee.value = 24; master.ratio.value = 3;
  master.attack.value = 0.006; master.release.value = 0.24;
  var out = ctx.createGain(); out.gain.value = 0.92;
  master.connect(out); out.connect(ctx.destination);

  // jednoduchý prostor: dvě zpětnovazební echa s tlumením výšek
  var revIn = ctx.createGain(); revIn.gain.value = 1;
  [[0.271, 0.32], [0.413, 0.26]].forEach(function (cfg) {
    var d = ctx.createDelay(1); d.delayTime.value = cfg[0];
    var fb = ctx.createGain(); fb.gain.value = cfg[1];
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3400;
    var wet = ctx.createGain(); wet.gain.value = 0.16;
    revIn.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d);
    lp.connect(wet); wet.connect(master);
  });
  function toBus(node, revAmt) {
    node.connect(master);
    if (revAmt) { var g = ctx.createGain(); g.gain.value = revAmt; node.connect(g); g.connect(revIn); }
  }

  var NOTE = {};
  (function () {
    var names = ["C","Cs","D","Ds","E","F","Fs","G","Gs","A","As","B"];
    for (var o = 0; o < 8; o++) for (var i = 0; i < 12; i++)
      NOTE[names[i] + o] = 440 * Math.pow(2, (o * 12 + i - 57) / 12);
  })();

  function pluck(t, f, vol, decay, bright) {
    vol = vol || 0.22; decay = decay || 0.5;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0004, t + decay);
    var o1 = ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = f;
    var o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 4;
    var g2 = ctx.createGain(); g2.gain.setValueAtTime((bright || 0.18) * vol, t);
    g2.gain.exponentialRampToValueAtTime(0.0003, t + decay * 0.35);
    o1.connect(g); o2.connect(g2); g2.connect(g);
    toBus(g, 0.5);
    o1.start(t); o1.stop(t + decay + 0.1);
    o2.start(t); o2.stop(t + decay + 0.1);
  }

  function bell(t, f, vol, decay) {
    vol = vol || 0.2; decay = decay || 1.4;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0004, t + decay);
    [1, 2.76, 5.4].forEach(function (m, i) {
      var o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f * m;
      var og = ctx.createGain(); og.gain.value = [1, 0.28, 0.09][i];
      o.connect(og); og.connect(g); o.start(t); o.stop(t + decay + 0.2);
    });
    toBus(g, 0.85);
  }

  function bass(t, f, vol, len) {
    vol = vol || 0.3; len = len || 0.5;
    var o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.setValueAtTime(vol, t + len * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0005, t + len);
    o.connect(lp); lp.connect(g); toBus(g, 0);
    o.start(t); o.stop(t + len + 0.1);
  }

  function kick(t, vol) {
    vol = vol || 0.5;
    var o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    o.connect(g); toBus(g, 0);
    o.start(t); o.stop(t + 0.2);
  }

  var noiseBuf = (function () {
    var b = ctx.createBuffer(1, SR, SR), d = b.getChannelData(0);
    for (var i = 0; i < SR; i++) d[i] = Math.random() * 2 - 1;
    return b;
  })();
  function shaker(t, vol) {
    vol = vol || 0.05;
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 6800; hp.Q.value = 1.1;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0004, t + 0.06);
    s.connect(hp); hp.connect(g); toBus(g, 0.25);
    s.start(t); s.stop(t + 0.09);
  }
  function rim(t, vol) {
    vol = vol || 0.09;
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2100; bp.Q.value = 2.4;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0004, t + 0.05);
    s.connect(bp); bp.connect(g); toBus(g, 0.5);
    s.start(t); s.stop(t + 0.08);
  }

  var CH = {
    Am: ["A3", "C4", "E4", "G4"],
    F:  ["F3", "A3", "C4", "E4"],
    C:  ["C4", "E4", "G4", "B4"],
    G:  ["G3", "B3", "D4", "E4"]
  };
  var bars = ["Am", "F", "Am", "F", "C", "G", "Am", "F", "C", "G", "Am"];
  var roots = { Am: "A1", F: "F1", C: "C2", G: "G1" };

  // úvodní motiv: čtyři karty značky (0,30 / 0,55 / 0,80 / 1,05 s)
  bell(0.30, NOTE.A4, 0.16, 1.6);
  bell(0.55, NOTE.C5, 0.16, 1.6);
  bell(0.80, NOTE.E5, 0.16, 1.6);
  bell(1.05, NOTE.G5, 0.18, 2.2);
  bass(0.30, NOTE.A1, 0.16, 2.2);

  var arpPat = [0, 2, 1, 3, 2, 0, 3, 1];
  for (var bar = 0; bar < 10; bar++) {
    var t0 = bar * BAR, ch = CH[bars[bar]];
    var lvl = bar === 0 ? 0.4 : bar >= 9 ? 0.8 : 1;

    if (bar >= 1) for (var e = 0; e < 8; e++) {
      var tt = t0 + e * BEAT / 2;
      var oct = (e === 3 || e === 6) ? 2 : 1;
      var f = NOTE[ch[arpPat[e]]] * oct;
      pluck(tt, f, (e % 2 ? 0.10 : 0.15) * lvl, 0.5, 0.2);
    }
    if (bar >= 2 && bar <= 9) {
      bass(t0, NOTE[roots[bars[bar]]] * 2, 0.28, BEAT * 1.4);
      bass(t0 + 2.5 * BEAT, NOTE[roots[bars[bar]]] * 2, 0.2, BEAT * 0.9);
      kick(t0, 0.4); kick(t0 + 2 * BEAT, 0.34);
    }
    if (bar >= 1 && bar <= 9) for (var s8 = 0; s8 < 8; s8++)
      shaker(t0 + s8 * BEAT / 2 + BEAT / 4, s8 % 2 ? 0.045 : 0.028);
    if (bar >= 4 && bar <= 9) { rim(t0 + BEAT, 0.07); rim(t0 + 3 * BEAT, 0.07); }
  }

  // řídká melodie (takty 4-8)
  [[4, 0, "E5", 0.7], [4, 2, "D5", 0.5], [5, 1, "B4", 0.6], [5, 3, "D5", 0.4],
   [6, 0, "C5", 0.8], [6, 2.5, "A4", 0.5], [7, 1, "E5", 0.7], [7, 2.5, "G5", 0.9],
   [8, 0, "E5", 0.9], [8, 2, "B4", 0.5]].forEach(function (n) {
    bell(n[0] * BAR + n[1] * BEAT, NOTE[n[2]], 0.11, n[3] + 0.6);
  });

  // závěr: takt 10, jeden akord a čtyřtónový motiv vzhůru
  var tEnd = 10 * BAR;
  bass(tEnd, NOTE.A1, 0.3, 2.6);
  CH.Am.forEach(function (n, i) { pluck(tEnd + i * 0.02, NOTE[n], 0.16, 2.2, 0.12); });
  bell(tEnd + 0.55, NOTE.A4, 0.13, 1.8);
  bell(tEnd + 0.80, NOTE.C5, 0.13, 1.8);
  bell(tEnd + 1.05, NOTE.E5, 0.13, 2.0);
  bell(tEnd + 1.30, NOTE.A5, 0.16, 2.8);

  var buf = await ctx.startRendering();

  // WAV 16 bit stereo
  var len = buf.length, ab = new ArrayBuffer(44 + len * 4), v = new DataView(ab);
  function ws(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
  ws(0, "RIFF"); v.setUint32(4, 36 + len * 4, true); ws(8, "WAVE"); ws(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, SR, true); v.setUint32(28, SR * 4, true); v.setUint16(32, 4, true);
  v.setUint16(34, 16, true); ws(36, "data"); v.setUint32(40, len * 4, true);
  var L = buf.getChannelData(0), R = buf.getChannelData(1), o = 44;
  for (var i = 0; i < len; i++) {
    var a = Math.max(-1, Math.min(1, L[i])), b = Math.max(-1, Math.min(1, R[i]));
    v.setInt16(o, a * 32767, true); o += 2;
    v.setInt16(o, b * 32767, true); o += 2;
  }
  var bytes = new Uint8Array(ab), bin = "", CH2 = 32768;
  for (var p = 0; p < bytes.length; p += CH2) bin += String.fromCharCode.apply(null, bytes.subarray(p, p + CH2));
  return btoa(bin);
}
</script>
</body></html>
