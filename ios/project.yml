# Popis projektu pro XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Kdo má XcodeGen (brew install xcodegen), vyrobí si projekt jedním příkazem:
#     cd ios && ./copy-web.sh && xcodegen generate && open Kasa.xcodeproj
# Kdo ho nemá, založí projekt v Xcode ručně podle README.md — vyjde to nastejno.

name: Kasa
options:
  bundleIdPrefix: com.deriverge
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  Kasa:
    type: application
    platform: iOS
    sources:
      - path: Kasa
    info:
      path: Kasa/Info.plist
      properties:
        CFBundleDisplayName: Kasa
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Bez těchhle dvou klíčů iOS 14+ párování po místní síti zakáže.
        NSLocalNetworkUsageDescription: >-
          Kasa posílá objednávky mezi vašimi zařízeními přímo po místní síti.
          Data neopouštějí vaše zařízení.
        NSBonjourServices:
          - _kasa-order._tcp
          - _kasa-order._udp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Kasa
        PRODUCT_BUNDLE_IDENTIFIER: com.deriverge.kasa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone i iPad
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
